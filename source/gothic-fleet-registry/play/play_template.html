/* The armament as a table: badge, name, range, strength, the halved value
   (crippled p. 65, braced p. 47, All Ahead Full etc. p. 46 - whichever the
   table says applies), arc. A location knocked out by a critical (p. 67)
   is struck through. Escort squadrons show the per-ship value, the
   squadron total (p. 99) and half of the total. */
/* The range column: the builder's shortRange collapses "Furies: 30 cm /
   Starhawks: 20 cm" to "30/20"; a single craft label ("Thunderhawk: 20 cm")
   keeps only its number too - the craft is in the rules text. */
function rangeText(t){
  const r = shortRange(t);
  const m = String(r).match(/(\d+)\s*cm/);
  return /:/.test(r) && m ? m[1] : r;
}
/* The printed card's own rows (v1.2): the same filter and order as the
   rules layer's armament and escortFire, so row k of the table is row k
   here - and with it the card's range band (domain.js rangeCell, J183) and
   port / starboard pair (domain.js pairRows, J188). The page computes
   neither itself: it reads what the card prints. */
function cardRows(R){ return (R.weapons || []).filter(w => w.state !== "offered"); }
/* Which rows are a pair right now: the card's pair, held only while both
   sides are the same in play - neither silenced, the same value now. A
   critical on one side (p. 67) parts it, so the struck-through row shows
   which side. 1 = upper row, 2 = lower, 0 = no pair. */
function livePairs(R, rows, esq){
  if(esq) return rows.map(() => 0);
  const ws = cardRows(R);
  const same = (p, q) => !p.silent && !q.silent && String(p.now) === String(q.now) && String(p.strength) === String(q.strength) && String(p.range) === String(q.range);
  return rows.map((a, k) => {
    const w = ws[k];
    if(!w || !w.pair) return 0;
    const m = w.pair === 1 ? k + 1 : k - 1, wm = ws[m];
    if(!wm || wm.pair !== 3 - w.pair || !rows[m]) return 0;
    return same(a, rows[m]) ? w.pair : 0;
  });
}
/* The range as the card prints it (J183): one value in a frame of its
   band's colour - 15, 30, 45, 60 cm and beyond - the unit in the heading;
   a cell that is not one range (a launch bay's craft speeds, "Contact")
   stays text. */
function rangeHTML(R, a, k, cls){
  const rc = cardRows(R)[k] && cardRows(R)[k].range;
  if(rc) return `<span class="${cls}${rc.label.length > 3 ? " l" : ""}" style="--rb:${rc.color}">${esc(rc.label)}</span>`;
  return esc(String(rangeText(a.range)).replace(/\s*cm\b/g, ""));
}
/* The compact row's armament: one chip per row of the table - the badge,
   the strength in force now (halved when crippled or braced, struck through
   when silenced), the range in its band's colour and the arc; a live pair
   is one chip with both arcs. The names are on the card. */
function weaponsLine(R, st, esq){
  const v = PLAY.view(R, st, G.fleet);
  const rows = esq ? PLAY.escortFire(R, st) : v.arms;
  if(!rows.length) return `<p class="noarm">No armament</p>`;
  const pairs = livePairs(R, rows, esq);
  const cr = !esq && (v.crippled || (OPT.orders && (v.braced || (v.order && v.order.arm < 1))));
  return `<div class="wline">${rows.map((a, k) => {
    if(pairs[k] === 2) return "";
    const ps = pairs[k] === 1;
    const [letter, badge] = wepClass(a.name);
    const n = PLAY.num(a.strength), alive = esq ? a.ships : 1;
    const val = n == null ? String(a.strength).replace(/\s*squadrons?$/i, "") : esq ? n * alive : (cr && PLAY.num(a.now) != null ? PLAY.num(a.now) : n);
    const glyph = ps ? arcGlyph("left right").replace(/class="pick"/g, 'class="on"') : arcGlyph(a.arc);
    const title = ps ? a.name + " / " + rows[k + 1].name + ", each" : a.name;
    return `<span class="wc${!esq && a.silent ? " off" : ""}${cr && n != null && !a.whole ? " half" : ""}" title="${esc(title)}"><i style="--bd:${badge}">${letter}</i><b>${esc(String(val))}</b>${rangeHTML(R, a, k, "rpc")}${glyph}</span>`;
  }).join("")}</div>`;
}
/* The armament as a table, drawn the way the printed card is (v1.2): a
   pair of port / starboard rows keeps both names and both arcs and shares
   one tall badge, one range and one strength with "each" under it (the
   user's choice C, 12.10.2026 - one merged row was turned down as busy); a
   range in its band's frame. Then the play page's own: the halved value
   (crippled p. 65, braced p. 47, All Ahead Full etc. p. 46 - whichever the
   table says applies), a location knocked out by a critical (p. 67) struck
   through, an escort squadron's per-ship value, total (p. 99) and half. */
function weaponsTable(R, st, esq){
  const v = PLAY.view(R, st, G.fleet);
  const rows = esq ? PLAY.escortFire(R, st) : v.arms;
  /* a fire ship has no armament at all (Fleets p. 516): say so rather
     than show an empty table */
  if(!rows.length) return `<p class="noarm">No armament</p>`;
  /* "now" when something halves the armament: crippled always; an order
     or brace only when the page tracks them */
  const cr = v.crippled || (OPT.orders && !esq && (v.braced || (v.order && v.order.arm < 1)));
  const pairs = livePairs(R, rows, esq);
  let zone = null;
  const trs = rows.map((a, k) => {
    const [letter, badge] = wepClass(a.name);
    const n = PLAY.num(a.strength);
    const alive = esq ? a.ships : 1;
    const full = n == null ? null : n * alive;
    /* the halved value: the rules layer's own when the ship is crippled (a
       Necron Portal rounds down, Fleets p. 401), else the generic ceil */
    let half = full == null ? "" : PLAY.half(full);
    /* a star fort's Basilica row is whole while the quadrant is crippled
       (Fleets p. 501): its strength stays the value in force */
    const keep = !esq && a.whole && !(OPT.orders && (v.braced || (v.order && v.order.arm < 1)));
    if(!esq && cr && !keep && n != null && PLAY.num(a.now) != null) half = PLAY.num(a.now);
    if(!esq && cr && !keep && n == null && a.now !== a.strength) half = esc(String(a.now));
    const silent = !esq && !!a.silent;
    const txt = n == null;
    const pr = pairs[k];
    /* one heading per group: the selected quadrant's rows, the Basilica's */
    let head = "";
    if(!esq && a.zone && a.zone !== zone){
      zone = a.zone;
      head = `<tr class="zn"><td colspan="6">${a.zone === "basilica" ? "Basilica " + MID + " the whole fort's" : esc(PLAY.QUADS[v.quad]) + " quadrant"}</td></tr>`;
    }
    const cls = `${silent ? "silent" : ""}${half === "" ? " nohalf" : ""}${keep ? " keep" : ""}`.trim();
    /* the card's own shortening (v1.2 J186): a name that would wrap onto a
       second line on a phone says Stbd - the full name is the tooltip */
    const nm = String(a.name).length > 22 ? String(a.name).replace(/\bStarboard\b/, "Stbd") : String(a.name);
    const name = `<td class="nm"${nm !== a.name ? ` title="${esc(a.name)}"` : ""}>${esc(nm)}${silent ? `<small>${esc(a.silent)}</small>` : ""}</td>`;
    const arc = `<td class="ar">${arcGlyph(a.arc)}</td>`;
    /* the lower row of a pair: its name and its arc - the badge, range,
       strength and half are the upper row's, two rows high */
    if(pr === 2) return `<tr class="${cls}" data-pair="2">${name}${arc}</tr>`;
    const rs = pr === 1 ? ' rowspan="2"' : "";
    return `${head}<tr class="${cls}"${pr ? ' data-pair="1"' : ""}>
      <td class="bd"${rs}><span class="bg${pr ? " tall" : ""}" style="--bd:${badge}">${letter}</span></td>
      ${name}
      <td class="rg"${rs}>${rangeHTML(R, a, k, "rp")}</td>
      <td class="st${txt ? " txt" : ""}"${rs}>${txt ? esc(a.strength) : n}${esq && alive !== 1 ? `<small>${TIMES}${alive}${a.nocombine ? " separate" : n != null ? " = " + full : ""}</small>` : pr ? `<i class="ea">each</i>` : ""}</td>
      <td class="hf${txt ? " txt" : ""}"${rs}>${silent ? "" : half}</td>
      ${arc}</tr>`;
  }).join("");
  return `<table class="wt${cr ? " crippled" : ""}"><thead><tr><th></th><th>Armament</th><th class="rg">Range cm</th><th class="st">Str</th><th class="hf">&frac12;${cr ? "<small>now</small>" : ""}</th><th></th></tr></thead><tbody>${trs}</tbody></table>`;
}

/* ============================================================= RENDER ===== */
/* Scroll the open popover's anchor (the button line above it) to just
   under the sticky bar - in the page or inside the sheet. */
function showPop(){
  /* No scrolling for a popover opened from a button: it opens right under
     the button that was tapped (user 30.9.2026: the screen must not move).
     Only a table that opened by itself with its top off the screen - the
     Catastrophic table after a hit on the sheet - is brought into view. */
  const pop = document.querySelector(".pop");
  if(!pop) return;
  const r = pop.getBoundingClientRect(), bar = document.querySelector(V.sheet != null ? ".sh-hd" : ".top");
  const barH = bar ? bar.getBoundingClientRect().height : 0;
  if(r.top >= barH && r.top < window.innerHeight - 60) return;
  const anchor = pop.previousElementSibling || pop;
  anchor.style.scrollMarginTop = (barH + 8) + "px";
  anchor.scrollIntoView({ block: "start" });
}
/* The embarked commander's points ride with the flagship's VP (p. 123). */
const cmdPts = i => (G && G.cmd != null && i === G.flag) ? (U[G.cmd].R.points | 0) : 0;
/* Victory points conceded by the whole roster: ships (p. 123), planetary
   defences one installation at a time (p. 123) and orbital mines bought
   one by one (Fleets p. 512) - PLAY.conceded knows which row pays what;
   a commander's own row and a minefield pay nothing. */
const vpTotal = () => U.reduce((a, x, i) => a + PLAY.conceded(x.R, G.st[i], cmdPts(i)), 0);
/* The selector that finds a control again after a render. */
let TAP = null;
function tapSel(el){
  const a = ["data-act", "data-i", "data-arg"].filter(k => el.hasAttribute(k))
    .map(k => "[" + k + '="' + String(el.getAttribute(k)).replace(/"/g, '\\"') + '"]').join("");
  return (el.closest(".pop") ? ".pop " : el.closest(".sheet") ? ".sheet " : "") + a;
}
function render(){
  const tap = TAP; TAP = null;
  const top = document.scrollingElement ? document.scrollingElement.scrollTop : 0;
  const sh0 = document.querySelector(".sheet"), shTop = sh0 ? sh0.scrollTop : 0;
  /* a panel's own scroll (the menu, the End Phase) survives its re-render */
  const bx0 = document.querySelector(".menu .box"), bxTop = bx0 ? bx0.scrollTop : 0;
  let html = "";
  if(V.screen === "load") html = renderLoad();
  else if(V.screen === "setup") html = renderSetup();
  else html = renderRoster();
  if(V.sheet != null && G) html += renderSheet(V.sheet);
  if(V.menu && G) html += renderMenu();
  else if(V.endph && G && V.screen === "roster") html += renderEndPhase();
  $("#app").innerHTML = html;
  /* A new screen starts at its top, not at the old one's scroll (user
     19.10.2026: the set-up opened half-way down, its first ship off the
     screen), and taps are not taken for a moment (the click handler). */
  const changed = V.lastScreen !== V.screen;
  if(changed){
    if(document.scrollingElement) document.scrollingElement.scrollTop = 0;
    if(V.lastScreen != null) V.guardUntil = Date.now() + 400;
    V.lastScreen = V.screen;
  }
  else if(V.sheet == null && document.scrollingElement) document.scrollingElement.scrollTop = top;
  else { const sh1 = document.querySelector(".sheet"); if(sh1) sh1.scrollTop = shTop; }
  const bx1 = document.querySelector(".menu .box"); if(bx1 && bx0) bx1.scrollTop = bxTop;
  if(tap && !changed){
    let el = null;
    try{ el = document.querySelector(tap.sel); }catch(e){}
    if(el){
      const nr = el.getBoundingClientRect(), d = nr.top + nr.height / 2 - tap.top;
      if(Math.abs(d) >= 1){
        const sh2 = V.sheet != null ? document.querySelector(".sheet") : null;
        if(sh2) sh2.scrollTop += d; else window.scrollBy(0, d);
      }
    }
  }
  if(V.screen === "roster") paginate();
  wake();
}

/* ------------------------------------------------- screen wake lock --- */
/* A phone locks its screen after half a minute; at the table every look
   would then start with an unlock. While a game is open the page asks the
   browser to keep the screen on (Screen Wake Lock); the browser lets it go
   when the tab is hidden, and it is asked for again when the tab is back.
   Menu > Keep the screen on turns it off for this device. */
let WAKE = null, WAKING = false;
const wakeOff = () => lsGet(KEY_WAKE) === "0";
const wakeCan = () => typeof navigator !== "undefined" && !!navigator.wakeLock;
function wakeWanted(){ return !!G && V.screen === "roster" && !wakeOff() && document.visibilityState !== "hidden"; }
function wake(){
  if(!wakeCan()) return;
  if(wakeWanted()){
    if(WAKE || WAKING) return;
    WAKING = true;
    navigator.wakeLock.request("screen").then(l => {
      WAKING = false; WAKE = l;
      l.addEventListener("release", () => { if(WAKE === l) WAKE = null; });
      if(!wakeWanted()){ WAKE = null; l.release().catch(() => {}); }
    }).catch(() => { WAKING = false; });
  }else if(WAKE){ const l = WAKE; WAKE = null; l.release().catch(() => {}); }
}
document.addEventListener("visibilitychange", wake);

/* ----------------------------------------------- the row at the top --- */
/* The row whose top part is at the top of the screen, and where it is:
   a change of view keeps it there. */
function barBottom(){ const t = document.querySelector(".top"); return t ? t.getBoundingClientRect().bottom : 0; }
function topRow(){
  if(!document.querySelectorAll) return null;
  const y = barBottom();
  const rows = [...document.querySelectorAll("section.row[data-u]")];
  for(const r of rows){ const b = r.getBoundingClientRect(); if(b.bottom > y + 8) return { u: r.getAttribute("data-u"), top: b.top }; }
  return null;
}
/* The strip's tap: that ship's row just under the top bar. */
function jumpTo(i){
  const el = document.querySelector('section.row[data-u="' + i + '"]');
  if(!el) return;
  window.scrollBy(0, el.getBoundingClientRect().top - barBottom() - 6);
}

/* A laptop shows the fleet as a grid; what does not fit the screen goes
   on a second page rather than below the fold. Rows of the grid are
   measured after the render, so a card that grew (a popover) is counted. */
/* A laptop shows the fleet as a grid that scrolls; the pager's pages are
   the scroll positions at which a whole screenful of rows begins, so the
   arrows jump a screen at a time and the wheel still works. Rows are
   measured after the render, so a card that grew (a popover) is counted. */
function paginate(){
  const main = $(".main"), pager = $(".pager");
  if(!main) return;
  const cards = [...main.children];
  V.pages = 1; V.pageTops = [0];
  const desktop = window.matchMedia("(min-width:900px)").matches;
  if(!desktop || !cards.length){ if(pager) pager.classList.add("hide"); return; }
  const cols = Math.max(1, getComputedStyle(main).gridTemplateColumns.split(" ").filter(Boolean).length);
  const topH = ($(".top") || { getBoundingClientRect: () => ({ height: 0 }) }).getBoundingClientRect().height;
  const botH = ($(".bottom") || { getBoundingClientRect: () => ({ height: 0 }) }).getBoundingClientRect().height;
  const avail = window.innerHeight - topH - botH - 24;
  const gap = 10;
  const heights = cards.map(c => c.getBoundingClientRect().height);
  const tops = cards.map(c => c.getBoundingClientRect().top + window.scrollY - topH - 10);
  const pageTops = [tops[0]]; let used = 0;
  for(let r = 0; r * cols < cards.length; r++){
    const idx = []; for(let k = r * cols; k < Math.min(cards.length, r * cols + cols); k++) idx.push(k);
    const rh = Math.max.apply(null, idx.map(k => heights[k])) + gap;
    if(used + rh > avail && used > 0){ pageTops.push(tops[idx[0]]); used = 0; }
    used += rh;
  }
  V.pages = pageTops.length; V.pageTops = pageTops;
  if(pager) pager.classList.toggle("hide", V.pages <= 1);
  pageLabel();
}
/* Which page the window is on, from the scroll position. */
function pageLabel(){
  const pager = $(".pager"); if(!pager || !V.pageTops) return;
  const y = window.scrollY, maxY = document.documentElement.scrollHeight - window.innerHeight;
  let cur = 0; V.pageTops.forEach((t, k) => { if(y >= t - 2) cur = k; });
  if(maxY > 0 && y >= maxY - 2) cur = V.pages - 1;
  V.page = cur;
  const lab = pager.querySelector("b"); if(lab) lab.textContent = (cur + 1) + " / " + V.pages;
  const prev = pager.querySelector("[data-arg='-1']"), next = pager.querySelector("[data-arg='1']");
  if(prev) prev.disabled = cur <= 0;
  if(next) next.disabled = cur >= V.pages - 1;
}
window.addEventListener("scroll", () => { if(V.screen === "roster" && V.sheet == null) pageLabel(); }, { passive: true });
window.addEventListener("resize", () => { if(V.screen === "roster" && V.sheet == null) paginate(); });

  /* One line at the top (user 19.10.2026: the bar took two): the turn,

      ${OPT.fleet ? `<button class="pill ${fl.enemyOrders ? "on" : ""}" data-act="enemy" title="Enemy ships on special orders: +1 Ld (p. 48)">ENEMY+1</button>` : ""}
      ${OPT.fleet && (G.cmd != null || fleetRR()) ? `<button class="pill ${fl.rerollsLost ? "bad" : fl.rerolls ? "on" : ""}" data-act="pop" data-i="-1" data-arg="rr">RR <b>${fl.rerolls | 0}</b></button>` : ""}
      ${OPT.fleet && (bays || baysText) ? `<button class="pill ${G.ac > bays && !baysText ? "bad" : ""}" data-act="pop" data-i="-1" data-arg="ac">AC <b>${G.ac | 0}</b>/${bays}${baysText ? "+?" : ""}</button>` : ""}
      <div class="tools">
        ${toolBtn("view", "view", "Compact", { on: V.compact, tip: "Compact rows: hits and criticals of the whole fleet on one screen; the weapons are on the cards" })}
        ${toolBtn("undo", "undo", "Undo", { off: !UNDO.length, tip: "Undo the last tap" })}
        ${toolBtn("menu", "menu", "Menu", { tip: "Victory points, game report, rules text, tracking, new game" })}
      </div>
    </div>
    ${V.saveErr ? `<p class="note bad" style="margin:8px">This browser would not store the game record; it lives only in this tab.</p>` : ""}
    ${V.pop && V.pop.i === -1 ? renderFleetPop() : ""}
    <div class="main${V.compact ? " compact" : ""}">${out.join("")}</div>
    <div class="bottom">
      ${V.compact ? "" : jumpStrip()}
      <div class="brow">
        <button class="endbtn" data-act="endph" ${pend.n ? "" : "disabled"}>End phase<small>${pend.n ? pend.crits + " to repair" + (pend.fires ? " " + MID + " " + pend.fires + " fire" + (pend.fires > 1 ? "s" : "") : "") : "nothing to repair"}</small></button>
        ${OPT.orders ? `<button class="turnbtn ${fl.mine ? "" : "enemy"}" data-act="${fl.mine ? "endturn" : "newturn"}">${fl.mine ? "End turn " + fl.turn : "Start turn " + (fl.turn + 1)}</button>`
                     : `<button class="turnbtn" data-act="newturn">New turn ${fl.turn + 1}</button>`}
        <div class="pager hide"><button class="ico" data-act="page" data-arg="-1" aria-label="Previous page">&lsaquo;</button><b>1 / 1</b><button class="ico" data-act="page" data-arg="1" aria-label="Next page">&rsaquo;</button></div>
        <div class="vp">${OPT.orders && !fl.mine ? "brace, hits, crits" : toPlay + " to play"}<b>VP ${vp}</b></div>
      </div>
    </div>`;
}



/* A squadron's own colour ties its header and its members together. */
/* A squadron's colour: the capital squadrons A, B, C take the first three,
   each escort squadron (a card of its own) the next in the fleet's order. */
const SQ_COLS = ["var(--sq1)", "var(--sq2)", "var(--sq3)", "var(--sq4)", "var(--sq5)", "var(--sq6)"];
function sqColor(letter){ return SQ_COLS[Math.max(0, "ABC".indexOf(letter))]; }
function escColor(i){
  const k = U.slice(0, i).filter(x => x.R.kind === "ship" && PLAY.isEscort(x.R)).length;
  return SQ_COLS[(3 + k) % SQ_COLS.length];
}
function renderGroupHead(letter, ms){
  const units = ms.map(j => ({ R: U[j].R, st: G.st[j] }));
  const names = ms.map(j => unitName(j));
  const st0 = G.st[ms[0]];
  const [kd, km] = factionCols(G.ln, "");
  const from = PLAY.squadronLd(units, G.fleet);
  /* who is still on the table: a member out of action is struck through
     with the reason, a crippled one marked (its values are halved already) */
  const status = PLAY.squadronStatus(units);
  const members = ms.map((j, k) => {
    const o = status.out.find(x => x.idx === k);
    if(o) return `<s>${esc(names[k])}</s> <i>${o.why}</i>`;
    return esc(names[k]) + (status.crippled.indexOf(k) >= 0 ? ` <i class="cr">crippled</i>` : "");
  }).join(", ");
  return `<section class="row grp-hd" data-g="${letter}" style="--kd:${kd};--km:${km};--sq:${sqColor(letter)}">
    <div class="r1"><span class="tag grp">SQN ${letter}</span>
      <div class="name"><b>Squadron ${letter}</b><small>${members}${from.idx != null ? " " + MID + " Ld of " + esc(names[from.idx]) + " (p. 95)" : ""}</small></div>
      ${ldTile(ms[0])}
      <button class="played p${st0.played}" data-act="played" data-i="${ms[0]}">${["TO PLAY", "MOVED", "SHOT"][st0.played]}</button></div>
    ${V.compact ? "" : squadronTable(units, names)}
    ${OPT.orders && ordChip(st0) ? `<div class="r2">${ordChip(st0)}</div>` : ""}
    ${OPT.orders ? `<div class="r4">
      <button class="brace ${PLAY.braced(st0) ? "on" : ""}" data-act="brace" data-i="${ms[0]}" ${PLAY.canOrder(st0, G.fleet, "BFI") ? "" : "disabled"}>Brace<small>all ${ms.length}</small></button>
      <button class="order ${st0.order && st0.order !== "BFI" ? "on" : ""}" data-act="pop" data-i="${ms[0]}" data-arg="order">${st0.order && st0.order !== "BFI" ? esc(PLAY.ORDER_BY[st0.order].name) : "Order"}<small>squadron</small></button>
    </div>` : ""}
    ${V.pop && ms.indexOf(V.pop.i) >= 0 && /^(ld|order)$/.test(V.pop.kind) && V.sheet == null ? renderPop(V.pop.i) : ""}
  </section>`;
}

/* The squadron's combined fire as the same table the ships use: only the
   systems that add up (weapons batteries' Firepower, lances' Strength,
   p. 99), by arc and range; each ship's value is already its own current
   one (crippled ships halve individually, p. 99). Dice strengths (Ork
   gunz) cannot be added and stay on the ships' own rows. */
function squadronTable(units, names){
  /* the sum follows the ships: a destroyed, hulked or disengaged member
     is out of it, a silenced weapon (critical) is struck under its row */
  const status = PLAY.squadronStatus(units);
  const who = k => (names && names[k]) || ("ship " + (k + 1));
  const firing = status.out.length ? " " + MID + " " + status.firing.length + " of " + units.length + " firing" : "";
  if(!status.firing.length) return `<p class="foot">No ship left firing: ${status.out.map(o => esc(who(o.idx)) + " " + o.why).join(", ")}.</p>`;
  const all = PLAY.squadronFire(units);
  const SUMS = /^(battery|lance|torpedoes|launch bays|heavy gunz|bombardment cannon)$/;
  const rows = all.filter(r => SUMS.test(r.kind) && (r.total > 0 || (r.silent || []).some(s => typeof s.now === "number")));
  /* a dice strength (Ork gunz) is rolled ship by ship and stays on the
     ships' cards (T13): the table says so rather than dropping it */
  const diceRows = all.filter(r => SUMS.test(r.kind) && !(r.total > 0) && (r.dice || []).length);
  const diceFoot = diceRows.length ? `<p class="foot">Rolled ship by ship, not summed: ${diceRows.map(r => esc(r.kind) + " " + r.dice.map(d => esc(d)).join(", ")).join("; ")} (Fleets p. 360).</p>` : "";
  if(!rows.length) return `<p class="foot">No combined fire: nothing with a number to add (p. 99).${firing}</p>${diceFoot}`;
  const trs = rows.map(r => {
    const name = r.kind === "battery" ? "Weapons batteries" : r.kind === "lance" ? "Lances" : r.kind === "torpedoes" ? "Torpedoes, one salvo" : r.kind === "launch bays" ? "Launch bays, one wave" :
                 r.kind === "heavy gunz" ? "Heavy gunz, 2 hits each (Fleets p. 360)" : "Bombardment cannons";
    const [letter, badge] = wepClass(r.kind === "lance" ? "lance battery" : r.kind === "torpedoes" ? "torpedoes" : r.kind === "launch bays" ? "launch bays" : "weapons battery");
    const nums = r.parts.filter(p => PLAY.num(p.now) != null);
    const half = nums.reduce((a, p) => a + PLAY.half(PLAY.num(p.now)), 0);
    const dice = (r.dice || []).length;
    /* several ranges in one row: what the sum is at each distance */
    const bands = (r.bands || []).length > 1 ? r.bands.map((b, k) => b.total + (k === 0 ? " within " : " to ") + b.range).join(" " + MID + " ") : "";
    /* what a critical took out of this row, struck through, and why */
    const struck = (r.silent || []).filter(s => typeof s.now === "number");
    const lost = struck.length ? (nums.length || bands ? " + " : "") + struck.map(s => `<s>${s.now}</s>`).join(" + ") : "";
    const why = struck.length ? " " + MID + " " + struck.map(s => esc(who(s.ship)) + ": " + esc(String(s.name).toLowerCase()) + " " + esc(s.why)).join("; ") : "";
    return `<tr>
      <td class="bd"><span class="bg" style="--bd:${badge}">${letter}</span></td>
      <td class="nm">${name}<small style="color:var(--card-mute)">${bands ? bands + " cm" : nums.map(p => PLAY.num(p.now)).join(" + ")}${lost}${dice ? " + dice on " + dice + (dice > 1 ? " rows" : " row") : ""}${r.contact ? " " + MID + " base contact (p. 99)" : ""}${why}</small></td>
      <td class="rg">${esc(shortRange(r.range))}</td>
      <td class="st">${r.total}</td>
      <td class="hf">${half}</td>
      <td class="ar">${arcGlyph(r.arc)}</td></tr>`;
  }).join("");
  return `<table class="wt"><thead><tr><th></th><th>Combined fire${firing}</th><th>Range</th><th class="st">Str</th><th class="hf">&frac12;</th><th></th></tr></thead><tbody>${trs}</tbody></table>${diceFoot}`;
}

/* The commander's line on the flagship's card. */
function cmdLine(){
  const C = U[G.cmd].R, ld = C.leadership;
  return `<div class="cmdl"><span class="tag">CMD</span><b>${esc(unitName(G.cmd))}</b><small>${ld ? (ld.kind === "fixed" ? "Ld " + ld.value : "+" + ld.value + " Ld") : ""}${rrWords(C)}</small></div>${rrBoxesHTML(G.cmd)}`;
}
/* A ship's own re-rolls on its card: the sentence and the boxes. */
function shipRRLine(i){
  const rr = U[i].R.rerolls;
  if(!rr) return "";
  /* A star fort with the fleet commander aboard: its re-rolls are his and
     the whole fleet's (J168 b) - the boxes stay here, the words say so. */
  if(PLAY.rerollsJoinFleet(U[i].R, i === G.flag && G.cmd != null))
    return `<div class="cmdl"><span class="tag">RR</span><b>Fleet re-rolls from the fort</b><small>${esc(rr.head || rr.text || "")} \u00b7 commander aboard: any ship may use them (Fleets p. ${rr.joins.page})</small></div>${rrBoxesHTML(i)}`;
  return `<div class="cmdl"><span class="tag">RR</span><b>Ship's own re-rolls</b><small>${esc(rr.head || rr.text || "")}</small></div>${rrBoxesHTML(i)}`;
}
/* Whose re-rolls a box belongs to: the fleet's pool - its commander's, or
   the fleet's own without one (i = -1) - or a further commander's own. */
function rrPool(i){ return i === -1 || i === G.cmd ? G.fleet : G.st[i]; }
const RR_WORD = { included: "included", bought: "bought", optional: "option", added: "added" };
const RR_TIP = { included: "included in the points cost", bought: "bought with the fleet",
                 optional: "an open option of the list, taken into use at the table",
                 added: "added on the counter" };
/* Open options of the list still on offer to this pool: not in the fleet's
   points, and none once the bridge is smashed. */
function rrOpen(i){
  const pool = rrPool(i), src = i >= 0 ? U[i] && U[i].R.rerolls : fleetRR();
  if(!pool || !src || pool.rerollsLost) return 0;
  return Math.max(0, (src.optional | 0) - PLAY.rerollBoxes(pool).filter(b => b.kind === "optional").length);
}
/* The boxes of one pool (user 5.10.2026): a tap uses that re-roll, a second
   tap gives it back. Dashed ones are the list's open options, not in the
   fleet's points: tapped, one becomes a box of its own. */
function rrBoxesHTML(i){
  const pool = rrPool(i), src = i >= 0 ? U[i].R.rerolls : fleetRR();
  if(!pool || !src) return "";
  const boxes = PLAY.rerollBoxes(pool);
  const open = rrOpen(i);
  if(!boxes.length && !open) return "";
  const left = boxes.filter(b => !b.used).length;
  /* Abaddon's one comes back every turn (Fleets p. 231). Without the
     orders track the page has no enemy turn to start, so it says who
     brings the box back then. */
  const perTurn = !pool.rerollsPerTurn ? "" : OPT.orders ? " " + MID + " back every turn (Fleets p. 231)"
    : " " + MID + " 1 per turn (Fleets p. 231): back at NEW TURN - tap it back yourself for the enemy's turn";
  const note = pool.rerollsLost ? "lost: flagship bridge smashed (p. 67)"
    : (left + " of " + boxes.length + " left") + perTurn + (open ? " " + MID + " + open option: tap if bought" : "");
  return `<div class="rrb">${boxes.map((b, k) =>
      `<button class="rrx ${b.kind}${b.used ? " used" : ""}" data-act="rrbox" data-i="${i}" data-arg="${k}" aria-pressed="${b.used}"${b.lost ? " disabled" : ""} aria-label="${esc("Re-roll " + (k + 1) + " of " + boxes.length + ", " + (RR_TIP[b.kind] || "") + ": " + (b.lost ? "lost" : b.used ? "used" : "free"))}" title="${esc(RR_TIP[b.kind] || "")}"><b>RR</b><small>${RR_WORD[b.kind] || ""}</small></button>`).join("")}${
    Array.from({ length: open }, () =>

/* A commander's re-rolls in the builder's own words (DOMAIN.rerollText):

function rrWords(R){ return R.rerolls && R.rerolls.text ? " " + MID + " " + esc(R.rerolls.text) : ""; }
/* A fleet without a commander: its own re-rolls (Necrons p. 404, Demiurg p. 486). */
function fleetRR(){ return G.cmd == null && L0 && L0.frr ? DOMAIN.fleetRerolls(L0, U.map(x => x.R)) : null; }
/* The wreck: what it is now and what it still does (p. 71 / Fleets p. 423). */
const ICON = {

  blazing: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c-4 0-7-3-7-7 0-3 2-5 3-7 0 2 1 3 2 3 0-4 2-6 5-8 0 3 1 4 3 6 2 2 3 4 3 6 0 4-3 7-7 7zm0-2c2 0 3-1 3-3 0-1-1-2-2-3 0 1-1 2-2 2 0-2-1-3-1-4-1 1-2 2-2 4 0 2 1 4 4 4z"/></svg>',
  gone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/></svg>'
};
function hulkChip(st){

function hulkLine(R, st){

function playedBtn(i){

}
/* A star fort's quadrant selector (Fleets p. 501): four buttons, each with
   its own hits left; the selected one is the track, the shields, the
   turrets and the quadrant weapons the card shows, and where the next hit
   or critical goes. The names are the printed card's (LUEMINUT T29). */
function quadSelector(i, v){
  return `<div class="quads" role="group" aria-label="Quadrant">${v.quads.map(q =>
    `<button class="${q.i === v.quad ? "on" : ""}${q.gone ? " gone" : q.crippled ? " cr" : ""}" data-act="quad" data-i="${i}" data-arg="${q.i}" aria-pressed="${q.i === v.quad}" aria-label="${q.name} quadrant: ${q.gone ? "at 0, an asteroid field" : q.remaining + " of " + q.max + " hits left" + (q.crippled ? ", crippled" : "")}"><b>${q.name}</b><small>${q.gone ? "at 0" : q.remaining + "/" + q.max + (q.crippled ? " crip." : "")}</small></button>`).join("")}</div>`;
}
/* A rule card's steps (R.ruleCard, from the builder): heading and sentence. */
function ruleSteps(R){
  return `<ul class="steps">${R.ruleCard.steps.map(s => `<li><b>${esc(s.h)}</b>${esc(s.t)}</li>`).join("")}</ul>`;
}
/* What a rule card tracks: orbital mines one box each - ticked when that
   mine has left play, however it went (it then counts for victory points,
   Fleets p. 512); a minefield only its size, rolled at set-up (p. 513). */
function ruleTrack(i){
  const R = U[i].R, st = G.st[i], rc = R.ruleCard;
  const label = `<p class="noarm">${esc(rc.track.label || "")}</p>`;
  if(!PLAY.tickUnit(R)) return label;
  return `${label}<div class="r3"><div class="hits mem">${st.members.map((m, k) => `<b class="${m.dead ? "on" : ""}" data-act="kill" data-i="${i}" data-arg="${k}" role="button" aria-label="${esc(rc.each)} ${k + 1}">${k + 1}</b>`).join("")}</div>
    <span class="stat">${PLAY.alive(st)} of ${st.members.length} in play</span><span class="stat" title="${esc(PLAY.concededPage(R))}">VP <b>${PLAY.conceded(R, st, 0)}</b></span></div>`;
}
const ruleCount = R => (R.hulls | 0) + " " + R.ruleCard.each + ((R.hulls | 0) === 1 ? "" : "s");
/* A rule card without a profile (orbital mines Fleets p. 512, minefields
   p. 513): a row of its own - how many were bought, their points, what
   the thing is in one line and what it tracks. The steps are on its card
   (the name opens it), and on the row when INFO is on. */
function renderRuleRow(i){
  const R = U[i].R, rc = R.ruleCard;

  return `<section class="row" data-u="${i}" style="--kd:${kd};--km:${km}">

      <button class="name" data-act="sheet" data-i="${i}"><b>${esc(unitName(i))}</b><small>${esc(ruleCount(R))} ${MID} ${R.points | 0} pts ${MID} Fleets p. ${rc.page}</small></button></div>
    <p class="lead">${esc(rc.lead || "")}</p>
    ${ruleTrack(i)}
    ${V.info && !V.compact ? ruleSteps(R) : ""}
  </section>`;
}
/* ... and its card: the same, with every step. */
function renderRuleSheet(i){
  const R = U[i].R, st = G.st[i], rc = R.ruleCard;
  const [kd, km] = factionCols(G.ln, "");
  return `<div class="sheet" style="--kd:${kd};--km:${km}">

      <button class="btn sec" data-act="closesheet">Back to the fleet</button>
    </div></div>`;
}
function renderRow(i, inGroup){
  const R = U[i].R, st = G.st[i];
  if(R.kind === "commander"){
    /* aboard a flagship the commander rides on that card */
    if(G.flag != null && i === G.cmd) return "";
    return `<section class="row" style="--kd:${factionCols(G.ln, "")[0]};--km:${factionCols(G.ln, "")[1]};padding:6px 8px 6px 10px">
      <div class="r1"><span class="tag">CMD</span><div class="name" style="min-height:32px"><b>${esc(unitName(i))}</b><small style="white-space:normal">${esc(R.rerolls && R.rerolls.text || "")}</small></div></div>${rrBoxesHTML(i)}</section>`;
  }
  if(R.kind !== "ship" && R.ruleCard) return renderRuleRow(i);
  if(R.kind !== "ship") return `<section class="row" style="--kd:var(--line);--km:var(--ink-3);padding:6px 8px 6px 10px"><div class="r1"><span class="tag">+</span><div class="name" style="min-height:32px"><b>${esc(unitName(i))}</b><small>fleet entry, ${R.points | 0} pts</small></div></div></section>`;
  const v = PLAY.view(R, st, G.fleet);
  const [kd, km] = factionCols(R.entry ? R.entry.list : G.ln, R.source.faction || "");
  const esq = v.escort;
  const sqc = inGroup ? sqColor(G.grp[i]) : esq ? escColor(i) : null;
  const cls = ["row", esq ? "esc" : "cap", v.crippled ? "crippled" : "", v.destroyed ? "dead" : "", v.destroyed && !esq && !st.hulk && st.hulkName ? "gone" : "", "pl" + st.played, inGroup ? "ingrp" : "", sqc ? "sqd" : ""].join(" ");
  const sub = [R.name ? title(R.className) : "", R.stats.type, esq ? R.hulls + " " + memberWord(R, R.hulls) : (R.points | 0) + " pts"].filter(Boolean).join(" " + MID + " ");
  /* a star fort's chips are the selected quadrant's, and say which */
  const qn = v.fort ? PLAY.QUADS[v.quad] + " " : "";
  const chips = (OPT.orders && !inGroup ? ordChip(st) : "") + (v.crippled ? `<span class="chip crip">${qn}CRIPPLED</span>` : "") +
    (v.quadGone && !v.destroyed ? `<span class="chip crip">${qn}AT 0 ${MID} ASTEROID FIELD</span>` : "") +
    (v.destroyed ? hulkChip(st) : "") +
    critChips(R, st, i) + (st.disengaged ? `<span class="chip">disengaged</span>` : "") +
    (OPT.orders ? (st.braceLock ? `<span class="chip lock">brace locked</span>` : "") + (st.boarding ? `<span class="chip lock">boarding</span>` : "") + (st.noOrdersTurn ? `<span class="chip lock">no fire/orders</span>` : "") : "");
  let r3;
  if(esq){
    /* one box per ship, filled when it is gone (p. 66: one hit or any
       critical destroys an escort) */
    r3 = `<div class="hits mem">${st.members.map((m, k) => `<b class="${m.dead ? "on" : ""}" data-act="kill" data-i="${i}" data-arg="${k}" role="button" aria-label="${memberWord(R, 1)} ${k + 1}">${k + 1}</b>`).join("")}</div>
      <span class="stat">${v.alive} of ${R.hulls}</span>` +
      (OPT.shields ? `<button class="stat ${st.blast ? "off" : ""}" data-act="blast" data-i="${i}" data-arg="${st.blast ? 0 : 1}">UNDER FIRE <b>${st.blast ? "-1 Ld" : "no"}</b></button>` : "");
  }else{
    r3 = hitsTrack(i, v, false) +
      (OPT.shields ? `<button class="stat ${v.shields.now != null && v.shields.up < v.shields.now ? "off" : ""}" data-act="pop" data-i="${i}" data-arg="blast">SH <b>${v.shields.now == null ? esc(v.shields.text) : v.shields.up + "/" + v.shields.now}</b>${st.blast ? "<small>BM " + st.blast + "</small>" : ""}</button>` : "") +
      (OPT.ordnance ? ordnancePills(i, v) : "");
  }
  const orderBtns = !OPT.orders || inGroup ? "" : `<button class="brace ${v.braced ? "on" : ""}" data-act="brace" data-i="${i}" ${PLAY.canOrder(st, G.fleet, "BFI", R) ? "" : "disabled"}>Brace</button>
      <button class="order ${st.order && st.order !== "BFI" ? "on" : ""}" data-act="pop" data-i="${i}" data-arg="order">${st.order && st.order !== "BFI" ? esc(PLAY.ORDER_BY[st.order].name) : "Order"}</button>`;
  /* a star fort's HIT and CRIT go to the selected quadrant; one at 0
     takes no further damage (Fleets p. 501) */
  const critLine = (v.quadGone ? qn + "at 0" : (v.crits.length ? v.crits.length + " active" : "2D6") + (qn && v.crits.length ? " " + qn.trim() : ""));
  /* The compact row (user 19.10.2026): what a hit or a critical needs and
     nothing else - the name, Ld, CRIT, the spec line the enemy asks about
     (armour, shields), the track and the chips. The track takes a hit in
     one tap, so HIT +1 is not repeated; the weapons are on the card (the
     name). Brace and orders stay when they are tracked: they are the enemy
     turn's own taps. */
  const compact = V.compact;
  const r4 = v.destroyed ? (esq ? "" : `<div class="r4"><button data-act="pop" data-i="${i}" data-arg="hulk">Catastrophic<small>${cataLabel(R, st)}</small></button></div>`)
    : esq || compact ? (orderBtns ? `<div class="r4">${orderBtns}</div>` : "") : `<div class="r4">
      <button class="hit" data-act="hit" data-i="${i}" ${v.quadGone ? "disabled" : ""}>Hit<small>${v.quadGone ? qn + "at 0" : "+1" + (qn ? " " + qn.trim() : "")}</small></button>
      ${orderBtns}
      <button class="crit" data-act="pop" data-i="${i}" data-arg="crit" ${v.quadGone ? "disabled" : ""}>Crit<small>${critLine}</small></button>
    </div>`;
  const r1tail = compact
    ? (v.destroyed ? "" : (inGroup ? "" : ldTile(i, "", true)) + (esq ? "" : `<button class="crit cmini" data-act="pop" data-i="${i}" data-arg="crit" ${v.quadGone ? "disabled" : ""}>Crit<small>${critLine}</small></button>`) + (inGroup ? "" : playedBtn(i, v)))
    : (inGroup || v.destroyed ? "" : ldTile(i) + playedBtn(i, v));
  return `<section class="${cls}" data-u="${i}" style="--kd:${kd};--km:${km}${sqc ? ";--sq:" + sqc : ""}">
    <div class="r1"><span class="tag">${classTag(R)}${esq ? TIMES + v.alive : ""}</span>${inGroup ? `<span class="tag sq" title="Squadron ${G.grp[i]}">SQN ${G.grp[i]}</span>` : ""}
      <button class="name" data-act="sheet" data-i="${i}"><b>${esc(unitName(i))}</b><small>${esc(sub)}</small></button>
      ${r1tail}</div>
    ${i === G.flag && G.cmd != null ? cmdLine() : ""}${shipRRLine(i)}
    ${v.fort && !v.destroyed ? quadSelector(i, v) : ""}
    ${v.destroyed && !esq ? hulkLine(R, st) : statsLine(v, R, esq)}
    ${v.destroyed && !esq ? "" : compact ? weaponsLine(R, st, esq) : weaponsTable(R, st, esq)}
    ${R.ruleCard && !v.destroyed && !compact ? ruleSteps(R) : ""}
    <div class="r3">${r3}${chips}</div>
    ${r4}
    ${V.pop && V.pop.i === i && V.sheet == null && !(inGroup && /^(ld|order)$/.test(V.pop.kind)) ? renderPop(i) : ""}
  </section>`;
}

function hitsTrack(i, v, big){
  const max = v.max, at = v.crippledAt;
  let s = `<div class="hits ${max > 16 ? "many" : ""}">`;
  for(let n = 1; n <= max; n++){
    const cr = v.crippledAt && n >= at && v.max > 1;
    s += `<b class="${n <= v.hits ? "on" : ""} ${cr ? "cr" : ""} ${n === at ? "first" : ""}" data-act="dmg" data-i="${i}" data-arg="${n}" role="button" aria-label="hits ${n}">${n}</b>`;
  }
  return s + "</div>";
}


function renderPop(i){
  const R = U[i].R, st = G.st[i], fl = G.fleet, kind = V.pop.kind;
  const v = PLAY.view(R, st, fl);
  /* the unit's own rule line for a slot ("orders", "blast"), as the builder
     wrote it with its page: the page shows it, it does not retell it */
  const slotRule = slot => { const r = (R.rules || []).find(x => x.slot === slot); return r ? String(r.t).replace(/^\*\s*/, "") : ""; };
  if(kind === "ld"){
    const l = PLAY.leadership(R, st, fl);
    const others = G.grp[i] ? groupUnits(G.grp[i]).filter(j => j !== i) : [];
    /* a Leadership the book fixes (planetary defences Ld 7, Rulebook
       p. 100; the Fortress-Monastery Ld 10, Fleets p. 111) is not rolled:
       no dice tiles, the reason instead */
    const fx = PLAY.fixedLd(R);
    const others2 = others.length ? `<p>Squadron: the highest surviving Leadership counts (p. 95). ${others.map(j => esc(unitName(j)) + " Ld " + (G.st[j].ld == null ? "?" : G.st[j].ld)).join(", ")} ${MID} ${others.map(j => `<button class="chip" data-act="pop" data-i="${j}" data-arg="ld">set ${esc(unitName(j)).slice(0, 12)}</button>`).join(" ")}</p>` : "";
    if(fx) return `<div class="pop"><h4>Leadership ${G.grp[i] ? MID + " " + esc(unitName(i)) + " " : ""}${MID} Ld ${fx.value}, not rolled${fx.page ? " " + MID + " Fleets p. " + fx.page : ""}</h4>
      ${others2}
      <p>${esc(slotRule("orders") || ("Ld " + fx.value + ": " + (fx.note || "fixed") + "."))}</p>
      ${st.ldFrom === "commander" ? `<p>The commander aboard: his own Leadership is used instead (Fleets p. 111).</p>` : ""}
      <button class="close" data-act="closepop">close</button></div>`;
    return `<div class="pop"><h4>Leadership ${G.grp[i] ? MID + " " + esc(unitName(i)) + " " : ""}${MID} rolled ${l.base == null ? "?" : l.base}${st.ldPerm ? " " + MID + " bridge smashed " + st.ldPerm : ""}</h4>
      ${others2}
      <p>${l.base == null ? "Roll a D6 (p. 45): 1 = 6, 2-3 = 7, 4-5 = 8, 6 = 9 - or on the fleet's own table: Ld 5 (Orks, Fleets p. 358) to Ld 10 (Space Marines, Fleets p. 94)." : "Command checks: 2D6 equal to or under Ld; -1 under fire, +1 enemy contacts, never above 10 (p. 48) - count those from the table."}</p>
      <div class="tiles c6">${PLAY.LD_VALUES.map(n => `<button class="${st.ldRoll === n ? "on" : ""}" data-act="ld" data-i="${i}" data-arg="${n}"><b>${n}</b></button>`).join("")}</div>
      ${st.ldFrom === "commander" ? `<p>The commander's Leadership line applies to this flagship: a fixed value stands in for the roll, a bonus is added to it.</p>` : ""}
      <button class="close" data-act="closepop">close</button></div>`;
  }
  if(kind === "blast"){
    return `<div class="pop"><h4>Blast markers touching the base</h4>
      <p>One is placed per hit the shields block (p. 70); each one in contact takes a shield off when fired upon (p. 69), -1 Ld (p. 48) and halves damage-control dice (p. 88). Shields come back when the ship moves clear (p. 70).</p>
      ${slotRule("blast") ? `<p>${esc(slotRule("blast"))}</p>` : ""}
      <div class="steprow"><button data-act="blast" data-i="${i}" data-arg="-1">&minus;</button><div class="val">${st.blast | 0}<small>shields up ${v.shields.up == null ? "-" : v.shields.up + " of " + v.shields.now}</small></div><button data-act="blast" data-i="${i}" data-arg="1">+</button></div>
      <button class="btn sec" data-act="blast" data-i="${i}" data-arg="0">${v.still ? "All removed" : "Moved clear"} ${MID} shields up</button>
      <button class="close" data-act="closepop">close</button></div>`;
  }
  if(kind === "order"){
    const l = G.grp[i] ? PLAY.squadronLd(groupUnits(G.grp[i]).map(j => ({ R: U[j].R, st: G.st[j] })), fl) : PLAY.leadership(R, st, fl);
    /* only the orders this unit may take at all (R.orders): a planetary
       defence Reload Ordnance and Brace (Rulebook p. 100), a star fort and
       a Haven Lock On as well (Fleets p. 503, 111, 336) - its own rule
       line says which and where */
    const tiles = PLAY.ordersFor(R).filter(o => o.id !== "BFI").map(o =>
      `<button class="${st.order === o.id ? "on" : ""}" data-act="order" data-i="${i}" data-arg="${o.id}" ${PLAY.canOrder(st, fl, o.id, R) || st.order === o.id ? "" : "disabled"}>${esc(o.name)}${V.info ? `<small>${esc(o.line)}</small>` : ""}</button>`).join("");
    const only = R.orders ? slotRule("orders") : "";
    return `<div class="pop"><h4>Special orders ${MID} check vs Ld ${l.now == null ? "?" : l.now}</h4>
      <p>${fl.orderLock ? "A check failed this turn: no more orders except Brace (p. 48)." : st.braceTurn ? "Braced: no other orders this turn (p. 47)." : "Tap an order = declared and passed. One per ship or squadron per turn (p. 46, 95)."}</p>
      ${only ? `<p>${esc(only)}</p>` : ""}
      <div class="tiles">${tiles}
        <button class="bad" data-act="orderfail" data-i="${i}" ${fl.orderLock ? "disabled" : ""}>Check failed<small>locks the fleet</small></button>
        <button class="warn" data-act="bracefail" data-i="${i}" ${st.braceLock ? "disabled" : ""}>Brace failed<small>p. 47</small></button>
        ${st.braceLock ? `<button class="ok" data-act="bracelock" data-i="${i}">Attacker done<small>brace again</small></button>` : ""}
        <button class="${st.boarding ? "on" : ""}" data-act="boarding" data-i="${i}">Boarding<small>no fire this turn p. 89</small></button>
        ${v.still ? "" : `<button class="${st.noOrdersTurn ? "on" : ""}" data-act="nofire" data-i="${i}">Disengage failed<small>no fire/orders p. 57</small></button>
        <button class="${st.disengaged ? "on" : ""}" data-act="diseng" data-i="${i}">Disengaged<small>left the table p. 57</small></button>`}
        ${st.order || st.braceTurn ? `<button data-act="clearorder" data-i="${i}">Clear order</button>` : ""}
      </div>
      <button class="close" data-act="closepop">close</button></div>`;
  }
  if(kind === "crit"){
    const cm = R.damage.critical;
    const std = PLAY.standardCrits(R);
    const fl = V.flash && V.flash.i === i && Date.now() - V.flash.t < 1500 ? V.flash : null;
    /* a star fort: the selected quadrant's criticals (Fleets p. 501) */
    const tk = PLAY.track(R, st);
    const cnt = key => (tk.crits && tk.crits[String(key)]) | 0;
    const badge = key => cnt(key) ? `<i class="n">${cnt(key) > 1 ? TIMES + cnt(key) : "on"}</i>` : "";
    const tcls = key => [cnt(key) ? "has" : "", fl && String(fl.key) === String(key) ? "just" : ""].join(" ").trim();
    /* each result: the minus right beside the plus; the minus is disabled
       when there is nothing of it on the ship */
    const minus = key => `<button class="minus" data-act="critminus" data-i="${i}" data-arg="${esc(String(key))}"${cnt(key) ? "" : " disabled"} aria-label="${esc("Take one " + critLabel(R, key) + " off")}">\u2212</button>`;
    const pair = (key, cls, plusAttrs, inner) => `<div class="cp ${cls}">${minus(key)}<button class="plus ${tcls(key)}" ${plusAttrs} aria-label="${esc("Add " + critLabel(R, key))}">${badge(key)}${inner}</button></div>`;
    const tiles = cm.rows.map(r => pair(r[0], cnt(r[0]) ? "has" : "", `data-act="crit" data-i="${i}" data-arg="${esc(String(r[0]))}"`,
      `<b>${esc(String(r[0]))}</b>${esc(r[1])}${r[2] ? `<small>${esc(r[2])}</small>` : ""}`)).join("");
    const wide = (cm.wide || []).map(w => {
      const m = String(w).match(/^(\d+)\s+(.*?)\s*\+D(\d)$/);
      const k0 = String(w).split(" ")[0];
      if(!m) return pair(k0, cnt(k0) ? "has" : "", `data-act="crit" data-i="${i}" data-arg="${esc(k0)}"`, esc(w));
      const open = V.pop.x === m[1];
      return pair(m[1], "warn" + (open ? " on" : "") + (cnt(m[1]) ? " has" : ""), `data-act="critpick" data-i="${i}" data-arg="${open ? "" : m[1]}"`,
        `<b>${m[1]}</b>${esc(m[2])}<small>+D${m[3]}: pick the roll</small>`);
    }).join("");
    /* the D3/D6 for 11 or 12, in place - nothing above it moves */
    let xrow = "";
    if(V.pop.x){
      const n = V.pop.x === "12" ? 6 : 3;
      const bs = []; for(let k = 1; k <= n; k++) bs.push(`<button data-act="critx" data-i="${i}" data-arg="${esc(V.pop.x)}:${k}">+${k}</button>`);
      xrow = `<div class="xrow"><span>${esc(critLabel(R, V.pop.x))}: roll the D${n} and tap the result - the hits go on at once (p. 67)</span>${bs.join("")}<button class="cx" data-act="critpick" data-i="${i}" data-arg="">cancel</button></div>`;
    }
    /* The order is for the finger: the status line (always there, so it
       never pushes anything), then the tiles - each with its own minus, so
       the table itself says what is on the ship (user 30.9.2026: the
       summary list and its REPAIR buttons went). */
    return `<div class="pop"><h4>${esc(cm.title)}${v.fort ? " " + MID + " " + PLAY.QUADS[v.quad] + " quadrant" : ""} ${MID} ${R.damage.triggerHint}</h4>
      <p class="last ${fl ? "fresh" : ""}">${fl ? esc(fl.msg) : (V.flash && V.flash.i === i ? esc(V.flash.msg) : "Tap a result to add it; the table stays open until you close it.")}</p>
      <div class="tiles">${tiles}${wide}</div>
      ${xrow}
      <p>Damage control: <b>${v.repairDice}D6</b> (half with blast markers in contact), each 6 repairs one system or puts out one fire (p. 88).${R.damage.repair ? " " + esc(R.damage.repair) : ""}</p>
      ${V.info && cm.foot ? `<p class="foot">${esc(cm.foot)}</p>` : ""}
      <button class="close" data-act="closepop">close</button></div>`;
  }
  if(kind === "hulk"){
    const c = PLAY.catastrophic(R);
    const tiles = c.rows.map((r, k) => `<button class="${r.kind === "gone" ? "bad" : (st.hulk === r.kind && st.hulkName === r.name ? "on" : "")}" data-act="hulk" data-i="${i}" data-arg="${k}"><b>${esc(r.roll)}</b>${esc(r.name)}<small>${r.extra ? esc(r.extra) + " " + MID + " " : ""}${esc(r.text)}</small></button>`).join("");
    return `<div class="pop cata"><h4>${esc(c.title)}${c.dice ? " " + MID + " roll " + c.dice : ""} ${MID} ${c.fleets ? "Fleets" : "Rulebook"} p. ${c.page}</h4>
      <p>${esc(unitName(i))} ${v.fort ? "has all four quadrants at 0 hits (" + R.stats.hits + " each to start)" : "is at 0 hits (" + R.stats.hits + " to start)"}. ${esc(c.note)}</p>
      <div class="tiles c2">${tiles}
        ${c.boarded ? `<button data-act="hulk" data-i="${i}" data-arg="boarded">Boarded to 0<small>no roll: a drifting hulk (p. 90)</small></button>` : ""}
      </div>
      <p class="hr"><b>While it is a hulk</b></p><ul class="hulkrules">${c.hulk.list.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      ${c.explode ? `<p class="hr">${esc(c.explode)}</p>` : ""}
      <button class="close" data-act="closepop">close</button></div>`;
  }
  return "";
}

    : `<div class="sec"><h3>Damage<em>${qn ? qn + " " + MID + " " : ""}${v.hits} of ${v.max} ${MID} crippled from box ${v.crippledAt}</em></h3>

/* ========================================== FLEETS BY LINK OR FILE ===== */
/* PHONE_LINK, b64url, packFleet, QR and qrSvg come from app_template.html
   (play/build_play.py copies them): the builder's Saved fleets make the
   same links. */
/* A phone has no builder save of its own. A fleet comes to it inside a
   link (#fleet=..., the fleet document deflated and base64url'd - nothing
   is uploaded anywhere, the link IS the fleet) or as the builder's export
   file. Either way it goes on the page's own list (KEY_LINKED), never into
   the builder's key. */
function linkedFleets(){
  let a = null; try{ a = JSON.parse(lsGet(KEY_LINKED) || "[]"); }catch(e){}
  return Array.isArray(a) ? a.filter(f => f && f.doc && Array.isArray(f.doc.units) && f.doc.units.length) : [];
}
function addLinked(doc, how){
  const d = { name: doc.name || "", ln: doc.ln, limit: doc.limit, units: doc.units };
  const fp = fnv(JSON.stringify([d.ln, d.units]));
  const now = new Date(), pad = n => (n < 10 ? "0" : "") + n;
  const all = linkedFleets().filter(f => f.fp !== fp);
  all.unshift({ fp: fp, how: how, date: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()), doc: d });
  lsSet(KEY_LINKED, JSON.stringify(all.slice(0, 40)));
  return fp;
}
function forgetLinked(k){ const all = linkedFleets(); all.splice(k, 1); lsSet(KEY_LINKED, JSON.stringify(all)); }
/* A fleet document as text (a file, a pasted one, a link's content): every
   fleet in it goes on the list, the first one is marked new. */
function takeFleetText(text, how){
  const p = parseDoc(text);
  if(p.error){ V.loadErr = p.error; render(); return false; }
  const fs = fleetsIn(p.o);
  if(!fs.length){ V.loadErr = "The document has no ships in it."; render(); return false; }
  const bad = fs.map(f => resolveFleet(f)).find(r => r.error);
  if(bad && fs.length === 1){ V.loadErr = bad.error; render(); return false; }
  const fresh = [];
  fs.slice().reverse().forEach(f => { fresh.push(addLinked(f, how)); });
  V.loadErr = ""; V.linkNew = fresh; V.screen = "load";
  render();
  return true;
}
/* The builder's fleets on this device, the named library first (J208,
   gothic-fleet-registry-saves-v1) and then the fleet each list is editing
   (gothic-fleet-registry-v1). Read, never written. */
const KEY_LIB_BUILDER = "gothic-fleet-registry-saves-v1";
function builderFleets(){
  const out = [];
  let lib = null; try{ lib = JSON.parse(lsGet(KEY_LIB_BUILDER) || "null"); }catch(e){}
  (lib && Array.isArray(lib.saves) ? lib.saves : []).forEach(f => {
    if(f && Array.isArray(f.units) && f.units.length) out.push({ name: f.name || "", ln: f.ln, limit: f.limit, units: f.units, saved: true });
  });
  const p = parseDoc(lsGet(KEY_BUILDER) || "");
  if(p.o) fleetsIn(p.o).forEach(f => out.push(Object.assign({ saved: false }, f)));
  return out;
}
/* Where the phone opens the link: this page when it is on the web, the
   published page when this one runs from a disk or from localhost (a phone
   cannot reach either). */
function playBase(){
  const loc = typeof location !== "undefined" ? location : null;
  const local = !loc || loc.protocol !== "https:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(loc.hostname);
  return local ? { url: PHONE_LINK.play, remote: true } : { url: loc.origin + loc.pathname, remote: false };
}
/* What a "to phone" sends: "b:<k>" a builder fleet on this device, "s:<k>"
   one of this page's own saved fleets, "all" every one of them - from phone
   to phone too (user 19.10.2026: "QR koodi ... pitaisi onnistua myos
   kannykalle. etta saa esim kannykasta kannykkaan"). Names travel along. */
function phoneDoc(key){
  const one = f => ({ name: f.name || undefined, ln: f.ln, limit: f.limit, units: f.units });
  if(key === "all"){
    const lk = linkedFleets().map(f => f.doc);
    if(!lk.length) return null;
    const d = Object.assign({ schemaVersion: DOMAIN.SCHEMA_VERSION }, one(lk[0]));
    if(lk.length > 1) d.fleets = lk.slice(1).map(one);
    return d;
  }
  const m = /^([bs]):(\d+)$/.exec(String(key));
  const f = !m ? null : m[1] === "b" ? builderFleets()[+m[2]] : (linkedFleets()[+m[2]] || {}).doc;
  return f ? Object.assign({ schemaVersion: DOMAIN.SCHEMA_VERSION }, one(f)) : null;
}
async function phoneLink(key){
  V.phoneUrl = ""; V.phoneSvg = ""; V.phoneErr = ""; V.phoneN = 0;
  try{
    const d = phoneDoc(key);
    if(!d) throw new Error("the fleet is no longer here");
    const base = playBase();
    V.phoneUrl = base.url + "#" + await packFleet(d); V.phoneRemote = base.remote;
    V.phoneN = 1 + (d.fleets || []).length;
    try{ V.phoneSvg = qrSvg(V.phoneUrl); }
    catch(e){ V.phoneErr = V.phoneN + " fleets are too long a link for one QR code (" + V.phoneUrl.length + " characters). Share or copy the link instead - a phone opens it all the same - or send the fleets one by one."; }
  }catch(e){ V.phoneErr = String(e && e.message || e); }
  if(V.phone === key) render();
}
/* Copy and share answer in place: the button says "Copied" (no toast). */
function copyText(text, what){
  const done = () => { V.copied = what; render(); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text) && done()); return; }
  }catch(e){}
  if(fallbackCopy(text)) done();
}
function fallbackCopy(text){
  const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(e){} t.remove(); return ok;
}
function shareText(title, text){
  if(navigator.share){ navigator.share(/^https?:/.test(text) ? { title: title, url: text } : { title: title, text: text }).catch(() => {}); }
  else copyText(text, /^https?:/.test(text) ? "link" : "report");
}


/* ------------------------------------------------------ the End Phase --- */
/* p. 88: in every End Phase - both players' - capital ships roll 1D6 per
   hit left (half with blast markers), each 6 repairs one system or puts out
   one fire; p. 67: a fire not put out costs a hit. The page rolls nothing:
   it lists the ships with something to repair and takes the results. */
function repairable(R, key){
  const cm = R.damage && R.damage.critical;
  if(cm && /cannot repair any critical/i.test(String(cm.foot || ""))) return false;
  const row = cm && cm.rows.find(r => String(r[0]) === String(key));
  if(row && (/\*\s*$/.test(String(row[1])) || /\*\s*$/.test(String(row[2] || "")))) return false;
  if(PLAY.standardCrits(R) && PLAY.CRITS[key] && PLAY.CRITS[key].perm) return false;
  return true;
}
function endPending(){
  let fires = 0, crits = 0;
  U.forEach((x, i) => {
    const R = x.R, st = G.st[i];
    if(R.kind !== "ship" || PLAY.isEscort(R) || PLAY.isFort(R) || PLAY.destroyed(R, st)) return;
    PLAY.activeCrits(st, R).forEach(c => {
      if(PLAY.standardCrits(R) && c.key === "7") fires += c.count;
      if(repairable(R, c.key)) crits += c.count;
    });
  });
  return { fires: fires, crits: crits, n: crits };
}
function renderEndPhase(){
  const fl = G.fleet;
  const rows = U.map((x, i) => {
    const R = x.R, st = G.st[i];
    if(R.kind !== "ship" || PLAY.isEscort(R) || PLAY.isFort(R)) return "";
    const v = PLAY.view(R, st, fl);
    if(v.destroyed) return "";
    const crits = PLAY.activeCrits(st, R);
    if(!crits.length) return "";
    const nm = c => { const cm = R.damage.critical, row = cm && cm.rows.find(r => String(r[0]) === c.key); return String(row ? row[1] : (c.def ? c.def.name : c.key)).replace(/\s*\*\s*$/, ""); };
    const reps = crits.map(c => repairable(R, c.key)
      ? `<button data-act="repair" data-i="${i}" data-arg="${esc(c.key)}"><b>${esc(c.key)}</b> ${esc(nm(c))}${c.count > 1 ? " " + TIMES + c.count : ""}<small>tap when repaired</small></button>`
      : `<span class="perm"><b>${esc(c.key)}</b> ${esc(nm(c))} ${MID} no repair (p. 67)</span>`).join("");
    const fire = PLAY.standardCrits(R) && crits.some(c => c.key === "7");
    const n = fire ? Math.max(1, PLAY.fireDamage(R, st)) : 0;
    const times = st.fireTurn === fl.turn ? st.fireN | 0 : 0;
    const fireBtn = fire ? `<button class="fireb${times ? " done" : ""}" data-act="fire" data-i="${i}">Fire not put out: +${n} hit${n > 1 ? "s" : ""}<small>${times ? "added " + times + TIMES + " this turn" : "after the repair rolls (p. 67)"}</small></button>` : "";
    return `<div class="eprow" style="--kd:${factionCols(R.entry ? R.entry.list : G.ln, R.source.faction || "")[0]}"><div class="ephd"><b>${esc(unitName(i))}</b><small>damage control ${v.repairDice}D6${R.damage.repair && R.damage.repair !== DOMAIN.REPAIR_LINE ? " " + MID + " " + esc(R.damage.repair) : ", a 6 repairs one (p. 88)"}</small></div>
      <div class="eprep">${reps}</div>${fireBtn}</div>`;
  }).join("");
  return `<div class="menu endp" data-act="endph"><div class="box">
    <h2>End phase</h2>
    <p class="foot">Both players repair in every End Phase (p. 88): roll the dice shown, tap what was repaired; then a fire still burning costs a hit (p. 67). Halve the dice with blast markers in contact.</p>
    ${rows || `<p class="foot">Nothing to repair.</p>`}
    <button class="btn sec" data-act="endph">Done</button>
  </div></div>`;
}

/* ------------------------------------------------- the strip of ships --- */
/* The bottom strip (full view): one chip per unit in the roster's order,
   its state in its colour - crippled, out of action, played. A tap moves
   the screen to that row. */
function shortName(i){
  const w = unitName(i).split(/\s+/).filter(Boolean);
  if(w.length > 1 && w[w.length - 1].length <= 3) return w[0].slice(0, 8) + " " + w[w.length - 1];
  return w.join(" ").length <= 10 ? w.join(" ") : w[0].slice(0, 9);
}
function jumpStrip(){
  const chips = U.map((x, i) => {
    const R = x.R, st = G.st[i];
    if(R.kind !== "ship" && !R.ruleCard) return "";
    const v = R.kind === "ship" ? PLAY.view(R, st, G.fleet) : null;
    const cls = v ? (v.destroyed ? "dead" : v.crippled ? "cr" : "") + (st.played >= 2 ? " done" : "") : "";
    return `<button class="${cls.trim()}" data-act="jump" data-i="${i}">${esc(shortName(i))}${v && v.escort ? `<small>${TIMES}${v.alive}</small>` : ""}</button>`;
  }).join("");
  return `<div class="jump" role="navigation" aria-label="Go to a ship">${chips}</div>`;
}

/* ------------------------------------------------------- game report --- */
/* The BFG Meta Almanac's report (meta-tietokanta/lisaa dataa/
   FLEET_REPORT_TEMPLATE.md): the first four lines are what counts, the rest
   is welcome. Fleets, the result and the ships - no names. */
const SCENARIOS = ["Cruiser Clash", "Fleet Engagement", "Planetary Assault", "Convoy", "Surprise Attack", "Raiders", "Blockade Run", "Exterminatus", "Escalating Engagement", "Bait and Trap", "Hunt the Hunter", "Pirate Hunt", "Breakout"];
function repState(){
  if(!G.report){ const d = new Date(), pad = n => (n < 10 ? "0" : "") + n; G.report = { opp: "", win: "", scen: "", notes: "", date: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) }; }
  return G.report;
}
function reportText(){
  const r = repState();
  const lost = [], crip = [];
  U.forEach((x, i) => {
    const R = x.R, st = G.st[i];
    if(R.kind !== "ship") return;
    const v = PLAY.view(R, st, G.fleet);
    if(v.escort){ const dead = R.hulls - v.alive; if(dead) lost.push(unitName(i) + (R.hulls > 1 ? " " + dead + "/" + R.hulls : "")); }
    else if(v.destroyed) lost.push(unitName(i) + (st.hulkName ? " (" + st.hulkName.toLowerCase() + ")" : ""));
    else if(v.crippled) crip.push(unitName(i));
    if(st.disengaged) lost.push(unitName(i) + " disengaged");
  });
  const auto = "Recorded with Gothic Fleet Play: turn " + G.fleet.turn + "; fleet A lost " + (lost.join(", ") || "nothing") +
    (crip.length ? "; crippled " + crip.join(", ") : "") + "; VP conceded by fleet A " + vpTotal() + ".";
  const win = r.win === "A" ? "A" : r.win === "B" ? "B" : r.win === "D" ? "Draw" : "";
  const lines = U.map(x => listLineOf(x.R));
  return ["Fleet A: " + G.ln, "Fleet B: " + (r.opp || ""), "Winner: " + win, "Scenario: " + (r.scen || ""), "",
          "Points: " + (G.limit || fleetPoints(U)), "Date: " + r.date, "Notes: " + (r.notes ? r.notes.trim() + " " : "") + auto, "",
          "List A:", G.ln + " \u2014 " + fleetPoints(U) + "/" + (G.limit | 0) + " pts"].concat(lines).concat(["", "List B:", ""]).join("\n");
}
/* typing in the report: kept at once, the text below follows, no re-render
   (the field keeps its focus) */
document.addEventListener("input", ev => {
  const k = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-rep");
  if(!k || !G) return;
  repState()[k] = ev.target.value; save();
  const t = $("#reptext"); if(t) t.value = reportText();
});
/* a ship's name at the set-up: kept as it is typed, no re-render (the field
   keeps its focus); an empty field or the old name is the old name again.
   The flagship choice beside it follows at once. */
document.addEventListener("input", ev => {
  const a = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-nm");
  if(a == null || !G) return;
  const i = parseInt(a, 10);
  if(!U[i]) return;
  const v = String(ev.target.value || "").replace(/\s+/g, " ").trim();
  G.nm = G.nm || {};
  if(!v || v === baseName(i)) delete G.nm[i]; else G.nm[i] = v;
  save();
  document.querySelectorAll('select[data-sel="flag"] option[value="' + i + '"]').forEach(o => { o.textContent = "aboard " + unitName(i); });
});
/* Enter (the keyboard's Done) puts the keyboard away */
document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target && ev.target.getAttribute && ev.target.getAttribute("data-nm") != null){ ev.preventDefault(); ev.target.blur(); }
});

/* ============================================================== EVENTS ===== */
document.addEventListener("touchstart", () => {}, { passive: true });   /* :active on iOS */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el || el.disabled) return;
  /* a new screen just came up under the finger (user 19.10.2026: a second
     tap on "nothing happened" landed on the next screen and picked an Ld):
     taps in the first moments after a screen change are not taken */
  if(Date.now() < V.guardUntil){ ev.preventDefault(); return; }
  const name = el.getAttribute("data-act");
  /* The tapped control stays where the finger is (user 30.9.2026: the screen
     must not move). render() finds the same control again and shifts the
     scroll by however far it moved - a chip line or a band appearing above
     it no longer pushes it away. */
  const tr = el.getBoundingClientRect();
  TAP = { sel: tapSel(el), top: tr.top + tr.height / 2 };
  /* a tap inside the menu box is not a tap on the backdrop */
  if((name === "menu" || name === "endph") && el.classList.contains("menu") && ev.target.closest(".box")) return;
  const i = el.hasAttribute("data-i") ? parseInt(el.getAttribute("data-i"), 10) : null;
  let arg = el.hasAttribute("data-arg") ? el.getAttribute("data-arg") : undefined;
  if(arg != null && /^-?\d+$/.test(arg)) arg = parseInt(arg, 10);
  if(name === "resume"){ const g = loadPlay(); if(g && resumeGame(g)){ V.screen = "roster"; } else { V.loadErr = "The saved game could not be resumed against this roster."; } render(); return; }
  if(name === "newfrom"){
    const f = builderFleets()[arg]; if(!f) return;
    const res = resolveFleet(f); if(res.error) return;
    if(loadPlay() && !confirm("A game is in progress. Start a new one and forget its record?")) return;
    newGame(res); V.screen = "setup"; save(); render(); return;
  }
  /* a fleet that came by a link or a file (the page's own list) */
  if(name === "linked"){
    const f = linkedFleets()[arg]; if(!f) return;
    const res = resolveFleet(f.doc); if(res.error){ V.loadErr = res.error; render(); return; }
    if(loadPlay() && !confirm("A game is in progress. Start a new one and forget its record?")) return;
    res.src = "link"; newGame(res); V.screen = "setup"; save(); render(); return;
  }
  if(name === "unlink"){ forgetLinked(arg); render(); return; }
  /* the QR code and the link for a builder fleet: open under its button */
  if(name === "phone"){ V.phone = V.phone === arg ? null : arg; V.copied = ""; render(); if(V.phone != null) phoneLink(arg); return; }
  if(name === "qrfull"){ if(V.phoneSvg) qrFull(V.phoneSvg); return; }
  if(name === "copylink"){ copyText(V.phoneUrl || "", "link"); return; }
  if(name === "sharelink"){ shareText("Gothic Fleet Play", V.phoneUrl || ""); return; }
  if(name === "pickfile"){ const f = $("#fleetfile"); if(f){ f.value = ""; f.click(); } return; }
  if(name === "paste"){
    const p = parseDoc(($("#paste") && $("#paste").value) || "");
    if(p.error){ V.loadErr = p.error; render(); return; }
    const fs = fleetsIn(p.o); if(!fs.length){ V.loadErr = "The document has no ships in it."; render(); return; }
    const res = resolveFleet(fs[0]); if(res.error){ V.loadErr = res.error; render(); return; }
    V.loadErr = ""; res.src = "paste"; newGame(res); V.screen = "setup"; save(); render(); return;
  }
  act(name, i, arg);
});
/* A fleet file (the builder's Export file, or any fleet document): it goes
   on the page's own list of fleets, the same as a link. */
document.addEventListener("change", ev => {
  const inp = ev.target;
  if(!inp || inp.id !== "fleetfile" || !inp.files || !inp.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => { takeFleetText(String(rd.result || ""), "file"); };
  rd.onerror = () => { V.loadErr = "The file could not be read."; render(); };
  rd.readAsText(inp.files[0]);
});
document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-sel]");
  if(!el) return;
  if(el.getAttribute("data-sel") === "flag") act("flag", null, parseInt(el.value, 10));
});

/* ================================================================ BOOT ===== */
(function boot(){
  const g = loadPlay();
  if(g && resumeGame(g)){
    /* the game continues where it was unless the builder's fleet changed */
    const raw = lsGet(KEY_BUILDER);
    const p = raw ? parseDoc(raw) : null;
    const same = (g.src && g.src !== "builder") || !p || !p.o || fleetsIn(p.o).some(f => fnv(JSON.stringify([f.ln, f.units])) === g.fp);
    V.screen = same ? "roster" : "load";
  }
  /* opened from a link with a fleet in it (the "to phone" QR code): the
     fleet goes on the page's own list and the list is shown, the new one
     on top; the address loses the fleet so a reload does not add it again */
  const loc = typeof location !== "undefined" ? location : null;
  const frag = loc && /^#fleetj?=/.test(loc.hash || "") ? loc.hash.slice(1) : "";
  if(frag){
    try{ history.replaceState(null, "", loc.pathname + loc.search); }catch(e){}
    V.screen = "load";
    unpackFleet(frag).then(text => { takeFleetText(text, "link"); },
                           e => { V.loadErr = "The fleet in the link could not be read: " + (e && e.message || e) + "."; render(); });
  }
  render();
})();
</script>
