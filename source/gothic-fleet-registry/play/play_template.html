<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gothic Fleet Play</title>
<meta name="description" content="Play Battlefleet Gothic with the fleet you built in Gothic Fleet Registry: hits, criticals, orders and braces recorded on your phone, rules derived from the book. Prototype v__VERSION__">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0F151B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314243F'/%3E%3Cpath d='M3 13 8 3l5 10z' fill='%23D1792A'/%3E%3C/svg%3E">
<style>
__FONTS__
</style>
<style>
__TOKENS__

/* ======================================================= PLAY LAYER ===== */
/* Card identity tokens: the printed card is paper-coloured in both themes;
   the phone card goes dark at a night table, so its surfaces are tokens. */
:root{
  --card:#FBF9F4; --card-ink:#211F20; --card-mute:#6B6769; --card-rule:#D8D3CB;
  --acc:#D1792A; --cr:#F4E5E6; --cr-ink:#9A5F62; --brace:#2F6B48; --brace-wash:#DDEBE2;
  --tap:44px; --big:56px;
  /* squadron colours (user 30.9.2026): every squadron its own, strong
     enough for a frame on either card colour and white tag text */
  --sq1:#B97512; --sq2:#2C7FC4; --sq3:#8A4FC4; --sq4:#2E8A5E; --sq5:#C4492F; --sq6:#B8407E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --card:#1B232C; --card-ink:#E4EAF0; --card-mute:#8F9CA9; --card-rule:#2C3945;
    --acc:#E0955A; --cr:#3A2224; --cr-ink:#E5A2A6; --brace:#6FBF8E; --brace-wash:#162C21;
  }
}
:root[data-theme="dark"]{
  --card:#1B232C; --card-ink:#E4EAF0; --card-mute:#8F9CA9; --card-rule:#2C3945;
  --acc:#E0955A; --cr:#3A2224; --cr-ink:#E5A2A6; --brace:#6FBF8E; --brace-wash:#162C21;
}

*{box-sizing:border-box}
html{overscroll-behavior-y:none}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Tap and click feedback (user 30.9.2026): every control answers the press
   where the finger is - a short press-in and a darker fill. Only transform
   and filter change, never the size, so nothing around the control moves.
   Hover tints only on devices that really hover; the keyboard keeps the
   focus ring; reduced motion keeps the tint and drops the movement. */
:where(button,a.btn,a.tool,[role=button],[data-act]:not(.menu),summary){-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:where(button,a.btn,a.tool,[role=button],[data-act]:not(.menu):not(span)){transition:transform .09s ease-out,filter .12s ease-out,background-color .15s,border-color .15s,color .15s}
:where(button,a.btn,a.tool,[role=button],[data-act]:not(.menu):not(span)):not([disabled]):active{transform:scale(.96);filter:brightness(.82)}
:where(summary):active{filter:brightness(.88)}
@media (hover:hover){:where(button,a.btn,a.tool,[role=button]):not([disabled]):hover{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){:where(button,a.btn,a.tool,[role=button],[data-act]):active{transform:none}}
textarea,select{font-size:16px}
h1,h2,h3{font-family:var(--disp);letter-spacing:.02em;margin:0}
.mono{font-family:var(--mono)}
small{font-size:12px}

/* --- shell ------------------------------------------------------------ */
.app{min-height:100vh;display:flex;flex-direction:column}
@supports (min-height:100dvh){.app{min-height:100dvh}}
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:max(8px,env(safe-area-inset-top)) 12px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.top h1{font-size:17px;text-transform:uppercase;flex:1 1 100%;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.top h1 .lock{font:700 12px var(--mono);color:var(--bad);letter-spacing:.04em}
.top h1 small{display:block;font:12px/1.2 var(--mono);color:var(--ink-3);text-transform:none;letter-spacing:0;white-space:normal}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);padding:0 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--sunk);font:600 12px/1 var(--sans);letter-spacing:.02em;color:var(--ink-2)}
.pill.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.pill.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.pill.warn{background:var(--warn-wash);border-color:var(--warn);color:var(--warn)}
.pill b{font-size:15px}
.ico{min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;border:1px solid var(--line);background:var(--sunk);font:600 12px var(--mono)}
/* The top bar's own buttons (user 30.9.2026: they looked hand-drawn): one
   family - a group of equal buttons, each an outline icon over nothing but
   its word, the same ink; the state (Info on) is the only colour. */
.tools{display:flex;gap:4px;margin-left:auto}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 10px;
  border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);
  font:600 12px/1 var(--sans);letter-spacing:.02em;text-decoration:none;cursor:pointer}
.tool svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--sunk);color:var(--ink)}
.tool.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.tool[disabled]{opacity:.35;cursor:default}
.tool[disabled]:hover{background:transparent;color:var(--ink-2)}
@media (max-width:420px){ .tool{padding:0 8px;gap:4px} .tool span{font-size:11px} }
.main{flex:1;padding:8px 8px 96px}
.bottom{position:sticky;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bottom .turnbtn{flex:1;min-height:var(--big);border-radius:10px;background:var(--accent);color:#fff;
  font:700 16px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.bottom .turnbtn.enemy{background:var(--ink-2)}
.bottom .vp{font:12px/1.3 var(--mono);color:var(--ink-3);text-align:right;white-space:nowrap}
.bottom .vp b{display:block;font-size:16px;color:var(--ink)}
.note{margin:0 0 8px;padding:8px 12px;border-radius:8px;background:var(--warn-wash);color:var(--warn);font-size:13px}
.note.bad{background:var(--bad-wash);color:var(--bad)}

/* --- load & setup ----------------------------------------------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:18px;text-transform:uppercase;margin-bottom:6px}
.card p{margin:4px 0;color:var(--ink-2);font-size:14px}
.card ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--big);padding:8px 14px;border-radius:10px;
  background:var(--accent);color:#fff;font:700 15px/1.2 var(--disp);letter-spacing:.05em;text-transform:uppercase;width:100%;margin-top:8px}
.btn.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn)}
.btn[disabled]{opacity:.45}
.btn small{font:12px var(--mono);text-transform:none;letter-spacing:0;opacity:.85}
textarea{width:100%;min-height:120px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:10px;color:var(--ink);font-family:var(--mono)}
.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft)}
.setrow .who{flex:1 1 140px;min-width:0}
.setrow .who b{display:block;font-family:var(--disp);font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow .who small{color:var(--ink-3)}
/* the ship's name, to type over (16 px: a smaller field zooms the page on iOS) */
.setrow .who input.nm{display:block;width:100%;min-width:0;box-sizing:border-box;min-height:38px;padding:4px 2px;margin:0 0 2px;
  font-family:var(--disp);font-size:16px;text-transform:uppercase;color:var(--ink);background:transparent;
  border:0;border-bottom:1px dashed var(--ink-3);border-radius:0}
.setrow .who input.nm::placeholder{color:var(--ink-3)}
.setrow .who input.nm:focus{outline:none;border-bottom:2px solid var(--accent);background:var(--sunk)}
.seg{display:flex;gap:4px}
.seg button{min-width:var(--tap);min-height:var(--tap);border-radius:8px;border:1px solid var(--line);background:var(--sunk);
  font:700 18px var(--mono);display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button.sq{font-size:14px;min-width:52px}
/* six Ld tiles and SQN on one line of a phone: the tiles give way, not the row */
.setrow .ctl{display:flex;gap:8px;flex:0 1 auto;min-width:0;max-width:100%}
.seg.ld{flex:0 1 auto;min-width:0}
.seg.ld button{flex:0 1 auto;width:var(--tap);min-width:30px}
select{min-height:var(--tap);border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:0 8px;max-width:100%}

/* --- roster rows ------------------------------------------------------ */
.row{background:var(--card);color:var(--card-ink);border:1px solid var(--line);border-left:6px solid var(--kd);border-radius:10px;
  margin:0 0 6px;padding:6px 8px 6px 10px;box-shadow:var(--shadow)}
.row.pl2{opacity:.62}
/* A wreck (p. 71): the name, what it is now and the table button stay
   readable; the hit boxes go, the stats and weapons are not rendered. */
.row.dead{border-left-color:var(--ink-3);background:var(--sunk)}
.row.dead .r1 .name b{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.row.dead .r3 .hits{display:none}
.row.dead .r4 button{min-height:40px;color:var(--ink-2)}
.row.dead .r4 button small{color:var(--ink-3)}
.row.dead.gone{opacity:.55}
.row.ingrp{margin-left:10px}
.r1{display:flex;align-items:center;gap:8px}
.tag{flex:0 0 auto;min-width:34px;padding:3px 6px;border-radius:5px;background:var(--km);color:#fff;font:700 12px/1 var(--mono);text-align:center;letter-spacing:.04em}
.tag.grp{background:var(--sq)}
.tag.sq{background:var(--sq);min-width:26px}
/* A squadron - capital ships under one header, or an escort squadron on
   one card - is framed in its own colour: header, members and escort card
   alike, so which ship flies with which reads at a glance. */
.row.sqd{border-color:var(--sq);border-left-color:var(--sq);box-shadow:inset 0 0 0 1px var(--sq)}
.row.ingrp{border-top:4px solid var(--sq)}
.row.esc.sqd .tag:first-child{background:var(--sq)}
.name{flex:1 1 auto;min-width:0;min-height:var(--tap);display:flex;flex-direction:column;justify-content:center}
.name b{font:700 17px/1.1 var(--disp);text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.name small{font:12px/1.2 var(--sans);color:var(--card-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldt{flex:0 0 auto;min-width:58px;min-height:var(--tap);border-radius:8px;border:1px solid var(--card-rule);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 6px;color:var(--ink)}
.ldt b{font:700 20px/1 var(--mono)}
.ldt small{font:600 12px/1.2 var(--mono);color:var(--ink-3);white-space:nowrap}
.ldt.na b{color:var(--ink-3)}
.played{flex:0 0 auto;min-width:66px;min-height:var(--tap);border-radius:8px;border:1px solid var(--card-rule);
  font:700 12px/1.1 var(--mono);text-align:center;color:var(--card-mute);background:var(--panel)}
.played.p1{background:var(--warn-wash);border-color:var(--warn);color:var(--warn)}
.played.p2{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.r2{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:6px 0 0;font:600 13px/1.3 var(--mono)}
.r2 .ac{white-space:nowrap}
.r2 .ac s{opacity:.55}
.r2 .ac em{font-style:normal;font-weight:400;color:var(--card-mute)}
.w-wb{color:var(--w-wb)} .w-lan{color:var(--w-lan)} .w-nov{color:var(--w-nov)} .w-tor{color:var(--w-tor)}
.w-bay{color:var(--w-bay)} .w-min{color:var(--w-min)} .w-pul{color:var(--w-pul)} .w-ram{color:var(--w-ram)} .w-hook{color:var(--w-hook)}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:0 7px;border-radius:12px;font:600 12px/1 var(--mono);
  border:1px solid var(--card-rule);color:var(--card-mute);background:var(--panel)}
.chip.crip{background:var(--cr);color:var(--cr-ink);border-color:var(--cr-ink)}
.chip.br{background:var(--brace-wash);color:var(--brace);border-color:var(--brace)}
.chip.ord{background:var(--accent-wash);color:var(--accent-ink);border-color:var(--accent)}
.chip.crit{background:var(--bad-wash);color:var(--bad);border-color:var(--bad)}
.chip.crit.fire{min-height:32px;padding:0 10px;cursor:pointer}
.chip.lock{background:var(--warn-wash);color:var(--warn);border-color:var(--warn)}
.r3{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0 0}
/* the track fills its line: the boxes shrink to fit one line on a narrow
   phone (360 px) rather than wrap a twelfth box onto a line of its own */
.hits{display:flex;flex-wrap:wrap;gap:3px;flex:1 1 100%;min-width:0}
.hits b{flex:1 1 0;min-width:18px;max-width:30px;height:44px;border:1px solid var(--card-mute);border-radius:4px;background:var(--panel);position:relative;
  font:600 12px/42px var(--mono);text-align:center;color:var(--card-mute)}
.hits.many b{max-width:22px;font-size:0}
.hits b.cr{background:var(--cr);border-color:var(--cr-ink);color:var(--cr-ink)}
.hits b.on{background:var(--card-ink);color:var(--card);border-color:var(--card-ink)}
.hits b.on.cr{background:var(--cr-ink);border-color:var(--cr-ink);color:#fff}
.hits b.first{border-left-width:3px}
.stat{min-height:var(--tap);display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;border:1px solid var(--card-rule);
  background:var(--panel);font:600 12px/1 var(--mono);color:var(--card-mute)}
.stat b{font-size:15px;color:var(--card-ink)}
.stat.off b{color:var(--bad)}
.stat.pill2{border-radius:22px}
.stat.on{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.stat.on b{color:var(--ok)}
.stat.spent{opacity:.55;text-decoration:line-through}
.mem{display:flex;flex-wrap:wrap;gap:6px}
.mem button{min-width:var(--tap);min-height:var(--tap);border-radius:22px;border:2px solid var(--card-ink);background:var(--panel);
  font:700 13px var(--mono);color:var(--card-ink)}
.mem button.dead{background:var(--card-mute);border-color:var(--card-mute);color:var(--card);text-decoration:line-through}
.r4{display:flex;gap:6px;margin:6px 0 0}
.r4 button{flex:1 1 0;min-height:48px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);
  font:700 13px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.r4 button small{font:12px/1.1 var(--mono);text-transform:none;letter-spacing:0;color:var(--ink-3)}
.r4 button.hit{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.r4 button.brace{background:var(--brace-wash);border-color:var(--brace);color:var(--brace)}
.r4 button.brace.on{background:var(--brace);color:#fff}
.r4 button.order.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.r4 button[disabled]{opacity:.4}
.row .grpline{font:600 12px var(--mono);color:var(--acc);margin-top:4px}

/* spec line and weapons table on the row */
.stl{display:flex;flex-wrap:wrap;gap:2px 6px;margin:4px 0 0;font:600 12px/1.4 var(--mono);color:var(--card-mute)}
.stl b{color:var(--card-ink);font-size:13px}
.stl span.mod b{color:var(--cr-ink)}
.stl em{font-style:normal;color:var(--card-rule)}
.wt{width:100%;border-collapse:collapse;margin:6px 0 0;font-size:13px;table-layout:auto}
.wt th{font:700 12px/1.2 var(--mono);color:var(--card-mute);text-align:left;padding:0 3px 2px;letter-spacing:.03em}
.wt th.st,.wt th.hf{text-align:right}
.wt th.rg{white-space:nowrap}
.wt th.hf small{display:block;font-size:12px;font-weight:600;text-transform:none}
.wt td{padding:3px 3px;border-top:1px solid var(--card-rule);vertical-align:middle}
.row .wt .arcg{width:20px;height:20px}
.wt td.bd{width:24px;padding-left:0}
.wt .bg{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;background:var(--bd);color:#fff;font:700 12px var(--mono)}
.wt td.nm{font-size:13.5px;line-height:1.2}
.wt td.nm small{display:block;font-size:12px;color:var(--bad)}
.wt td.rg{white-space:nowrap;font:12px var(--mono);color:var(--card-mute)}
.wt td.st,.wt td.hf{text-align:right;font:700 16px/1.1 var(--mono);white-space:nowrap}
.wt td.st small{display:block;font:600 12px var(--mono);color:var(--card-mute)}
.wt td.st i.ea{display:block;font:600 11px/1.1 var(--mono);font-style:normal;color:var(--card-mute)}
.wt td.hf{color:var(--card-mute)}
.wt.crippled tr:not(.nohalf) td.st{opacity:.4;font-weight:600}
.wt td.st.txt,.wt td.hf.txt{font:600 12px/1.2 var(--mono);white-space:normal;color:var(--card-mute);text-align:right}
.wt td.nm{min-width:110px}
.wt.crippled td.hf,.wt.crippled th.hf{color:var(--cr-ink)}
.wt tr.silent td.nm,.wt tr.silent td.st,.wt tr.silent td.hf{text-decoration:line-through;color:var(--card-mute)}
.wt tr.silent td.nm small{text-decoration:none}
.wt td.ar{width:26px;text-align:right;padding-right:0}
.sheet .wt{font-size:14px}
.sheet .wt td.nm{font-size:14.5px}
.hits.mem b.on{background:var(--card-mute);border-color:var(--card-mute);color:var(--card);text-decoration:line-through}
.hits.mem{flex:0 1 auto}
.hits.mem b{flex:0 0 36px;max-width:none}
/* A star fort's four quadrants (Fleets p. 501): one is selected - its hit
   track, shields, turrets and weapons are the ones the card shows, and the
   next hit or critical goes to it. Each button carries its own hits left;
   a crippled one is in the crippled colour, one at 0 is struck through. */
.quads{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 0}
.quads button{min-height:var(--tap);border-radius:8px;border:1px solid var(--card-rule);background:var(--panel);color:var(--card-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 4px}
.quads button b{font:700 14px/1 var(--mono)}
.quads button small{font:600 11px/1.1 var(--mono);color:var(--card-mute);white-space:nowrap}
.quads button.cr{background:var(--cr);border-color:var(--cr-ink)}
.quads button.cr small{color:var(--cr-ink)}
.quads button.gone{background:var(--sunk)}
.quads button.gone b{text-decoration:line-through;color:var(--card-mute)}
.quads button.on{border:2px solid var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.sheet .quads{margin:0 0 10px}
/* the weapons table of a star fort: one heading per group (the selected
   quadrant's own rows, the Basilica's); a Basilica row is not halved by
   the quadrant's crippling, so it keeps its weight in a crippled table */
.wt tr.zn td{padding:5px 3px 1px;font:700 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--card-mute)}
.wt.crippled tr.keep td.st{opacity:1;font-weight:700}
.wt.crippled tr.keep td.hf{color:var(--card-mute)}
/* a rule card (orbital mines, minefields, fire ships): what it is in one
   line, then its steps - a heading and a sentence each */
.lead{margin:4px 0 0;font:13px/1.35 var(--sans);color:var(--card-ink)}
.steps{margin:6px 0 0;padding:0;list-style:none;font:13px/1.35 var(--sans);color:var(--card-ink)}
.steps li{margin:0 0 4px}
.steps li b{font:700 11px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--km);margin-right:6px}
.noarm{margin:6px 0 0;font:600 12px/1.3 var(--mono);color:var(--card-mute)}

/* the wreck and the commander on the card */
.chip.hulk{gap:4px;padding-left:5px}
.chip.hulk svg{width:14px;height:14px;fill:currentColor}
.chip.hulk.blazing{background:var(--bad-wash);color:var(--bad);border-color:var(--bad)}
.chip.hulk.drifting{background:var(--sunk);color:var(--ink-2);border-color:var(--ink-3)}
.chip.hulk.gone{background:var(--cr);color:var(--cr-ink);border-color:var(--cr-ink)}
.hulkl{display:flex;align-items:flex-start;gap:6px;margin:6px 0 0;padding:6px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);font:12.5px/1.35 var(--sans)}
.hulkl svg{flex:0 0 auto;width:20px;height:20px;fill:currentColor;margin-top:1px}
.hulkl b{font:700 12px var(--mono);letter-spacing:.04em;margin-right:4px}
.hulkl.blazing{background:var(--bad-wash);color:var(--bad)}
.hulkl.gone{background:var(--cr);color:var(--cr-ink)}
.row.dead .hulkl{opacity:1}
.band .hulkl{margin:0;background:none;padding:0;color:inherit}
/* Re-roll boxes (user 5.10.2026): one per re-roll, tapped when it is used
   and tapped again if that was a slip. The colour says where it came from
   and the word under it says the same: with the price, bought, an open
   option taken into use, or added on the counter. A dashed one is an open
   option of the list - tap it if it was bought. */
.rrb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px}
.rrx{position:relative;min-width:56px;min-height:var(--tap);padding:3px 5px;border-radius:8px;border:2px solid var(--rrc);
  background:color-mix(in srgb,var(--rrc) 16%,var(--panel));color:var(--card-ink);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rrx b{font:700 14px/1 var(--mono)}
.rrx small{font:600 9.5px/1 var(--sans);letter-spacing:0;color:var(--card-mute)}
.rrx.included{--rrc:var(--brace)} .rrx.bought{--rrc:var(--acc)}
.rrx.optional{--rrc:var(--sq2)} .rrx.added{--rrc:var(--sq3)}
.rrx.open{--rrc:var(--card-mute);border-style:dashed;background:none}
/* used: the colour stays as a faint frame so the kind still reads, the
   cross says the rest */
.rrx.used{background:var(--sunk);border-color:color-mix(in srgb,var(--rrc) 40%,var(--card-rule))}
.rrx.used b,.rrx.used small{color:var(--card-mute);opacity:.55}
.rrx.used::after{content:"";position:absolute;inset:6px;pointer-events:none;
  background:
    linear-gradient(to top right,transparent calc(50% - 1.25px),var(--card-mute) calc(50% - 1.25px),var(--card-mute) calc(50% + 1.25px),transparent calc(50% + 1.25px)),
    linear-gradient(to bottom right,transparent calc(50% - 1.25px),var(--card-mute) calc(50% - 1.25px),var(--card-mute) calc(50% + 1.25px),transparent calc(50% + 1.25px))}
.rrn{font:600 12px/1.25 var(--mono);color:var(--card-mute);flex:1 1 90px;min-width:0}
.cmdl{display:flex;align-items:center;gap:6px;margin:4px 0 0;font:600 12.5px/1.2 var(--sans);color:var(--card-ink)}
.cmdl .tag{min-width:30px}
.cmdl small{color:var(--card-mute);font-family:var(--mono);font-size:12px}
.pop.cata .tiles button{min-height:64px;align-items:flex-start;text-align:left}
.pop.cata .tiles button small{white-space:normal}
.pop.cata .hr{margin:10px 0 2px}
.pop.cata ul.hulkrules{margin:0;padding-left:18px;font:12px/1.4 var(--sans);color:var(--ink-2)}
.pop.cata ul.hulkrules li{margin:3px 0}
.hulkl span{flex:1 1 auto;min-width:0}

/* group header */
.grp-hd{background:var(--panel);background:color-mix(in srgb,var(--sq) 12%,var(--panel));border:2px solid var(--sq);border-radius:10px;margin:0 0 6px;padding:8px 10px}
.grp-hd .r1 .name b{color:var(--sq)}
.grp-hd .r4 button{min-height:44px}
/* the members line: a ship out of action is struck through with the
   reason, a crippled one is marked (its values are already halved) */
.grp-hd .name small{white-space:normal;overflow:visible;text-overflow:clip}
.grp-hd .name small s{color:var(--ink-3)}
.grp-hd .name small i{font:600 10px/1 var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.grp-hd .name small i.cr{color:var(--ink-2)}
.grp-hd .wt .nm small s{color:var(--bad)}

/* --- popover (inline under the row) ---------------------------------- */
.pop{margin:8px -8px -8px -10px;padding:10px;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 10px 10px;color:var(--ink)}
.pop h4{margin:0 0 6px;font:700 12px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.pop p{margin:4px 0 8px;font-size:13px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tiles.c4{grid-template-columns:repeat(4,1fr)}
.tiles.c6{grid-template-columns:repeat(6,1fr)}
.tiles button{min-height:52px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:4px 6px;
  font:700 13px/1.15 var(--disp);letter-spacing:.03em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tiles button small{font:11px/1.2 var(--mono);text-transform:none;letter-spacing:0;color:var(--ink-3)}
.tiles button.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.tiles button.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.tiles button.warn{background:var(--warn-wash);border-color:var(--warn);color:var(--warn)}
.tiles button.ok{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.tiles button[disabled]{opacity:.4}
.tiles button{position:relative}
.tiles button .n{position:absolute;top:3px;right:4px;min-width:18px;padding:1px 4px;border-radius:9px;
  background:var(--accent);color:#fff;font:700 11px/1.2 var(--mono);font-style:normal}
/* A critical result is a pair (user 30.9.2026): the minus right beside the
   plus. The minus takes a mis-tapped count off; with nothing to take off it
   is plainly disabled - dashed, faded, not tappable. */
.tiles .cp{display:flex;min-height:52px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);overflow:hidden}
.tiles .cp.has{border-color:var(--accent)}
.tiles .cp>button{border:0;border-radius:0;min-height:52px;background:transparent}
.tiles .cp>button.plus{flex:1 1 auto;min-width:0;padding-right:13px}
.tiles .cp>button.minus{flex:0 0 34px;border-right:1px solid var(--line);font:700 20px/1 var(--mono);color:var(--ink);padding:0}
.tiles .cp>button.minus[disabled]{opacity:1;color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line-soft) 4px 5px);cursor:default}
.tiles .cp>button.plus::after{content:"+";position:absolute;right:4px;bottom:3px;font:700 13px/1 var(--mono);color:var(--ink-3)}
.tiles .cp.warn{background:var(--warn-wash);border-color:var(--warn)}
.tiles .cp.warn>button.plus{color:var(--warn)}
.tiles .cp.on{background:var(--accent-wash);border-color:var(--accent)}
.tiles button.has{border-color:var(--accent)}
.tiles button.just{animation:just .9s ease-out}
@keyframes just{0%{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-wash)}100%{box-shadow:0 0 0 0 transparent}}
.pop .last{min-height:2.6em;margin:0 0 8px;padding:6px 8px;border-radius:6px;background:var(--sunk);font:600 13px/1.35 var(--sans);color:var(--ink-3)}
.pop .last.fresh{color:var(--ink);background:var(--accent-wash)}
.pop .xrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;padding:8px;border-radius:8px;
  border:1px solid var(--warn);background:var(--warn-wash);font:600 13px var(--sans);color:var(--ink)}
.pop .xrow span{flex:1 1 100%}
.pop .xrow button{min-width:56px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:700 14px var(--mono);color:var(--ink)}
.pop .xrow button.cx{font:600 12px var(--sans);color:var(--ink-3)}
.tiles button b{font:700 16px var(--mono)}
.steprow{display:flex;align-items:center;gap:8px}
.steprow button{min-width:var(--big);min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font:700 20px var(--mono)}
.steprow .val{flex:1;text-align:center;font:700 22px var(--mono)}
.steprow .val small{display:block;font:12px var(--mono);color:var(--ink-3)}
.pop .close{margin-top:8px;width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);font:600 12px var(--mono);color:var(--ink-3)}

/* --- sheet (the card) ------------------------------------------------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--card);color:var(--card-ink);overflow:auto;overscroll-behavior:contain;
  padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sh-hd{position:sticky;top:0;z-index:2;background:var(--kd);color:#fff;padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:flex;gap:10px;align-items:center}
.sh-hd .t{flex:1;min-width:0}
.sh-hd h2{font-size:20px;line-height:1.1;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-hd p{margin:2px 0 0;font-size:12px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-hd .x{min-width:var(--tap);min-height:var(--tap);border-radius:8px;border:1px solid rgba(255,255,255,.45);font:700 18px var(--mono);color:#fff}
.sh-hd .ldt{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
.sh-hd .ldt small{color:rgba(255,255,255,.8)}
.sh-body{padding:10px 12px}
.band{padding:8px 10px;border-radius:8px;margin:0 0 10px;font-size:13px;font-weight:600}
.band.crip{background:var(--cr);color:var(--cr-ink)}
.band.br{background:var(--brace-wash);color:var(--brace)}
.band.dead{background:var(--sunk);color:var(--ink-2)}
.band.lock{background:var(--warn-wash);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.stats div{background:var(--panel);border:1px solid var(--card-rule);border-radius:8px;padding:6px 8px;min-height:56px}
.stats span{display:block;font:700 12px/1 var(--mono);color:var(--km);letter-spacing:.05em}
.stats b{display:block;font:700 19px/1.2 var(--mono);color:var(--card-ink);white-space:nowrap}
.stats b s{font-size:12px;color:var(--card-mute);margin-left:4px}
.stats b i{display:block;font:600 12px/1.2 var(--mono);color:var(--bad);font-style:normal;white-space:normal}
.stats div.tapp{border-color:var(--accent)}
.stats button{width:100%;text-align:left}
.sec{margin:0 0 12px}
.sec h3{font:700 12px/1.2 var(--mono);color:var(--km);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid var(--card-rule)}
.sec h3 em{font-style:normal;font-weight:400;color:var(--card-mute);text-transform:none;letter-spacing:0;margin-left:6px}
.arm{width:100%;border-collapse:collapse;font-size:13px}
.arm td{padding:6px 4px;border-bottom:1px solid var(--card-rule);vertical-align:middle}
.arm td.nm{width:auto}
.arm td.rg{color:var(--card-mute);font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.arm td.st{white-space:nowrap;font:700 18px var(--mono);text-align:right}
.arm td.st s{font-size:12px;color:var(--card-mute);margin-left:3px}
.arm td.ar{width:30px;text-align:right}
.arm tr.silent td.nm,.arm tr.silent td.st{text-decoration:line-through;color:var(--card-mute)}
.arm tr.silent td.nm small{text-decoration:none;color:var(--bad)}
.arm .bg{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;background:var(--bd);color:#fff;font:700 12px var(--mono);margin-right:6px;vertical-align:middle}
.arm td.nm small{display:block;font-size:12px;color:var(--card-mute);margin-left:26px}
.arcg{width:24px;height:24px;vertical-align:middle}
.arcg path{fill:var(--panel);stroke:var(--card-mute);stroke-width:.5}
.arcg path.on{fill:var(--card-ink)}
.arcg path.pick{fill:var(--card-mute)}
.arcg circle{fill:none;stroke:var(--card-mute);stroke-width:.5}
.noarc{color:var(--card-mute)}
.sheet .hits b{max-width:36px;height:44px;font-size:13px;line-height:42px}
.sheet .hits.many b{max-width:26px;font-size:11px}
.crline{font:600 12px var(--mono);color:var(--cr-ink);margin:6px 0 0}
.rules{margin:0;padding-left:18px;font-size:13px;color:var(--card-ink)}
.rules li{margin:0 0 4px}
.rules li b.ast{font-style:normal;color:var(--ast);margin-right:3px}
.crtab{width:100%;border-collapse:collapse;font-size:12.5px}
.crtab td{padding:3px 4px;border-bottom:1px solid var(--card-rule)}
.crtab td:first-child{font:700 13px var(--mono);width:30px}
.crtab td:last-child{color:var(--card-mute)}
.foot{font-size:12px;color:var(--card-mute);margin:4px 0 0}
.sheet .r4{margin:10px 0}
.sheet .tiles{margin-top:6px}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flags button{min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--card-rule);background:var(--panel);font:600 12px var(--mono);color:var(--card-mute)}
.flags button.on{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.flags button.bad.on{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.ordtab{width:100%;border-collapse:collapse;font-size:12.5px}
.ordtab td{padding:4px;border-bottom:1px solid var(--card-rule);vertical-align:top}
.ordtab td:first-child{font:700 12px var(--mono);white-space:nowrap}

/* --- menu ------------------------------------------------------------- */
.menu{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.menu .box{width:100%;background:var(--panel);border-radius:14px 14px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.menu h2{font-size:17px;text-transform:uppercase;margin-bottom:8px}
.menu .btn{margin-top:8px}
.menu table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.menu td{padding:4px 0;border-bottom:1px solid var(--line-soft)}
.menu td:last-child{text-align:right;font-family:var(--mono)}

/* --- tracking toggles ------------------------------------------------- */
.togs{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.togs button{min-height:var(--tap);display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font:600 13px/1.2 var(--mono);text-align:left}
.togs button i{font-style:normal;font:700 12px var(--mono);color:var(--ink-3);text-transform:uppercase}
.togs button small{grid-column:1 / -1;font:12px/1.3 var(--sans);color:var(--ink-3)}
.togs button.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.togs button.on i{color:var(--accent-ink)}

/* --- one-line top bar, bottom strip, End Phase (19.10.2026) ----------- */
.top.one{flex-wrap:wrap}
.top.one h1{flex:1 1 0;min-width:0;display:block;overflow:hidden}
.top.one h1 small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.one .tools{flex:0 0 auto}
.bottom{flex-direction:column;align-items:stretch;gap:6px;padding-top:6px}
.brow{display:flex;gap:8px;align-items:center}
.bottom .turnbtn{min-height:48px}
.endbtn{flex:0 1 auto;min-height:48px;min-width:96px;padding:2px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);
  font:700 13px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.endbtn small{font:600 11px/1.15 var(--mono);text-transform:none;letter-spacing:0;color:var(--warn)}
.endbtn[disabled]{opacity:1;color:var(--ink-3)}
.endbtn[disabled] small{color:var(--ink-3)}
.jump{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--card-ink);
  font:700 12px/1 var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.jump button small{font:600 11px var(--mono);color:var(--card-mute)}
.jump button.cr{background:var(--cr);color:var(--cr-ink);border-color:var(--cr-ink)}
.jump button.dead{color:var(--ink-3);text-decoration:line-through;background:var(--sunk)}
.jump button.done{opacity:.55}
/* the P+S badge on a merged port / starboard row */
/* v1.2 card style (J183, J188): a port / starboard pair shares one tall
   badge, one range and one strength "each" (two rows high); no line between
   the pair's own rows, so it reads as one weapon; the range in a frame of
   its band's colour */
.wt td.bd[rowspan]{position:relative}
.wt .bg.tall{position:absolute;left:0;top:5px;bottom:5px;width:20px;height:auto;line-height:1;display:flex;align-items:center;justify-content:center}
.wt tr[data-pair="2"] td{border-top-color:transparent}
.wt .rp{display:inline-block;min-width:2.1em;text-align:center;border:2px solid var(--rb);border-radius:6px;padding:0 4px;margin:-2px 0;
  background:var(--panel);color:var(--card-ink);font:700 14px/18px var(--mono)}
.wt .rp.l{font-size:12px}
.wc .rpc{display:inline-block;border:1.5px solid var(--rb);border-radius:4px;padding:0 3px;font:700 11px/14px var(--mono);color:var(--card-ink)}
.wc .rpc.l{font-size:10px}
/* the compact rows: CRIT in the name line, no weapons table */
.r1 .cmini{flex:0 0 auto;min-width:58px;min-height:var(--tap);border-radius:8px;border:1px solid var(--bad);background:var(--bad-wash);color:var(--bad);
  font:700 13px/1.05 var(--disp);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center}
.r1 .cmini small{font:600 11px/1.1 var(--mono);text-transform:none;letter-spacing:0;color:var(--bad)}
.r1 .cmini[disabled]{opacity:.4}
.main.compact .r1{gap:6px}
.main.compact .r1 .played{min-width:50px;padding:0 3px;font-size:10.5px}
.main.compact .r1 .ldt{min-width:44px;padding:2px 4px}
.main.compact .r1 .ldt small{font-size:10px;max-width:58px;overflow:hidden;text-overflow:ellipsis}
.main.compact .r1 .cmini{min-width:50px}
.main.compact .cmdl small,.main.compact .rrn{display:none}
.main.compact .rrb{margin:4px 0 0}
.wline{display:flex;flex-wrap:wrap;gap:3px 5px;margin:4px 0 0}
.wc{display:inline-flex;align-items:center;gap:3px;padding:1px 4px 1px 1px;border-radius:5px;border:1px solid var(--card-rule);background:var(--panel)}
.wc i{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:4px;background:var(--bd);color:#fff;font:700 11px var(--mono);font-style:normal}
.wc b{font:700 14px/1 var(--mono);color:var(--card-ink)}
.wc em{font:600 11px/1 var(--mono);font-style:normal;color:var(--card-mute)}
.wc .arcg{width:15px;height:15px}
.wc.half b{color:var(--cr-ink)}
.wc.off{opacity:.55}
.wc.off b{text-decoration:line-through}
.main.compact .row{padding-top:4px;padding-bottom:4px}
.main.compact .r3{margin-top:4px}
.main.compact .stl{margin-top:2px}
/* the End Phase panel */
.endp .eprow{border-left:5px solid var(--kd);border-radius:8px;background:var(--sunk);padding:8px 10px;margin:0 0 8px}
.endp .ephd b{font:700 15px/1.1 var(--disp);text-transform:uppercase}
.endp .ephd small{display:block;font:12px/1.3 var(--mono);color:var(--ink-3)}
.endp .eprep{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.endp .eprep button{min-height:var(--tap);padding:4px 10px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);font:600 13px/1.15 var(--sans);text-align:left}
.endp .eprep button b{font:700 13px var(--mono)}
.endp .eprep button small{display:block;font:11px var(--mono);color:var(--ink-3)}
.endp .perm{font:600 12px/1.3 var(--mono);color:var(--ink-3);padding:6px 0}

<body>
<div id="app" class="app"></div>
<div id="toast"></div>
<script id="bfgdata" type="application/json">__DATA__</script>
<script>
"use strict";
__DOMAIN__
__PLAYRULES__
const DATA = JSON.parse(document.getElementById("bfgdata").textContent);
const SHIPS = DATA.ships, LISTS = DATA.lists;
const uniqRefs = DOMAIN.uniqRefs, wepClass = DOMAIN.wepClass;
__SHARED__

/* ============================================================ STORAGE ===== */
/* The builder's key is read and never written (LUEMINUT.md). */
const KEY_BUILDER = "gothic-fleet-registry-v1";
const KEY_PLAY = "gothic-fleet-play-v1";
const KEY_INFO = "gothic-fleet-play-info";
/* Tracking options: what the page records of the things tokens do on the
   table. Per device, never in the game record. Default: nothing - the
   spec + HP + crits row is the product; these are opt-in. */
const KEY_TRACK = "gothic-fleet-play-track";
const TRACK = [
  ["orders",   "Special orders and Brace",   "order per ship, fleet lock after a failed check, brace timing (p. 46-48)"],
  ["shields",  "Shields and blast markers",  "markers touching the base: shields up, -1 Ld, damage-control dice (p. 69-70, 48, 88)"],
  ["ordnance", "Ordnance loaded",            "torpedoes and attack craft ready / launched (p. 73-74)"],
  ["fleet",    "Fleet counters",             "the RR counter in the top bar (the re-roll boxes on the commander's card are always there), attack craft in play vs bays, enemy contacts +1, radiation (p. 48, 73, 115)"],
];
function loadOpts(){
  const o = {};
  let saved = null; try{ saved = JSON.parse(lsGet(KEY_TRACK) || "null"); }catch(e){}
  TRACK.forEach(t => { o[t[0]] = !!(saved && saved[t[0]]); });
  return o;
}
let OPT = loadOpts();
function saveOpts(){ lsSet(KEY_TRACK, JSON.stringify(OPT)); }
/* State the page does not track is cleared, so a switch turned off (or a
   record from a device with other settings) cannot feed the numbers. */
function normaliseUntracked(g){
  (g.st || []).forEach(st => {
    if(!OPT.orders){ st.order = null; st.braceTurn = 0; st.braceCarry = null; st.braceLock = false; st.boarding = false; st.noOrdersTurn = false; st.teleported = false; }
    if(!OPT.shields) st.blast = 0;
  });
  if(g.fleet){ if(!OPT.orders) g.fleet.orderLock = false; if(!OPT.fleet){ g.fleet.enemyOrders = false; g.fleet.radiation = 0; } }
}
const PLAY_VERSION = "__VERSION__";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ============================================================ HELPERS ===== */
function fnv(s){
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ("0000000" + h.toString(16)).slice(-8);
}
const clone = o => JSON.parse(JSON.stringify(o));
const listByName = nm => LISTS.filter(x => x.nm === nm)[0] || null;
const listOf = (u, L0) => (u && u.lst && listByName(u.lst)) || L0;
const $ = s => document.querySelector(s);
const EM = "\u2014", MID = "\u00b7", TIMES = "\u00d7";

/* ================================================= THE FLEET DOCUMENT ===== */
function parseDoc(raw){
  let o = null;
  try{ o = JSON.parse(raw); }catch(e){ return { error: "That is not a fleet document (JSON could not be read)." }; }
  if(!o || typeof o !== "object" || !Array.isArray(o.units)) return { error: "The document has no fleet in it." };
  if(typeof o.schemaVersion === "number" && o.schemaVersion > DOMAIN.SCHEMA_VERSION)
    return { error: "The fleet was saved by a newer builder (schema " + o.schemaVersion + "); this page reads " + DOMAIN.SCHEMA_VERSION + "." };
  return { o: o };
}
/* The open fleet and every stashed one (schema 4). */
function fleetsIn(o){
  const out = [];
  if(o.units.length) out.push({ name: o.name || "", ln: o.ln, limit: o.limit, units: o.units, open: true });
  (Array.isArray(o.fleets) ? o.fleets : []).forEach(f => {
    if(f && typeof f === "object" && Array.isArray(f.units) && f.units.length)
      out.push({ name: f.name || "", ln: f.ln, limit: f.limit, units: f.units, open: false });
  });
  return out;
}
/* Resolve exactly as the builder does: resolveSaved (by name, attachment
   filter, one purchase one row) and then the domain. */
function resolveFleet(f){
  const L0 = listByName(f.ln);
  if(!L0) return { error: "The fleet list \"" + f.ln + "\" is not in this build." };
  const lost = [];
  const kept = resolveSaved(clone(f.units), L0, lost);
  const units = kept.map(u => {
    const ctx = { list: listOf(u, L0), host: L0 };
    const it = DOMAIN.fromLegacyUnit(u, ctx, DATA);
    const R = DOMAIN.resolveUnit(it, ctx, DATA);
    return R ? { u: u, R: R, it: it } : null;
  }).filter(Boolean);
  return { L0: L0, units: units, lost: lost,
           fp: fnv(JSON.stringify([f.ln, f.units])),
           doc: { ln: f.ln, limit: f.limit, units: f.units } };
}
function fleetPoints(units){ return units.reduce((a, x) => a + (x.R.points | 0), 0); }
/* Fleet facts (J214): the attack rating, what the enemy gets for free and
   victory points that are not a ship's cost - the builder's own resolveFleet
   on the same units. */
function fleetFactsNow(){
  if(!L0 || !U.length) return [];
  return DOMAIN.resolveFleet({ list: L0.nm, limit: G.limit | 0, units: U.map(x => x.it) }, DATA).facts || [];
}

/* ============================================================== STATE ===== */
let G = null;      /* the game: persisted */
let U = [];        /* resolved units, rebuilt from G.doc */
let L0 = null;
/* The view (user 19.10.2026): "full" rows carry the weapons table, the
   compact rows only what a hit or a critical needs - the whole fleet on one
   screen for the enemy's turn. Per device, never in the game record. */
const KEY_VIEW = "gothic-fleet-play-view";
/* Keep the screen on while a game is open (Screen Wake Lock); "0" = off. */
const KEY_WAKE = "gothic-fleet-play-awake";
/* Fleets that came by a link or a file: the page's own list, newest first
   (the builder's key is never written). */
const KEY_LINKED = "gothic-fleet-play-linked";
let V = { screen: "load", sheet: null, pop: null, menu: false, info: lsGet(KEY_INFO) === "1", note: "", loadErr: "", saveErr: false,
          compact: lsGet(KEY_VIEW) === "compact", endph: false, phone: null, guardUntil: 0, lastScreen: null, linkNew: null, copied: "" };
/* The way back: the builder sits beside play/ (dev and the shared ZIP);
   make_site.py rewrites this to the site root. */
const BUILDER_URL = "../Gothic%20Fleet%20Registry.html";
const builderLink = cls => `<a class="${cls}" href="${BUILDER_URL}" style="text-decoration:none" title="Back to the fleet builder">BUILDER</a>`;
/* Outline icons for the top bar, one stroke weight. */
const TOOL_ICON = {
  info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>',
  undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>',
  view: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="11" width="16" height="5" rx="1"/><path d="M4 20h16"/></svg>'
};
const toolBtn = (act, icon, word, extra) => `<button class="tool${extra && extra.on ? " on" : ""}" data-act="${act}"${extra && extra.off ? " disabled" : ""} title="${esc(extra && extra.tip || word)}">${TOOL_ICON[icon]}<span>${word}</span></button>`;
const builderTool = () => `<a class="tool" href="${BUILDER_URL}" title="Back to the fleet builder">${TOOL_ICON.back}<span>Builder</span></a>`;
let UNDO = [];

function newGame(res){
  const fleet = PLAY.freshFleet();
  const st = res.units.map(x => PLAY.freshUnit(x.R));
  /* The fleet commander is the commander that stands first in the fleet
     LIST, whatever the roster's order (PLAY.fleetCommander): a Veteran
     Captain added before the Admiral does not lead the fleet. */
  const cmd = PLAY.fleetCommander(res.units.map(x => {
    const si = x.R.entry ? res.L0.secs.findIndex(sec => sec.t === x.R.entry.section) : -1;
    const ei = si >= 0 ? res.L0.secs[si].ents.findIndex(en => en.l === x.R.entry.label) : -1;
    return { kind: x.R.kind, s: si < 0 ? 1e6 : si, e: ei < 0 ? 1e6 : ei };
  }));
  /* The commander's re-rolls, included and bought; without a commander the
     fleet's own (Necrons p. 404, Demiurg p. 486). Abaddon's come back every
     turn (Fleets p. 231). */
  const crr = cmd >= 0 ? res.units[cmd].R.rerolls : null;
  const frr0 = cmd < 0 ? DOMAIN.fleetRerolls(res.L0, res.units.map(x => x.R)) : null;
  const pool0 = crr || frr0;
  PLAY.setRerolls(fleet, pool0 ? pool0.total : 0, !!(crr && crr.unit === "per turn"), rrKinds(pool0));
  /* a further commander's re-rolls are his own (a Veteran Captain's, a
     Farseer's, a second Warlord's): they stay on his own row */
  res.units.forEach((x, j) => {
    if(x.R.kind === "commander" && j !== cmd && x.R.rerolls)
      PLAY.setRerolls(st[j], x.R.rerolls.total, x.R.rerolls.unit === "per turn", rrKinds(x.R.rerolls));
    /* a ship's own re-rolls (Scion of Prospero p. 258, a Mark of Tzeentch
       p. 234, a fortress-monastery p. 111) stay on its own card */
    if(x.R.kind === "ship" && x.R.rerolls)
      PLAY.setRerolls(st[j], x.R.rerolls.total, false, rrKinds(x.R.rerolls));
  });
  /* the flagship defaults to the biggest capital ship; a platform, a
     station or a defence vessel never carries the commander, a star fort
     or a Haven only when there is no ship (PLAY.defaultFlagship) */
  const flag0 = PLAY.defaultFlagship(res.units.map(x => x.R));
  /* J215: the builder's placement when the book or the player decided it -
     a Master of the Fleet on his battle barge, a Warmaster on the most
     expensive ship that is no Daemonship, the ship picked in the builder */
  const ab = cmd >= 0 ? (DOMAIN.resolveFleet({ list: res.L0.nm, limit: res.doc.limit | 0,
    units: res.units.map(x => x.it) }, DATA).aboard || []).filter(a => a.unit === cmd)[0] : null;
  const flag = ab && (ab.ruled || ab.chosen) && ab.ship != null && PLAY.mayCarryCommander(res.units[ab.ship].R)
    ? ab.ship : flag0;
  G = { v: 1, play: PLAY_VERSION, fp: res.fp, src: res.src || "builder", ln: res.doc.ln, limit: res.doc.limit, doc: res.doc,
        fleet: fleet, st: st, grp: builderGroups(res.units), flag: cmd >= 0 ? flag : null, cmd: cmd >= 0 ? cmd : null, ac: 0 };
  U = res.units; L0 = res.L0;
  fixedLds();
  applyCommanderLd();
}
/* The ships the SQN button is offered to: capital ships; a star fort
   "cannot squadron with other orbital defences" (Rulebook p. 100). */
function sqnShip(R){ return R.kind === "ship" && !PLAY.isEscort(R) && !PLAY.isFort(R); }
/* J222: the builder's squadrons (u.sq, the same tag = one squadron, J216)
   start the game squadroned. A tag shared by two or more such ships gets
   an SQN letter, A to C in the builder's tag order; a tag on one ship alone
   and a fourth squadron start free, as does an escort (LUEMINUT T42). The
   SQN button changes it as before. */
function builderGroups(units){
  const tagOf = units.map(x => x.u && x.u.sq && sqnShip(x.R) ? String(x.u.sq) : null);
  const tags = tagOf.filter((t, j) => t && tagOf.indexOf(t) === j && tagOf.filter(s => s === t).length >= 2).sort().slice(0, 3);
  return tagOf.map(t => t && tags.indexOf(t) >= 0 ? "ABC"[tags.indexOf(t)] : null);
}
/* A unit whose Leadership is not rolled has it from the start: planetary
   defences Ld 7 (Rulebook p. 100, Fleets p. 499), the Fortress-Monastery
   Ld 10 (Fleets p. 111). A value the player tapped for such a unit in an
   older record gives way to the book's. */
function fixedLds(){
  U.forEach((x, i) => {
    const fx = PLAY.fixedLd(x.R), st = G.st[i];
    if(!fx || st.ldFrom === "commander") return;
    st.ld = fx.value; st.ldRoll = null; st.ldFrom = "fixed";
  });
}
/* The Leadership a unit has without a commander: its fixed value, else
   its roll (null until it is rolled). */
function ownLd(i){
  const fx = PLAY.fixedLd(U[i].R);
  return fx ? fx.value : (G.st[i].ldRoll == null ? null : G.st[i].ldRoll);
}
/* The boxes a pool starts with: the re-rolls that are the fleet's as built
   - the open options are not, until one is taken into use. */
function rrKinds(rr){ return rr && rr.boxes ? rr.boxes.filter(k => k !== "optional") : []; }
/* A game saved before the boxes existed gets them laid over its counts. */
function adoptPools(){
  const cr = G.cmd != null ? U[G.cmd].R.rerolls : null;
  /* a fleet without a commander had no count at all before the boxes: its
     boxes start free; the per-turn flag comes from the roster every time */
  PLAY.adoptRerolls(G.fleet, rrKinds(cr || fleetRR()), { fresh: G.cmd == null, perTurn: !!(cr && cr.unit === "per turn") });
  U.forEach((x, j) => {
    if(x.R.kind === "commander" && j !== G.cmd && x.R.rerolls)
      PLAY.adoptRerolls(G.st[j], rrKinds(x.R.rerolls), { perTurn: x.R.rerolls.unit === "per turn" });
    if(x.R.kind === "ship" && x.R.rerolls) PLAY.adoptRerolls(G.st[j], rrKinds(x.R.rerolls), { fresh: true });
  });
}
/* The commander's Leadership line (Fleets book, e.g. p. 35 "improves its
   Leadership to the value shown"): a fixed value replaces the roll, a
   modifier is added to it (LUEMINUT.md T8). */
function applyCommanderLd(){
  /* one flagship: a ship that carried the commander's line before gets its
     own roll back (or nothing, until it rolls) */
  G.st.forEach((s, j) => { if(j !== G.flag && s.ldFrom === "commander"){ s.ld = ownLd(j); s.ldFrom = PLAY.fixedLd(U[j].R) ? "fixed" : null; } });
  if(G.cmd == null || G.flag == null) return;
  const ld = U[G.cmd].R.leadership, st = G.st[G.flag];
  if(!ld || ld.value == null) return;
  /* aboard a star fort too "their own Leadership value is used by the
     fort" (Fleets p. 503; the Fortress-Monastery "even if less!", p. 111) */
  const own = ownLd(G.flag);
  if(ld.kind === "fixed"){ st.ld = ld.value; st.ldFrom = "commander"; }
  else if(own != null){ st.ld = Math.min(ld.max || 10, own + ld.value); st.ldFrom = "commander"; }
}
function setLd(i, v){
  const st = G.st[i];
  st.ldRoll = v; st.ld = v; st.ldFrom = null;
  if(i === G.flag) applyCommanderLd();
}

function save(){
  if(!G) return;
  V.saveErr = !lsSet(KEY_PLAY, JSON.stringify(G));
}
function loadPlay(){
  const raw = lsGet(KEY_PLAY);
  if(!raw) return null;
  try{ const g = JSON.parse(raw); return (g && g.v === 1 && g.doc && Array.isArray(g.st)) ? g : null; }catch(e){ return null; }
}
/* Open a saved game against its own roster copy. */
function resumeGame(g){
  const res = resolveFleet(g.doc);
  if(res.error || res.units.length !== g.st.length) return false;
  normaliseUntracked(g);
  G = g; U = res.units; L0 = res.L0;
  adoptPools();
  /* a record from before the quadrant tracks, the member boxes of one-hit
     defences or the unrolled Leaderships is brought up to them */
  U.forEach((x, i) => PLAY.adoptUnit(x.R, G.st[i]));
  fixedLds();
  return true;
}

/* ============================================================ ACTIONS ===== */
function snapshot(){ UNDO.push(JSON.stringify(G)); if(UNDO.length > 30) UNDO.shift(); }
/* The Catastrophic Damage table is for a ship at 0 hits: after UNDO, or a
   tap that took the ship back up, the open one is dropped. */
function dropStalePop(){
  if(V.pop && V.pop.kind === "hulk" && U[V.pop.i] && G.st[V.pop.i] && !PLAY.destroyed(U[V.pop.i].R, G.st[V.pop.i])) V.pop = null;
}
/* The CATASTROPHIC button's second line: the result taken, else the roll
   this ship makes - or that it makes none. */
function cataLabel(R, st){
  if(st.hulkName) return esc(st.hulkName);
  const c = PLAY.catastrophic(R);
  return c.dice ? "roll " + c.dice : "no roll";
}
/* A critical result's name as the ship's own table prints it. */
function critLabel(R, key){
  const cm = R && R.damage && R.damage.critical;
  const row = cm && cm.rows.find(r => String(r[0]) === String(key));
  if(row) return String(key) + " " + row[1];
  const d = PLAY.CRITS[String(key)];
  return String(key) + (d ? " " + d.name : "");
}
function critCountText(tk, key){
  const n = tk && tk.crits ? (tk.crits[String(key)] | 0) : 0;
  return n > 1 ? " (now \u00d7" + n + ")" : "";
}
/* A star fort's selected quadrant, for the line that says where a hit or
   a critical went ("NE quadrant"); nothing for any other unit. */
function quadWord(R, st){ return PLAY.isFort(R) && st.quads ? PLAY.QUADS[st.qsel | 0] + " quadrant" : ""; }
function toast(msg, cls){
  const t = document.createElement("div");
  if(cls) t.className = cls;
  t.textContent = msg;
  $("#toast").appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms || 60); }catch(e){} }

/* Members of a unit's squadron (itself when it is not in one). */
function members(i){
  const g = G.grp[i];
  if(!g) return [i];
  return G.grp.map((x, j) => x === g ? j : -1).filter(j => j >= 0);
}
function groupUnits(letter){ return G.grp.map((x, j) => x === letter ? j : -1).filter(j => j >= 0); }

function act(name, i, arg){
  if(name === "undo"){
    if(!UNDO.length) return;
    G = JSON.parse(UNDO.pop());
    const res = resolveFleet(G.doc); U = res.units; L0 = res.L0;
    dropStalePop();
    save(); render(); return;
  }
  if(name === "info"){ V.info = !V.info; lsSet(KEY_INFO, V.info ? "1" : "0"); render(); return; }
  /* full rows or compact rows: a choice of view, not an event - the row at
     the top of the screen stays where it was, so the eye keeps its place */
  if(name === "view"){
    const keep = topRow();
    V.compact = !V.compact; lsSet(KEY_VIEW, V.compact ? "compact" : "full");
    if(V.pop && V.pop.kind !== "hulk") V.pop = null;
    render();
    if(keep){ const el = document.querySelector('section.row[data-u="' + keep.u + '"]'); if(el) window.scrollBy(0, el.getBoundingClientRect().top - keep.top); }
    return;
  }
  /* the strip of ships at the bottom: the user's own gesture moves the
     screen to that ship (30.9.2026 allows that - only render never scrolls) */
  if(name === "jump"){ jumpTo(i); return; }
  if(name === "endph"){ V.endph = !V.endph; render(); return; }
  /* the fleet list from the menu (user 19.10.2026: the "to phone" QR codes
     are there): the game record stays, the list offers Resume */
  if(name === "fleets"){ V.menu = false; V.sheet = null; V.pop = null; V.endph = false; V.phone = null; V.screen = "load"; render(); return; }
  if(name === "wake"){ lsSet(KEY_WAKE, lsGet(KEY_WAKE) === "0" ? "1" : "0"); wake(); render(); return; }
  if(name === "rwin"){ if(!G) return; repState().win = arg; save(); render(); return; }
  if(name === "copyrep"){ copyText(reportText(), "report"); return; }
  if(name === "sharerep"){ shareText("BFG game report", reportText()); return; }
  if(name === "pop"){
    V.pop = (V.pop && V.pop.i === i && V.pop.kind === arg) ? null : { i: i, kind: arg };
    render();
    if(V.pop) showPop();
    return;
  }
  if(name === "closepop"){ V.pop = null; render(); return; }
  if(name === "critpick"){ V.pop = { i: i, kind: "crit", x: arg ? String(arg) : null }; render(); return; }
  if(name === "page"){
    /* a page is a scroll position: jump there, nothing re-renders */
    if(!V.pageTops) return;
    const to = Math.max(0, Math.min(V.pages - 1, (V.page | 0) + arg));
    window.scrollTo(0, V.pageTops[to]);
    pageLabel();
    return;
  }
  /* the card opens over the screen, under the finger: a double tap must
     not land on it */
  if(name === "sheet"){ V.sheetY = window.scrollY || 0; V.sheet = i; V.pop = null; render(); V.guardUntil = Date.now() + 350; return; }
  /* back to the fleet where it was left (the card used to send the roster
     to its top, and the ship had to be found again) */
  if(name === "closesheet"){ V.sheet = null; V.pop = null; render(); if(V.sheetY != null) window.scrollTo(0, V.sheetY); return; }
  if(name === "menu"){ V.menu = !V.menu; render(); return; }
  if(name === "newgame"){
    if(!confirm("Forget this game's record and go back to the fleet list?")) return;
    lsDel(KEY_PLAY); G = null; U = []; UNDO = []; V = Object.assign(V, { screen: "load", sheet: null, pop: null, menu: false });
    render(); return;
  }
  if(name === "track"){
    if(arg === "all"){ const on = !TRACK.every(t => OPT[t[0]]); TRACK.forEach(t => { OPT[t[0]] = on; }); }
    else OPT[arg] = !OPT[arg];
    saveOpts();
    if(G){ normaliseUntracked(G); save(); }
    render(); return;
  }
  if(!G) return;
  snapshot();
  const st = G.st[i], R = U[i] && U[i].R, fleet = G.fleet;
  const before = R && R.kind === "ship" ? PLAY.view(R, st, fleet) : null;
  /* where this unit's hits and criticals are counted: on itself, or on a
     star fort's selected quadrant (Fleets p. 501) */
  const tk = R && st ? PLAY.track(R, st) : st;
  switch(name){
    case "ld": setLd(i, arg); break;
    case "ldclear": st.ld = null; st.ldRoll = null; st.ldFrom = null; break;
    case "flag": G.flag = arg; applyCommanderLd(); break;
    case "grp": { const seq = [null, "A", "B", "C"]; G.grp[i] = seq[(seq.indexOf(G.grp[i]) + 1) % seq.length]; break; }
    case "start": V.screen = "roster"; break;
    /* which quadrant of a star fort the card shows and the next tap goes
       to: a choice of view, not an event - nothing for UNDO to take back,
       and an open table stays open and follows the quadrant */
    case "quad": PLAY.selectQuad(st, arg); UNDO.pop(); save(); render(); return;
    /* once a Catastrophic Damage result is on the card, its damage is
       not edited by a tap - a wreck's hits are the wreck's; UNDO is the
       way back */
    case "hit": if(st.hulkName) break; PLAY.addHits(R, st, 1); break;
    case "dmg": if(st.hulkName || st.destroyed) break; PLAY.tapHit(R, st, arg); break;
    /* the fires burn in every End Phase - both players repair in it (p. 88),
       so twice a round - and the button counts how many times this turn
       they went on (J192's counter): a second tap is seen, not blocked */
    case "fire": {
      const n = Math.max(1, PLAY.fireDamage(R, st)); PLAY.addHits(R, st, n);
      st.fireN = st.fireTurn === fleet.turn ? (st.fireN | 0) + 1 : 1; st.fireTurn = fleet.turn;
      V.flash = { i: i, key: null, t: Date.now(), msg: "+" + n + " hit" + (n > 1 ? "s" : "") + " from " + (n > 1 ? n + " fires" : "the fire") + " (p. 67)" }; break; }
    /* damage control in the End Phase (p. 88): one system repaired or one
       fire out per 6; a result that may not be repaired (p. 67) stays */
    case "repair": {
      const key = String(arg);
      if(!tk.crits || !(tk.crits[key] > 0) || !repairable(R, key)){ UNDO.pop(); return; }
      PLAY.repairCrit(st, key, R); break;
    }
    case "crit": {
      /* a quadrant at 0 takes no further damage (Fleets p. 501): nothing
         is recorded and no UNDO step is spent */
      if(PLAY.quadGone(R, st)){ UNDO.pop(); render(); return; }
      /* p. 67: a location the ship does not have, or a repeated permanent
         result, is applied as the next result; if that is 11 or 12 the
         card asks for the D3/D6 first (LUEMINUT T4, T6) */
      const tgt = PLAY.critTarget(st, String(arg), R);
      const tdef = PLAY.standardCrits(R) ? PLAY.CRITS[tgt] : null;
      if(tdef && typeof tdef.extra === "string"){
        /* the table stays open and asks for the D3/D6 in place */
        V.pop = { i: i, kind: "crit", x: tgt };
        V.flash = { i: i, key: tgt, t: Date.now(), msg: String(arg) + " cannot be applied here, it counts as " + tgt + ": pick the " + tdef.extra + " roll below (p. 67)" };
        UNDO.pop(); render(); return;
      }
      const k = PLAY.addCrit(st, arg, R);
      const notes = [];
      if(k !== String(arg)) notes.push(String(arg) + " cannot be applied here, it counts as " + k + " (p. 67)");
      if(tdef && tdef.extra === 1){ PLAY.addHits(R, st, 1); notes.push("+1 hit (p. 67)"); }
      if(k === "9" && PLAY.standardCrits(R) && i === G.flag && !fleet.rerollsLost){
        PLAY.flagshipBridgeSmashed(fleet);
        notes.push("flagship: Fleet Commander re-rolls lost for the battle (p. 67)");
      }
      /* the table stays open (user 30.9.2026): the tile flashes and the
         line at the top says what went on the ship */
      V.pop = { i: i, kind: "crit" };
      V.flash = { i: i, key: k, t: Date.now(), msg: "Added " + critLabel(R, k) + critCountText(tk, k) + (notes.length ? " \u00b7 " + notes.join(" \u00b7 ") : "") };
      break;
    }
    case "critx": {
      if(PLAY.quadGone(R, st)){ UNDO.pop(); render(); return; }
      const key = arg.split(":")[0], n = parseInt(arg.split(":")[1], 10) || 0;
      PLAY.addCrit(st, key, R); PLAY.addHits(R, st, n);
      V.pop = { i: i, kind: "crit" };
      V.flash = { i: i, key: key, t: Date.now(), msg: "Added " + critLabel(R, key) + " \u00b7 +" + n + " hit" + (n > 1 ? "s" : "") + critCountText(tk, key) };
      break;
    }
    case "critminus": {
      /* The minus is the repair (damage control, p. 88) and the correction
         of a mis-tap both: the count comes off, the damage stays - a repair
         does not heal hits. A mis-tapped +1 hit (6 Engine, 8 Thrusters)
         comes off with UNDO or on the hit track. */
      const key = String(arg);
      if(!tk.crits || !(tk.crits[key] > 0)){ UNDO.pop(); return; }
      PLAY.removeCrit(st, key, R);
      /* the flagship's last Bridge Smashed taken off again: the re-roll
         boxes are back as they were (the 9 was a slip - it cannot be
         repaired, p. 67) */
      const rrBack = key === "9" && PLAY.standardCrits(R) && i === G.flag && fleet.rerollsLost && !((tk.crits || {})[key] > 0);
      if(rrBack) PLAY.flagshipBridgeRestored(fleet);
      V.pop = { i: i, kind: "crit", x: V.pop && V.pop.i === i ? V.pop.x : null };
      V.flash = { i: i, key: null, t: Date.now(), msg: "Removed " + critLabel(R, key) + ((tk.crits[key] | 0) ? " (now \u00d7" + tk.crits[key] + ")" : "") + " \u00b7 hits stay" + (rrBack ? " \u00b7 re-rolls back" : "") };
      break;
    }
    /* a unit that cannot move goes straight to SHOT (Rulebook p. 100) */
    case "played": members(i).forEach(j => PLAY.cyclePlayed(G.st[j], U[j].R)); break;
    case "kill": if(st.members[arg].dead) PLAY.reviveMember(st, arg); else PLAY.killMember(st, arg); break;
    case "hulk": {
      /* arg = index into PLAY.catastrophic(R).rows, or "boarded" (p. 90);
         only a ship at 0 hits takes a result */
      if(!PLAY.destroyed(R, st)) break;
      const c = PLAY.catastrophic(R);
      if(arg === "boarded" && !c.boarded) break;
      const row = arg === "boarded" ? { kind: "drifting", name: c.rows[0].name, text: c.rows[0].text + " (boarded to 0: no roll, p. 90)" } : c.rows[arg];
      if(!row) break;
      if(row.kind === "gone"){ st.destroyed = true; st.hulk = null; } else { st.hulk = row.kind; }
      st.hulkName = row.name; st.hulkText = row.text;
      V.pop = null; break;
    }
    case "diseng": st.disengaged = !st.disengaged; break;
    /* --- opt-in tracking (menu > Tracking); no button emits these when off --- */
    case "brace": members(i).forEach(j => PLAY.setOrder(G.st[j], fleet, "BFI", true)); V.pop = null; break;
    case "bracefail": members(i).forEach(j => PLAY.setOrder(G.st[j], fleet, "BFI", false)); V.pop = null;
      toast("Brace failed: locked against this attacker (p. 47); no further orders this turn, brace excepted (p. 48)"); break;
    case "bracelock": members(i).forEach(j => { G.st[j].braceLock = false; }); break;
    case "order": members(i).forEach(j => PLAY.setOrder(G.st[j], fleet, arg, true)); V.pop = null; break;
    case "orderfail": PLAY.setOrder(st, fleet, "LO", false); V.pop = null;
      toast("Command check failed: no more special orders this turn except Brace (p. 48)"); break;
    case "clearorder": members(i).forEach(j => { G.st[j].order = null; G.st[j].braceTurn = 0; G.st[j].braceCarry = null; }); V.pop = null; break;
    case "boarding": st.boarding = !st.boarding; break;
    case "nofire": st.noOrdersTurn = !st.noOrdersTurn; break;
    case "torps": st.torps = !st.torps; break;
    case "craft": st.craft = !st.craft; break;
    case "blast": if(arg === 0) PLAY.clearBlast(st); else st.blast = Math.max(0, (st.blast | 0) + arg); break;
    case "rr": PLAY.adjustRerolls(fleet, arg); break;
    /* one box: that re-roll is used, or back if the tap was a slip */
    case "rrbox": PLAY.toggleReroll(rrPool(i), arg); break;
    /* an open option of the list, bought after all: a box of its own */
    case "rropt": if(!rrOpen(i)){ UNDO.pop(); return; } PLAY.addReroll(rrPool(i), "optional"); break;
    case "enemy": fleet.enemyOrders = !fleet.enemyOrders; break;
    case "rad": fleet.radiation = Math.max(0, (fleet.radiation | 0) + arg); break;
    case "ac": G.ac = Math.max(0, (G.ac | 0) + arg); break;
    case "endturn": PLAY.endTurn(G.st, fleet); V.pop = null; V.endph = false; break;
    /* the turn button: played marks off, turn counter up (orders, braces
       and blast markers live on the table as tokens - not here) */
    case "newturn": PLAY.newTurn(G.st, fleet); V.pop = null; V.endph = false; break;
    default: UNDO.pop(); return;
  }
  dropStalePop();
  if(before){
    const after = PLAY.view(R, st, fleet);
    const qw = quadWord(R, st);
    if(!before.crippled && after.crippled){
      buzz(120);
      toast(unitName(i) + (qw ? " " + qw : "") + " CRIPPLED: " + crippledNow(R, st) + " (" + (after.fort ? "Fleets p. 501" : "p. 65") + ")", "crip");
    }
    /* a star fort's quadrant at 0 (Fleets p. 501); the fort itself stands
       until all four are (p. 502) */
    if(after.fort && !before.quadGone && after.quadGone && !after.destroyed){
      buzz(160);
      toast(unitName(i) + " " + qw + " is at 0: it takes no further damage, and that quarter of the base is an asteroid field from now on (Fleets p. 501)", "crip");
    }
    if(!before.destroyed && after.destroyed){
      buzz(200);
      const c = PLAY.catastrophic(R);
      /* one-hit units make no Catastrophic Damage roll: an escort leaves a
         Blast Marker (p. 71), a one-hit defence nothing the book names
         (p. 101) - no table opens */
      if(after.escort) toast(unitName(i) + ": " + (R.hulls > 1 ? "all " + R.hulls + " destroyed" : "destroyed") + ". " + c.rows[0].text, "crip");
      else {
        toast(unitName(i) + " is out of action: " + (c.dice ? "roll " + c.dice + " on the " + c.title + " table (" + (c.fleets ? "Fleets " : "") + "p. " + c.page + ")" : c.rows[0].text), "crip");
        /* the table opens on the card by itself, with this ship's numbers */
        V.pop = { i: i, kind: "hulk" }; save(); render(); showPop(); return;
      }
    }
  }
  save();
  render();
}

/* ============================================================ DERIVED ===== */
function baseName(i){ const R = U[i].R; return R.name || title(R.className || (R.entry && R.entry.label) || ""); }
/* a name the player gave the ship at the set-up (user 19.10.2026: "voi myos
   kirjoittaa laivoille viela uudet nimet") is this game's: G.nm, by row */
function unitName(i){ const n = G && G.nm && G.nm[i]; return n || baseName(i); }
function classTag(R){
  const t = String(R.stats ? R.stats.type : "");
  if(/grand/i.test(t)) return "GC";
  if(/battleship/i.test(t)) return "BB";
  if(/cruiser/i.test(t)) return "CR";
  if(/escort/i.test(t)) return "ESC";
  if(/defence/i.test(t)) return "DEF";
  if(/ground/i.test(t)) return "GND";
  return t.slice(0, 3).toUpperCase() || "?";
}
/* What the members of a member-model unit are called: ships for escorts,
   units for platforms, silos and air bases ("grouped in up to six units",
   Rulebook p. 100). */
function memberWord(R, n){ return /escort/i.test(String(R.stats.type || "")) ? (n === 1 ? "ship" : "ships") : (n === 1 ? "unit" : "units"); }
function crippledNow(R, st){
  const v = PLAY.view(R, st, G.fleet);
  const note = String(R.damage.note || "").replace(/^crippled:\s*/i, "").replace(/\s*no nova cannon\.?$/i, "");
  const now = [];
  /* a unit that does not move has no speed to lose (Rulebook p. 100-101) */
  if(v.still){ /* nothing */ }
  else if(v.speed.now != null) now.push("speed " + v.speed.now + " cm");
  else if(v.speed.mods.length) now.push("speed " + v.speed.text + " " + v.speed.mods.map(m => m.v).join(""));
  if(v.shields.now != null) now.push("shields " + v.shields.now);
  if(v.turrets.now != null) now.push("turrets " + v.turrets.now);
  /* a star fort: the crippled quadrant's own weapons and bays, never the
     Basilica's (Fleets p. 501) */
  if(v.fort) return "now " + now.join(", ") + " " + MID + " its own weapons and launch bays halved, the Basilica's not";
  const nova = (R.weapons || []).some(w => w.state !== "offered" && /nova cannon/i.test(w.a[0]));
  return (now.length ? "now " + now.join(", ") + " " + MID + " " : "") + note + (nova ? " No nova cannon." : "");
}
const ARM_CLS = { WB: "w-wb", LAN: "w-lan", NOVA: "w-nov", BOMB: "w-nov", TORP: "w-tor", BAYS: "w-bay", HOOK: "w-hook", MINES: "w-min", PULSE: "w-pul", RAM: "w-ram" };
/* The row's armament line: current strengths by weapon group, in the
   card's colours, a silenced row struck through. */




function ldTile(i, extraCls, short){
  const grp = G.grp[i];
  const ms = grp ? groupUnits(grp) : [i];
  const l = grp ? PLAY.squadronLd(ms.map(j => ({ R: U[j].R, st: G.st[j] })), G.fleet) : PLAY.leadership(U[i].R, G.st[i], G.fleet);
  /* a squadron's tile edits the ship whose Leadership it shows (p. 95) */
  const who = grp && l.idx != null ? ms[l.idx] : i;
  const st = G.st[who];
  const mods = l.mods.map(m => (m.v > 0 ? "+" : "") + m.v + " " + m.t.split(" ")[0]).join(" ");
  /* short (the compact row): the big number is the value; the line under
     it keeps only what qualifies it - "Ld 10 cmdr" cut to "Ld 10 cm..."
     read as centimetres (19.10.2026) */
  const qual = st.ldFrom === "commander" ? "cmdr" : st.ldFrom === "fixed" ? "fixed" : "";
  const sub = l.now == null ? "set Ld" : (mods || (short && qual ? qual : "Ld " + l.base + (qual ? " " + qual : "")));
  return `<button class="ldt ${l.now == null ? "na" : ""} ${extraCls || ""}" data-act="pop" data-i="${who}" data-arg="ld" aria-label="Leadership">
    <b>${l.now == null ? "?" : l.now}</b><small>${sub}</small></button>`;
}


function ordChip(st){
  if(st.order === "BFI" || st.braceTurn) return `<span class="chip br">BRACED</span>`;
  if(st.order) return `<span class="chip ord">${esc(PLAY.ORDER_BY[st.order].name)}</span>`;
  return "";
}
function ordnancePills(i, v){
  const st = G.st[i];
  const has = { torp: v.arms.some(a => a.torp), bays: v.arms.some(a => a.bays) };
  let s = "";
  if(has.torp) s += `<button class="stat pill2 ${st.torps ? "on" : "spent"}" data-act="torps" data-i="${i}">TORP <b>${st.torps ? "loaded" : "fired"}</b></button>`;
  if(has.bays) s += `<button class="stat pill2 ${st.craft ? "on" : "spent"}" data-act="craft" data-i="${i}">AC <b>${st.craft ? "ready" : "launched"}</b></button>`;
  return s;
}
function renderFleetPop(){
  const fl = G.fleet;
  const frr = fleetRR(), C = G.cmd != null ? U[G.cmd].R : null;
  /* whose they are and what the price included, then the rule */
  const rrHead = frr ? "Fleet re-rolls" : fl.rerollsPerTurn ? "Fleet Commander re-rolls " + MID + " per turn" : "Fleet Commander re-rolls";
  const rrOwn = frr ? "The fleet's own: " + esc(frr.text) + " (Fleets p. " + frr.page + ")."
    : C && C.rerolls && C.rerolls.text ? esc(unitName(G.cmd)) + ": " + esc(C.rerolls.text) + "." : "";
  const rrRule = frr ? esc(frr.how || "") + " One re-roll per check at most (p. 48)."
    : fl.rerollsPerTurn ? "One re-roll per check at most (p. 48). It is one per turn (Fleets p. 231), and the enemy's turn is a turn too: " +
        (OPT.orders ? "the box comes back at the start of yours and of the enemy's." : "the box comes back at NEW TURN - tap it back yourself when the enemy's turn starts.") +
        " Lost for the battle if the flagship's bridge is smashed (p. 67)."
    : "One re-roll per check at most; lost for the battle if the flagship's bridge is smashed (p. 48, 67).";
  if(V.pop.kind === "rr") return `<div class="pop"><h4>${rrHead}</h4><p>${rrOwn ? `<b>${rrOwn}</b> ` : ""}${rrRule}</p>
    <div class="steprow"><button data-act="rr" data-i="-1" data-arg="-1" ${fl.rerollsLost ? "disabled" : ""}>&minus;</button><div class="val">${fl.rerolls | 0}<small>${fl.rerollsLost ? "lost: flagship bridge smashed (p. 67)" : "left"}</small></div><button data-act="rr" data-i="-1" data-arg="1" ${fl.rerollsLost ? "disabled" : ""}>+</button></div>
    <button class="close" data-act="closepop">close</button></div>`;
  if(V.pop.kind === "ac") return `<div class="pop"><h4>Attack craft in play</h4><p>No more attack craft markers in play than surviving launch bays, fleet-wide; crippled carriers count half (p. 73).</p>
    <div class="steprow"><button data-act="ac" data-i="-1" data-arg="-1">&minus;</button><div class="val">${G.ac | 0}<small>markers on the table</small></div><button data-act="ac" data-i="-1" data-arg="1">+</button></div>
    <button class="close" data-act="closepop">close</button></div>`;
  return "";
}
function critChips(R, st, i){
  const rows = (R.damage && R.damage.critical && R.damage.critical.rows) || [];
  return PLAY.activeCrits(st, R).map(c => {
    const row = rows.find(r => String(r[0]) === c.key);
    const nm = row ? row[1] : (c.def ? c.def.name : c.key);
    const fire = PLAY.standardCrits(R) && c.key === "7";
    /* An unrepaired fire costs a hit each in the End Phase (p. 67): the
       chip is the button that adds them. */

    return `<span class="chip crit">${esc(String(nm).split(/\s+\+/)[0])}${c.count > 1 ? " " + TIMES + c.count : ""}</span>`;
  }).join("");
}

/* The spec line under the name: the profile as it stands now, a value a
   critical or crippling changed marked in the crippled colour. */
function statsLine(v, R, esq){
  const sp = v.speed.now != null ? v.speed.now + " cm" : v.speed.text + (v.speed.mods.length ? " " + v.speed.mods.map(m => m.v).join("") : "");
