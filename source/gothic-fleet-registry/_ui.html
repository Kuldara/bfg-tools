."],"ents":[]}]},{"nm":"Eldar \u2014 Iyanden Craftworld","pg":318,"secs":[{"t":"FLEET RULES (pg. 317\u2013317)","rules":[],"text":["FLEET COMMANDER 0-1 Pirate Prince You may include 1 Pirate Prince in your fleet, who must be assigned to a ship and adds +2 to its Leadership, to a maximum of 10.","If the fleet is worth over 750 points a Pirate Prince must be included to lead it.","Pirate Prince (+2 Ld).................................100 pts You may purchase Fleet Commander re-rolls for your Pirate Prince by paying the cost listed below.","One re-roll..................................................+25 pts Two re-rolls.................................................+50 pts Three re-rolls...........................................+100 pts Eldar Hero Your fleet may be led by an Eldar Hero, in place of its normal fleet commander.","Only a fleet led by an Eldar Hero may take reserves from the Craftworld Eldar fleet list.","Eldar Hero (Ld 10)....................................100 pts You may purchase Fleet Commander re-rolls for your Eldar Hero by paying the cost listed below.","One re-roll..................................................+50 pts Two re-rolls.................................................+75 pts Three re-rolls...........................................+100 pts CAPITAL SHIPS Battleships Your fleet may include up to one battleship for every full 1,000 points it contains.","Therefore, if you have between 0 to 999 points, you cannot field any battleships, while from 1000 to 1,999 points you can include one, and so on.","140 pts Solaris class light cruiser (pg 324)..............130 pts ESCORTS You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","55 pts Hemlock class destroyer (pg 327).................40 pts Nightshade class destroyer (pg 328).............40 pts ORDNANCE Any ship with launch bays may choose to have them launch any mix of Darkstar fighters and Eagle bombers.","RESERVES AND ALLIES An Eldar Hero must lead the fleet in order to use Craftworld Eldar vessels as reserves.","Following this, one Craftworld Eldar Flame of Asuryan, Dragonship or Wraithship may be taken for every three cruisers in the fleet.","Craftworld Eldar Shadowhunters may be taken in the same ratio of no more than one for every three escort vessels in the fleet.","Corsair Eldar escorts and Shadowhunters may not be in the same squadron.","If the Flame of Asuryan is taken, the Eldar Hero must be embarked aboard it."],"ents":[]},{"t":"Autarch","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Autarch","sec":[1],"ok":true,"hdr":1}],"text":["You may include one Eldar Autarch in your fleet, who replaces the ship\u2019s Leadership with his own.","If the fleet is worth over 750 points, an Autarch must be included to lead it.","The fleet commander may purchase a re-roll, at the cost listed below:"],"ents":[{"l":"Eldar Autarch (Ld 9)","r":null,"p":75,"src_page":318,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Iyanden Bearer of the Flame (Ld 10)","r":null,"p":100,"src_page":318,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":25,"src_page":318,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1]]}]},{"t":"Eldar Hero","rules":[],"text":["Your fleet may be led by an Eldar Hero, in place of its normal fleet commander.","Only a fleet led by an Eldar Hero may take reserves from the Corsair Eldar fleet list.","You may purchase Fleet Commander re-rolls for your Eldar Hero by paying the cost listed below."],"ents":[{"l":"Eldar Hero (Ld 10)","r":null,"p":100,"src_page":318,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":50,"src_page":318,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[2,0]]},{"l":"Two re-rolls","r":null,"p":75,"src_page":318,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[2,0]]},{"l":"Three re-rolls","r":null,"p":100,"src_page":318,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[2,0]]}]},{"t":"Farseers","rules":[{"kind":"cap","max":3,"what":"farseers","src":"You may include up to three Farseers in your fleet, each of whom must be assigned to a capital ship (including the flagship if desired) and gives the vessel a re-roll which may be used on itself, another capital ship in the same squadron or an escort squadron within 15 cm.","ok":true,"sec":[3]},{"kind":"section_count","min":0,"max":3,"src":"0-3 Farseers","sec":[3],"ok":true,"hdr":1}],"text":[],"ents":[{"l":"0-3 Farseers","r":null,"p":30,"src_page":318,"a":1,"mx":null,"nt":null,"k":"cmd"}]},{"t":"Dragonships","rules":[{"kind":"ratio","allow":1,"allow_type":"dragonship","per":2,"per_type":"wraithships","src":"Your fleet may include up to one Dragonship for every two Wraithships included in the fleet.","ok":true,"allow_sec":[4],"per_sec":[5]}],"text":["If your fleet is led by an Autarch, you may include a single Dragonship as his flagship which does not count against this limitation.","In order to take the Flame of Asuryan, an Eldar Hero must lead the fleet and be embarked aboard it."],"ents":[{"l":"Flame of Asuryan","r":329,"p":320,"src_page":318,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Dragonship","r":330,"p":260,"src_page":318,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Wraithships","rules":[],"text":["Your fleet may include any number of Wraithships."],"ents":[{"l":"Wraithship","r":331,"p":160,"src_page":318,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Ghostships","rules":[],"text":["Any capital ship in the fleet may be upgraded to a Ghostship.","Such a vessel may not also include a Farseer or Aspect Warrior crew."],"ents":[{"l":"Ghostship","r":null,"p":0,"src_page":318,"a":0,"u":1,"mx":null,"nt":"The book points at pg. 306, which is a rules page rather than a ship profile.","k":"up"}]},{"t":"ASPECT WARRIOR HOST","rules":[],"text":["Any capital ship in the fleet may be equipped with Aspect Warriors, serving as the ship\u2019s fighting crew."],"ents":[{"l":"Aspect Warrior Host","r":null,"p":20,"src_page":318,"a":1,"u":1,"mx":null,"nt":"Fleet upgrade from pg. 305, not a ship profile.","k":"up"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[8]}],"text":[],"ents":[{"l":"Shadowhunter","r":332,"p":40,"src_page":318,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["Any ship with launch bays may choose to have them launch any mix of Nightwing fighters and Phoenix bombers.","Attack craft carriers may also be equipped with torpedo bombers for +15 points per launch bay, with these functioning the same way as other Eldar torpedoes."],"ents":[{"l":"Torpedo bombers","r":null,"p":15,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book prints this only in the section text: \u201cAttack craft carriers may also be equipped with torpedo bombers for +15 points per launch bay, with these functioning the same way as other Eldar torpedoes.\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"}]},{"t":"RESERVES AND ALLIES","rules":[],"text":["An Eldar Hero must lead the fleet in order to use Corsair Eldar vessels as reserves.","Following this, one Corsair Eldar cruiser or light cruiser may be taken for every three Dragonships and / or Wraithships in the fleet.","Corsair Eldar escort vessels may be taken in the same ratio of no more than one for every three Shadowhunters in the fleet.","These may be organized in squadrons in any mix desired, but Corsair Eldar escorts and Shadowhunters may not be in the same squadron.","Up to one Void Stalker may be taken in the fleet as long as the fleet is at least 1000 points and at least three Corsair Eldar cruisers and / or light cruisers are already present in the fleet.","Yriel may be taken instead of the Hero Fleet Commander as listed in the Corsair and Craftworld Eldar fleet lists.","He is accompanied by the fiercest members of Yriel\u2019s own pirate warband, which count as an Aspect Warrior host.","He has one re-roll as part of his point cost, but a second or third re-roll can be purchased at +25 points each.","When Yriel is taken he must be placed on a Craftworld Eldar Dragonship with launch bays, but you may instead pick the Flame of Asuryan as his command ship to be embarked on.","He must be embarked aboard the Flame of Asuryan if it is present, in which case his cost is 125 points."],"ents":[{"l":"Prince Yriel","r":null,"p":150,"src_page":319,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cHe has one re-roll as part of his point cost, but a second or third re-roll can be purchased at +25 points each.\u201d","prose":1,"k":"up","grp":"rr","at":[[10,0]]},{"l":"Two extra re-rolls","r":null,"p":50,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cHe has one re-roll as part of his point cost, but a second or third re-roll can be purchased at +25 points each.\u201d","prose":1,"k":"up","grp":"rr","at":[[10,0]]},{"l":"Embarked aboard the Flame of Asuryan","r":null,"p":-25,"a":1,"u":1,"mx":null,"nt":"His cost becomes 125 points instead of 150. The book prints this only in the section text: \u201cHe must be embarked aboard the Flame of Asuryan if it is present, in which case his cost is 125 points.\u201d","prose":1,"k":"up","at":[[10,0]]}]}]},{"nm":"Dark Eldar \u2014 Pirates","pg":351,"secs":[{"t":"FLEET RULES (pg. 345\u2013350)","rules":[],"text":["Roll a dice for each point of the Phantom lance\u2019s strength when firing, with the following effects: D6 ROLL EFFECT 1-3 No hits 1 hit 5-6 2 hits ORDNANCE All Dark Eldar Ordnance can only be hit by turrets on a 6.","When orbital mines are used, they completely replace all other attack craft used by the launching carrier, with one orbital mine per launch bay strength.","Raptor fighters are resilient, meaning they get a 4+ save once per ordnance phase whenever they come in contact with enemy ordnance.","Instead the Impaler rolls a D6 and remains in play on a 4+.","The Impaler can only use this save once per ordnance phase, but if it does so against a fighter in base contact with a ship and subsequently survives turret fire, it may then attack that ship normally.","Turrets may fire at the Impaler, in the same way as against ordnance.","On a score of a 1 the Impaler\u2019s boarders are defeated and the module may not be used for the remainder of the game.","On a 2-6 the Impaler causes a critical hit, but instead of just looking up the rolled score on the Critical Hits table, you roll 2D6 and look up this added score instead.","Against Tyranids, you must roll 2D6 twice and take the lowest roll.","At the beginning of each of the Dark Eldar player\u2019s turn he must remove any Impalers from the table (these are assumed to have been forced to return to their parent ship due to lack of fuel).","He may of course attempt to reload ordnance during the turn in order to relaunch said Impalers (ie he reloads ordnance as quickly as possible to \u2018turn around\u2019 the Impalers and their crew just as soon as they arrive back at their parent ship).","You may not launch additional Impalers if you already have a number of Impalers in play equal to the number of Impaler armed vessels in the fleet.","If the Impaler is removed (either by turrets, enemy ordnance, attack craft and so on), the Dark Eldar vessel must reload ordnance as normal before being able to fire it again (it is assumed that a damaged module limps back to its parent vessel and must await hurried repairs or else take time for its crew to transfer to a replacement).","An Impaler can only be completely destroyed by a failed Hit & Run attack (a roll of 1 on the initial attack as described above), which would leave it useless due to the loss of its crew.","Leech Torpedoes Dark Eldar ships armed with torpedoes may use leech torpedoes at no extra cost.","These must be loaded with a specific Reload Ordnance roll, although a ship may start the scenario with them in the tubes by writing a note on the ship sheet.","Do not roll for the effect of this critical hit, instead the leech torpedo immediately causes a -10 cm speed reduction on its target.","Only one -10 cm speed penalty applies regardless of the number attached \u2013 the effect is not cumulative.","However, all leech hits on a ship must be repaired before the movement penalty is removed (eg if a ship suffers 5 leech hits, it remains at a reduced speed until all 5 hits have been repaired).","Any torpedo that comes in contact with a ship and misses the target on the first attempt must re-roll the hit roll, even if the ship is already destroyed.","TRANSPORTS Dark Eldar fleets may use Imperial transports (of all types) in scenarios that call for transports where the Dark Eldar are playing the defender.","ELDAR HAVEN An Eldar Haven (pg 334) may be used as a Dark Eldar pirate base.","DARK ELDAR CREW SKILLS Over the course of a campaign, a ship\u2019s crew develops experience that only comes from serving together in the crucible of war.","When the ship attempts to make Lock-On Special Orders, you may roll 3D6 and discard the highest D6 before comparing the roll against the ship\u2019s leadership.","This vessel may always attempt to go on Special Orders, even if another ship or squadron in the fleet has failed a command check this turn.","Bombers launched by this vessel may survive being intercepted by enemy fighters utilizing the \u2018Resilient Attack Craft\u2019 4+ save rule in the same manner as Dark Eldar fighters.","This ship may re-roll the dice in a boarding action.","Disciplined Crew: Whenever this ship checks leadership or attempts to go on Special Orders, you may roll 3D6 and discard the highest D6 before comparing the roll against the ship\u2019s leadership.","Elite Command Crew: Once per battle the ship may automatically pass a Leadership test or command check \u2013 there is no need to roll any dice.","This may be used even if another ship or squadron in the fleet has failed a command check this turn.","Eldar Havens may earn ship or weapon refits but not engine refits.","Ships that cannot use the refit or crew skill rolled for whatever reason may re-roll the result, such as not being equipped with weapon batteries, attack craft, etc.","This does not count as being braced, but the ship may not use this save when on Brace For Impact Special Orders or attempt to go on Brace For Impact special orders against any round of shooting or event of taking damage if this save fails.","No more than 1HP can be regained in this manner per turn, regardless of how many rolls of 6 are made.","Distortion Charges: The vessel has been fitted with a weapon system which ejects a Warp Distortion charge into its wake (usable once per game).","This D-charge must be placed at the same time the player places the rest of the fleet\u2019s ordnance on the table, in the ship\u2019s aft firing arc.","If it comes in contact with an enemy ship\u2019s base, the enemy vessel may attempt to shoot it down with turrets, hitting on a roll of 6.","At the beginning of each subsequent Dark Eldar turn roll a D6.","Ships fitted with lance-type weapons may re-roll their first miss each turn."],"ents":[{"l":"Leech torpedoes","r":null,"p":0,"a":0,"u":1,"mx":null,"nt":"Loaded with a specific Reload Ordnance roll. The book prints this only in the section text: \u201cLeech Torpedoes Dark Eldar ships armed with torpedoes may use leech torpedoes at no extra cost.\u201d","prose":1,"cond":{"has":"torpedo"},"k":"up"}]},{"t":"Dread Archon","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Dread Archon","sec":[1],"ok":true,"hdr":1}],"text":["You may include 1 Dread Archon in your fleet, who must be assigned to a ship and adds + 2 to its Leadership, to a maximum of 10.","1f the fleet is worth over 750 points a Dread Archon must be included to lead it.","You may purchase Fleet Commander re-rolls for your Dread Archon by paying the cost listed below."],"ents":[{"l":"Dread Archon (+2 Ld)","r":null,"p":100,"src_page":351,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":25,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Two re-rolls","r":null,"p":50,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Three re-rolls","r":null,"p":100,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]}]},{"t":"Cruisers","rules":[{"kind":"section_count","min":0,"max":12,"src":"0-12 Cruisers","sec":[2],"ok":true,"hdr":1}],"text":["Torture class cruisers may choose one of the following for the points shown: 1\u20132 Impaler Assault Modules.........+20 /+40 pts Torture class cruisers may add Mimic Engines:"],"ents":[{"l":"Torture class cruiser","r":352,"p":210,"src_page":351,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Prow Torpedoes","r":null,"p":20,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]},{"l":"Phantom Lance","r":null,"p":20,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]},{"l":"Launch Bays","r":null,"p":40,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]},{"l":"Mimic Engines","r":null,"p":20,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[3]}],"text":["However, Dark Eldar fleets must contain at least three escorts for every capital ship taken.","Corsair class escorts may add Mimic Engines:"],"ents":[{"l":"Corsair Class Escort","r":353,"p":50,"src_page":351,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Mimic Engines","r":null,"p":5,"src_page":351,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[3,0]]}]},{"t":"ORDNANCE","rules":[],"text":["Ships with launch bays may launch any mix of Raptor fighters, Razorwing bombers and Slavebringer assault boats.","Ships with torpedo tubes are armed with both Eldar torpedoes and Leech torpedoes, though the Leech torpedoes must be loaded with a separate reload ordnance roll as described in the special rules."],"ents":[]}]},{"nm":"Orks \u2014 Cyclops Cluster","pg":365,"secs":[{"t":"FLEET RULES (pg. 359\u2013364)","rules":[],"text":["A Space Hulk may use boarding torpedoes for +15 points.","Escorts cannot use boarding torpedoes.","Launch capacity Some ships in an Ork fleet may possess a variable launch capacity (as is the case with many Ork capital ships).","In the Ordnance phase of each Ork turn when Ork attack craft remain in play, an Ork fleet with variable launch bay Strength must roll to check its attack craft capacity.","However, when attacking a ship, each squadron only rolls a D3 not a D6 for the number of attacks they inflict.","As they behave as both fighters and bombers, they apply a bonus to turret suppression by adding +1 attack for each marker in the wave after attacks are modified by turrets \u2013 meaning each ordnance marker that survives against turrets will be able to conduct at least one attack and will not have a minimum of zero attacks.","When a wave of fighta-bommas attacks a ship, you must decide beforehand if any of the markers will forgo their attack runs in favour of turret suppression.","Every one that does so cannot make any attack rolls but adds an additional +1 bonus attack to any surviving fighta-bommas when rolling their attacks.","Fighta-bommas used in this manner cannot contribute more bonus attacks than the defending ship actually has turrets or the number of surviving fighta-bommas, whichever number is lower.","NOTE: In either case, at least one fighta-bomma has to survive against turrets for the wave to attack in this manner.","Example: A Terror Ship launches a single wave of four fighta-bommas against a Devastation cruiser with three turrets and no CAP, declaring two markers are not attacking and will only be suppressing turrets.","The two remaining markers now each roll 1D3-3 (minimum zero) attacks, but because each marker also counts as a fighter, it adds +1 attack for each marker.","It then adds +2 attacks for the two markers used only to suppress turrets (even though one was removed), for a single total addition of +4 attacks.","Torpedo-bommas only move 20 cm and do NOT retain the ability to behave as fighters and cannot intercept other ordnance or provide a bonus attack for turret suppression.","In the beginning of any turn after the turn they are launched, each torpedo-bomma marker may be converted into a Strength-2 torpedo salvo.","Torpedo-bommas in a wave may combine their salvoes into a single salvo, or any number of markers may launch their salvoes separately.","Torpedo-bommas may be taken by any ship equipped with launch bays for +10 points per launch bay strength.","This means a Terror Ship must pay +40 points and a Space Hulk must pay +160 points to use Torpedo Bommas.","Ork Orbital Mines Orks may buy orbital mines like other fleets at +5 pts per (maximal) launch bay strength and minefields for the normal point cost.","Note: Ork Space Hulks cannot take orbital mines.","Regardless of how the Orks refer to the four named Ork battleships, they are battleships nonetheless and cannot take orbital mines.","These often have a random firepower which is rolled each time they are fired.","Each hit scored by heavy gunz causes double damage, i.e, two hits instead of one.","The strength of a salvo from an Ork torpedo launcha is randomly generated each time it is fired by rolling the dice indicated on its characteristics.","Ork ships in skwadrons may not combine torpedoes into larger salvoes.","When used in this manner, they follow all rules for planetary defences, meaning they automatically pass all leadership checks they are required to make but cannot undergo any Special Orders except Reload Ordnance and Brace For Impact, for which they are Leadership 7 (Yes, 7 and not 6!).","Ork Roks cannot move and count as stationary in all effects when purchased as defences, including all rules concerning removal of blast markers from planetary defences.","When used in this manner, roll 2D6 after setting up each Rok.","Once per game when you use the All Ahead Full special orders, you may double the result of the dice roll to see how far you go.","You must travel this FULL distance.","A ship with this refit may ignore the movement penalty for Blast Markers in contact with its base, or it travels though (including gas clouds and other celestial phenomenon).","Note: the model must be painted red to get this benefit.","More Shields: If one is good two must be better.","For each hit against the shields roll a D6; on a 6 the increased shielding absorbs the hit and it is ignored, place no blast marker.","ORK CREW SKILLS Over the course of a campaign, a ship\u2019s crew develops experience that only comes from serving together in the crucible of war.","When the Ship attempts Lock- on special orders you may roll 3D6 and discard the highest roll before comparing it to the ship\u2019s leadership.","The Ork ship may always repair at least one critical hit per turn, excepting those that may not be repaired.","Note: escorts may re-roll this result.","If the ship/squadron attempts to Reload Ordnance, you may roll 3D6 and discard the highest die.","Note: Ships/Squadrons without ordnance may ignore this roll.","Once per game you may re-roll a failed Leadership or Command check.","Once per battle the ship may automatically pass a Leadership test or Command check without rolling any dice.","Rather than rolling D3 for the number of hits against ships, these Bombers may roll a D6.","However, your crew doesn\u2019t know what to do yet and loses 1 Ld for the next battle only.","Pillagin\u2019: You may add up to 1 kroozer or squadron of escorts to your roster for each system you control.","Each unit you add forces you to reduce the grade of the system as follows: Forge becomes Mining, Civilised becomes Agri, all others become Uninhabited.","Lootin\u2019: For each hulk you captured last scenario you may give one of your kroozers Looted Torpedoes or Extra Power Fields.","Oddboyz: For each civilised system or hive world you control you may give one of your kroozers any warlord upgrade except Looted Torpedoes or Extra Power Fields.","You may add a warlord to your registry.","The next time you are the attacker in a battle you may nominate two systems to be attacked."],"ents":[]},{"t":"WARLORD","rules":[{"kind":"mandatory_at","points":500,"src":"If the fleet is worth 500 points or more it must include at least 1 Warlord to lead it.","ok":true,"sec":[1]},{"kind":"per_points","each":1,"what":"warlord","per":500,"src":"An Ork fleet can include a max of one Warlord per 500 points.","ok":true,"sec":[1]}],"text":["You may include 1 or more Warlord in your fleet, each of whom must be assigned to a ship or squadron.","ie, if the fleet is worth up to 500 points, it may have one Warlord.","If it is worth 500\u20131,000 points two Warlords may be included, etc.","They can have up to two more re-rolls for the additional cost noted below.","A vessel carrying a Warlord doubles its boarding value and may include up to one of the upgrades shown below at the additional cost indicated.","The ship may re-roll the dice for the firepower of its gunz when it fires.","The ship may re-roll the dice for damage control.","The ship may re-roll the dice for the strength of torpedo salvoes when it fires."],"ents":[{"l":"Ork Warlord","r":null,"p":40,"src_page":365,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":20,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Two extra re-rolls","r":null,"p":40,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Maniac Gunners","r":null,"p":35,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]},{"l":"Mad Meks","r":null,"p":25,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]},{"l":"Extra Power Fields","r":null,"p":25,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]},{"l":"Mega-armoured Boarding Parties","r":null,"p":15,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]},{"l":"Looted Torpedoes","r":null,"p":20,"src_page":365,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]}]},{"t":"KROOZERS","rules":[{"kind":"cap","max":6,"what":"kroozers","src":"You may include up to six kroozers in your fleet.","ok":true,"sec":[2]}],"text":[],"ents":[{"l":"Terror ship","r":380,"p":185,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Kill kroozer","r":382,"p":155,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[3]}],"text":[],"ents":[{"l":"Ravager attack ship","r":386,"p":40,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Onslaught attack ship","r":384,"p":35,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Grunt assault ship","r":388,"p":30,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Savage gunship","r":385,"p":30,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Brute ramship","r":387,"p":25,"src_page":365,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"DAKKA DAKKA","rules":[],"text":["Ork capital ships can add +2 turrets to their ships for +20 points (this is not the same thing as saying \u201cup to two turrets at +10 points each\u201d).","Ork escorts may add +1 turret for +5 points per escort.","If this option is taken, every escort in a given squadron must take the refit, not just individual escorts in a squadron."],"ents":[{"l":"Dakka Dakka: +2 turrets","r":null,"p":20,"a":1,"u":1,"mx":null,"nt":"The e purchased with points for planetary defences, in scenarios where these are used.","Ork Roks may be squadroned with up to three other Roks (total squadron size of four), but not with any other vessels."],"ents":[{"l":"Rok","r":392,"p":80,"src_page":367,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":[],"ents":[]},{"t":"DAKKA DAKKA","rules":[],"text":["Ork capital ships can add +2 turrets to their ships for +20 points (this is not the same thing as saying \u201cup to two turrets at +10 points each\u201d).","Ork escorts may add +1 turret for +5 points per escort.","If this option is taken, every escort in a given squadron must take the refit, not just individual escorts in a squadron."],"ents":[{"l":"Dakka Dakka: +2 turrets","r":null,"p":20,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cOrk capital ships can add +2 turrets to their ships for +20 points (this is not the same thing as saying \u201cup to two turrets at +10 points each\u201d).\u201d","prose":1,"k":"up"},{"l":"Dakka Dakka: +1 turret (every escort in the squadron)","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cOrk escorts may add +1 turret for +5 points per escort.\u201d","prose":1,"per":"hull","k":"up"}]},{"t":"ORK CLANZ","rules":[],"text":["Each has its own colours, markings, and ways of waging war."],"ents":[]},{"t":"USING ORK CLANZ","rules":[],"text":["The Ork Clanz rules can be used in addition to the normal Ork rules, but only with its dedicated Clanz fleet list."],"ents":[]},{"t":"MUSTERIN' DA CLANZ","rules":[],"text":["Orks live in tribes, individual armies each led by a Warlord.","Members of the same clan may well end up fighting one another if their tribes clash, though this doesn\u2019t really bother the Orks too much, who will cheerfully fight anyone they can.","Each clan has its own distinctive character and abilities, and an Ork will retain these no matter which tribe he belongs to."],"ents":[]},{"t":"CLAN UPGRADES","rules":[],"text":["A Warlord and his skwadrons may only be from one clan, but as many different clans as desired can be in a single fleet.","Any skwadron can be given a clan upgrade by paying the points cost shown, but the squadron must show clan colours.","In case players have any smart ideas about showing all the colours on their Ork ships for maximum flexibility, a skwadron only counts as showing clan colours if the majority of the ships in the skwadron have their clan colour covering more than half of the model.","The colours for each clan is shown after the points cost for the upgrade.","Additionally, being from a particular clan and being painted as such does not obligate the skwadron to take the benefits of being from a particular clan by paying the extra points for them, nor are Ork vessels limited to only these paint schemes.","Clan upgrades are different from Gubbins and may be taken (and paid for) in addition to Gubbins by individual skwadrons.","If taken, every capital ship in the skwadron must separately take and pay for the clan upgrade, not just individual ships.","This also means the enemy only gets additional victory points for the clan upgrade if the tiddla skwadron is wiped out.","The Warlord\u2019s ship may take one refit from the Imperial Navy refit table (rolled randomly) for +20 points.","A Blood Axe tiddla skwadron of at least six escorts may include up to three Imperial Navy and/or Chaos escorts from any fleet list at their listed cost.","These commandeered vessels must have an Orky colour scheme and kustom-job \u2013 you can\u2019t just borrow the ships from your Imperial or Chaos fleet!","Free/Brown The Snakebites are a primitive clan (even by Ork standards) and use technology only reluctantly.","Snakebite capital ship skwadrons can only use space hulks or roks \u2013 no other kind of capital ship skwadrons are permitted to bear the clan colours."],"ents":[]},{"t":"MOB RULE","rules":[],"text":["Note: the maximum number of escorts in an Ork squadron can be up to ten."],"ents":[]},{"t":"YOUNG GUNZ","rules":[],"text":["The free ship can be any Ork escort class in the fleet list costing equal to or less than that of the cheapest escort paid for in the skwadron (the skwadron cannot exceed ten escorts).","Young Gunz can be applied before Mob Rule: a tiddla skwadron with five escorts that rolls Ld 5 may have a sixth escort for free, increasing its Ld to 6!"],"ents":[]},{"t":"GUBBINS","rules":[],"text":["A warlord in particular gathers around himself a number of other cunning and successful leaders, each one an enterprising Mekboss or Nob in his own right.","Several warlords may band together to fight a common foe, and they will each of course bring the best of their wargear to the fight, as much to demonstrate their prowess to their fellow warlords as to bring the fight to the enemy.","A vessel or escort skwadron led by a Warlord may be given up to one of the following upgrades per Command re-roll the Warlord has.","Each upgrade can only be applied once.","Each Warlord that does so at least twice over the course of a campaign may have their first normally earned refit for free instead of paying the normal +10% cost.","This also means the enemy only gets additional victory points for the Gubbins if the tiddla skwadron is wiped out.","This cannot be combined with Maniac Turrets.","This cannot be combined with Extra Turrets.","The ship may re-roll the dice for the Strength of torpedo salvoes when it fires.","(Not for escorts.) The ship may re-roll the dice when repairing critical damage.","The ship may re-roll the dice for the firepower of its gunz when it fires."],"ents":[{"l":"Soopa Boostas","r":null,"p":25,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Extra Power Fields","r":null,"p":25,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Extra Turrets","r":null,"p":20,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Maniac Turrets","r":null,"p":10,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Looted Lances","r":null,"p":30,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Looted Torpedoes","r":null,"p":20,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Mad Meks","r":null,"p":25,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Maniac Gunners","r":null,"p":30,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Mega-Armoured Boarding Parties","r":null,"p":15,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Prow Ram","r":null,"p":10,"src_page":370,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Tellyporta","r":null,"p":30,"src_page":371,"a":1,"u":1,"mx":null,"nt":null,"k":"up"}]},{"t":"MORE GUBBINS","rules":[],"text":["More Gubbins are not available for escorts (except the Grunt where indicated) and can only be added to capital ships.","(Not for escorts except the Grunt at +5 points per escort.) Klaws are unaffected by special orders of any kind but cannot be used by capital ships if they are crippled.","Each roll of a 4+ inflicts one hit on the target, ignoring shields but not holofields.","Each ship with Klaws may only use it once per turn, regardless of how many vessels it contacts during the Ork player\u2019s movement phase, though it does not have to be the first ship in contact.","If the Klaws hit only once or not at all, the ship can continue moving after making the attack and shoot/launch ordnance later in the turn.","Neither vessel can move if they are of the same class or smaller (such as cruiser to cruiser), but a larger class vessel may still move but only at half rate.","Both ships may shoot at half effectiveness (nova cannon and similar special weapons cannot fire).","Either ship may conduct boarding actions as normal.","(Not for escorts.) A ship\u2019s prow heavy gunz batteries can be replaced with this weapon, which cannot be used if the ship is crippled or braced.","It is only effective against ships with shields down in the same manner as teleporters.","Each hit does not cause damage.","Instead, the next leadership check or special order made by the ship must be with an extra D6 (such as 3D6, or even more when already using 3D6, such as when All Ahead Full through an asteroid field)!","Additional \u201chits\u201d from this weapon only add to the number of hordes that must be eradicated before the ship can return to conducting leadership checks normally.","These can also each be repaired in the end phase normally when rolling to repair critical damage.","It takes boarding torpedoes for free, but it may only use assault boats.","It may launch +1 assault boat marker each time it launches attack craft normally (even if crippled or braced, but not both)."],"ents":[{"l":"Klaws","r":null,"p":10,"src_page":371,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Shokk-Attack Lance","r":null,"p":0,"src_page":371,"a":0,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Assault Karrier","r":null,"p":0,"src_page":371,"a":0,"u":1,"mx":null,"nt":null,"k":"up"}]},{"t":"FLEET UPGRADES","rules":[],"ents":[{"l":"Torpedo-bommas","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book states this in the shared fleet rules: \u201cTorpedo-bommas may be taken by any ship equipped with launch bays for +10 points per launch bay strength.\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"},{"l":"Boarding torpedoes","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book states this in the shared fleet rules: \u201cORDNANCE Boarding Torpedoes Any capital ship in the Ork fleet list armed with torpedoes can use boarding torpedoes for +5 points.\u201d","prose":1,"cond":{"cap":1,"has":"torpedo","nmno":"hulk"},"k":"up"},{"l":"Boarding torpedoes (Space Hulk)","r":null,"p":15,"a":1,"u":1,"mx":null,"nt":"The book states this in the shared fleet rules: \u201cA Space Hulk may use boarding torpedoes for +15 points.\u201d","prose":1,"cond":{"nm":"hulk"},"k":"up"}],"text":["Priced upgrades the book states in this faction's shared fleet rules rather than as list entries."]}]},{"nm":"Orks \u2014 Da Ork Clanz","pg":372,"secs":[{"t":"FLEET RULES (pg. 367\u2013371)","rules":[],"text":["SPACE HULKS You may include up to one Ork Space Hulk in your fleet per 1,500 points.","Ork hulk (pg 389).........................................600 pts An Ork fleet can include a maximum of one space hulk per 1,500 points.","So if the fleet is worth up to 1,500 points, it may include one Space hulk.","If it is worth 1,500-3,000 points, two space hulks may be included, etc.","Each Ork hulk must be assigned an Ork Warlord to command it.","For every two kroozers included in your fleet, you may pick one vessel from the list below.","270 pts Hammer class battlekroozer (pg 374)........245 pts KROOZERS You may include up to six kroozers in your fleet.","155 pts ESCORTS You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","Rok (pg 392)......................................................80 pts Ork Roks may also be purchased with points for planetary defences, in scenarios where these are used.","Ork Roks may be squadroned with up to three other Roks (total squadron size of four), but not with any other vessels.","DAKKA DAKKA Ork capital ships can add +2 turrets to their ships for +20 points (this is not the same thing as saying \u201cup to two turrets at +10 points each\u201d).","Ork escorts may add +1 turret for +5 points per escort.","If this option is taken, every escort in a given squadron must take the refit, not just individual escorts in a squadron.","Each has its own colours, markings, and ways of waging war.","USING ORK CLANZ The Ork Clanz rules can be used in addition to the normal Ork rules, but only with its dedicated Clanz fleet list.","MUSTERIN' DA CLANZ Orks live in tribes, individual armies each led by a Warlord.","Members of the same clan may well end up fighting one another if their tribes clash, though this doesn\u2019t really bother the Orks too much, who will cheerfully fight anyone they can.","Each clan has its own distinctive character and abilities, and an Ork will retain these no matter which tribe he belongs to.","CLAN UPGRADES A Warlord and his skwadrons may only be from one clan, but as many different clans as desired can be in a single fleet.","Any skwadron can be given a clan upgrade by paying the points cost shown, but the squadron must show clan colours.","In case players have any smart ideas about showing all the colours on their Ork ships for maximum flexibility, a skwadron only counts as showing clan colours if the majority of the ships in the skwadron have their clan colour covering more than half of the model.","The colours for each clan is shown after the points cost for the upgrade.","Additionally, being from a particular clan and being painted as such does not obligate the skwadron to take the benefits of being from a particular clan by paying the extra points for them, nor are Ork vessels limited to only these paint schemes.","Clan upgrades are different from Gubbins and may be taken (and paid for) in addition to Gubbins by individual skwadrons.","If taken, every capital ship in the skwadron must separately take and pay for the clan upgrade, not just individual ships.","This also means the enemy only gets additional victory points for the clan upgrade if the tiddla skwadron is wiped out.","The Warlord\u2019s ship may take one refit from the Imperial Navy refit table (rolled randomly) for +20 points.","A Blood Axe tiddla skwadron of at least six escorts may include up to three Imperial Navy and/or Chaos escorts from any fleet list at their listed cost.","These commandeered vessels must have an Orky colour scheme and kustom-job \u2013 you can\u2019t just borrow the ships from your Imperial or Chaos fleet!","Free/Brown The Snakebites are a primitive clan (even by Ork standards) and use technology only reluctantly.","Snakebite capital ship skwadrons can only use space hulks or roks \u2013 no other kind of capital ship skwadrons are permitted to bear the clan colours.","Note: the maximum number of escorts in an Ork squadron can be up to ten.","The free ship can be any Ork escort class in the fleet list costing equal to or less than that of the cheapest escort paid for in the skwadron (the skwadron cannot exceed ten escorts).","Young Gunz can be applied before Mob Rule: a tiddla skwadron with five escorts that rolls Ld 5 may have a sixth escort for free, increasing its Ld to 6!","A warlord in particular gathers around himself a number of other cunning and successful leaders, each one an enterprising Mekboss or Nob in his own right.","Several warlords may band together to fight a common foe, and they will each of course bring the best of their wargear to the fight, as much to demonstrate their prowess to their fellow warlords as to bring the fight to the enemy.","A vessel or escort skwadron led by a Warlord may be given up to one of the following upgrades per Command re-roll the Warlord has.","Each upgrade can only be applied once.","Each Warlord that does so at least twice over the course of a campaign may have their first normally earned refit for free instead of paying the normal +10% cost.","This also means the enemy only gets additional victory points for the Gubbins if the tiddla skwadron is wiped out.","This cannot be combined with Maniac Turrets.","This cannot be combined with Extra Turrets.","Looted Torpedoes................................+20 pts The ship may re-roll the dice for the Strength of torpedo salvoes when it fires.","Mad Meks.............................................+25 pts (Not for escorts.) The ship may re-roll the dice when repairing critical damage.","Maniac Gunners..................................+30 pts The ship may re-roll the dice for the firepower of its gunz when it fires.","More Gubbins are not available for escorts (except the Grunt where indicated) and can only be added to capital ships.","+10 pts (Not for escorts except the Grunt at +5 points per escort.) Klaws are unaffected by special orders of any kind but cannot be used by capital ships if they are crippled.","Each roll of a 4+ inflicts one hit on the target, ignoring shields but not holofields.","Each ship with Klaws may only use it once per turn, regardless of how many vessels it contacts during the Ork player\u2019s movement phase, though it does not have to be the first ship in contact.","If the Klaws hit only once or not at all, the ship can continue moving after making the attack and shoot/launch ordnance later in the turn.","Neither vessel can move if they are of the same class or smaller (such as cruiser to cruiser), but a larger class vessel may still move but only at half rate.","Both ships may shoot at half effectiveness (nova cannon and similar special weapons cannot fire).","Either ship may conduct boarding actions as normal.","Shokk-Attack Lance..................................Free (Not for escorts.) A ship\u2019s prow heavy gunz batteries can be replaced with this weapon, which cannot be used if the ship is crippled or braced.","It is only effective against ships with shields down in the same manner as teleporters.","Each hit does not cause damage.","Instead, the next leadership check or special order made by the ship must be with an extra D6 (such as 3D6, or even more when already using 3D6, such as when All Ahead Full through an asteroid field)!","Additional \u201chits\u201d from this weapon only add to the number of hordes that must be eradicated before the ship can return to conducting leadership checks normally.","These can also each be repaired in the end phase normally when rolling to repair critical damage.","It takes boarding torpedoes for free, but it may only use assault boats.","It may launch +1 assault boat marker each time it launches attack craft normally (even if crippled or braced, but not both)."],"ents":[]},{"t":"WARLORD","rules":[{"kind":"per_points","each":1,"what":"warlord","per":500,"src":"Ork fleets always include one Warlord for every 500 points, or part, that the fleet is worth \u2013 no more, no less.","ok":true,"sec":[1]}],"text":["A Warlord adds +2 to one boarding dice roll per game.","A Warlord has one re-roll, and may purchase one or two more for the points cost shown below.","A Warlord may choose for his own ship or escort skwadron one upgrade from the Gubbins list for every re-roll he has at its listed cost.","He must be embarked on the most expensive ship under his own command (as opposed to the whole fleet), even if it is an escort - annotate which one it is.","A Warlord\u2019s re-rolls only count for the skwadrons under his command and not for the whole fleet."],"ents":[{"l":"Ork Warlord","r":null,"p":0,"src_page":372,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":20,"src_page":372,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Two extra re-rolls","r":null,"p":40,"src_page":372,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]}]},{"t":"SKWADRONS","rules":[],"text":["For every re-roll a Warlord has (including the first one for free), the Warlord must be in command of one tiddla skwadron of at least three escorts and one other skwadrons.","He may also swap leadership with any one ship or escort squadron under his command."],"ents":[]},{"t":"\u2018Uge ship skwadron","rules":[],"text":[],"ents":[{"l":"Gorbag\u2019s Revenge","r":377,"p":310,"src_page":372,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Slamblasta","r":378,"p":295,"src_page":372,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Dethdeala","r":376,"p":275,"src_page":372,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Kroolboy","r":379,"p":270,"src_page":372,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Hammer class battlekroozer","r":374,"p":245,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Big ship skwadron","rules":[],"text":["1-2 Kroozers, chosen from the following list:."],"ents":[{"l":"Zukov's Klaw (Goff only)","r":381,"p":310,"src_page":372,"a":0,"mx":1,"nt":"Source page reference is wrong: the book prints pg. 377, but Zukov'S Klaw Assault Kroozer is on pg. 381. Corrected by name.","k":"unit"},{"l":"Terror ship","r":380,"p":185,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Kill kroozer","r":382,"p":155,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Lite kroozer","r":383,"p":90,"src_page":372,"a":0,"mx":null,"nt":"Source page reference is wrong: the book prints pg. 380, but Lite Kroozer is on pg. 383. Corrected by name.","k":"unit"}]},{"t":"Tiddla skwadron","rules":[],"text":["3-10 Escorts, chosen from the following list in any mix desired:."],"ents":[{"l":"Ravager attack ship","r":386,"p":40,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Onslaught attack ship","r":384,"p":35,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Grunt assault ship","r":388,"p":30,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Savage gunship","r":385,"p":30,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Brute ramship","r":387,"p":25,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Roks","rules":[{"kind":"section_count","min":1,"max":4,"src":"1\u20134 Roks","sec":[6],"ok":true,"hdr":1}],"text":[],"ents":[{"l":"Rok","r":392,"p":80,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Space Hulks","rules":[],"text":["An Ork fleet with at least three Warlords may include one Space Hulk.","One of your Warlords must be embarked on it, which by itself counts as all the skwadrons that Warlord can have (including a tiddla skwadron), regardless of how many re-rolls the Warlord has.","Upgrades that increase its boarding value or speed may not be taken."],"ents":[{"l":"Ork hulk","r":389,"p":600,"src_page":372,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["They may take torpedo- bommas for +10 points per launch bay (counting maximum number of launch bays).","Ork capital ships that use torpedoes may use boarding torpedoes for +5 points."],"ents":[{"l":"Torpedo bombers","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book prints this only in the section text: \u201cThey may take torpedo- bommas for +10 points per launch bay (counting maximum number of launch bays).\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"},{"l":"Boarding torpedoes","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cOrk capital ships that use torpedoes may use boarding torpedoes for +5 points.\u201d","prose":1,"k":"up"}]},{"t":"USING SKWADRONS","rules":[],"text":["There is no restriction for what kinds or how many of what type of skwadrons are in the fleet as long as no Warlord may have more than one \u2018Uge Ship, which counts as a skwadron by itself.","Each skwadron must be fielded with the number of ships chosen for it in this list; you can\u2019t split up skwadrons or add more ships to them.","However, no more than one of each of the named Ork battleships may be in the fleet, no more than one \u2018Uge ship may be taken in the fleet for every two kroozers, and a Space Hulk may only be taken by a fleet of no less than 1500 points.","While there must be at least one Warlord for every 500 points in the fleet or portion thereof, not all Warlords are created equal!","Thus, the smallest fleet a single Warlord with only the one free re-roll may command is two tiddla skwadrons, each with three escorts.","The largest fleet a single Warlord with two extra re-rolls (for a total of three) can command is one \u2018Uge ship, two skwadrons of two kroozers each and three skwadrons of up to ten escorts each.","While the number of Warlords for a given fleet size cannot be altered, how many points each Warlord is put in charge of can be mixed and matched in any way desired; it is perfectly legal for a Warlord with one re-roll to have one or two kroozers and a tiddla squadron of three escorts, or just a single Rok as a skwadron (if desired) and a tiddla squadron of nine escorts, etc.","A Warlord must have two kroozers in order to take a \u201cUge ship, meaning the Warlord must have at least one extra re-roll to do so.","A Warlord leading a Space Hulk may only lead it and no other ships, but he is not required to take any extra re-rolls to do so if it is not desired.","This is essentially \u201cyou\u201d and must be on the most expensive ship in the fleet, even if it is a Space Hulk.","The fleet commander still starts with one re-roll and may purchase up to one more at the start of the campaign, earning more (along with more skwadrons) over the course of the campaign.","This means the fleet commander personally starts with no more than one tiddla squadron of up to ten escorts and one other skwadron (or two each if a second re- roll is purchased at the start of the campaign), which may be taken in any manner desired.","Fleet commander re-rolls can only be used by his or her own skwadrons.","The fleet commander cannot earn more re-rolls than would be allowed by p.153 of the Rulebook, even if a second re-roll was purchased at the start of the campaign."],"ents":[]},{"t":"FLEET UPGRADES","rules":[],"ents":[{"l":"Torpedo-bommas","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book states this in the shared fleet rules: \u201cTorpedo-bommas may be taken by any ship equipped with launch bays for +10 points per launch bay strength.\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"},{"l":"Boarding torpedoes (Space Hulk)","r":null,"p":15,"a":1,"u":1,"mx":null,"nt":"The book states this in the shared fleet rules: \u201cA Space Hulk may use boarding torpedoes for +15 points.\u201d","prose":1,"cond":{"nm":"hulk"},"k":"up"}],"text":["Priced upgrades the book states in this faction's shared fleet rules rather than as list entries."]},{"t":"GUBBINS","rules":[],"ents":[{"l":"Soopa Boostas","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Extra Power Fields","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Extra Turrets","r":null,"p":20,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Maniac Turrets","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Looted Lances","r":null,"p":30,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Looted Torpedoes","r":null,"p":20,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Mad Meks","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Maniac Gunners","r":null,"p":30,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Mega-Armoured Boarding Parties","r":null,"p":15,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Prow Ram","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Tellyporta","r":null,"p":30,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"},{"l":"Klaws","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once.","prose":1,"k":"up"}],"text":["Gubbin, Fleets pg. 367-371. A vessel or skwadron led by a Warlord may take one Gubbin per Command re-roll the Warlord has, and each Gubbin only once."]},{"t":"CLAN UPGRADES","rules":[],"ents":[{"l":"Clan: Goffs (Black)","r":null,"p":20,"a":1,"u":1,"mx":null,"prose":1,"nt":"Clan upgrade, Fleets pg. 367\u2013371. Every capital ship in the skwadron pays separately; for tiddla skwadrons the cost is for the whole skwadron. The skwadron must show clan colours.","k":"up","grp":"clan"},{"l":"Clan: Evil Sunz (Red)","r":null,"p":20,"a":1,"u":1,"mx":null,"prose":1,"nt":"Clan upgrade, Fleets pg. 367\u2013371. Every capital ship in the skwadron pays separately; for tiddla skwadrons the cost is for the whole skwadron. The skwadron must show clan colours.","k":"up","grp":"clan"},{"l":"Clan: Bad Moonz (Yellow)","r":null,"p":30,"a":1,"u":1,"mx":null,"prose":1,"nt":"Clan upgrade, Fleets pg. 367\u2013371. Every capital ship in the skwadron pays separately; for tiddla skwadrons the cost is for the whole skwadron. The skwadron must show clan colours.","k":"up","grp":"clan"},{"l":"Clan: Deathskullz (Blue)","r":null,"p":30,"a":1,"u":1,"mx":null,"prose":1,"nt":"Clan upgrade, Fleets pg. 367\u2013371. Every capital ship in the skwadron pays separately; for tiddla skwadrons the cost is for the whole skwadron. The skwadron must show clan colours.","k":"up","grp":"clan"},{"l":"Clan: Blood Axes (Green)","r":null,"p":0,"a":1,"u":1,"mx":null,"prose":1,"nt":"Clan upgrade, Fleets pg. 367\u2013371. Every capital ship in the skwadron pays separately; for tiddla skwadrons the cost is for the whole skwadron. The skwadron must show clan colours.","k":"up","grp":"clan"},{"l":"Clan: Snakebites (Brown)","r":null,"p":0,"a":1,"u":1,"mx":null,"prose":1,"nt":"Clan upgrade, Fleets pg. 367\u2013371. Every capital ship in the skwadron pays separately; for tiddla skwadrons the cost is for the whole skwadron. The skwadron must show clan colours.","k":"up","grp":"clan"}],"text":["A Warlord and his skwadrons may only be from one clan, but as many different clans as desired can be in a single fleet. Clan upgrades are separate from Gubbins and may be taken in addition to them."]}]},{"nm":"Necrons \u2014 Harvest Fleet","pg":404,"secs":[{"t":"FLEET RULES (pg. 398\u2013403)","rules":[],"text":["Sepulchre Only utilised by the largest Necron vessel in a fleet, a ship carrying a Sepulchre automatically gains a Leadership of 10.","Also the ship may not use any special orders until after the end of their next turn.","A Necron ship may only unleash its Sepulchre when the ship is not on any special orders or crippled.","Each pulse generator gets one roll to hit against each ship or piece of ordnance in range.","This is an area effect that cannot be saved against by holofields or anything similar.","A star pulse cannot be generated while the vessel is using any special order or crippled as it requires precise control.","Each portal confers an additional hit and run attack to the Necron vessel.","These have a range of 10cm and, as normal, can only be made against ships whose shields are down.","The usual restriction that teleport attacks can only be made against ships with less remaining Hull Points is waived, with the exception that Necron Raider class vessels do not carry enough Warriors to board anything with more than 6 Hull Points remaining.","A Necron capital ship both crippled and Braced may not make Portal attacks.","CRITICAL HITS TABLE 2D6 Roll Extra Damage Result +0 Power Flow Disrupted: May not fire lightning arc or particle whip in its port arc until it has been repaired.","+0 Power Flow Disrupted: May not fire lightning arc or particle whip in its starboard arc until it has been repaired.","+0 Power Flow Disrupted: May not fire lightning arc in any arc until it has been repaired.","+0 Power Flow Disrupted: May not fire lightning arc or particle whip in any arc until it has been repaired.","+0 Drive Damaged: May not change facing until repaired.","+0 Inertialess Drive Damaged: May not use All Ahead Full special orders until repaired.","All Necron ships are Armour 6, representing the difficulty of targeting them, and in addition receive a special save against each hit to represent the hull\u2019s adaptive qualities.","The drive is fired whenever All Ahead Full orders are issued; instead of obeying the normal rules for this order the ship gains D6 \u00d7 10 cm additional movement and can make a turn for every 20 cm it travels.","At the end of its Movement phase any Necron ship may perform a 'fade out' disengage automatically.","At the end of a game, including normal Victory points, count up the Necron losses using the following modifiers: \u2022 Any capital ship that disengages with no damage whatsoever counts as 10% destroyed.","\u2022 Any capital ship that disengages with any damage at all or any raider that disengages counts as 25 % destroyed.","\u2022 Any capital ship that is crippled counts as 50 % destroyed.","\u2022 Any capital ship that is destroyed but not left as a drifting hulk counts as 200 % destroyed.","\u2022 Any capital ship that is destroyed and left as a drifting hulk counts as 300 % destroyed.","Necron vessels may ignore the rule preventing them from firing upon or boarding friendly drifting/blazing hulks.","NECRON IN CAMPAIGNS Necron repair points Due to the advanced nature of Necron technology all Necron ships must expend double the normal amount of repair points to repair hits and buy new ships when playing in a campaign.","Refits Necrons do not have access to any refits or crew skills in the course of a campaign, but the fleet as a whole may earn additional repair points in the same manner other fleet\u2019s ships earn refits or crew skills.","Two more enemy vessels appeared, each a flat crescent shaped disk, glowing with a strange light against the blackness of space."],"ents":[]},{"t":"MIND OF THE MACHINE","rules":[],"text":["Necron fleets, just like their armies, are composed of a horrifying array of unthinking machines intent only on fulfilling their C\u2019tan master\u2019s ancient plans of conquest."],"ents":[]},{"t":"Leadership","rules":[],"text":[],"ents":[]},{"t":"Re-rolls","rules":[],"text":["A Necron fleet may purchase re-rolls, but they are purchased by the fleet as a whole, rather than being considered Fleet Commander re-rolls."],"ents":[{"l":"One extra re-roll","r":null,"p":25,"src_page":404,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr"},{"l":"Two extra re-rolls","r":null,"p":75,"src_page":404,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr"}]},{"t":"Tombships","rules":[],"text":["Your fleet may include up to one tombship for every Scythe class harvest ship it contains.","A single tombship may be upgraded to carry a Sepulchre."],"ents":[{"l":"Cairn class tombship","r":405,"p":500,"src_page":404,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Sepulchre","r":null,"p":50,"src_page":404,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[4,0]]}]},{"t":"Cruisers","rules":[],"text":["Your fleet may include up to six Scythe class harvest ships and up to three Shroud class light cruisers."],"ents":[{"l":"0-6 Scythe class harvest ship","r":406,"p":275,"src_page":404,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"0-3 Shroud class light cruiser","r":407,"p":155,"src_page":404,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Raiders","rules":[{"kind":"squadron","min":2,"max":6,"src":"Your fleet may include up to twelve Jackal class raiders, and up to twelve Dirge class raiders, in squadrons of 2\u20136.","ok":true,"sec":[6]}],"text":[],"ents":[{"l":"0-12 Jackal class raiders","r":408,"p":50,"src_page":404,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"0-12 Dirge class raiders","r":409,"p":40,"src_page":404,"a":0,"mx":null,"nt":null,"k":"unit"}]}]},{"nm":"Tyranids \u2014 Vanguard Fleet","pg":429,"secs":[{"t":"FLEET RULES (pg. 423\u2013428)","rules":[],"text":["The ship\u2019s spore cysts may not be used until they have been repaired.","The ship\u2019s starboard armament may not be used again until it has been repaired.","The ship\u2019s port armament may not be used until it has been repaired.","Its prow armament may not be used until it has been repaired.","The ship may not use its thorax weapons until the damage is repaired.","The bio-ship may not turn until the damage is repaired.","The bio-ship cannot have its instinctual orders overridden by the Hive Mind until the damage is repaired.","The bio- ship may no longer use its spore cysts.","This damage cannot be repaired.","The wreck moves 4D6 cm forward in each of its subsequent movement phases.","Place a blast marker in contact with the corpse\u2019s base after each move.","The wreck moves 4D6 cm forward in each of its subsequent Movement phases.","ORDNANCE Some Tyranid ships may have launch bays or torpedo batteries.","Tyranids may only launch boarding torpedoes, fighters and assault boats, or rather their biological equivalents in the form of giant hull-boring worms, ether-swimming brood carriers, protazoid enzymes, ravening limpet mines and the like.","For reference, the ordnance speeds are as follows: ATTACK CRAFT SPEED Fighters 20 cm Assaults Boats 15 cm Boarding Torpedoes 15 cm Tyranid attack craft consist only of fighters and assault boats.","As they cannot have bombers, they obviously cannot have torpedo bombers.","As such, they may have up to twice the number of attack craft markers in play as they have available launch bays.","However, if a bio-ship becomes crippled its generative capacities will be turned completely to self preservation and it may no longer launch ordnance (note that spore clouds will still be produced as noted above).","It may also be given some \u2018fixed\u2019 weapons (including the number of spores it can launch).","Each ship is limited as to how many weapon choices it may have on a given location, but where more than one weapon is permitted you may select multiples of the same weapon (eg a Tyranid hive ship which can have up to three port/starboard weapons could pick three sets of launch bays if you wish).","Instead they use the tables presented here.","If a critical hit is rolled which cannot be applied, for example a ship with no prow weapons gets a Prow Armament wounded critical, apply the next highest critical instead.","Individual organisms adapt and refine themselves with each new encounter, while the hive ships perpetually alter the morphology of the new organisms birthed by the fleet.","They may gain refits in the course of a campaign.","These refits can only be used in one-off games if both players agree.","During a campaign, no one ship can gain more than one different kind of special refit before each battle.","With the exception of reinforced carapace and extra spore cysts, no single bio-enhancement may be granted more than once.","No hive ship may ever have more than three different special refits, no cruiser more than two and no escort more than one.","Example: A Hive ship can have four reinforced carapaces, two extra spore cysts and one other refit, resulting in no more than three different refits.","These improvements represent the only means of evolving against increasingly capable foes, for Tyranids operate under Instinctive Behaviour or under direction of the Hive Mind, and thus they cannot take on any crew skills, even in the course of a campaign.","Because the equivalent of Tyranid torpedoes are always boarding torpedoes, Tyranids cannot use the torpedo refits available to other races.","6: Extra Spore Cysts.....................+10 pts each The ship gains one spore cyst.","No more than two spore cysts can be gained in this manner.","As Tyranid Kraken do not have spores, they cannot evolve the ability to use spores and thus cannot take this refit.","7: Reinforced Carapace...............+10 pts each The creature has grown to an inordinate size with correspondingly reinforced internal endostructures and additional ablative carapace, increasing its total mass and capacity to sustain damage.","No more than four additional Hits may be gained in this manner for Hive ships, and no more than three for cruisers.","Keep in mind that if the fleet does not desire or by restrictions cannot have another hiveship, then the fourth reinforced carapace refit cannot be taken by a Tyranid cruiser.","Bombers and assault boats suffer a -1 modifier (in addition to any other modifiers) when rolling their Attack roll, and all torpedoes must roll +1 to hit (maximum of 6+).","Each launch bay can launch one mega-spore mine In the Ordnance phase Mega-spore mines follow all movement and ordnance rules mines do on [???] of the Remastered Rulebook, but when rolling against armour to inflict hits, it inflicts that number of fire criticals instead.","SCENARIO NOTES CRUISER CLASH Tyranids can use one hive ship and three cruisers instead of the four cruisers.","If this option is used, refits or escorts cannot be taken, and the hive ship cannot be higher than Ld 8.","Tyranid hive fleets don\u2019t add extra transport ships but instead score 1 Assault Point for each spore cyst on ships which get within 30 cm of the planet\u2019s surface.","Each Strength point of torpedoes and each assault boats marker which reaches the surface also scores one Assault Point.","EXTERMINATUS Tyranids will never be the attacking forces in an exterminatus scenario \u2013 substitute Planetary Assault instead if randomly generated."],"ents":[]},{"t":"Intro","rules":[],"text":[],"ents":[]},{"t":"VANGUARD DRONE SHIPS","rules":[],"text":["Your fleet may include any number of Vanguard drone ships.","A Vanguard drone ship must be armed with one weapon chosen from the following list:"],"ents":[{"l":"Vanguard drone ship","r":436,"p":20,"src_page":429,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Pyro-acid battery","r":null,"p":5,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]},{"l":"Feeder tentacles","r":null,"p":5,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]}]},{"t":"KRAKEN","rules":[],"text":["Your fleet may include any number of Kraken.","A Kraken must be armed with one weapon chosen from the following list:"],"ents":[{"l":"Kraken","r":435,"p":25,"src_page":429,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Pyro-acid battery","r":null,"p":15,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[3,0]]},{"l":"Feeder tentacles","r":null,"p":5,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[3,0]]},{"l":"Massive claws","r":null,"p":10,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[3,0]]},{"l":"Bio-plasma discharge","r":null,"p":10,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[3,0]]},{"l":"Torpedoes","r":null,"p":15,"src_page":429,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[3,0]]}]},{"t":"SQUADRONS","rules":[],"text":["Vanguard drone ships and Kraken may be deployed in squadrons of 6 to 12 models.","You may combine the two types in a single squadron if you wish."],"ents":[]},{"t":"LEADERSHIP","rules":[],"text":["Vanguard fleets contain no hive ships and instead are acting on a heightened form of instinct, moving ahead of the main fleet in order to scout out new worlds ripe for conquest.","Escort n more than once. In one-off games both players must agree.","prose":1,"k":"up"},{"l":"Tenacity","r":null,"p":20,"a":1,"u":1,"mx":null,"nt":"Bio-enhancement, Fleets pg. 429-431. A hive ship may have at most three different refits, a cruiser two and an escort one; only Reinforced Carapace and Extra Spore Cysts may be taken more than once. In one-off games both players must agree.","prose":1,"k":"up"},{"l":"Mega-Spore Mines","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Bio-enhancement, Fleets pg. 429-431. A hive ship may have at most three different refits, a cruiser two and an escort one; only Reinforced Carapace and Extra Spore Cysts may be taken more than once. In one-off games both players must agree.","prose":1,"k":"up"}],"text":["Bio-enhancement, Fleets pg. 429-431. A hive ship may have at most three different refits, a cruiser two and an escort one; only Reinforced Carapace and Extra Spore Cysts may be taken more than once. In one-off games both players must agree."]}]},{"nm":"Tau \u2014 Merchant Fleet","pg":454,"secs":[{"t":"FLEET RULES (pg. 448\u2013453)","rules":[],"text":["TELEPORT ATTACKS Tau ships may not conduct teleport hit and run attacks.","However, gravitic hooks have no effect in game terms \u2013 ships do not start a game attached to their parent ship, and can never be docked during a game.","If fired at from the front the deflector augments the passive armour which counts as armour 6.","Deflectors are NOT shields and do not count as such for the purpose of boarding, blast markers or other effects which apply to shields.","Any Tau vessel within 10 cm of a ship with tracking systems may re-roll misses when using turrets, and ignores the column shift when firing batteries at ranges above 30 cm.","A Note on Tau Weapon Configurations Tau rail gun and lance batteries are extremely sophisticated with advanced targeting systems that allow several individual weapons to engage each designated target regardless of their relative positions on the Tau ship.","Where individual turrets and batteries may be relatively weak, combining firezones in this manner make Tau railguns and ion cannons fearsome prospects, especially in forward firing arc, where turrets from all over the vessel can combine against a single enemy vessel or squadron.","ATTACK CRAFT SPEED Barracuda Superiority Fighter 25 cm Manta Missile Destroyer 20 cm Mantas Mantas are bombers, each marker represents a single vessel.","They are well shielded and count as resilient attack craft in all regards with a 4+ save against enemy fighters once per Ordnance Phase.","ORDNANCE SPEED Tau Missiles 20\u201340 cm Tau missiles are drone-guided and are fired in salvoes, each point of torpedo strength represents about 10 actual missiles.","Tau missiles are able to alter both their speed and course throughout flight, so may move at any speed between 20 cm and 40 cm (ie must move at least 20 cm, cannot move more than 40 cm) each ordnance phase.","Each ordnance phase the missiles may change course by 45 degrees at the start of their movement.","However, you must roll a dice for each point of torpedo strength in the salvo at the start of each ordnance phase, after the one they were launched.","The Tau may spend their points allocation for planetary defences on orbitals.","The Tau may not use any other form of planetary defence.","Ships not able to take a particular refit rolled randomly may re-roll the result.","They do not have access to the special torpedo refit table listed on pg 19, though they may use Torpedo Bombers and Orbital Mines as listed on pgs.","ALLIES, SUBJECTS & MERCENARIES Tau fleets may include allies, subjects and mercenaries, selected from the fleet lists as normal.","Moreover, his tactical genius did not go unnoticed, and it was only a matter of time before he was selected to command a starship, first as command pilot of a Kass\u2019l gunship, then later of the first ship to carry his name, the T\u2019olku Il\u2019fannor M\u2019poth Vash\u2019eldi.","Excellent Pilots His love of flight has never diminished, and he continues to fly a fighter out of his own hangar bays, true to his name Y\u2019eldi."],"ents":[]},{"t":"Commander","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Commander","sec":[1],"ok":true,"hdr":1}],"text":["Your fleet may include a fleet commander to lead it if you wish.","Your fleet must include a commander if it is greater than 750 pts.","the commander may be either a Kor\u2019O or Kor\u2019el.","If you wish, the commander\u2019s ship may carry a member of the Ethereal caste and therefore purchase additional re-rolls at the cost shown."],"ents":[{"l":"Tau Kor'el (Ld 8)","r":null,"p":50,"src_page":454,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Tau Kor\u2019O (Ld 9)","r":null,"p":80,"src_page":454,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Aun\u2019el (one extra re-roll)","r":null,"p":25,"src_page":454,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1]]},{"l":"Aun\u2019O (two extra re-rolls)","r":null,"p":75,"src_page":454,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1]]}]},{"t":"Battleships","rules":[],"text":["Your fleet may include any number of battleships.","If your fleets is worth more than 750 pts it must include at least one Explorer."],"ents":[{"l":"Explorer class starship \u2014 Vash\u2019ya Mk XXIII configuration","r":458,"p":230,"src_page":454,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Explorer class starship \u2014 Bor\u2019kan Mk XXIV configuration","r":"458b","p":230,"src_page":454,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Cruisers","rules":[],"text":["Your fleet may include any number of Merchant class starships.","It may also include up to one Hero class starship for every Merchant or Explorer in the fleet."],"ents":[{"l":"Hero class starship \u2014 Vash\u2019ya configuration","r":460,"p":180,"src_page":454,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Hero class starship \u2014 T\u2019olku configuration","r":"460b","p":180,"src_p ,"r":490,"p":185,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Nicassar Vessels","rules":[],"text":["Your fleet may include Nicassar Dhows in place of some or all of its Orcas.","You may not have more Dhows (or Orcas) than the gravitic hook capacity of the fleet.","A ship may have either Orcas or Dhows, but not both so the gravitic hook capacity of the fleet is divided between Orcas and Dhows.","Gravitic hooks on a Custodian battleship or Emissary starship cannot count toward this total.","The Dhows from each parent ship fight as a squadron with the same Leadership as the parent, but may be squadroned with other Dhows from vessels squadroned with their own parent vessel.","If the parent ships are squadroned together, their Dhows may be likewise.","However, the normal squadron limit of six still applies, so you may find it necessary to have more than one Dhow squadron associated with a capital ship squadron.","Dhows may not be squadroned with any other form of escort."],"ents":[{"l":"Nicassar Caravan","r":492,"p":200,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Nicassar Rig","r":493,"p":40,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Nicassar Dhow","r":491,"p":45,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Rogue Traders","rules":[],"text":["Up to one Rogue Trader cruiser and its attendant escorts may accompany the fleet for every 750 points of Tau ships in the fleet.","Additionally, a single squadron of up to six Xenos escorts can be taken as per the Rogue Trader rules and fleet list."],"ents":[{"l":"Rogue Trader Cruiser","r":180,"p":185,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Dauntless Class Light Cruiser","r":77,"p":125,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Endeavour Class Light Cruiser","r":181,"p":110,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Xenos Vessel","r":184,"p":50,"src_page":457,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Xenos Vessel - Pthu
