 equipped with an Honour Guard for +10 points per ship.\u201d","prose":1,"k":"up"}]},{"t":"ATTACK RATING","rules":[],"text":[],"ents":[]},{"t":"RESERVES AND ALLIES","rules":[],"text":[],"ents":[]},{"t":"SCENARIOS","rules":[],"text":["Like the rules for a Ramilies Star Fortress, the fortress-monastery should only be used as a defence or in some scenarios substituting for the planet itself."],"ents":[]}]},{"nm":"Space Marines \u2014 Dominion","pg":100,"secs":[{"t":"FLEET RULES (pg. 99\u201399)","rules":[],"text":["CAPITAL SHIPS 0-3 Battle Barges You may include one Space Marine battle barge for every 1,000 points or part thereof in your fleet.","The fleet must be worth at least 1,000 points to include a single Venerable battle barge (counting as one of the three allowed), chosen from any available Imperial or Chaos battleship, grand cruiser, battlecruiser or heavy cruiser at the listed cost, plus an additional +35 points for its Space Marine crew.","145 pts ESCORTS You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","Any battle barge or strike cruiser in the fleet may be equipped with an Honour Guard for +10 points per ship.","Like the rules for a Ramilies Star Fortress, the fortress-monastery should only be used as a defence or in some scenarios substituting for the planet itself."],"ents":[]},{"t":"Master of the Fleet","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Master of the Fleet","sec":[1],"ok":true,"hdr":1}],"text":["You may include 1 Master of the Fleet.","If your fleet includes any battle barges, he must be assigned to a battle barge.","If a Venerable battle barge is included in the fleet, the Master of the Fleet must be assigned to it.","If the fleet is worth over 750 points, a Master of the Fleet must be included to lead it.","You may buy Fleet Commander re-rolls for your Master of the Fleet.","In addition, the Master of the Fleet\u2019s ship may carry a Terminator boarding party:"],"ents":[{"l":"Master of the Fleet (Ld 10)","r":null,"p":50,"src_page":100,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":25,"src_page":100,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Two re-rolls","r":null,"p":50,"src_page":100,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Three re-rolls","r":null,"p":75,"src_page":100,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Terminator boarding party","r":null,"p":50,"src_page":100,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]}]},{"t":"Space Marine Captains","rules":[],"text":["Aside from the Space Marine vessels themselves, certain important Imperial Navy vessels within a Dominion Fleet may well have Space Marine commanders assigned to them.","Any Imperial Navy battleship, grand cruiser or battlecruiser may have a Space Marine Captain assigned to it.","Space Marine Captains roll against the Space Marines leadership table instead of the normal leadership table.","In addition, a ship led by a Space Marine Captain may carry Honour Guard."],"ents":[{"l":"Space Marine Captain","r":null,"p":25,"src_page":100,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Honour Guard","r":null,"p":10,"src_page":100,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[2,0]]}]},{"t":"SPACE MARINE DOMINION FLEETS","rules":[],"text":["The Master of each Space Marine Chapter is its leader and spiritual head.","As some Chapters rule entire planets or even sub-sectors of space, a Chapter Master may well act as the head of government as well, effectively as the Imperial Commander of a whole planet or system."],"ents":[]},{"t":"Battle Barges","rules":[{"kind":"section_count","min":0,"max":3,"src":"0-3 Battle Barges","sec":[4],"ok":true,"hdr":1}],"text":["You may include one Space Marine battle barge for every 1,000 points or part thereof in your fleet.","The fleet must be worth at least 1,000 points to include a single Venerable battle barge (counting as one of the three allowed), chosen from any available Imperial or Chaos battleship, grand cruiser, battlecruiser or heavy cruiser at the listed cost, plus an additional +35 points for its Space Marine crew."],"ents":[{"l":"Venerable battle barge","r":103,"p":null,"src_page":101,"a":0,"mx":1,"nt":"Source page reference is wrong: the book prints pg. 102, but Seditio Opprimere, Venerable Battle Barge is on pg. 103. Corrected by name.","k":"unit"},{"l":"Battle barge","r":104,"p":425,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Cruisers","rules":[{"kind":"section_count","min":0,"max":10,"src":"0-10 Cruisers","sec":[5],"ok":true,"hdr":1}],"text":[],"ents":[{"l":"Strike cruiser","r":105,"p":145,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[6]}],"text":[],"ents":[{"l":"Nova class Frigate","r":107,"p":50,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gladius class Frigate","r":108,"p":45,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Hunter class Destroyer","r":109,"p":40,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Firestorm)","r":79,"p":45,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Falchion)","r":80,"p":40,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Sword)","r":82,"p":40,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Cobra)","r":84,"p":35,"src_page":101,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["Imperial Navy, Adeptus Mechanicus and Rogue Trader vessels are equipped with their own standard ordnance (even if they have Space Marine Captains) and cannot be given any form of Space Marine upgrade."],"ents":[]},{"t":"ATTACK RATING","rules":[],"text":[],"ents":[]},{"t":"RESERVES AND ALLIES","rules":[],"text":["For purposes of choosing reserves, battle barges count as battleships, and strike cruisers count as cruisers for the selection of any cruiser (battlecruiser, etc.) type.","When reserves are taken in this manner, the fleet can have up to twelve cruisers.","However, in the course of a campaign, a Dominion Fleet cannot take reinforcements from the Space Marines table listed on [???] of the Battlefleet Gothic rulebook."],"ents":[]},{"t":"VENERABLE BATTLE BARGE","rules":[],"text":["The Space Wolves, a traditionally minded Chapter, is more immersed in the customs of its homeworld of Fenris than most Chapters and has access to only the most rudimentary of shipyards, and they are perhaps the best known example of this, relying as they do on an Emperor class battleship to fulfil the role of battle barge."],"ents":[]},{"t":"Choosing a Battle Barge","rules":[],"text":["In addition to their fleet list, any Space Marine fleet may include a single \u2013 meaning only one!","\u2013 Venerable battle barge, which may be any Imperial or Chaos (painted appropriately of course!) battleship, grand cruiser, battlecruiser or heavy cruiser (with the exception of any of the unique vessels like the Terminus Est).","The normal cost must be paid for the ship, plus an additional +35 points for the cost of the Space Marine crew.","A Venerable battle barge benefits from all the Space Marine special rules, but since it is already heavily reconfigured to make it into a battle barge, it may not be given any of the optional refits or upgrades listed in its profile \u2013 it must be used exactly as is, in its basic form.","For example, a Mars battlecruiser taken as a Venerable battle barge may not be given a salvaged targeting matrix and can only earn such a refit in the course of a campaign normally.","The only exceptions to this are the special refits that the Space Marines themselves make to their battle barges, as follows:"],"ents":[]},{"t":"Launch Bays and Thunderhawks","rules":[],"text":["For example, an Imperial Mars battlecruiser with two launch bays each side is reduced to one each side, and a Chaos Styx heavy cruiser with three launch bays on each side is reduced to two each side.","The launch bays are configured to carry Thunderhawks following the rules detailed beforehand and on [???] of Armada, and they cannot be used to launch any other form of attack craft.","A Venerable battle barge not equipped with launch bays cannot take Thunderhawks."],"ents":[]},{"t":"Prow Weapons and Boarding Torpedoes","rules":[],"text":["Any Venerable battle barge equipped with a prow weapon (regardless of what it is) may, if desired, replace it with strength-6 torpedo tubes (speed: 30 cm) for no change in cost.","As with all Space Marine vessels, these tubes may also be used to launch boarding torpedoes."],"ents":[]},{"t":"FLEET LISTS","rules":[],"text":[],"ents":[]}]},{"nm":"Adeptus Mechanicus \u2014 Explorator","pg":124,"secs":[{"t":"FLEET RULES (pg. 118\u2013123)","rules":[],"text":["To determine base leadership for a given vessel, roll a D6 against the following table: D6 ROLL LEADERSHIP Ld 7 2-3 Ld 8 4-6 Ld 9 Any vessel that rolls a 6 when determining base leadership may select any one desired refit from the Mechanicus Gifts table instead of rolling for it randomly (this does not mean you get an extra one!).","This option cannot be used if the vessel embarks a Mechanicus Archmagos.","Though they may conduct hit and run raids normally, the attacker may re-roll the dice if desired during boarding actions as well as Hit and Run attacks against Mechanicus vessels, but the second roll stands.","POWER RAM The Imperial Power Ram may be taken by any Mechanicus capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.","This is for any Imperial fleet list and does not count as a separate refit.","This rule only applies to Mechanicus vessels shooting at Mechanicus drifting hulks, and not Imperial Navy, reserve or allied vessels in the fleet.","VESSELS OF THE ADEPTUS MECHANICUS As the ability to efficiently produce long-range lance weaponry by Mars was perfected in late M37, the need to reserve these complex and expensive weapons for only a relatively small number of their own hulls no longer existed.","Mechanicus capital ships must also roll a D6 once against the Mechanicus Gifts table.","D6 ROLL MECHANICUS GIFT Emergency Energy Reserves: When crippled, the ship only reduces turrets, shielding and weapons by 25% rather than 50%.","The vessel still counts as crippled in every other respect.","Fleet Defence Turrets: Up to two turrets on the ship are exchanged for fleet defence turrets capable of protecting itself or any one other vessel within 15 cm each ordnance phase, adding +2 to the turret strength of the ship it is defending (this does not alter bomber attack rolls when used to defend another vessel).","Gyro-stabilized Targeting Matrix: Ship weapons are reduced to 75% instead of 50%when on All Ahead Full, Come To New Heading or Burn Retros special orders.","Nova Cannon still cannot fire.","However, because these ships are commonly relied upon to test untried and sometimes Xenos technology for extended periods of time, Mechanicus vessels will on occasion suffer adverse, unanticipated consequences that in some cases may endanger the entire ship and its crew.","In addition to any subplots that may be taken D6 ROLL QUEST FOR KNOWLEDGE Extended Duty: The Quest for Knowledge can be long and arduous, sometimes seeing the fleet deep in unexplored space far away from logistical support for exceedingly long periods.","Roll a D6 for each Mechanicus capital ship.","You must destroy or cripple more enemy ships than you lose.","Roll a D6 for each Mechanicus capital ship in the fleet.","(+1/-1) Sacred Vessel: The ship is an example of or contains much valued archaeotech and must be protected at any cost.","This vessel cannot be crippled or destroyed.","Even if the ship is only crippled, it will grant an easier venture to capture it.","You must cripple or destroy it.","Roll a D6 on the following two tables to see how the ship has been altered (Re-roll any result that cannot be applied to the vessel).","This ship must not be crippled or destroyed so that it can be examined to review its performance.","The ship must move an additional 5 cm before it can turn.","Dorsal or prow lances can only hit targets on a roll of 6.","Adeptus Mechanicus Endeavour and Endurance light cruisers may replace their prow torpedoes with a single 30 cm range dorsal lance battery firing left/front/right for no cost.","ESCORTS You may have any number of Adeptus Mechanicus escorts in the fleet, chosen from the fleet list on the next page.","Note that these are taken from both the Imperial Navy and Space Marines fleet lists, but they must be taken for the point costs listed on the fleet list and not from their basic profiles.","These vessels count as Mechanicus vessels and use all rules that Mechanicus vessels do, but do not have access to the Mechanicus Gifts table, nor do they get any boarding action bonuses Space Marine escorts may have.","They however may each purchase +1 turret for +5 points.","If taken, all the escorts in a squadron must take this refit, not just individual escorts in the squadron.","Escorts must be painted to match the Mechanicus fleet to be of the Adeptus Mechanicus; you cannot take Imperial Navy or Space Marine vessels painted for another fleet and call them Mechanicus vessels!","No more than one reserve vessel can be taken for every three capital ships in the fleet.","For every three cruisers, one reserve cruiser-class, battlecruiser or grand cruiser may be taken.","For every three battleships, one battleship- class vessel may be taken.","Mechanicus vessels cannot be placed in squadrons with Rogue Trader, regular Imperial Navy or Adeptus Astartes vessels.","Mechanicus re-rolls cannot be used on these vessels, and other fleet commander re-rolls cannot be used on Mechanicus vessels.","An Adeptus Mechanicus fleet commander can only be embarked on a Mechanicus ship.","Mechanicus starships are rare and precious vessels, and they will not be expended lightly, regardless of the circumstances.","Escorts taken in this manner must be taken from the same fleet list reserve capital ships are being drawn from.","In the course of a campaign, Mechanicus vessels can only earn additional refits from the standard Imperial Navy refit table or the Space Marines reinforcement table.","They cannot continue to gain refits from the Mechanicus Gifts table.","Additional refits earned by renown in the course of a campaign as listed on the following table are at no cost to the vessel they are applied to, and they are separate from refits earned by appeal, which must be paid for normally.","Unlike normal refits, these free refits may be taken from the Mechanicus Gifts table if desired (this is the only way a ship can ever earn more than two refits form the Mechanicus Gifts table).","However, they can only be applied to the fleet commander's flagship, they must be rolled randomly, and no refit can be used more than once (re-roll the result)."],"ents":[]},{"t":"Mechanicus Archmagos","rules":[{"kind":"mandatory_at","points":1000,"src":"If the fleet is worth 1,000 points or more, a Mechanicus Archmagos must be included to lead it.","ok":true,"sec":[1]},{"kind":"section_count","min":0,"max":1,"src":"0-1 Mechanicus Archmagos","sec":[1],"ok":true,"hdr":1}],"text":["You may include 1 Mechanicus Archmagos in your fleet, which must be assigned to a capital ship and replaces its Leadership with the value shown.","An Archmagos Veneratus must be embarked on an Ark Mechanicus if one is included in the fleet.","A Mechanicus Archmagos can elect up to any one desired item from the Adeptus Mechanicus refit table for their own ship as part of their point cost, in addition to (and before) the refit the ship rolls for normally.","The benefit a Mechanicus Archmagos brings with it cannot be combined with a refit selected because the ship rolled a 6 when determining base leadership, meaning in one-off games a ship will never have more than two refits from the Mechanicus Gifts table."],"ents":[{"l":"Archmagos Explorator (Ld 8)","r":null,"p":50,"src_page":124,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Archmagos Veneratus (Ld 9)","r":null,"p":100,"src_page":124,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":50,"src_page":124,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1]]},{"l":"Two re-rolls","r":null,"p":125,"src_page":124,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1]]}]},{"t":"CAPITAL SHIPS","rules":[],"text":["The Adeptus Mechanicus will only use warships from the following classes, applying all the rules described beforehand.","The Omnissiah\u2019s Victory may not take any Mechanicus Gifts refits, as its Mechanicus Gifts are already included in its point cost and special rules."],"ents":[]},{"t":"Battleships","rules":[{"kind":"ratio","allow":1,"allow_type":"battleship","per":3,"per_type":"cruisers","src":"You may include 1 battleship for every three cruisers in the fleet.","ok":true,"allow_sec":[3],"per_sec":[4]}],"text":[],"ents":[{"l":"Omnissiah\u2019s Victory","r":126,"p":415,"src_page":125,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Emperor class battleship","r":53,"p":400,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Retribution class battleship","r":54,"p":380,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Oberon class battleship","r":56,"p":370,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Cruisers","rules":[],"text":[],"ents":[{"l":"Dictator class cruiser","r":67,"p":255,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Tyrant class cruiser","r":69,"p":220,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gothic class cruiser","r":70,"p":215,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Lunar class cruiser","r":71,"p":215,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Endeavour class light cruiser","r":72,"p":125,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Endurance class light cruiser","r":74,"p":125,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Defiant class light cruiser","r":76,"p":130,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13), taken from both the Imperial Navy and Space Marines fleet lists for the point costs listed below but otherwise unmodified from their normal profiles.","ok":true,"sec":[5]}],"text":[],"ents":[{"l":"Nova Class Frigate","r":107,"p":45,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Firestorm Class Frigate","r":79,"p":40,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gladius Class Frigate","r":108,"p":40,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Sword Class Frigate","r":82,"p":35,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Falchion Class Frigate","r":80,"p":35,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Hunter Class Destroyer","r":109,"p":35,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Cobra Class Destroyer","r":84,"p":30,"src_page":125,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["Attack carriers may use any combination of Fury interceptors and Starhawk bombers.","They may not use assault boats, even if their Imperial Navy counterparts may have access to this type of ordnance (such as Emperor battleships).","Mechanicus vessels equipped with launch bays may also take torpedo bombers for +10 points per launch bay."],"ents":[{"l":"Torpedo bombers","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book prints this only in the section text: \u201cMechanicus vessels equipped with launch bays may also take torpedo bombers for +10 points per launch bay.\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"}]},{"t":"FLEET UPGRADES","rules":[],"ents":[{"l":"Mechanicus turret refit (+1 turret)","r":null,"p":0,"a":0,"u":1,"mx":null,"nt":"Included in the point cost. The book states this in the shared fleet rules: \u201cAll Mechanicus capital ships add +1 to a given vessel's original turret value.\u201d","prose":1,"cond":{"cap":1},"mod":{"tu":1},"req":1,"k":"up"},{"l":"Mechanicus dorsal lance battery","r":null,"p":0,"a":0,"u":1,"mx":null,"nt":"Included in the point cost. The book states this in the shared fleet rules: \u201cEvery Mechanicus cruiser (not light cruiser) is equipped with a single 60 cm range dorsal lance battery firing left/front/right.\u201d","prose":1,"cond":{"ty":"cruiser","nmno":"light"},"add":["Dorsal lance battery","60 cm","1","Left/front/right"],"req":1,"k":"up"},{"l":"Imperial Power Ram","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"Any capital ship with a 6+ prow, unless it has a Nova Cannon. The book states this in the shared fleet rules: \u201cPOWER RAM The Imperial Power Ram may be taken by any Mechanicus capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.\u201d","prose":1,"cond":{"cap":1,"prow":"6","no":"nova cannon"},"k":"up"},{"l":"Nova Cannon instead of prow torpedoes","r":null,"p":20,"a":1,"u":1,"mx":null,"nt":"Any cruiser with a 6+ prow, even classes that do not normally offer it (such as the Gothic). The book states this in the shared fleet rules: \u201cAll Adeptus Mechanicus cruisers (not light cruisers) with armour 6+ prows can replace their prow torpedoes with a Nova Cannon for +20 points, even if this option is not normally provided for a given cruiser class (such as the Gothic).\u201d","prose":1,"cond":{"ty":"cruiser","nmno":"light","prow":"6","has":"prow torpedo"},"swp":{"f":"prow torpedo","t":["Prow nova cannon","30 - 150 cm","1","Front"]},"k":"up"},{"l":"Nova Cannon instead of prow torpedoes (Retribution)","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"The book states this in the shared fleet rules: \u201cA Mechanicus Retribution battleship can make this trade for +10 points.\u201d","prose":1,"cond":{"nm":"retribution","has":"prow torpedo"},"swp":{"f":"prow torpedo","t":["Prow nova cannon","30 - 150 cm","1","Front"]},"k":"up"},{"l":"Plasma-boosted batteries","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Weapon battery range 30 cm becomes 45 cm. The book states this in the shared fleet rules: \u201cAdeptus Mechanicus cruisers that would normally be equipped with 30 cm Weapon Batteries can incorporate plasma-boosted batteries that increase their range to 45 cm for +10 points.\u201d","prose":1,"cond":{"ty":"cruiser","has":"weapons batter@30","noopt":"30 cm range weapons batteries with 45"},"swp":{"f":"weapons batter","onlyrg":"30","rg":"45 cm"},"k":"up"},{"l":"+1 turret (escort squadron)","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"If taken, every escort in the squadron takes it. The book states this in the shared fleet rules: \u201cThey however may each purchase +1 turret for +5 points.\u201d","prose":1,"per":"hull","cond":{"esc":1},"k":"up"},{"l":"Dorsal lance instead of prow torpedoes","r":null,"p":0,"a":0,"u":1,"mx":null,"nt":"The book states this in the shared fleet rules: \u201cAdeptus Mechanicus Endeavour and Endurance light cruisers may replace their prow torpedoes with a single 30 cm range dorsal lance battery firing left/front/right for no cost.\u201d","prose":1,"cond":{"nm":"endeavour|endurance","has":"prow torpedo"},"swp":{"f":"prow torpedo","t":["Dorsal lance battery","30 cm","1","Left/front/right"]},"k":"up"}],"text":["Priced upgrades the book states in this faction's shared fleet rules rather than as list entries."]}]},{"nm":"The Emperor's Inquisition","pg":138,"secs":[{"t":"FLEET RULES (pg. 132\u2013137)","rules":[],"text":["Only the Emperor himself is beyond the gimlet gaze of their jurisdiction.","Deathwatch teams may specialize in defending or attacking any known alien race, including the Tau, Tyranids, Necrons, Orks or even Eldar; it depends upon the experience of the team.","The Ordo's organization is divided into Chambers, each controlled by an Inquisitor Lord called a Proctor.","Of all Space Marines Chapters, they are the only one made up entirely of psykers.","Only they are indoctrinated in the knowledge of the dark secrets of Chaos - they alone completely know of and understand the existence of demons and of their appearance in the real universe, and they alone are best equipped to battle and defeat mankind's most terrible enemy.","While other Chapters and Imperium forces have some knowledge of daemons and how to fight them, only the Grey Knights are privy to the darkest, deepest secrets that the Ordo Malleus possesses on these creatures and how to defeat them.","An Ordo Hereticus Inquisitor and his retinue may investigate a well-placed government official suspected of collusion with dark forces drawing Chaos demons against a deployed Grey Knights squad.","There are a number of other such minor Ordos, some so deeply secretive they are known only by their members and the Inquisitor Lords that lead them.","Individuals and even groups of Inquisitors may be of differing and in some cases even conflicting philosophies and factions with names such as the Thorians or the Istvaanists, and these allegiances as often as not cross the already ill-defined lines between Ordos.","Because of this and the enormous authority each Inquisitor wields, such collaboration and interdependency is the only manner an organization beholden to no- one is able to police itself."],"ents":[]},{"t":"USING VESSELS OF THE INQUISITION","rules":[],"text":["Instead, there are various ways to add an Inquisitor or Inquisitorial ships to the Imperial factions."],"ents":[]},{"t":"Accompanying a fleet","rules":[],"text":["An inquisitor may be content to use such vessels to merely accompany a fleet under the command of another authority, or they may even travel in obscurity aboard a Rogue Trader vessel or merchant transport.","A single Inquisitorial cruiser led by an Inquisitor can be taken as reserves by any Imperial Navy, Space Marine or Adeptus Mechanicus fleet; or an Inquisitor and his retinue may be embarked on a single Rogue Trader cruiser.","This may include the specific ship so-called in the Inquisition rules, but it can be any Imperial cruiser-class vessel.","As the rules state, there should be only one Inquisitorial cruiser in the fleet."],"ents":[]},{"t":"Leading a fleet","rules":[],"text":["An Inquisitor Lord may called forth to lead a fleet at times of great duress, during which his or her word is law and authority is absolute.","However, even unquestioned loyalty may come in many shades, and such vagaries are only magnified by the authority and power one wields.","While there are many factions and allegiances within the Inquisition, only how an Inquisitor\u2019s affiliation leans between the Puritans and the Radicals can visibly affect his or her decisions at the scale of Battlefleet Gothic."],"ents":[]},{"t":"Inquisitor Lord","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Inquisitor Lord","sec":[4],"ok":true,"hdr":1}],"text":["Any Imperial or Space Marine fleet 750 points or greater may be led by an Inquisitor Lord.","They must be aboard an Inquisitorial Cruiser if one is included, otherwise they must be on an Inquisition Blackship if one is included.","An Inquisitor Lord gets one re-roll, which may be used for any ship in the fleet."],"ents":[{"l":"Inquisitor Lord (Ld 9)","r":null,"p":75,"src_page":138,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cA second re-roll can be purchased for +25 points.\u201d","prose":1,"k":"up","grp":"rr","at":[[4,0]]}]},{"t":"CAPITAL SHIPS","rules":[],"text":["Any Imperial or Space Marine fleet may include a single Inquisitorial Cruiser in the fleet, which takes the place of a battlecruiser or strike cruiser in the fleet.","A fleet may include a single Blackship, which as a special vessel does not count toward or against other ship limits in the fleet.","If an Inquisitor Lord is leading the fleet, up to one Grey Knights Strike Cruiser may be taken for every 500 points in the fleet.","A Space Marine fleet led by an Ordo Malleus Inquisitor including at least 1000 points of Inquisition vessels and Grey Knights strike cruisers may include a single Grey Knights battle barge."],"ents":[{"l":"Inquisitorial Cruiser","r":150,"p":270,"src_page":138,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Inquisition Blackship","r":148,"p":300,"src_page":138,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Grey Knights Strike Cruiser","r":151,"p":165,"src_page":138,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Grey Knights Battle barge","r":147,"p":440,"src_page":138,"a":0,"mx":1,"nt":null,"k":"unit"}]},{"t":"ATTACK RATING","rules":[],"text":[],"ents":[]},{"t":"The Bombardment Cannons used by","rules":[],"text":[],"ents":[]},{"t":"ORDNANCE AND UPGRADES","rules":[],"text":["If an Imperial Navy or Adeptus Mechanicus ship embarking an Inquisitor is equipped with launch bays, it must replace its attack craft with Thunderhawks, with its launch bay strength divided in half (rounding down)."],"ents":[{"l":"Embarks the Inquisitor: Thunderhawks, launch bays halved","r":null,"p":0,"a":0,"u":1,"mx":null,"nt":"Only the ship the Inquisitor is aboard. The book prints this only in the section text: \u201cIf an Imperial Navy or Adeptus Mechanicus ship embarking an Inquisitor is equipped with launch bays, it must replace its attack craft with Thunderhawks, with its launch bay strength divided in half (rounding down).\u201d","prose":1,"cond":{"has":"launch bay"},"swp":{"f":"launch bay","halfst":1,"rg":"Thunderhawks: 30 cm"},"k":"up"}]},{"t":"SCENARIOS","rules":[],"text":["Scenarios may be rolled normally in any agreed-upon fashion.","If a Convoy Run scenario is rolled and the defending fleet list includes an Inquisition Blackship, this vessel may be used as the objective in the same manner as a transport convoy, counting as eight transports for purposes of deciding escorting forces.","A single Inquisitorial Cruiser may be included as part of the escorting fleet if desired and the points are available, keeping in mind that the point value of the Blackship counts against the escorting fleet!"],"ents":[]},{"t":"SUB-PLOTS","rules":[],"text":["Inquisitors are almost always in pursuit of some higher objective that may be obscured by the current conflict at-hand.","In addition to any sub-plots rolled normally, the fleet led by an Inquisitor must take a Secret Ploys sub-plot rolled randomly from [???] p.84 of the Battlefleet Gothic Rulebook."],"ents":[]},{"t":"RESERVES AND ALLIES","rules":[],"text":["Any one of the Imperial Navy, Adeptus Mechanicus and Space Marine fleets led by an Inquisitor may always take ships from the other two as reserves in the normal manner.","Imperial Navy and Adeptus Mechanicus fleets may also take a single Rogue Trader cruiser.","If taken, a Rogue Trader escort squadron may accompany it, but Xenos vessels may not be used."],"ents":[]},{"t":"Space Marine Chapters are fiercely","rules":[],"text":["independent and will only grudgingly submit to having their leadership usurped by an Inquisitor Lord, regardless of his renown.","While a Space Marine Captain or Fleet Master may agree to parley at an Inquisitor\u2019s side, they will not countenance adding insult to injury by actively serving alongside Xenos or potentially renegade vessels of any stripe!"],"ents":[]},{"t":"INQUISITORS OF THE ORDOS","rules":[],"text":["If desired, vessels with an embarking Inquisitor may gain special characteristics, depending upon the Ordo the Inquisitor leading the fleet is affiliated with.","For example, an Ordo Hereticus Inquisitor may lead a fleet to perform Exterminatus on a planet subsumed by a witch-cult, an Ordo Xenos Inquisitor and her kill-team may be sent to clear a derelict Space Hulk of a Tyranid infestation, etc.","However, these shadowy agents of the Imperium are only called upon in dire need, usually only when a threat to the Imperium has gained a significant foothold in a system, or a war threatens to turn for the worse."],"ents":[]},{"t":"ORDO HERETICUS INQUISITORS","rules":[],"text":["If a Blackship is used as an Exterminatus vessel, a Hereticus Inquisitor must lead it.","Reserve/allies An Imperial Navy or Adeptus Mechanicus fleet led by an Inquisitor that does not include Space Marine vessels has no additional restrictions or changes to their reserve and allies rules, although Rogue Traders will be regarded with particular suspicion, though a single Rogue Trader and its attendant escorts may still accompany the fleet."],"ents":[{"l":"Ordo Hereticus Inquisitor Lord","r":null,"p":25,"src_page":140,"a":1,"mx":null,"nt":null,"k":"cmd"}]},{"t":"ORDO XENOS INQUISITORS","rules":[],"text":["While Inquisitors of this Ordo know they must be fully cognizant of Xenos races in order to defeat them, radical Inquisitors of this Ordo that follow the philosophies of the Istvaanists and Xeno Hybrists actively cultivate accommodation with aliens and seek their technology for the Imperium\u2019s benefit.","Rolled saves by holofields, shadowfields or any similar rule against a boarding action or hit and run attack succeed on a 3+ instead of a 2+.","An Ordo Xenos Inquisitor will only be called when an alien threat significantly exceeds a given Sector Stabilis mandate.","The vessel upon which the Inquisitor Lord is embarked may roll once against the following table and apply it to the ship.","Alternatively, the refit may be selected for +5 points."],"ents":[{"l":"Ordo Xenos Inquisitor Lord","r":null,"p":30,"src_page":141,"a":1,"mx":null,"nt":null,"k":"cmd"},{"l":"Choose the Xenotech refit instead of rolling","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cAlternatively, the refit may be selected for +5 points.\u201d","prose":1,"k":"up","at":[[15,0]]}]},{"t":"IMPROVEMENT","rules":[],"text":["Reserve/allies An Imperial Navy or Adeptus Mechanicus fleet led by an Inquisitor that does not include Space Marine vessels may has the following addition to its reserves and/or allies rules.","A fleet led by an Ordo Xenos Inquisitor may be accompanied by a single Demiurg capital ship, Corsair Eldar cruiser or Tau cruiser."],"ents":[]},{"t":"ORDO MALLEUS INQUISITORS","rules":[],"text":["An Ordo Malleus Inquisitor will only be called when intense demonic activity threatens to overrun an entire Sector.","The enemy Chaos fleet may add one Mark of Chaos or upgrade a cruiser to a Daemonship at no cost.","Reserve/allies An Imperial Navy or Adeptus Mechanicus fleet led by an Inquisitor that does not include Space Marine vessels may has the following addition to its reserves and/or allies rules: For no change in their cost, a fleet led by an Ordo Malleus Inquisitor may take as reserves any Chaos ship listed in the Bastion Fleet List on p.37 of the Remastered Fleetbook.","These vessels are free of the \u201cStrange Happenings\u201d special rule as long as the Inquisitor\u2019s ship remains in play, but the fleet may not take any Grey Knights vessels!"],"ents":[{"l":"Ordo Malleus Inquisitor Lord","r":null,"p":25,"src_page":142,"a":1,"mx":null,"nt":null,"k":"cmd"}]},{"t":"General Rules","rules":[],"text":["Grey Knights count as Space Marines in all respects and as such follow all rules for Space Marines as written on pages 92-94.","(Note: Grey Knights may not take Thunderhawk annihilators)"],"ents":[]},{"t":"FLEET COMMANDER","rules":[],"text":["If the fleet is above 750 points an Inquisitor Lord must lead the fleet.","If an Inquisitorial Cruiser is present the Inquisitor Lord must be placed aboard it.","If the Inquisitorial Cruiser is not present but a Blackship is then the Inquisitor Lord must be placed aboard the Blackship.","Otherwise the Inquisitor must be placed on the most expensive ship.","(Note: above two points are not to be applied to Grey Knight or Space Marine vessels as these already include this upgrade) An Inquisitor Lord gets one re-roll, and may purchase up to two more re-rolls for +25 points each."],"ents":[{"l":"Inquisitor Lord (Ld 9)","r":null,"p":75,"src_page":144,"a":1,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201c(Note: above two points are not to be applied to Grey Knight or Space Marine vessels as these already include this upgrade) An Inquisitor Lord gets one re-roll, and may purchase up to two more re-rolls for +25 points each.\u201d","prose":1,"k":"up","grp":"rr","at":[[19,0]]},{"l":"Two extra re-rolls","r":null,"p":50,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201c(Note: above two points are not to be applied to Grey Knight or Space Marine vessels as these already include this upgrade) An Inquisitor Lord gets one re-roll, and may purchase up to two more re-rolls for +25 points each.\u201d","prose":1,"k":"up","grp":"rr","at":[[19,0]]},{"l":"Ordo Malleus Inquisitor Lord (Ld 10)","r":null,"p":100,"a":1,"mx":null,"nt":"The book prints this only in the section text: \u201cOrdo Malleus Inquisitor Lord (Ld 10) ............................................................+100 pts A vessel embarking an Ordo Malleus Inquisitor Lord is accompanied by several squads of Grey Knights Space Marines that serves as their personal bodyguard and assault force.\u201d","prose":1,"k":"cmd"}]},{"t":"CAPITAL SHIPS","rules":[],"text":["You may include a single Grey Knights Battle barge if the remainder of the fleet is at least worth 1000 points.","Furthermore an Ordo Malleus Inquisitor Lord must lead in the fleet.","A Grey Knights fleet may include a single Inquisitorial Cruiser in the fleet.","A Grey Knights fleet may include a single Blackship, which as a special vessel does not count toward or against other ship limits in the fleet.","Grey Knights Strike Cruiser (pg 151)...............vvv One Grey Knights Strike Cruiser may be taken per 500 points (eg one from 0-500 points, two from 501-1000 points, etc.)."],"ents":[{"l":"Grey Knights Battlebarge","r":147,"p":440,"src_page":145,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Inquisitorial Cruiser","r":150,"p":270,"src_page":145,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Inquisition Blackship","r":148,"p":300,"src_page":145,"a":0,"mx":1,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13) Rapid strike vessel (Firestorm) (pg 106) (pg 79)..45 pts","ok":true,"sec":[21]}],"text":[],"ents":[{"l":"Nova class Frigate","r":107,"p":50,"src_page":145,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gladius class Frigate","r":108,"p":45,"src_page":145,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Hunter class Destroyer","r":109,"p":40,"src_page":145,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Sword)","r":82,"p":40,"src_page":145,"a":0,"mx":null,"nt":"Source misprint: pg. 80 is the Falchion; Sword is pg. 82.","k":"unit"},{"l":"Rapid strike vessel (Cobra)","r":84,"p":35,"src_page":145,"a":0,"mx":null,"nt":"Source misprint: pg. 82 is the Sword; Cobra is pg. 84.","k":"unit"}]},{"t":"ORDNANCE AND UPGRADES","rules":[],"text":["The vessel embarking the Inquisitor Lord or one Grey Knights vessel may take Grey Knight Terminators.","Once per turn a vessel equipped with Terminator boarding parties may use them when conducting a hit and run teleport attack.","Terminators may be used in addition to a normal teleport attack that turn.","Any Grey Knights capital ship in the fleet may embark an Honour Guard for +10 points.","Once per turn you may use the Honour Guard.","All the normal rules for teleport attacks apply, except that they may be used in addition to a normal teleport attack that turn.","The player may roll two dice and choose which one to use as the result, including the normal +1 bonus for being Space Marines."],"ents":[{"l":"Grey Knights Terminators","r":null,"p":50,"src_page":145,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Grey Knights Honour Guard","r":null,"p":10,"src_page":145,"a":1,"u":1,"mx":null,"nt":null,"k":"up"}]},{"t":"Hexagrammic Wards","rules":[],"text":[],"ents":[]},{"t":"Daemonhunters","rules":[],"text":["A Grey Knights fleet will only be called when intense demonic activity threatens to overrun an entire Sector.","An enemy Chaos fleet may add one Mark of Chaos; or upgrade a cruiser to a Daemonship; for no aditional cost, for each of the following included in the Grey Knights Fleet: \u2022"],"ents":[]},{"t":"Ordo Malleus Inquisitor Lord","rules":[],"text":[],"ents":[]},{"t":"ATTACK RATING","rules":[],"text":[],"ents":[]},{"t":"RESERVES AND ALLIES","rules":[],"text":[],"ents":[]},{"t":"SCENARIOS","rules":[],"text":["Scenarios may be rolled normally in any agreed- upon fashion.","If a Convoy Run scenario is rolled and the defending fleet list includes an Inquisition Blackship, this vessel may be used as the objective in the same manner as a transport convoy, counting as eight transports for purposes of deciding escorting forces.","A single Inquisitorial Cruiser may be included as part of the escorting fleet if desired and the points are available, keeping in mind that the point value of the Blackship counts against the escorting fleet!"],"ents":[]},{"t":"SUB-PLOTS","rules":[],"text":["Inquisitors are almost always in pursuit of some higher objective that may be obscured by the current conflict at-hand.","In addition to any sub-plots rolled normally, the fleet led by an Inquisitor must take a Secret Ploys subplot rolled randomly from the table on pg126 of the Battlefleet Gothic Remastered Rulebook."],"ents":[]}]},{"nm":"Rogue Traders","pg":174,"secs":[{"t":"FLEET RULES (pg. 168\u2013173)","rules":[],"text":["THE TREACHERY OF DURANDAL GROHE Memet Poralius was only one of many Rogue Traders and privateers that found an alliance with the Tau to be more appealing than maintaining their loyalty to the Imperium.","While the freedom afforded Rogue Traders has led on some occasions to such abuses that later needed to be rectified with varying degrees of prejudice, never has the actions of any single Rogue Trader betrayed the Imperium more gravely than the fall from grace of Durandal Grohe.","Grohe later brought several other artefacts from an undisclosed location to Techmagos Carnivrir, but never revealed from where he received them except to say it was from a dead world located deep in the Obscurus Segmentum near the Tamahl Sector.","Convinced that this could be none other than the now unquestionably traitorous Grohe, he sent word to the Kar Durniash fleetlords that a large flotilla must be dispatched with great haste to intercept and destroy this unknown host.","M41 that the massive swarms of Hive Fleet Behemoth were pressing hard upon the sectors of the Eastern Fringe near the home systems of the Ultramarines, and with much of the available fleet thus committed, only thee cruisers, an Inquisition cruiser accompanied by two under-strength escort squadrons led by the Mars battlecruiser Emendable were able to give chase.","An inquest of the planetary governor and her family quickly revealed that more than thirty Xenos capital ships had departed the system only five months before and that Grohe certainly was guiding them.","Apparently the fleet had a large number of Merchant-class transports and Hero-class cruisers, as well as several alien vessels identified as possible Demiurg and Kroot warships, along with unusual escort-displacement vessels of a class never previously encountered."],"ents":[]},{"t":"Veteran Rogue Traders","rules":[{"kind":"section_count","min":0,"max":2,"src":"0-2 Veteran Rogue Traders","sec":[1],"ok":true,"hdr":1}],"text":["A Veteran Rogue Trader may lead each Rogue Trader cruiser in a fleet.","If a fleet has more than one Rogue Trader cruiser or also includes more than one squadron of transports, a Veteran Rogue Trader must be assigned to a Rogue Trader cruiser.","A Veteran Rogue Trader gets one re-roll, which may be used for his vessel or an accompanying Rogue Trader escort squadron."],"ents":[{"l":"Veteran Rogue Trader (Ld 9)","r":null,"p":50,"src_page":174,"a":0,"mx":null,"nt":null,"k":"cmd"}]},{"t":"POWER RAM","rules":[],"text":["The Imperial Power Ram may be taken by any Rogue Trader capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.","This is for any Imperial fleet list and does not count as a separate refit."],"ents":[{"l":"Imperial Power Ram (6+ prow, not with a Nova Cannon)","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cThe Imperial Power Ram may be taken by any Rogue Trader capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.\u201d","prose":1,"k":"up"}]},{"t":"CAPITAL SHIPS","rules":[],"text":["Any fleet except Necrons or Tyranids may include a single Rogue Trader capital ship.","Tau, Demiurg and Imperial fleets may include one Rogue Trader cruiser for every 750 points or part thereof in their fleet.","If a second Rogue Trader cruiser is taken, it may be any Rogue Trader cruiser variant listed on the Exploration Fleet List.","Heavy transports may not be in squadrons with other transport types."],"ents":[{"l":"Rogue Trader Cruiser","r":180,"p":185,"src_page":174,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Dauntless Class Light Cruiser","r":77,"p":125,"src_page":174,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Endeavour Class Light Cruiser","r":181,"p":110,"src_page":174,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Heavy Transport","r":182,"p":40,"src_page":174,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"A s  counting against cruiser limits.","Reserves and Allied vessels do not have access to the Veteran Rogue Trader re-rolls, but allied vessels may purchase up to one special character from its own fleet list (if available)."],"ents":[]},{"t":"The Demiurg","rules":[],"text":["At least one Demiurg vessel of any class may be taken for every three Rogue Trader cruisers in the fleet.","This is separate from and in addition to any reserve or allied cruisers taken, but each Demiurg vessel taken still counts against the twelve-cruiser limit, and no more than one Stronghold may be taken.","Demiurg vessels may not be employed if Space Marines are taken as reserves, allies or escort squadron auxiliary vessels."],"ents":[{"l":"Stronghold Commerce Vessel","r":488,"p":350,"src_page":177,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Bastion Commerce Vessel","r":489,"p":255,"src_page":177,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Citadel Commerce Vessel","r":490,"p":185,"src_page":177,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"The Kroot","rules":[],"text":["A single Kroot Warsphere may be taken if there are at least three Rogue Trader cruisers in the fleet.","A Kroot Warsphere may not be employed if Space Marines are taken as reserves, allies or escort squadron auxiliary vessels."],"ents":[{"l":"Kroot Warsphere","r":494,"p":145,"src_page":177,"a":0,"mx":null,"nt":null,"k":"unit"}]}]},{"nm":"Rogue Traders \u2014 Pirates and Wolf Packs","pg":178,"secs":[{"t":"FLEET RULES (pg. 177\u2013177)","rules":[],"text":["ESCORTS A single squadron of 2-6 Rogue Trader escorts, Rogue Trader cargo ships and auxiliary vessels may accompany each Rogue Trader cruiser in a fleet, in any mix desired.","Besides Xenos vessels, auxiliary vessels from only one race can be taken in a fleet.","Xenos vessels cannot be employed if Space Marine escorts are used as auxiliary vessels.","Any number of cargo ships beyond this number may be taken and organized in squadrons that only contain cargo ships.","Heavy transports may also be taken but not in squadrons with other transport types.","No more than 1/3 of the fleet\u2019s total transport value can be made up of heavy transports.","RESERVES AND ALLIES Up to one cruiser from any fleet except Orks, Necrons and Tyranids can be taken for every three Rogue Trader cruisers in the fleet.","Capital ships taken count against the cruiser limit, they can only be from one fleet and cannot be from a fleet list differing from that used to provide escort squadron auxiliary vessels.","If the fleet is large enough that three reserve or allied capital ships are taken, a single (0-1) allied battleship may also accompany the fleet for its regular point cost without counting against cruiser limits.","Reserves and Allied vessels do not have access to the Veteran Rogue Trader re-rolls, but allied vessels may purchase up to one special character from its own fleet list (if available).","The Demiurg At least one Demiurg vessel of any class may be taken for every three Rogue Trader cruisers in the fleet.","This is separate from and in addition to any reserve or allied cruisers taken, but each Demiurg vessel taken still counts against the twelve-cruiser limit, and no more than one Stronghold may be taken.","Demiurg vessels may not be employed if Space Marines are taken as reserves, allies or escort squadron auxiliary vessels.","185 pts The Kroot A single Kroot Warsphere may be taken if there are at least three Rogue Trader cruisers in the fleet.","A Kroot Warsphere may not be employed if Space Marines are taken as reserves, allies or escort squadron auxiliary vessels."],"ents":[]},{"t":"USING THIS FLEET LIST","rules":[],"text":["However, large pirate bands with a substantial fleet at their disposal may elect to actually raid larger planetary colonies."],"ents":[]},{"t":"Leadership","rules":[],"text":[],"ents":[]},{"t":"Attack rating","rules":[],"text":[],"ents":[]},{"t":"Pirates in scenarios","rules":[],"text":["However, if the Pirate fleet is the attacker and has a fleet of 1,500 points or greater, they may elect to play a Planetary Assault on a D6 roll of 6."],"ents":[]},{"t":"Pirates in campaigns","rules":[],"text":["They have very limited access to formal shipyards and cannot earn refits in the course of a campaign, but they may instead earn crew skills in the manner other fleets earn refits, in addition to earning them normally."],"ents":[]},{"t":"POWER RAM","rules":[],"text":["The Imperial Power Ram may be taken by any Rogue Trader capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.","This is for any Imperial fleet list and does not count as a separate refit."],"ents":[{"l":"Imperial Power Ram (6+ prow, not with a Nova Cannon)","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cThe Imperial Power Ram may be taken by any Rogue Trader capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.\u201d","prose":1,"k":"up"}]},{"t":"Pirate Captains","rules":[{"kind":"section_count","min":0,"max":3,"src":"0-3 Pirate Captains","sec":[7],"ok":true,"hdr":1}],"text":["A Pirate Captain may be embarked on a cruiser for every 500 points or portion thereof in a fleet.","If a pirate fleet has more than 750 points of ships, a Pirate Captain must lead it.","A Pirate Captain gets one re-roll, and may purchase up to two more re-rolls for +25 points each.","He (or she!) must be placed aboard the most expensive vessel in the fleet (or vessels if more than one Captain is present).","Pirate Captains may use their re-rolls on any vessel or escort squadron in the fleet, but no individual Pirate Captain may use more than one re-roll per turn."],"ents":[{"l":"Pirate Captain (+1 Ld)","r":null,"p":50,"src_page":178,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cA Pirate Captain gets one re-roll, and may purchase up to two more re-rolls for +25 points each.\u201d","prose":1,"k":"up","grp":"rr","at":[[7,0]]},{"l":"Two extra re-rolls","r":null,"p":50,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cA Pirate Captain gets one re-roll, and may purchase up to two more re-rolls for +25 points each.\u201d","prose":1,"k":"up","grp":"rr","at":[[7,0]]}]},{"t":"CAPITAL SHIPS","rules":[],"text":["Pirate fleets do not ally with any race, as they are only in business for themselves and consider any ship they encounter and can easily defeat a target of value and opportunity.","A human pirate fleet may have up to one cruiser for every 500 points of ships in the fleet or portion thereof.","A Pirate Cruiser may consist of a Rogue Trader cruiser or any cruiser from the Imperial or Chaos fleet lists worth 185 points or less.","It may also include a single Space Marine strike cruiser!","Special variants, refits and Nova Cannons cannot be used.","These count as cruisers for fleet building."],"ents":[{"l":"Fra\u2019al Battleship","r":194,"p":250,"src_page":178,"a":0,"mx":2,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":3,"max":6,"src":"At least one squadron of 3\u20136 escort vessels must be included for each cruiser in the fleet, organized in any mix desired.","ok":true,"sec":[9]}],"text":["While transports of various types are typically not included in a raiding fleet once they have been plundered, they can be used if desired but are never free.","The number of escort vessels that utilize ordnance or lance weaponry may not outnumber those that rely solely on weapon batteries."],"ents":[{"l":"Escort Carrier","r":521,"p":60,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Q-Ship","r":522,"p":60,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Xenos Vessel","r":184,"p":50,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Xenos Vessel - Pthuxutl war cruiser","r":186,"p":50,"src_page":179,"a":0,"mx":null,"nt":"Named Xenos Vessel variant from pg. 186: same 50 points, with one xenotech system already chosen.","k":"unit"},{"l":"Xenos Vessel - Fra'al raider","r":187,"p":50,"src_page":179,"a":0,"mx":null,"nt":"Named Xenos Vessel variant from pg. 187: same 50 points, with one xenotech system already chosen.","k":"unit"},{"l":"Xenos Vessel - Nekulli whip","r":188,"p":50,"src_page":179,"a":0,"mx":null,"nt":"Named Xenos Vessel variant from pg. 188: same 50 points, with one xenotech system already chosen.","k":"unit"},{"l":"Idolator Raider","r":281,"p":45,"src_page":179,"a":0,"mx":null,"nt":"Source page reference is wrong: the book prints pg. 147, but Idolator Class Raider is on pg. 281. Corrected by name.","k":"unit"},{"l":"Infidel Raider","r":282,"p":40,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Firestorm Frigate","r":79,"p":40,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Sword Frigate","r":82,"p":35,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Falchion Frigate","r":80,"p":35,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Cobra Destroyer","r":84,"p":30,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Recommissioned Escort","r":189,"p":30,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Iconoclast Destroyer","r":190,"p":30,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Armed Cargo Vessel","r":192,"p":20,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Armed Freighter","r":523,"p":20,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Cargo Transport","r":192,"p":10,"src_page":179,"a":0,"mx":null,"nt":"Source page reference is wrong: the book prints pg. 85, but Armed Cargo Vessel is on pg. 192. Corrected by name.","k":"unit"}]},{"t":"BRIGANDS","rules":[],"text":["Up to 10% of a pirate fleet may be made up of alien escorts from any race except Tyranids, Necrons or vessels that require support from a capital ship of their race, such as Nicassar Dhows or Tau Orcas.","They can be organized in squadrons of two to six ships, but vessels of different races may not combine with each other into a single squadron, nor can they combine into squadrons with human (Imperial, Chaos or Rogue Trader) vessels.","In other words, a squadron of three Eldar escorts and a squadron of three Ork escorts may both be part of the same pirate fleet, but they can only squadron with themselves and NOT with each other or with any Idolators, Swords, etc.","The only exception to this is Rogue Trader Xenos Vessels, which represent minor alien races seeking to expand their influence or pursue some other obscure agenda.","They may freely ally themselves with any other race and join with them in pirate raider squadrons.","They may not use any of a Pirate Captain\u2019s re-rolls, and will automatically attempt to disengage if the escort squadron is crippled (reduced to half their starting number).","They are not restricted to nor benefit from the leadership values of human pirates and must use the unmodified leadership from the fleet lists of their respective races."],"ents":[]},{"t":"NOTES FROM NATE MONTES","rules":[],"text":[],"ents":[{"l":"Siluria Class Light Cruiser","r":78,"p":100,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Havoc Class Frigate","r":81,"p":35,"src_page":179,"a":0,"mx":null,"nt":null,"k":"unit"}]}]},{"nm":"Chaos \u2014 Incursion","pg":232,"secs":[{"t":"FLEET RULES (pg. 226\u2013231)","rules":[],"text":["For centuries or even millennia, they disappear from the real universe only to re-emerge with a crew of Daemonkind.","This has led to the theory that Daemon ships can only leave the Warp by following in the wake of another vessel and that at other times they are trapped in an endlessly shifting ocean of madness.","Typically, there has never been enough reliable evidence to confirm any hypothesis.","A Daemon ship may not have a Chaos Space Marine crew.","Daemon ships cannot carry Exterminatus weapons and do not score any points for landing troops in a planetary assault (the Daemons are bound within the hull of their vessel, whilst able to board enemy ships normally in the context of a BFG game they would become unstable if holding a planetary objective for any length of time).","Daemonships cannot be used in squadrons.","Any Daemon ship may have a single Mark of Chaos with the same effects and cost in points as described on pg 232.","WARP TRANSLATION A Daemonship may be kept off table at the start of a game.","In the End phase of any Chaos turn, after the first, they may enter play from the Warp as follows: Select a friendly or enemy Capital ship; only a Capital ship contains enough supplicants or victims to draw a Daemonship from the Warp.","A Daemonship cannot be forced to disengage by a scatter roll that places it off the table.","The arriving Daemonship is unaffected by celestial phenomena and does not trigger attack by ordnance markers it may happen to land on.","If it would appear in contact with an enemy vessel, reposition it by up to 1 cm so that it is out of contact.","It cannot move, shoot, board or conduct any action in any way, though any Marks it may have still take effect immediately.","It also may not be shot at, boarded, rammed or have any action done to it while spectral.","At the end of any subsequent Chaos End phase it may complete the translation to real space.","It does not have to and may remain a spectral, haunting presence as long as the Chaos player wishes.","This final translation cannot be made if the Daemonship is in contact with an enemy vessel.","However, if it materializes in an asteroid field, it may then attempt to avoid damage by making a leadership check normally.","HAUNTING A Daemonship may disengage at the end of any Chaos Movement phase without having to make any dice roll.","A disengaged Daemonship may re-enter play on any Chaos turn following the one in which it disengages.","If it was damaged when it disengaged it may be repaired when it returns, roll a D6: D6 ROLL RESULT 1, 2, 3 No change 4, 5 +1 hull point +2 hull points Add +1 to the roll if it is a battleship.","Add +1 for each full turn the Daemonship spent in the Warp.","In addition to repairing damage, they may repair critical hits while in the warp rolling normally, repairing critical damage on a 4+ as opposed to a 6.","However, Daemonships may not make repair rolls in the end phase they are first deployed when returning into play.","If Daemonships repair enough hits while \u201chaunting\u201d to no longer be crippled, they will still count as disengaged for purposes of victory points but will no longer count as crippled.","A returning Daemonship cannot come back with more hits than it could normally have.","At the end of the game a Daemonship which disengaged (even just once) will count as having disengaged for Victory points purposes, unless of course it is destroyed or crippled when the normal rules apply.","CHAOS IN CAMPAIGNS DAEMONSHIPS Daemonships do not automatically regain hits after each battle.","You may re-roll the dice when deciding who has the initiative in the next campaign turn.","You may add a Chaos Lord (with a Mark of Chaos if you wish) to your Fleet Registry.","Your flagship may add +1 to all boarding actions it is involved in.","Your flagship and any ship with a Chaos Lord aboard may add +1 to all boarding actions it is involved in for the rest of the campaign.","Any one ship in your fleet may add +2 to all boarding actions it is involved in for the rest of the campaign.","One ship in your fleet may be equipped with boarding torpedoes and/or Dreadclaw assault boats.","In your next battle, one ship in your fleet may be given a Chaos Reward for free, as if the Warmaster or a Chaos Lord was on board (this can be combined with the Chaos Rewards of a Warmaster or Chaos Lord).","In the next battle, any enemy ship within 15 cm of this vessel counts as having one Blast marker in contact with its base.","What means he used to bring together the fleets of so many different Chaos Lords and Warmasters is unknown, but even his unholy gift of leadership must have been stretched to the full coordinating the attacks of such an anarchic coalition.","In the Chaos Shooting phase Abaddon will direct at least half the available firepower and lance strength of the ship he is commanding against the weaklings who have failed him (assuming the worthless scum are within range and fire arc).","The Leadership bonus will only take effect once (after that the crews are working as hard as they can!).","If the object of Abaddon\u2019s wrath is not in range and/or fire arc he will leave them to their fate \u2013 Abaddon\u2019s re-rolls may no longer be used on it.","This means that no further Commander re-rolls may be used on the ship or squadron unless it is carrying its own Chaos Lord with a Mark of Tzeentch.","You may not place a Chaos Lord on the same ship as Abaddon (you don\u2019t get to be a Chaos Lord by spending lots of time near a bloody-tempered maniac!).","Re-rolls: 1 per turn.","Abaddon\u2019s fleet is allowed to re-roll a single Command check or Leadership test each turn."],"ents":[]},{"t":"FLEET COMMANDER","rules":[],"text":["1 Chaos Warmaster You must include a Chaos Warmaster in your fleet, even if it is worth 750 points or less.","He must be assigned to the biggest (ie, most expensive) ship and improves its Leadership to the value shown below.","In addition they may be given up to four Marks of Chaos as shown below (no Mark may be taken more than once).","The Chaos Warmaster's ship gains 1 damage point and may not be boarded."],"ents":[{"l":"Chaos Warmaster (Ld 8)","r":null,"p":50,"src_page":232,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Chaos Warmaster (Ld 9)","r":null,"p":100,"src_page":232,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"The Mark of Slaanesh","r":null,"p":25,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[1,0],[1,1]]},{"l":"The Mark of Khorne","r":null,"p":20,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[1,0],[1,1]]},{"l":"The Mark of Tzeentch","r":null,"p":30,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[1,0],[1,1]]},{"l":"The Mark of Nurgle","r":null,"p":35,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[1,0],[1,1]]}]},{"t":"Chaos Lords","rules":[{"kind":"cap","max":3,"what":"chaos lords","src":"You may include up to three Chaos Lords in your fleet.","ok":true,"sec":[2]},{"kind":"section_count","min":0,"max":3,"src":"0-3 Chaos Lords","sec":[2],"ok":true,"hdr":1}],"text":["Each Chaos Lord must be assigned a ship and improves its Leadership rating to the value shown.","A Chaos Lord may be given up to one of the following Marks of Chaos.","The Chaos Lord's ship gains a damage point and may not be boarded."],"ents":[{"l":"Chaos Lord (Ld 8)","r":null,"p":50,"src_page":232,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"The Mark of Slaanesh","r":null,"p":25,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[2,0]]},{"l":"The Mark of Khorne","r":null,"p":20,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[2,0]]},{"l":"The Mark of Tzeentch","r":null,"p":30,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[2,0]]},{"l":"The Mark of Nurgle","r":null,"p":35,"src_page":232,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[2,0]]}]},{"t":"Chaos Space Hulk","rules":[{"kind":"cap","max":1,"what":"space hulk","src":"You may include up to one Space Hulk in the fleet.","ok":true,"sec":[3]},{"kind":"section_count","min":0,"max":1,"src":"0\u20131 Chaos Space Hulk","sec":[3],"ok":true,"hdr":1}],"text":[],"ents":[{"l":"Chaos Space Hulk","r":286,"p":650,"src_page":233,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Battleships","rules":[{"kind":"ratio","allow":1,"allow_type":"battleship","per":3,"per_type":"cruisers","src":"You may include up to one battleship in your fleet for every three cruisers or heavy cruisers.","ok":true,"allow_sec":[4],"p ts rolled Leadership by +2, to a maximum of 9.","A Chaos Warmaster (and their required capital ship) must be taken in fleets of 750 points or more.","In addition they may be given a single Mark of Chaos.","The Warmaster may be given an extra re-roll at a cost of +25 points."],"ents":[{"l":"Chaos Warmaster (Ld +2)","r":null,"p":100,"src_page":234,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":25,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cThe Warmaster may be given an extra re-roll at a cost of +25 points.\u201d","prose":1,"k":"up","grp":"rr","at":[[1,0]]}]},{"t":"Abaddon","rules":[],"text":["You may include Abaddon the Despoiler as the Warmaster in any Chaos Fleet worth more than 1,000 points.","Abaddon receives one re-roll per turn, in addition see his special rules on pg 74[??]"],"ents":[{"l":"Abaddon (Ld 10)","r":null,"p":195,"src_page":234,"a":0,"mx":null,"nt":null,"k":"cmd"}]},{"t":"Chaos Lords","rules":[],"text":["Any capital ship, apart from that of the Warmaster, may be captained by a Chaos Lord.","A Lord may be given a re-roll (which he can use for his own ship or squadron only) at +25 points.","A ship commanded by a Lord may be given a single Mark of Chaos.","It gains 1 Damage Point and may not be boarded."],"ents":[{"l":"Chaos Lord (Ld +1)","r":null,"p":25,"src_page":234,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"The Mark of Slaanesh","r":null,"p":25,"src_page":234,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[3,0]]},{"l":"The Mark of Khorne","r":null,"p":20,"src_page":234,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[3,0]]},{"l":"The Mark of Tzeentch","r":null,"p":25,"src_page":234,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[3,0]]},{"l":"The Mark of Nurgle","r":null,"p":35,"src_page":234,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"mark","at":[[3,0]]},{"l":"One re-roll (his own ship or squadron only)","r":null,"p":25,"a":1,"u":1,"mx":null,"n er class cruiser","r":280,"p":165,"src_page":249,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"DAEMONSHIPS","rules":[],"text":["Up to half of the capital ships (not the Wage of Sin or the flagship) in a Pleasurefleet may be upgraded to Daemonships at the additional points cost shown, based upon the type of vessel chosen.","A Daemonship may not be commanded by a Warmaster or a Chaos Lord, even if it is the largest ship in the fleet.","A Daemonship may not have a Chaos Space Marine crew.","All Daemonships in a Pleasurefleet must take the Mark of Slaanesh, which is already included in the cost to upgrade them to Daemonships."],"ents":[{"l":"Battleship","r":null,"p":75,"src_page":249,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Grand cruiser","r":null,"p":55,"src_page":249,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Heavy cruiser","r":null,"p":50,"src_page":249,"a":1,"u":1,"mx":null,"nt":null,"k":"up"},{"l":"Cruiser","r":null,"p":45,"src_page":249,"a":1,"u":1,"mx":null,"nt":null,"k":"up"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[12]}],"text":["These vessels may not contain a Chaos Warmaster, a Chaos Lord or have a Chaos Space Marine crew, neither can they be given Marks."],"ents":[{"l":"Idolator class raider","r":281,"p":45,"src_page":249,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Infidel class raider","r":282,"p":40,"src_page":249,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Iconoclast class destroyer","r":283,"p":30,"src_page":249,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":[],"ents":[]},{"t":"Doomfire bombers and","rules":[],"text":[],"ents":[]},{"t":"Marine crew may be","rules":[],"text":["equipped with Thunderhawk Gunships but if so it may only carry Thunderhawks and may not launch Swiftdeaths, Doomfires and Dreadclaws."],"ents":[]},{"t":"Furthermore the launch","rules":[],"text":[],"ents":[]},{"t":"This is because the launch","rules":[],"text":[],"ents":[]}]},{"nm":"Eldar Corsairs","pg":316,"secs":[{"t":"FLEET RULES (pg. 310\u2013315)","rules":[],"text":["ELDAR CREW SKILLS Over the course of a campaign, a ship\u2019s crew develops experience that only comes from serving together in the crucible of war.","When the ship attempts to make Lock-On Special Orders, you may roll 3D6 and discard the highest D6 before comparing the roll against the ship\u2019s leadership.","This vessel may always attempt to go on Special Orders, even if another ship or squadron in the fleet has failed a command check this turn.","Bombers launched by this vessel may survive being intercepted by enemy fighters utilizing the \u2018Resilient Attack Craft\u2019 4+ save rule in the same manner as Eldar fighters.","This ship may re-roll the dice in a boarding action.","Disciplined Crew: Whenever this ship checks leadership or attempts to go on Special Orders, you may roll 3D6 and discard the highest D6 before comparing the roll against the ship\u2019s leadership.","Elite Command Crew: Once per battle the ship may automatically pass a Leadership test or command check \u2013 there is no need to roll any dice.","This may be used even if another ship or squadron in the fleet has failed a command check this turn.","The defender (Eldar) does not spend extra points on planetary defences \u2013 these are included in the special rules for the craftworld instead (see below).","Since the attackers are Tyranids, they do not gain any extra transport models (since all Tyranid ships are \u2018transports\u2019 in effect), but if you want to replay this scenario with another attacker, they may take two free transports for every 500 points (or part) in his fleet.","Reserves: Any number of Eldar ships (including the flagship!) may be purchased against the fleet\u2019s total at 50% cost, but they count as reserves and start off the table.","Ships may not use their re-rolls if they are not yet in play.","Roll a D6 for each defending ship/ squadron (except Shadowhunters) on patrol: on a 1-3 the attacker may set up the ship/squadron, on a 4-6 the defender may set it up.","DEFENDER'S DEPLOYMENT AREA ATTACKER'S DEPLOYMENT AREA 30 cm 30 cm 30 cm 30 cm 150 cm 15 cm Ships on patrol may be set up anywhere that is not within 30cm of a table edge or within an area of celestial phenomena.","Shadowhunter Patrols Shadowhunters are quite simply the most nimble patrol vessels in the galaxy, and so must always be set-up on patrol, but no dice roll is required, and they are always deployed by the defender.","However, if you are refighting this scenario with another craftworld as the target, or if you want to introduce some degree of randomness into the game, you can always vary the size of the craftworld, or roll on a dice: 1 = small (no more than 15cm) , 2-5 = medium (no more than 20cm, 6 = large (no more than 30cm).","The craftworld is placed no more than 150cm from one of the short table edges.","Instead of planetary defenses in the normal sense, individual areas of the Craftworld are purpose-constructed to provide for its collective defense.","Whilst other craftworlds may vary in their defenses, you can safely use the following rules as standard for all craftworlds.","Each time an Assault Point is scored (or \u2018landed\u2019 on the Craftworld), roll a dice.","During the Eldar player\u2019s Shooting phase, the two fortresses each unleash one 45cm pulsar lance against each escort squadron or capital ship on the Low Orbit table.","These cannot be redirected or \u201cstacked\u201d on a single or group of targets; each enemy escort squadron or capital ship can receive no more than two pulsar lance shots that roll to hit in the normal manner pulsar lances are used.","During each End phase, roll one dice for each Assault Point already scored on the craftworld.","No matter how many 6\u2019s are rolled, only a single \u20131 reduction can apply in each End phase, meaning only a single Fortress can be affected by a single -1 reduction each end phase.","The number of pulsar lances fired at each enemy ship in low orbit is reduced by 1 for every Fortress destroyed.","Like the fortresses, one dice must be rolled during each End Phase for each Assault Point already scored on the craftworld.","If any of these score a \u20186\u2019 the Spear of Light is damaged, and a Reload Ordnance special order must be passed each time the weapon is used again.","Unlike when coming in contact with a planet\u2019s surface, the vessel does not count as destroyed by doing so, though it must subsequently remain in place for one full turn.","It gains +4D6 to repair critical damage in the End Phase and may regain up to 1Hp damage for every roll of 6 not used to repair critical damage (all critical damage must be repaired before this benefit can be taken).","Additionally, it counts as passing a Reload Ordnance special order for free.","However, it may not move, shoot or launch ordnance while docked, critical damage that cannot normally be repaired during a battle (such as holofields damaged) still remains damaged, and while docked to the Craftworld the ship counts as defences for purposes of being fired upon using the gunnery table.","Holofields work normally against gunnery-based weapons, and the ship benefits from an additional right column shift and may ignore blast markers while docked, as it is inside the sheath of the craftworld\u2019s powerful polarization field.","Each one of these is capable of opening vast portals sizable enough for even the largest of the Eldar\u2019s war machines.","On a 5+, D3 capital ships and/or escort squadrons of the owning player\u2019s choice held in reserve at the start of the game now appear along the table edge closest to the Craftworld no more than 30cm away from it.","Eldar ships cannot move or shoot in the same turn they appear.","FIRST TURN The players roll a D6, with each player adding their fleet\u2019s initiative (attack rating) to the roll.","Whoever got the highest may take either the first or second turn.","SPECIAL RULES Attacking ships must move within 30cm of the craftworld table edge (which obviously replaces the planet edge) on the low orbit table to send troops to the surface and bombard enemy positions.","However, should you wish to vary the attackers, the following basic rules apply: For each turn an attacking capital ship spends within 30cm of the craftworld edge, the attacker scores 1 Assault Point.","For each turn an attacking transport spends within 30cm of the craftworld edge, the attacker scores 2 Assault Points.","A ship deploying troops or bombarding the craftworld may not do anything else that turn."],"ents":[]},{"t":"Pirate Prince","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Pirate Prince","sec":[1],"ok":true,"hdr":1}],"text":["You may include 1 Pirate Prince in your fleet, who must be assigned to a ship and adds +2 to its Leadership, to a maximum of 10.","If the fleet is worth over 750 points a Pirate Prince must be included to lead it.","You may purchase Fleet Commander re-rolls for your Pirate Prince by paying the cost listed below."],"ents":[{"l":"Pirate Prince (+2 Ld)","r":null,"p":100,"src_page":316,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":25,"src_page":316,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Two re-rolls","r":null,"p":50,"src_page":316,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Three re-rolls","r":null,"p":100,"src_page":316,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]}]},{"t":"Eldar Hero","rules":[],"text":["Your fleet may be led by an Eldar Hero, in place of its normal fleet commander.","Only a fleet led by an Eldar Hero may take reserves from the Craftworld Eldar fleet list.","You may purchase Fleet Commander re-rolls for your Eldar Hero by paying the cost listed below."],"ents":[{"l":"Eldar Hero (Ld 10)","r":null,"p":100, uryan is taken, the Eldar Hero must be embarked aboard it."],"ents":[]},{"t":"Pirate Prince","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Pirate Prince","sec":[7],"ok":true,"hdr":1}],"text":["You may include 1 Pirate Prince in your fleet, who must be assigned to a ship and adds +2 to its Leadership, to a maximum of 10.","If the fleet is worth over 750 points a Pirate Prince must be included to lead it.","You may purchase Fleet Commander re-rolls for your Pirate Prince by paying the cost listed below."],"ents":[{"l":"Pirate Prince (+2 Ld)","r":null,"p":100,"src_page":317,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":25,"src_page":317,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[7,0]]},{"l":"Two re-rolls","r":null,"p":50,"src_page":317,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[7,0]]},{"l":"Three re-rolls","r":null,"p":100,"src_page":317,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[7,0]]}]},{"t":"Eldar Hero","rules":[],"text":["Your fleet may be led by an Eldar Hero, in place of its normal fleet commander.","Only a fleet led by an Eldar Hero may take reserves from the Craftworld Eldar fleet list.","You may purchase Fleet Commander re-rolls for your Eldar Hero by paying the cost listed below."],"ents":[{"l":"Eldar Hero (Ld 10)","r":null,"p":100,"src_page":317,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":50,"src_page":317,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[8,0]]},{"l":"Two re-rolls","r":null,"p":75,"src_page":317,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[8,0]]},{"l":"Three re-rolls","r":null,"p":100,"src_page":317,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[8,0]]}]},{"t":"Battleships","rules":[],"text":["Your fleet may include up to one battleship for every full 1,000 points it contains.","Therefore, if you have between 0 to 999 points, you cannot field any battleships, while from 1000 to 1,999 points you can i
