/* Kortin sisalto vaihtelee; ruutu on kiinteat 135 mm, joten liian pitka
   kortti kutistetaan mahtumaan sen sijaan etta se leikkautuisi pois. */
function fitCards(){
  const sheet = $("#sheet");
  const prev = sheet.getAttribute("style") || "";
  sheet.setAttribute("style", "display:block;position:absolute;left:-20000px;top:0");

  /* Jokainen kategorian sisalto sovitetaan omaan laatikkoonsa. Skaalauksella
     ei ole kovaa alarajaa: mitaan ei leikata tai piiloteta, vaikka tuloksena
     olisi poikkeuksellisella datalla hyvin pieni teksti. */
  const fitInto = (box, content) => {
    let k = 1, guard = 0;
    const apply = () => {
      content.style.transform = k < .999 ? "scale(" + k.toFixed(4) + ")" : "";
      content.style.width = k < .999 ? (100 / k).toFixed(2) + "%" : "";
    };
    apply();
    while(content.getBoundingClientRect().height > box.clientHeight - 1 && guard < 240){
      k *= .96; apply(); guard++;
    }
    const overflow = content.getBoundingClientRect().height > box.clientHeight - 1;
    content.dataset.fitScale = k.toFixed(4);
    content.dataset.fitOverflow = overflow ? "true" : "false";
    return {k, overflow};
  };

  /* Ylipitka solu pienennetaan katkaisun sijaan. Nimisarakkeessa se koskee
     koko nimea, rivittyvissa sarakkeissa vain sanaa joka on yksinaan
     saraketta leveampi - rivitys ei voi katkaista sanan sisalta. Alaraja
     0,8: sita pienempi teksti olisi kortilla yhta hukassa kuin ellipsis.
     Luku ja kirjoitus on eroteltu, jottei jokainen solu pakota omaa
     uudelleenladontaansa. */
  const cells = [...sheet.querySelectorAll(".k-arm td.nm,.k-arm td.rg,.k-arm td.st")];
  cells.forEach(td => { td.style.fontSize = ""; });
  cells.filter(td => td.scrollWidth > td.clientWidth).forEach(td => {
    const base = parseFloat(getComputedStyle(td).fontSize);
    /* Nimisarake on rivin paaotsikko ja pitaa 0,8:n rajan. Range ja Str
       ovat toissijaisia, ja niissa esiintyy yksittaisia sanoja jotka ovat
       yksinaan saraketta leveampia ("Thunderhawks:"); niille sallitaan
       0,72, mika on 150 %:n tulosteessa yha 6,5 pt. */
    const floor = td.classList.contains("nm") ? .8 : .72;
    let px = base, guard = 0;
    while(td.scrollWidth > td.clientWidth && guard < 24 && px > base * floor){
      px *= .98; td.style.fontSize = px.toFixed(3) + "px"; guard++;
    }
    /* Yksi askel lisaa pyoristysvaraksi: scrollWidth on kokonaisluku, joten
       silmukka pysahtyy kun ylitysta on viela alle pikselin - ja juuri se
       jattaa ellipsiksen nakyviin. */
    if(guard){ px *= .98; td.style.fontSize = px.toFixed(3) + "px"; }
  });

  sheet.querySelectorAll(".k").forEach(card => card.dataset.contentOverflow = "false");
  sheet.querySelectorAll(".k-box > .k-bd > .fit-content").forEach(content => {
    const result = fitInto(content.parentElement, content);
    const card = content.closest(".k");
    if(content.classList.contains("k-opt-list")) card.dataset.optionScale = result.k.toFixed(4);
    if(result.overflow) card.dataset.contentOverflow = "true";
  });

  /* Pitka nimi ei jaa ellipsiksi: pienennetaan vain otsikkoa kunnes se mahtuu. */
  sheet.querySelectorAll(".k-hd h3").forEach(title => {
    let px = parseFloat(getComputedStyle(title).fontSize), guard = 0;
    while(title.scrollWidth > title.clientWidth && guard < 160){
      px *= .96; title.style.fontSize = px.toFixed(3) + "px"; guard++;
    }
  });

  sheet.querySelectorAll(".k > .kfit").forEach(fit => {
    const room = fit.parentElement.clientHeight;
    let k = 1, guard = 0;
    while(fit.scrollHeight * k > room + .5 && guard < 240){
      k *= .96;
      fit.style.transform = "scale(" + k.toFixed(4) + ")";
      fit.style.width = (100 / k).toFixed(2) + "%";
      guard++;
    }
    fit.parentElement.dataset.cardScale = k.toFixed(4);
    if(fit.scrollHeight * k > room + .5)
      fit.parentElement.dataset.contentOverflow = "true";
  });
  sheet.setAttribute("style", prev);
}

/* ---------------------------------------------- Download for editing ----
   Sama arkki tiedostona, jossa tekstia voi klikata ja kirjoittaa paalle.
   Tiedosto on itsenainen: CSS ja sovitusskripti tulevat mukaan, joten se
   toimii ilman verkkoa ja ilman tata sovellusta. */

/* Muokkausisantana on kokonainen sivu, ei yksittaiset tekstit. Vain nain
   myos otsikot, aseistuksen nimisolu ja kriittisten vaurioiden rivit ovat
   valittavissa ja poistettavissa - ne ovat elementteja joilla on lapsia,
   eivatka siis olisi lehtia. Rakenteen saa rikki, ja se on tarkoitus:
   arkki on tehokayttajan tyokalu ja vaarin menneen korjaa lataamalla
   uudelleen. */
function markEditable(root){
  root.querySelectorAll(".page").forEach(page => {
    page.setAttribute("contenteditable", "true");
    page.setAttribute("spellcheck", "false");
  });
}

/* Ladatun tiedoston oma kuori: harmaa tausta, sivut keskella, tyokalurivi.
   Tulostettaessa kuori katoaa ja jaljelle jaa tasan sama arkki kuin
   Print cards tuottaa. */
const EDITOR_CSS = [
  "body{margin:0;background:#3A3634}",
  ".sheet{display:block}",
  ".sheet .page{margin:8mm auto;box-shadow:0 2px 16px rgba(0,0,0,.5)}",
  ".edbar{position:sticky;top:0;z-index:20;background:#211F20;color:#F6F2E9;",
  "  padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;",
  "  font:500 13px/1.35 'IBM Plex Sans',Arial,sans-serif}",
  ".edbar button{font:600 12px/1 'IBM Plex Sans',Arial,sans-serif;cursor:pointer;",
  "  padding:7px 12px;border:1px solid #6B6769;border-radius:3px;",
  "  background:#2E2A29;color:#F6F2E9}",
  ".edbar button.primary{background:#D1792A;border-color:#D1792A;color:#fff}",
  ".edbar span{color:#B9B3AC;font-weight:400;font-size:12px}",
  ".page[contenteditable]:focus{outline:2px solid #D1792A;outline-offset:2px}",
  ".page[contenteditable]{cursor:text}",
  /* Rastiruutu ei ole tekstia vaan CSS:n piirtama, joten se saa oman
     klikkauskytkimen; kursori kertoo etta rivia voi napsauttaa. */
  ".k-opt .cb,.k-arm .wb,.k-arm .rb{cursor:pointer}",
  "@media print{.edbar{display:none}.sheet .page{margin:0;box-shadow:none}",
  "  body{background:#fff}[contenteditable]{outline:none!important;",
  "  background:transparent!important}}"
].join("\n");

/* Sovitus ajetaan ladatussa tiedostossa uudelleen jokaisen muokkauksen
   jalkeen. fitCards menee mukaan lahdekoodina eika kopiona, jottei
   sovituslogiikka paase eriytymaan. */
function editorScript(){
  return [
    /* Oma sulkeuma: mitaan ei jaa globaaliin nimiavaruuteen, joten
       tiedosto ei voi tormata isantasivun kanssa. */
    '(function(){',
    'var $=function(q){return document.querySelector(q)};',
    fitCards.toString(),
    'function refit(){',
    '  document.querySelectorAll(".k-hd h3").forEach(function(h){h.style.fontSize="";});',
    '  fitCards();',
    '}',
    /* Rastin X on CSS:n content-arvo eika tekstia, joten sita ei voi
       poistaa kirjoittamalla. Klikkaus kaantaa sen paalle ja pois. */
    'document.addEventListener("click",function(e){',
    '  var b=e.target.closest?e.target.closest(".k-opt .cb,.k-arm .wb,.k-arm .rb"):null;',
    '  if(!b)return;',
    /* Ympyra on ryhmavalinta: yksi paalle, sisarukset pois. */
    '  if(b.classList.contains("rb")){',
    '    var g=b.closest("tbody");',
    '    if(g)[].forEach.call(g.querySelectorAll(".rb"),function(o){',
    '      o.classList.remove("on");});',
    '    b.classList.add("on"); return;',
    '  }',
    '  b.classList.toggle("on");',
    '});',
    'var t=null;',
    'document.addEventListener("input",function(){',
    '  clearTimeout(t); t=setTimeout(refit,220);',
    '});',
    /* Liitetty teksti puhtaana: selain tyontaisi muuten omaa merkintaansa. */
    'document.addEventListener("paste",function(e){',
    '  var el=e.target;',
    '  if(!el||!el.getAttribute||!el.getAttribute("contenteditable"))return;',
    '  e.preventDefault();',
    '  var txt=(e.clipboardData||window.clipboardData).getData("text");',
    '  document.execCommand("insertText",false,String(txt).replace(/\\s+/g," "));',
    '});',
    'function saveCopy(){',
    '  var doc="<!DOCTYPE html>\\n"+document.documentElement.outerHTML;',
    '  var a=document.createElement("a");',
    '  a.href=URL.createObjectURL(new Blob([doc],{type:"text/html;charset=utf-8"}));',
    '  a.download=document.title.replace(/[^\\w .-]+/g,"_")+".html";',
    '  document.body.appendChild(a); a.click(); a.remove();',
    '  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);',
    '}',
    'var bar=document.querySelector(".edbar");',
    'if(bar){',
    '  bar.querySelector("[data-act=save]").onclick=saveCopy;',
    '  bar.querySelector("[data-act=print]").onclick=function(){window.print();};',
    '}',
    'refit();',
    '})();'
  ].join("\n");
}

function downloadEditable(){
  if(!buildCardSheet()) return;
  const css = [...document.querySelectorAll("style")]
    .map(el => el.textContent).join("\n");
  const sheet = $("#sheet").cloneNode(true);
  markEditable(sheet);
  const title = L().nm + " \u2013 fleet cards";
  const bar = '<div class="edbar">' +
    '<button class="primary" data-act="print">Print / Save as PDF</button>' +
    '<button data-act="save">Save edited copy</button>' +
    '<span>Everything on the page is editable \u2014 click and type, or ' +
    'select and delete. Click a tick box to toggle it. The layout re-fits ' +
    'itself after every edit, so nothing overflows. No undo beyond ' +
    'Ctrl+Z: if you break it, download the sheet again. This is a ' +
    'printout, not the builder \u2014 edits do not go back and points are ' +
    'not recalculated.</span>' +
    '</div>';
  const doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
    '<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
    "<title>" + esc(title) + "</title>\n" +
    "<style>\n" + css + "\n</style>\n" +
    "<style>\n" + EDITOR_CSS + "\n</style>\n" +
    "</head>\n<body>\n" + bar + "\n" + sheet.outerHTML +
    /* Tagit kootaan paloista. Kirjaimellinen avaustagi lahteessa
       katkaisisi sen, miten testit ja layout-audit poimivat sovelluksen
       koodin: ne jakavat tiedoston sillA merkkijonolla ja ottavat [1]. */
    "\n<scr" + "ipt>\n" + editorScript() +
    "\n<\/scr" + "ipt>\n</body>\n</html>\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([doc], {type: "text/html;charset=utf-8"}));
  a.download = title.replace(/[^\w .-]+/g, "_") + ".html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function setPage(portrait, margin = "0"){
  let st = document.getElementById("pagecss");
  if(!st){ st = document.createElement("style"); st.id = "pagecss"; document.head.appendChild(st); }
  st.textContent = "@page{size:A4 " + (portrait ? "portrait" : "landscape") + ";margin:" + margin + "}";
}

/* Arkin rakennus erillaan tulostuksesta, jotta Download for editing saa
   tasan saman tulosteen eika omaa muunnelmaansa. */
function buildCardSheet(){
  const units = S.units.filter(u => shipOf(u));
  if(!units.length){ alert("Add at least one ship first."); return 0; }
  const pages = Math.ceil(units.length / 2);
  let html = "";
  for(let i = 0; i < units.length; i += 2){
    const p = i / 2 + 1;
    html += `<div class="page">
      <div class="pghead"><b>${esc(L().nm)} &ndash; fleet cards</b>
        <i>${esc(DATA.src)}</i>
        <span class="rt">2 cards / A4 | 144 x 135 mm | print 100 % | page ${p}/${pages}</span></div>
      ${cardHTML(units[i], "top")}
      ${units[i + 1] ? cardHTML(units[i + 1], "bot") : ""}</div>`;
  }
  setPage(true);
  $("#sheet").innerHTML = html;
  fitCards();
  return units.length;
}

function printCards(){
  if(!buildCardSheet()) return;
  window.print();
}

/* Kehittajan regressioajo: ?layout-audit=1 renderoi kaikki profiilit oikealla
   kortti-CSS:lla, ajaa samat sovitukset kuin Print cards ja tallettaa tiiviin
   tuloksen body[data-layout-audit]-attribuuttiin. Ei tulosta eika muuta
   tallennettua laivastoa. */
async function auditAllCardLayouts(){
  const saved = JSON.parse(JSON.stringify(S));
  const chunks = [];
  let cards = 0;
  LISTS.forEach((fleet, li) => {
    S.li = li; S.limit = 100000; S.units = [];
    fleet.secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
      if(!en.r || !SHIPS[String(en.r)]) return;
      const u = {s:si,e:ei,ref:en.r,n:1,opts:[],os:{},name:""};
      if(isEscort(u)) u.n = 3;
      S.units.push(u);
    }));
    for(let i=0; i<S.units.length; i+=2){
      chunks.push(`<div class="page" data-audit-fleet="${esc(fleet.nm)}">
        ${cardHTML(S.units[i], "top")}
        ${S.units[i+1] ? cardHTML(S.units[i+1], "bot") : ""}</div>`);
    }
    cards += S.units.length;
  });
  setPage(true);
  $("#sheet").innerHTML = chunks.join("");
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  fitCards();
  const rows = [...document.querySelectorAll("#sheet .k")].map(card => ({
    fleet: card.closest(".page").dataset.auditFleet,
    name: card.querySelector(".k-hd h3").textContent,
    options: +(card.dataset.optionCount || 0),
    optionScale: +(card.dataset.optionScale || 1),
    cardScale: +(card.dataset.cardScale || 1),
    overflow: card.dataset.contentOverflow === "true",
    zoneScale: Math.min(...[...card.querySelectorAll(".fit-content")]
      .map(zone => +(zone.dataset.fitScale || 1)))
  }));
  const summary = {
    lists: LISTS.length, cards,
    overflows: rows.filter(row => row.overflow).length,
    minOptionScale: Math.min(...rows.map(row => row.optionScale)),
    minZoneScale: Math.min(...rows.map(row => row.zoneScale)),
    minCardScale: Math.min(...rows.map(row => row.cardScale)),
    worst: rows.sort((a,b) => a.optionScale - b.optionScale).slice(0,8)
  };
  document.body.dataset.layoutAudit = JSON.stringify(summary);
  S = saved; render();
  return summary;
}

/* Yhden profiilin ruutunakyma visuaalista QA:ta varten, esim.
   ?card-audit=432. Ei koske normaalia kayttoa tai tulostusta. */
async function auditOneCard(ref){
  let picked = null;
  LISTS.some((fleet, li) => fleet.secs.some((sec, si) => sec.ents.some((en, ei) => {
    if(String(en.r || "") !== String(ref) || !SHIPS[String(en.r)]) return false;
    picked = {fleet, li, si, ei, en}; return true;
  })));
  if(!picked) throw new Error("Unknown card profile " + ref);
  const saved = JSON.parse(JSON.stringify(S));
  S.li = picked.li;
  const u = {s:picked.si,e:picked.ei,ref:picked.en.r,n:1,opts:[],os:{},name:""};
  if(isEscort(u)) u.n = 3;
  document.body.classList.add("card-audit");
  $("#sheet").innerHTML = `<div class="page"><div class="pghead"><b>${esc(picked.fleet.nm)}</b>
    <i>${esc(DATA.src)}</i><span class="rt">visual QA | ${esc(String(ref))}</span></div>
    ${cardHTML(u,"top")}</div>`;
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  fitCards();
  S = saved;
}

function printRoster(){
  const rows = S.units.map(u => {
    const sh = shipOf(u), en = entOf(u);
    const opts = sh ? sh.ol.map((o, i) => optState(u, i) === "take" ? o.t : "")
                          .filter(Boolean) : [];
    if((u.note||"").trim()) opts.push(u.note.trim());
    return `<tr><td>${esc(u.name || "")}</td>
      <td>${esc(title(sh ? sh.nm : en.l))}${hulls(u) > 1 ? " \u00d7 " + hulls(u) : ""}
        ${opts.length ? `<br><span style="font-size:7.5pt;color:#555">${esc(opts.join(" \u00b7 "))}</span>` : ""}</td>
      <td>${sh ? sh.ty : "option"}</td><td class="n">${sh ? (sh.hp||"\u2013") : "\u2013"}</td>
      <td class="n">${unitPts(u)}</td></tr>`;
  }).join("");
  const cs = checks();
  /* Rosteri saa jatkua niin monelle A4-sivulle kuin tarvitsee. Sivun oma
     tulostusmarginaali suojaa myos jatkosivut; taulukon otsikko toistuu. */
  setPage(true, "14mm");
  $("#sheet").innerHTML = `<div class="rost">
    <h1>${esc(L().nm)}</h1>
    <p class="sub">${total()} / ${S.limit|0} pts \u00b7 ${S.units.length} units \u00b7
      ${S.units.reduce((a,u)=>a+hulls(u),0)} hulls \u00b7 ${esc(DATA.src)}</p>
    <table><thead><tr><th>Name</th><th>Class &amp; options</th><th>Type</th><th>Hits</th><th>Pts</th></tr></thead>
      <tbody>${rows}
      <tr class="tot"><td colspan="4">Total</td><td class="n">${total()}</td></tr></tbody></table>
    <div class="rules"><h4>Legality checks</h4><ul>${cs.map(c =>
      `<li>${c.ok ? "PASS" : "FAIL"} \u2014 ${esc(c.t)} (${esc(c.v)}): ${esc(c.s)}</li>`).join("")}</ul>
      <p>Rules that could not be machine-checked are listed in the builder under each
      section and remain the player's responsibility.</p></div>
  </div>`;
  window.print();
}

function listText(){
  const lines = [L().nm + " \u2014 " + total() + "/" + (S.limit|0) + " pts", ""];
  S.units.forEach(u => {
    const sh = shipOf(u), en = entOf(u);
    let s = "\u2022 " + (u.name ? u.name + " \u2014 " : "") + title(sh ? sh.nm : en.l);
    if(hulls(u) > 1) s += " \u00d7 " + hulls(u);
    s += "  " + unitPts(u) + " pts";
    (u.opts||[]).forEach(i => { if(sh && sh.ol[i]) s += "\n    \u2013 " + sh.ol[i].t; });
    lines.push(s);
  });
  const bad = checks().filter(c => !c.ok);
  lines.push("", bad.length ? "Fails: " + bad.map(c => c.t + " (" + c.v + ")").join("; ")
                            : "All machine-checked restrictions pass.");
  lines.push("Built with Gothic Fleet Registry \u00b7 " + DATA.src);
  return lines.join("\n");
}

/* -------------------------------------------------------------- wire ---- */
$("#listsel").onchange = e => { S.li = +e.target.value; S.units = []; render(); };
$("#limit").oninput = e => { S.limit = parseInt(e.target.value, 10) || 0; renderTop(); renderChecks(); save(); };
$("#printcards").onclick = printCards;
$("#editcards").onclick = downloadEditable;
$("#printroster").onclick = printRoster;
$("#reset").onclick = () => { if(confirm("Clear the whole fleet?")){ S.units = []; render(); } };
$("#copy").onclick = async () => {
  const t = listText();
  try{ await navigator.clipboard.writeText(t); $("#copy").textContent = "Copied"; }
  catch(e){ $("#copy").textContent = "Press Ctrl+C";
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.body.removeChild(ta); }
  setTimeout(() => $("#copy").textContent = "Copy list", 1600);
};

if(typeof location !== "undefined"){
  const qa = new URLSearchParams(location.search);
  if(qa.has("card-audit")){
    setTimeout(() => auditOneCard(qa.get("card-audit")).catch(err => {
      document.body.dataset.layoutAudit = JSON.stringify({error:String(err)});
    }), 0);
  }else if(qa.has("layout-audit")){
    document.body.dataset.layoutAudit = "running";
    setTimeout(() => auditAllCardLayouts().catch(err => {
      document.body.dataset.layoutAudit = JSON.stringify({error:String(err)});
    }), 0);
  }
}
window.onafterprint = () => { $("#sheet").innerHTML = ""; setPage(false); };

load();
if(!LISTS[S.li]) S.li = 0;
render();
</script>


<script>
(function(){
  function pickList(rx){
    for(var i=0;i<LISTS.length;i++) if(rx.test(LISTS[i].nm)) return i;
    return 0;
  }
  function rowIn(li, rx){
    for(var si=0; si<LISTS[li].secs.length; si++)
      for(var ei=0; ei<LISTS[li].secs[si].ents.length; ei++){
        var en = LISTS[li].secs[si].ents[ei];
        if(en.r && rx.test(en.l||"")) return {si:si, ei:ei};
      }
    return null;
  }
  try{
    var li = pickList(/Space Marines .* Codex/i);
    S.li = li; S.limit = 1500; S.units = [];
    [/^Battle barge$/i, /strike cruiser/i, /strike cruiser/i,
     /Nova class/i, /Hunter class/i].forEach(function(rx){
      var r = rowIn(li, rx);
      if(r) addUnit(r.si, r.ei);
    });
    if(S.units[1]) setOptState(S.units[1], 1, "take");
    if(S.units[2]) S.units[2].name = "Sword of Baal";
    render();
    /* Vasen sarake alusriveihin asti: saantoteksti on hyodyllista mutta
       esitteessa halutaan nayttaa ostettavat alukset. */
    var cat = document.querySelector(".work > div, .cat, #catalogue");
    setTimeout(function(){
      var secs = document.querySelectorAll(".work h3, .work h2, .sec");
      var target = null;
      document.querySelectorAll("*").forEach(function(e){
        if(!target && /BATTLE BARGES/.test(e.textContent||"") && e.children.length===0)
          target = e;
      });
      if(target && target.scrollIntoView) target.scrollIntoView({block:"start"});
      document.title = "ready";
    }, 60);
  }catch(e){ document.title = "boot error: " + e.message; }
})();
</script>
