<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Gothic Fleet Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ============================================================ TOKENS ===== */
:root{
  --ground:#E6E9ED; --panel:#F4F6F8; --sunk:#DCE1E6; --line:#C3CBD3;
  --line-soft:#D6DCE2; --ink:#141A21; --ink-2:#3E4A57; --ink-3:#6B7885;
  --accent:#1F6F63; --accent-ink:#12463E; --accent-wash:#DCEAE7;
  --brass:#8A6A26; --brass-wash:#F0E7D2;
  --ok:#2F6B48; --ok-wash:#DDEBE2;
  --warn:#8A5B12; --warn-wash:#F5E9D5;
  --bad:#993330; --bad-wash:#F6DEDC;
  --shadow:0 1px 2px rgba(20,26,33,.08), 0 8px 24px -16px rgba(20,26,33,.35);
  --r:3px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F151B; --panel:#161E26; --sunk:#0B1116; --line:#2C3945;
    --line-soft:#222D38; --ink:#E4EAF0; --ink-2:#A9B6C3; --ink-3:#778695;
    --accent:#5FB3A3; --accent-ink:#A5D8CD; --accent-wash:#15302C;
    --brass:#C9A45C; --brass-wash:#2C2517;
    --ok:#6FBF8E; --ok-wash:#162C21;
    --warn:#D6A340; --warn-wash:#2E2415;
    --bad:#E5807A; --bad-wash:#331A19;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0F151B; --panel:#161E26; --sunk:#0B1116; --line:#2C3945;
  --line-soft:#222D38; --ink:#E4EAF0; --ink-2:#A9B6C3; --ink-3:#778695;
  --accent:#5FB3A3; --accent-ink:#A5D8CD; --accent-wash:#15302C;
  --brass:#C9A45C; --brass-wash:#2C2517;
  --ok:#6FBF8E; --ok-wash:#162C21;
  --warn:#D6A340; --warn-wash:#2E2415;
  --bad:#E5807A; --bad-wash:#331A19;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================= CHROME ==== */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:14px 18px; align-items:flex-end;
  padding:12px 20px;
}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{
  font:600 20px/1 var(--disp); letter-spacing:.055em; text-transform:uppercase;
}
.brand span{font:400 11px/1.35 var(--mono);color:var(--ink-3);letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:4px}
.field>label{
  font:600 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3);
}
select,input[type=number],input[type=text]{
  background:var(--ground); border:1px solid var(--line); border-radius:var(--r);
  padding:7px 9px;
}
select{max-width:320px}
input[type=number]{width:104px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{
  background:var(--ground); border:1px solid var(--line); border-radius:var(--r);
  padding:7px 12px; cursor:pointer;
  font:600 12px/1.2 var(--sans); letter-spacing:.03em;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#08120F}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary:hover{color:#08120F}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.tally{
  display:flex;align-items:baseline;gap:8px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  border-left:3px solid var(--accent); padding-left:12px;
}
.tally b{font:600 26px/1 var(--mono)}
.tally i{font-style:normal;font-size:12px;color:var(--ink-3)}
.tally.over b{color:var(--bad)}

/* ============================================================= LAYOUT ==== */
.work{
  display:grid; grid-template-columns:minmax(0,7fr) minmax(0,9fr);
  gap:18px; padding:18px 20px 60px; align-items:start;
  max-width:1560px; margin:0 auto;
}
@media (max-width:1020px){.work{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden;
}
.card>h2{
  margin:0; padding:9px 14px; background:var(--sunk);
  border-bottom:1px solid var(--line);
  font:600 11px/1.2 var(--sans); letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-2); display:flex; justify-content:space-between; gap:10px;
}
.card>h2 em{font-style:normal;color:var(--ink-3);font-weight:500;letter-spacing:.04em}

/* ---------------------------------------------------------- catalogue --- */
.sec{border-bottom:1px solid var(--line-soft)}
.sec:last-child{border-bottom:0}
.sec>summary{
  cursor:pointer; padding:9px 14px; display:flex; gap:10px; align-items:center;
  font:600 13px/1.2 var(--disp); letter-spacing:.05em; text-transform:uppercase;
  list-style:none;
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{
  content:"+"; font-family:var(--mono); color:var(--ink-3); width:12px;
}
.sec[open]>summary::before{content:"\2013"}   /* CSS-escape, ei HTML-entiteetti */
.sec>summary .n{
  margin-left:auto; font:500 11px/1 var(--mono); color:var(--ink-3);
  letter-spacing:0;
}
.secbody{padding:0 14px 12px}
.limitchip{
  display:inline-block; font:500 10px/1.6 var(--mono); letter-spacing:.02em;
  background:var(--brass-wash); color:var(--brass);
  border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);
  border-radius:2px; padding:0 6px; margin-left:8px; text-transform:none;
}
.rule{
  font:400 12px/1.55 var(--sans); color:var(--ink-2);
  border-left:2px solid var(--accent); padding:2px 0 2px 10px; margin:0 0 8px;
}
.rule.manual{border-left-color:var(--line)}
.rule b{
  font:600 9px/1.6 var(--sans); letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); display:block;
}
.rule.manual b{color:var(--ink-3)}
.pick{
  display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center;
  padding:5px 0; border-top:1px solid var(--line-soft);
}
.pick:first-of-type{border-top:0}
.pick .nm{font:500 13px/1.3 var(--sans)}
.pick .nm small{display:block;color:var(--ink-3);font:400 11px/1.4 var(--mono)}
.pick .p{font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--brass)}
.pick .warn{
  grid-column:1/-1; margin:2px 0 4px;
  font:400 11px/1.45 var(--sans); color:var(--warn);
  background:var(--warn-wash); border-left:2px solid var(--warn);
  padding:4px 8px; border-radius:2px;
}
.pick .warn b{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:9px;display:block}
.add{
  border:1px solid var(--line); background:var(--ground); border-radius:2px;
  width:26px;height:24px;cursor:pointer;font:600 15px/1 var(--sans);color:var(--accent)
}
.add:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* --------------------------------------------------------------- fleet -- */
.unit{border-bottom:1px solid var(--line-soft);padding:10px 14px}
.unit:last-child{border-bottom:0}
.uhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.uhead .cls{
  font:600 14px/1.2 var(--disp); letter-spacing:.04em; text-transform:uppercase;
}
.uhead .ty{font:400 11px/1 var(--mono);color:var(--ink-3)}
.uhead .pts{margin-left:auto;font:600 14px/1 var(--mono);color:var(--brass)}
.uctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}
.uctl input[type=text]{padding:4px 7px;font-size:13px}
.uctl .nmin{flex:1 1 190px;min-width:130px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:2px}
.stepper button{border:0;background:transparent;width:24px;height:26px;cursor:pointer;color:var(--accent);font:600 14px/1 var(--sans)}
.stepper span{
  min-width:34px;text-align:center;font:500 12px/1 var(--mono);
  border-left:1px solid var(--line);border-right:1px solid var(--line);padding:7px 0
}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;
  margin-top:7px;font-size:12px;line-height:1.5}
.tri{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;flex:none}
.tri button{
  border:0;background:var(--ground);cursor:pointer;padding:3px 7px;
  font:600 9px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);border-left:1px solid var(--line)
}
.tri button:first-child{border-left:0}
.tri button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tri button.off[aria-pressed="true"]{background:var(--ink-3)}
.tri button:disabled{opacity:.35;cursor:not-allowed}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.dis{opacity:.5}
.opt .c{font-family:var(--mono);color:var(--brass);white-space:nowrap}
.ups{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
.ups>h5{font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 5px}
.ups details>summary{cursor:pointer;font:400 11px/1.5 var(--mono);color:var(--ink-3);
  list-style:none;padding:2px 0}
.ups details>summary::-webkit-details-marker{display:none}
.ups details>summary::before{content:"+ ";font-weight:700}
.ups details[open]>summary::before{content:"\2013 "}
.opt.req .tri{opacity:.55;pointer-events:none}
.opt .src{display:block;color:var(--ink-3);font:400 11px/1.35 var(--sans);margin-top:2px}
.pick.upg{opacity:.72}
.pick.upg .p{color:var(--ink-3)}
.pick .tag{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--line);
  border-radius:2px;font:600 9px/1.5 var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);vertical-align:1px}
.maxp{font:400 11px/1 var(--mono);color:var(--ink-3);margin-left:6px}
.stats{
  display:flex;flex-wrap:wrap;gap:0 14px;margin-top:6px;
  font:400 11px/1.6 var(--mono);color:var(--ink-3)
}
.stats b{color:var(--ink-2);font-weight:500}
.del{
  border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  font:500 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase
}
.del:hover{color:var(--bad)}

/* ---------------------------------------------------------- validation -- */
.checks{padding:4px 0}
.chk{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;
  padding:7px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px
}
.chk:last-child{border-bottom:0}
.chk .dot{
  width:8px;height:8px;border-radius:50%;background:var(--ok);
  align-self:center;box-shadow:0 0 0 3px var(--ok-wash)
}
.chk.bad .dot{background:var(--bad);box-shadow:0 0 0 3px var(--bad-wash)}
.chk.warn .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-wash)}
.chk .src{display:block;color:var(--ink-3);font-size:11px;line-height:1.45;margin-top:2px}
.chk .val{font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.empty{padding:22px 14px;color:var(--ink-3);font-size:13px;text-align:center}

.note{
  padding:10px 14px;font-size:11.5px;line-height:1.55;color:var(--ink-3);
  background:var(--sunk);border-top:1px solid var(--line-soft)
}
.note b{color:var(--ink-2)}

/* ============================================================== PRINT ====
   Korttiarkki: A4 pysty, 2 korttia, 144 x 135 mm. Mitat ja varit vastaavat
   projektin ship cards -kortteja (BFG_Fleet_Cards_*_150pct_2up_A4.pdf). */
.sheet{display:none}
body.card-audit .topbar,body.card-audit .work{display:none!important}
body.card-audit{background:#fff}
body.card-audit .sheet{display:block}
body.card-audit .page{margin:0}
/* Ilman tata selain tiputtaa kaikki taustavarit tulostuksesta, ja kortista
   tulee harmaa. Koskee koko arkkia lapsineen. */
.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.work{display:none!important}
  body{background:#fff;color:#000}
  .sheet{display:block}
}
.page{
  width:210mm;height:297mm;position:relative;background:#fff;
  page-break-after:always;break-after:page;
  font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif;color:#211F20;
  /* Nykyinen tuotantoformaatti. Oikea 6 x 6 in = 152.4 mm tarvitsee
     1-up A4:n tai 2-up A3:n, koska kaksi ei mahdu A4:n 297 mm sivulle. */
  --card-w:144mm;--card-h:135mm;--card-x:33mm;
  --card-top:16.3mm;--card-bottom:156.7mm;
}
.pghead{position:absolute;left:12mm;right:12mm;top:6mm;display:flex;
  align-items:baseline;gap:6mm}
.pghead b{font:700 8pt/1.2 var(--disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex:none}
.pghead i{font-style:normal;font:400 5.6pt/1.3 var(--sans);color:#6B6769;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pghead .rt{margin-left:auto;font:400 5.6pt/1.2 var(--mono);color:#6B6769;white-space:nowrap}

/* --- kortti --------------------------------------------------------- */
.k{
  position:absolute;left:var(--card-x);width:var(--card-w);height:var(--card-h);
  background:#F6F2E9;border:.6pt solid var(--kd);overflow:hidden;
  display:flex;flex-direction:column;
}
.k.top{top:var(--card-top)}
.k.bot{top:var(--card-bottom)}
.kfit{display:flex;flex-direction:column;height:100%;transform-origin:top left}

.k-hd{background:var(--kd);color:#fff;display:flex;align-items:stretch;
  border-left:2.6mm solid #D1792A}
.k-hd .t{padding:1.25mm 3mm 1.2mm;min-width:0;flex:1}
.k-hd h3{margin:0;font:700 13.5pt/1 var(--disp);letter-spacing:.005em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-hd p{margin:.55mm 0 0;font:400 6pt/1.2 var(--sans);color:#E8E4DC}
.k-hd .pts{display:flex;flex-direction:column;justify-content:center;
  padding:0 3mm 0 0;gap:.55mm}
.k-hd .pts span{font:700 5.2pt/1 var(--sans);letter-spacing:.13em;color:#F0C99A}
.k-hd .pts i{display:block;width:34mm;height:6.9mm;background:#fff;
  border:.9pt solid #D1792A;border-radius:.6mm}

.k-st{display:flex;background:#FAF9F6;border-bottom:.6pt solid #B9B4B5}
.k-st div{flex:1;padding:.85mm 1.8mm .9mm;border-left:.5pt solid #D8D3CB;
  display:flex;flex-direction:column;gap:.65mm;min-width:0}
.k-st div:first-child{border-left:0}
.k-st span{font:700 5.4pt/1 var(--sans);letter-spacing:.09em;color:var(--km)}
.k-st .v{display:flex;flex-direction:row;align-items:center;gap:1.6mm}
.k-st b{font:700 8.6pt/1.02 var(--sans);min-width:0;white-space:nowrap}
.k-st i{display:block;width:7mm;height:4.3mm;background:#fff;border:.6pt solid #8C8781;
  border-radius:.5mm;flex:none}
.k-st .wide i{width:20mm}

.k-row{display:flex;gap:1mm;padding:.9mm 1.35mm 0;flex:none}
.k-row.grow{flex:1;min-height:0;padding-bottom:.9mm}
.k-box{background:#fff;border:.6pt solid #B9B4B5;display:flex;
  flex-direction:column;min-width:0;overflow:hidden}
.k-box>h4{margin:0;background:var(--km);color:#fff;
  padding:.8mm 1.4mm;display:flex;justify-content:space-between;gap:1.2mm;
  font:700 7.1pt/1.12 var(--sans);letter-spacing:.045em}
.k-box>h4 em{font-style:normal;font:400 5.4pt/1.3 var(--sans);color:#E6EFE7;
  align-self:center}
.k-bd{padding:1mm 1.4mm;min-width:0;flex:1;overflow:hidden}
.fit-content{transform-origin:top left}

/* Vahinkoruudut kahtena kaistana: ylhaalla ehjat hitit, alhaalla
   crippled-puolisko omalla otsikollaan. Jako on nyt rakenteessa eika vain
   ruudun varissa, ja lohko mahtuu kapeampaan sarakkeeseen. */
.k-hits{display:flex;flex-wrap:wrap;gap:.85mm}
.k-hits i{width:4.5mm;height:4.5mm;border:.6pt solid #7D7873;background:#fff;
  display:flex;align-items:center;justify-content:center;
  font:400 5pt/1 var(--mono);color:#6B6769;border-radius:.4mm}
.k-hits.cr i{background:#F4E5E6;border-color:#C08E90;color:#9A5F62}
.k-cr{margin:1.1mm 0 .6mm;font:700 4.9pt/1 var(--sans);letter-spacing:.06em;
  color:#9A5F62}
.k-cr em{font-style:normal;font-weight:400;letter-spacing:0;color:#8C8781}
/* Kaksi runkoa kantaa 40 hittia. Taysikokoisina ne veisivat kahdeksan
   rivia, joten niilla ruutu on pienempi. */
.k.hp-big .k-hits i{width:3.2mm;height:3.2mm;font-size:3.7pt;border-radius:.3mm}
.k.hp-big .k-hits{gap:.6mm}
.k-note{margin:1mm 0 0;font:400 4.6pt/1.25 var(--sans);color:#4A4644}

/* squadron */
.k-sq{display:flex;gap:2.4mm}
.k-sq div{flex:1}
.k-sq span{display:block;font:700 5.4pt/1 var(--sans);letter-spacing:.08em;
  color:var(--km);margin-bottom:1mm}
.k-sq i{display:block;height:6.4mm;background:#fff;border:.6pt solid #8C8781;border-radius:.5mm}
.k-mem{display:flex;flex-wrap:wrap;gap:1.4mm}
.k-mem div{flex:1 1 30%;min-width:28mm;border:.6pt solid #B9B4B5;background:#FAF9F6;
  border-radius:.5mm;padding:1.1mm 1.4mm;display:flex;align-items:center;gap:1.2mm;
  font:400 6.2pt/1.1 var(--sans)}
.k-mem div.gh{border-style:dashed;border-color:#CFCAC4;background:transparent}
.k-mem em{font-style:normal;color:var(--km);font-weight:700;font-size:5.4pt}
.k-mem u{text-decoration:none;flex:1;min-width:0;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis}
.k-mem s{text-decoration:none;width:5mm;height:4.4mm;border:.55pt solid #8C8781;
  background:#fff;border-radius:.4mm;flex:none;
  font:400 4.2pt/4.4mm var(--sans);text-align:center;color:#8C8781}

/* loadout / options */
.k-optbox{overflow:hidden}
.k-opt-list{transform-origin:top left}
.k-opt{display:flex;gap:1mm;align-items:flex-start;padding:.38mm 0;min-width:0}
.k-opt+.k-opt{border-top:.4pt solid #EDE9E1}
.k-opt .cb{width:3.1mm;height:3.1mm;border:.7pt solid #4A4644;background:#fff;
  flex:none;margin-top:.25mm;border-radius:.4mm;position:relative}
.k-opt .cb.on::after{content:"X";position:absolute;inset:0;
  font:700 3pt/3.1mm var(--sans);text-align:center;color:#211F20}
.k-opt .tx{flex:1;min-width:0}
.k-opt .tx>b{display:block;font:700 5.55pt/1.12 var(--sans)}
.k-opt .tx b.ast{display:inline;font:inherit;color:var(--ast);margin-right:.35mm}
.k-opt .tx span{display:block;font:400 4.45pt/1.18 var(--sans);color:#6B6769;margin-top:.12mm}
.k-opt .c{font:700 5.75pt/1.15 var(--mono);white-space:nowrap;color:#211F20}
.k-opt.pick{border-left:1mm solid #D1792A;padding-left:1.1mm}

/* Optiopolitiikka: 0-4 normaalina, 5-6 tiiviina, 7-8 dense-tilassa.
   9+ aloittaa viela pienemmasta koosta. Kaikki nimet, hinnat ja kuvaukset
   sailyvat aina; fitCards() jatkaa skaalausta ilman kovaa alarajaa. */
.k.opt-compact .k-opt{padding:.25mm 0;gap:.8mm}
.k.opt-compact .k-opt .tx b{font-size:5.15pt;line-height:1.08}
.k.opt-compact .k-opt .tx span{font-size:4.1pt;line-height:1.12}
.k.opt-compact .k-opt .c{font-size:5.35pt}
.k.opt-dense .k-opt{padding:.16mm 0;gap:.65mm}
.k.opt-dense .k-opt .cb{width:2.75mm;height:2.75mm;margin-top:.12mm}
.k.opt-dense .k-opt .cb.on::after{line-height:2.75mm}
.k.opt-dense .k-opt .tx b{font-size:4.85pt;line-height:1.04}
.k.opt-dense .k-opt .tx span{font-size:3.85pt;line-height:1.06}
.k.opt-dense .k-opt .c{font-size:5pt;line-height:1.05}
.k.opt-overflow .k-opt{padding:.12mm 0}
.k.opt-overflow .k-opt .tx b{font-size:4.7pt;line-height:1.03}
.k.opt-overflow .k-opt .tx span{font-size:3.65pt;line-height:1.03}

/* aseistus */
.k-arm{width:100%;border-collapse:collapse;table-layout:fixed;
  color:#211F20;font-family:var(--sans)}
.k-arm th{font:700 5pt/1 var(--sans);letter-spacing:.06em;color:#6B6769;
  overflow:hidden;white-space:nowrap;
  text-align:left;padding:0 1.2mm .8mm;border-bottom:.5pt solid #D8D3CB}
.k-arm th.r{text-align:center}
.k-arm td{padding:.55mm 1.2mm;font:400 6pt/1.1 var(--sans);color:#211F20;
  vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-arm tr.w td{background:var(--rw)}
.k-arm .bg{width:3.2mm;height:3.2mm;border-radius:.5mm;display:inline-block;
  color:#fff;font:700 4.2pt/3.2mm var(--sans);text-align:center;background:var(--bd)}
.k-arm td.ar{text-align:center;padding-left:.3mm;padding-right:.6mm}
/* Kapeat sarakkeet rivittyvat mieluummin kuin katkeavat: pisimmat arvot
   ovat kaksisanaisia ("Thunderhawk: 20 cm", "Cap. 1 Orca/Warden") ja
   mahtuvat kahdelle riville. Nimisarake pysyy yhdella rivilla. */
.k-arm td.rg,.k-arm td.st{white-space:normal;line-height:1.02}
.k-arm .st{font-weight:600}
/* Kaariruusuke: nelja lohkoa, etu ylospain. Tumma lohko = kiintea kaari,
   harmaa = valittavissa oleva. Ruusuke on samalla se ruutu johon kaytetty
   kaari merkitaan, joten erillista kirjoitusruutua ei ole. Teksti ei
   mahtunut sarakkeeseen: 438 solua 1829:sta katkesi ellipsiksi. */
.k-arm .arcg{width:3.2mm;height:3.2mm;display:inline-block;vertical-align:middle}
.k-arm .arcg path{fill:#fff;stroke:#8C8781;stroke-width:.4}
.k-arm .arcg path.on{fill:#3F3B39}
.k-arm .arcg path.pick{fill:#9E968B}
.k-arm .arcg circle{fill:none;stroke:#4A4644;stroke-width:.75}
.k-arm .noarc{color:#8C8781}
/* Valintamerkit: nelio = itsenainen valinta (valikkoase), ympyra =
   valitse yksi ryhmasta. Ryhma on aina tasan yhden aseen paikka. */
.k-arm .wb,.k-arm .rb{width:2.5mm;height:2.5mm;border:.7pt solid #4A4644;
  background:#fff;display:inline-block;position:relative;
  vertical-align:-.35mm;margin-right:.4mm}
.k-arm .wb.on::after{content:"X";position:absolute;inset:0;
  font:700 2.1mm/2.6mm var(--mono);text-align:center;color:#211F20}
.k-arm .rb{border-radius:50%}
.k-arm .rb.on::after{content:"";position:absolute;inset:.55mm;
  background:#211F20;border-radius:50%}
/* Ryhmapalkki sitoo vaihtoehdot yhteen. Aiempi rivien valinen katkoviiva
   erotti ne, mika oli vaarin pain: ne ovat yksi valinta. Rivien
   taustavarit tulevat asetyypista, joten ryhmitys ei voi olla varissa. */
.k-arm tbody.g td.nm{border-left:.7pt solid #8C8781;padding-left:.9mm}
/* Perakkaiset ryhmat ovat eri valintoja, joten niiden valiin tarvitaan
   vali - muuten kaksi palkkia koskettavat ja nayttavat yhdelta ryhmalta.
   Vali on oma rivinsa eika tayte: tayte saisi rivin taustavarin, eika rako
   nakyisi kahden samanvarisen rivin valissa. */
.k-arm tbody.gp td{padding:0;height:1.2mm;border:0;background:transparent}
.k-arm tr.alt .or{font:700 4pt/1 var(--sans);color:#8C8781;letter-spacing:.04em;
  margin-right:.35mm}

/* special rules */
/* Gifts of the Omnissiah: kaksi saraketta SPECIAL-lohkon ylaosassa.
   Numero on ulkoreunallinen ympyra, jotta heitetyn lahjan voi varittaa. */
.k-gift{margin:0 0 1.3mm;padding-bottom:1.2mm;border-bottom:.4pt solid #D8D3CB}
.k-gift>b{display:block;font:700 5pt/1.15 var(--sans);letter-spacing:.05em;
  color:var(--km);margin-bottom:1mm}
.k-gift>b em{font-style:normal;font-weight:400;letter-spacing:0;color:#6B6769}
.k-gg{display:grid;grid-template-columns:1fr 1fr;gap:1mm 2.2mm}
.k-gg>div{display:flex;gap:1.1mm;align-items:flex-start;min-width:0}
.k-gg i{flex:none;width:3.1mm;height:3.1mm;border:.55pt solid var(--km);
  border-radius:50%;background:#fff;font:700 4.1pt/3.1mm var(--mono);
  font-style:normal;text-align:center;color:var(--km)}
.k-gg span{min-width:0}
.k-gg u{text-decoration:none;display:block;font:700 4.8pt/1.15 var(--sans)}
.k-gg em{display:block;font-style:normal;font:400 4.4pt/1.2 var(--sans);
  color:#4A4644;margin-top:.2mm}
.k-gg em b{font-weight:700;color:var(--km)}
.k-sr{margin:0;padding-left:3.2mm;list-style:disc}
.k-sr li{font:400 5.4pt/1.3 var(--sans);margin-bottom:.7mm;color:#211F20}
.k-sr li.ast{list-style:none;margin-left:-3.2mm;text-indent:0}
b.ast{color:var(--ast,#D1792A);font-weight:700;margin-right:.35mm}
.k-sr b.ast{display:inline-block;min-width:1.6mm}

/* critical damage */
.k-crit{display:flex;flex-wrap:wrap;gap:1mm}
.k-crit div{flex:1 1 18%;min-width:23mm;border:.55pt solid #C9C4BC;background:#FAF9F6;
  border-radius:.5mm;padding:.8mm 1mm;display:flex;align-items:center;gap:1mm}
.k-crit .lb{flex:1;min-width:0}
.k-crit b{display:block;font:700 4.7pt/1.1 var(--sans)}
.k-crit em{display:block;font-style:normal;font:400 3.8pt/1.05 var(--sans);color:#6B6769}
.k-crit .tk{display:flex;gap:.45mm;flex:none}
.k-crit .tk i{width:2.1mm;height:2.1mm;border:.45pt solid #8C8781;background:#fff;
  display:block;border-radius:.3mm}
.k-crit .wide{flex:1 1 100%;background:#F3E8CF;border-color:#D9C79B;gap:5mm}
.k-crit .wide span{font:700 5pt/1.2 var(--sans);flex:none}
.k-crit .wide u{text-decoration:none;margin-left:auto;font:400 4.2pt/1.2 var(--sans);
  color:#8A7340;text-align:right}

.k-foot{margin:0 2mm 2mm;border:.6pt solid #B9B4B5;background:#fff;
  padding:1.2mm 2mm;font:700 5.2pt/1 var(--sans);letter-spacing:.07em;color:#6B6769}

/* roster print */
.rost{font-family:var(--sans);color:#000}
.rost h1{font:700 20pt/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase;margin:0}
.rost .sub{font:400 8.5pt/1.4 var(--mono);color:#444;margin:1mm 0 5mm}
.rost table{width:100%;border-collapse:collapse;font-size:9pt;color:#000;font-family:var(--sans)}
.rost thead{display:table-header-group}
.rost tr,.rost .rules li{break-inside:avoid;page-break-inside:avoid}
.rost th{text-align:left;background:#222;color:#fff;padding:1.5mm 2mm;font:600 7.5pt/1 var(--sans);letter-spacing:.06em}
.rost td{padding:1.4mm 2mm;border-bottom:.4pt solid #bbb;vertical-align:top;color:#000}
.rost td.n{text-align:right;font-family:var(--mono)}
.rost .tot td{border-top:1pt solid #000;font-weight:700}
.rost .rules{margin-top:6mm;font-size:7.6pt;line-height:1.45;color:#333}
.rost .rules h4{font:700 8pt/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:0 0 1.5mm}
.rost .rules li{margin-bottom:1mm}
@page{size:A4 portrait;margin:0}

 listed for the Omnissiah\u2019s Victory, an Ark Mechanicus may exchange its broadside lance batteries for strength-2 launch bays for +10 points.","c":10,"var":0}],"sr":"\u2022 The Omnissiah\u2019s Victory is a slow and ponderous vessels and cannot use Come to New Heading special orders. \u2022 The Omnissiah\u2019s Victory is a unique vessel; only one may ever be present in the fleet. \u2022 In no case can more than one Ark Mechanicus ever be used in a fleet. \u2022 The Omnissiah\u2019s Victory can only be taken in place of one battleship in an a fleet that totals 1000 points or greater and is made up primarily of Adeptus Mechanicus vessels. \u2022 The Omnissiah\u2019s Victory must be the flagship and embark an Archmagos Veneratus for the cost listed in the fleet list. \u2022 The Omnissiah\u2019s Victory is equipped with Repulsor Shields and Augmented Weapon Relays as part of its point cost. \u2022 The Omnissiah\u2019s Victory cannot take any refits (from the Mechanicus Gifts table or from elsewhere) except the one described in the options below. In a campaign it can earn other refits normally."},"147":{"pg":147,"fl":"INQUISTION","nm":"GREY KNIGHTS BATTLE BARGE","bp":440,"ty":"Battleship","hp":12,"sp":"20 cm","tn":"45\u00b0","sh":"3","ar":"6+","tu":"3","tl":"TURRETS","aw":[["Port weapons battery","45 cm","12","Left"],["Starboard weapons battery","45 cm","12","Right"],["Prow launch bays","Thunderhawk: 20 cm","3 squadrons","\u2013"],["Prow torpedoes","30 cm","6","Front"],["Dorsal bombardment cannon","30 cm","8","Left/front/right"]],"op":"","ol":[],"sr":"\u2022 A battle barge cannot use Come to New Heading special orders. \u2022 Grey Knights vessels do not have access to Thunderhawk Annihilators. \u2022 Grey Knights are fearsome warriors even among other Space Marines; they may re- roll any boarding action result (the second roll stands)."},"148":{"pg":148,"fl":"INQUISITION","nm":"BLACKSHIP","bp":300,"ty":"Battleship","hp":12,"sp":"20 cm","tn":"45\u00b0","sh":"5","ar":"6+ front / 5+","tu":"5","tl":"TURRETS","aw":[["Port weapons battery","30 cm","10","Left"],["Starboard weapons battery","30 cm","10","Right"],["Dorsal lance battery","30 cm","2","Left/front/right"],["Prow torpedoes","30 cm","6","Front"]],"op":"","ol":[],"sr":"\u2022 Inquisition Blackships are ponderous vessels and cannot use Come To New Heading special orders. \u2022 They will never attempt to board an enemy vessel, but their embarked Adepta Sororitas Mission and platoons of Inquisitorial Storm Troopers adds +2 to their roll when defending against a boarding action. \u2022 Hit and run attacks of any type suffer a -1 modifier. \u2022 Even when used in fleets with Space Marines, they are not crewed by Space Marines and do not get additional Space Marine benefits. \u2022 Gellar Field: The ship is sheathed in an especially powerful Gellar Field to shield the presence of its cargo of untrained psykers from the ravages of the warp. If the ship takes a Shields Collapsed critical hit, roll a D6. On a 4+, the Gellar Field is also damaged and must be repaired before the ship departs the table or disengages, or the ship counts as being destroyed! The Gellar Field is repaired normally as would be any other repairable critical damage, though this does not repair the Shields Collapsed critical. \u2022 Special Objective: These vessels are especially rare and fulfil one of the most important missions in all the Imperium. They are as carefully protected by Imperial forces as they are prized by the Emperor\u2019s enemies, and it is not uncommon that they in and of themselves will be the object of a battle. This vessel counts as 500 victory points if destroyed. However, it provides the owning player +3 Renown if it survives the battle (+2 Renown if crippled)."},"150":{"pg":150,"fl":"INQUISITION","nm":"INQUISITORIAL CRUISER","bp":270,"ty":"Cruiser","hp":8,"sp":"25 cm","tn":"45\u00b0","sh":"2","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Port weapons battery","60 cm","8","Left"],["Starboard weapons battery","60 cm","8","Right"],["Dorsal bombardment cannon","30 cm","6","Left/front/right"],["Prow launch bays","Thunderhawk: 20 cm","2 squadrons","\u2013"]],"op":"\u2022 An Inquisitorial cruiser may replace its launch bays for strength-6, Speed: 30 cm torpedo tubes for no change in cost. Torpedo tubes may fire normal or boarding torpedoes. \u2022 If the torpedo refit is taken, the ship does not have to be modified to serve as an Exterminatus vessel in the same manner as Space Marine battle barges, as they are always equipped with virus bombs and cyclotronic warheads as standard. As such, when in position to exterminate a planet, it may do so on a roll of 3+ instead of 4+. \u2022 An Inquisitorial cruiser may replace its dorsal bombardment cannon for strength-2, range: 45 cm lances firing Left/Front/ Right for +15 points.","ol":[{"t":"An Inquisitorial cruiser may replace its launch bays for strength-6, Speed: 30 cm torpedo tubes for no change in cost. Torpedo tubes may fire normal or boarding torpedoes.","c":null,"var":0,"sw":{"f":[3],"t":[["Prow torpedo tubes","30 cm","6","\u2013"]]}},{"t":"If the torpedo refit is taken, the ship does not have to be modified to serve as an Exterminatus vessel in the same manner as Space Marine battle barges, as they are always equipped with virus bombs and cyclotronic warheads as standard. As such, when in position to exterminate a planet, it may do so on a roll of 3+ instead of 4+.","c":null,"var":0},{"t":"An Inquisitorial cruiser may replace its dorsal bombardment cannon for strength-2, range: 45 cm lances firing Left/Front/ Right for +15 points.","c":15,"var":0,"sw":{"f":[2],"t":[["Dorsal lances","45 cm","2","Left / Front / Right"]]}}],"sr":"\u2022 In addition to the profile listed above, Inquisitorial cruisers follow special rules specific to the Ordo they serve under. \u2022 Inquisitorial cruisers do not have access to Thunderhawk Annihilators, even if included in a Space Marine Crusade Fleet."},"151":{"pg":151,"fl":"INQUISITION","nm":"GREY KNIGHTS STRIKE CRUISER","bp":165,"ty":"Cruiser","hp":6,"sp":"25 cm","tn":"90\u00b0","sh":"2","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Port weapons battery","30 cm","4","Left"],["Starboard weapons battery","30 cm","4","Right"],["Prow bombardment cannon","30 cm","3","Left/front/right"],["Prow launch bays","Thunderhawk: 20 cm","2 squadrons","\u2013"]],"op":"\u2022 May replace launch bays for strength-6, Speed: 30 cm torpedo tubes for no change in cost. May fire normal or boarding torpedoes. \u2022 May replace launch bays for a firepower-5, range 30 cm (front arc only) bombardment cannon battery.","ol":[{"t":"May replace launch bays for strength-6, Speed: 30 cm torpedo tubes for no change in cost. May fire normal or boarding torpedoes.","c":null,"var":0,"sw":{"f":[3],"t":[["Prow torpedo tubes","30 cm","6","\u2013"]]}},{"t":"May replace launch bays for a firepower-5, range 30 cm (front arc only) bombardment cannon battery.","c":null,"var":0,"sw":{"f":[3],"t":[["Prow bombardment cannon battery","30 cm","5","Front"]]}}],"sr":"\u2022 Grey Knights strike cruisers roll +5D6 when on All Ahead Full special orders. \u2022 Grey Knights vessels do not have access to Thunderhawk Annihilators. \u2022 Grey Knights are fearsome warriors even among other Space Marines; they may re- roll any boarding action result (the second roll stands). \u2022 Up to half of the Grey Knights strike cruisers in a fleet may replace their launch bays with one of the refits listed below, in any mix desired."},"180":{"pg":180,"fl":"ROGUE TRADERS","nm":"ROGUE TRADER CRUISER","bp":185,"ty":"Cruiser","hp":8,"sp":"20 cm","tn":"45\u00b0","sh":"2","ar":"6+ front / 5+","tu":"3","tl":"TURRETS","aw":[["Port weapons battery","45 cm","6","Left"],["Starboard weapons battery","45 cm","6","Right"],["Port weapons battery","30 cm","4","Left"],["Starboard weapons battery","30 cm","4","Right"],["Prow torpedoes","30 cm","4","Front"]],"op":"\u2022 Rogue Trader cruisers in an Exploration fleet may also be of the following Imperial or Chaos ship classes: Lunar, Tyrant, Carnage or Murder (even if used as a loyalist ship), for their normal point cost, +15 points if the ship is equipped with lances or 60 cm weapons due to the additional expense maintaining such weapons, as reflected in the fleet list. Chaos vessels used as loyalist ships must be painted as such, and no special variants in the notes of these ships' profiles can be used. For example, the Tyrant can\u2019t take boosted batteries or a Nova Cannon, etc.","ol":[{"t":"Rogue Trader cruisers in an Exploration fleet may also be of the following Imperial or Chaos ship classes: Lunar, Tyrant, Carnage or Murder (even if used as a loyalist ship), for their normal point cost, +15 points if the ship is equipped with lances or 60 cm weapons due to the additional expense maintaining such weapons, as reflected in the fleet list. Chaos vessels used as loyalist ships must be painted as such, and no special variants in the notes of these ships' profiles can be used. For example, the Tyrant can\u2019t take boosted batteries or a Nova Cannon, etc.","c":15,"var":0}],"sr":"\u2022 At least half the Rogue Trader cruisers in an Exploration fleet must be of the basic profile listed above."},"181":{"pg":181,"fl":"ROGUE TRADERS","nm":"ENDEAVOUR CLASS LIGHT CRUISER","bp":110,"ty":"Cruiser","hp":6,"sp":"20 cm","tn":"90","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Port weapons battery","30 cm","6","Left"],["Starboard weapons battery","30 cm","6","Right"],["Prow weapons battery","30 cm","2","Left/front/right"],["Prow torpedoes","30 cm","2","Front"]],"op":"\u2022 May increase the prow armour to 6+ for no additional cost. However, if this option is taken, the turning radius of this vessel is reduced to 45 degrees. \u2022 Instead of the Endeavour, Rogue Traders may use a lance-armed Dauntless light cruiser for +15 points due to the additional expense incurred maintaining such weapons. This is already reflected in the point cost in the fleet list. The use of Dauntless light cruisers by Rogue Traders is not restricted to the Exploration Fleet List and they may be taken in the same manner as other Rogue Trader cruisers.","ol":[{"t":"May increase the prow armour to 6+ for no additional cost. However, if this option is taken, the turning radius of this vessel is reduced to 45 degrees.","c":null,"var":0},{"t":"Instead of the Endeavour, Rogue Traders may use a lance-armed Dauntless light cruiser for +15 points due to the additional expense incurred maintaining such weapons. This is already reflected in the point cost in the fleet list. The use of Dauntless light cruisers by Rogue Traders is not restricted to the Exploration Fleet List and they may be taken in the same manner as other Rogue Trader cruisers.","c":15,"var":0}],"sr":"\u2022 Rogue Trader light cruisers may be used interchangeably in the same manner as Rogue Trader cruisers in any fleet or scenario that allows them. \u2022 Pirates and raiders are the bane of Rogue Traders, and they will be even more ready for such a threat than most. For this the cramped decks and confined spaces of Endeavour light cruisers are especially favoured; these ships add +1 to their dice roll when defending against a boarding action."},"182":{"pg":182,"fl":"ROGUE TRADERS","nm":"HEAVY TRANSPORT","bp":40,"ty":"Cruiser","hp":6,"sp":"15 cm","tn":"45\u00b0","sh":"2","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Port weapons battery","15 cm","3","Left"],["Starboard weapons battery","15 cm","3","Right"],["Prow weapons battery","15 cm","2","Left/front/right"]],"op":"\u2022 When included in a Rogue Trader fleet in a campaign or one-off game, they may take one refit from the Xenotech systems table for +10 points. \u2022 Fuel Tanker: For no extra cost or change in profile a heavy transport can be a fuel tanker. In addition to the special rules above, fuel tankers suffer critical damage on a roll of 5+ instead of a 6 normally. If a fuel tanker is reduced to zero hits, it rolls 3D6 on the catastrophic damage table instead of 2D6, adding the result of all three dice together. These vessels are especially critical to a Rogue Trader and the operations of a given fleet in general; every one that survives at the end of the game without disengaging earns +1 renown to the owning player, even if crippled. \u2022 Repair Tender (+50 pts): Augmented by personnel and servitors of the Adeptus Mechanicus, these ships are vital for quickly repairing and refitting warships close to the battlezone. Purchasing a repair tender adds +1 renown or two repair points to the owning player at the end of every battle (even if crippled), but the enemy gains +1 renown for crippling or +2 renown for destroying it. \u2022 Super-Heavy Transport (+50 pts): Some heavy transports are extraordinarily vast behemoths of the stars, serving the core worlds of the Imperium as supertankers or as bulk ore carriers bound for the foundries of Mechanicus worlds. Such vessels add +4HP to their profile and count as three normal transports (two if crippled). However, they turn like battleships and are mounted on a large base. Their profile and special rules are otherwise unchanged.","ol":[{"t":"When included in a Rogue Trader fleet in a campaign or one-off game, they may take one refit from the Xenotech systems table for +10 points.","c":10,"var":0},{"t":"Fuel Tanker: For no extra cost or change in profile a heavy transport can be a fuel tanker. In addition to the special rules above, fuel tankers suffer critical damage on a roll of 5+ instead of a 6 normally. If a fuel tanker is reduced to zero hits, it rolls 3D6 on the catastrophic damage table instead of 2D6, adding the result of all three dice together. These vessels are especially critical to a Rogue Trader and the operations of a given fleet in general; every one that survives at the end of the game without disengaging earns +1 renown to the owning player, even if crippled.","c":null,"var":0},{"t":"Repair Tender (+50 pts): Augmented by personnel and servitors of the Adeptus Mechanicus, these ships are vital for quickly repairing and refitting warships close to the battlezone. Purchasing a repair tender adds +1 renown or two repair points to the owning player at the end of every battle (even if crippled), but the enemy gains +1 renown for crippling or +2 renown for destroying it.","c":50,"var":0},{"t":"Super-Heavy Transport (+50 pts): Some heavy transports are extraordinarily vast behemoths of the stars, serving the core worlds of the Imperium as supertankers or as bulk ore carriers bound for the foundries of Mechanicus worlds. Such vessels add +4HP to their profile and count as three normal transports (two if crippled). However, they turn like battleships and are mounted on a large base. Their profile and special rules are otherwise unchanged.","c":50,"var":0}],"sr":"\u2022 Despite their size and complexity, heavy transports have little in common with true warships. Like other normal cargo ships, they only move +3D6 when under All Ahead Full special orders. \u2022 They are worth four assault points (two if crippled) in planetary assault scenarios when within 30 cm of the planet edge and have the value of two regular transports (one if crippled) in scenarios that require transports. \u2022 Many specialized heavy transports provide unique abilities to a given fleet, like the Repair Tender and the Super-Heavy Transport variants below. Unfortunately, they are particularly sought out by enemies and if those variant options are taken, they must always be present in scenarios requiring transports."},"184":{"pg":184,"fl":"ROGUE TRADERS","nm":"XENOS VESSEL","bp":50,"ty":"Escort","hp":1,"sp":"25 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Weapons battery*","45 cm","2","Left/front/right"],["Lance battery*","30 cm","1","Front"]],"op":"","ol":[],"sr":"\u2022 The profile above represents a whole variety of alien vessels that may be found in a Rogue Trader\u2019s personal escort. Since Rogue Traders tend to choose vessels for certain specific purpose, many of the Xenos vessels employed as mercenaries will be similar, though never entirely identical. For this reason, a single ship profile is used, but to better represent the great variety of Xenos vessels that may be encountered in the 41st millennium, each Xenos vessel also has one selected xenotech system as described in the Rogue Trader special rules. This system does not cost extra points and may be selected by the owning player for free, whether they are used in a Rogue Trader fleet, as pirate raiders or even their own, independent squadron of Xenos warships. However, all Xenos Vessels of the same type or race must all use the same refit, though multiple types or races may be in the same fleet, each easily identified by distinctly different models. \u2022 The following pages feature a few of those variants with distinct names, all of them cost 50 points and have chosen one of the xenotech systems that is already included in their profile. \u2022 *Xenos vessel weapon systems, like the vessels themselves, represent a wide variety of technologies. While the weapon systems may take any form and be described in any manner desired, their behavior will be as the weapons indicated in the Xenos Vessel profile. It can only be modified by one of the Xenotech systems described on p. 175"},"186":{"pg":186,"fl":"ROGUE TRADERS","nm":"PTHUXUTL WAR CRUISER","bp":50,"ty":"Escort","hp":1,"sp":"25 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Weapons battery","45 cm","2","Left/front/right"],["Disruptor Cannon","30 cm","1","Front"]],"op":"\u2022 The Pthuxutl War Cruiser has a Xenotech: Ship Defense Grid (turrets +1) already included in its profile.","ol":[{"t":"The Pthuxutl War Cruiser has a Xenotech: Ship Defense Grid (turrets +1) already included in its profile.","c":null,"var":0}],"sr":"\u2022 The Pthuxutl disruptor cannon is an inefficient and cumbersome but easily-duplicated weapon system. It functions as a standard lance in all respects. \u2022 Pthuxutl war cruisers cannot be used in any fleet allied with the Orks."},"187":{"pg":187,"fl":"ROGUE TRADERS","nm":"FRA\u2019AL RAIDER","bp":50,"ty":"Escort","hp":1,"sp":"25 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Weapons battery","45 cm","2","Left/front/right"],["Lance battery","30 cm","1","Front"]],"op":"\u2022 The Fra\u2019al Raider has a Xenotech: Targeting Matrix, see the special ability above.","ol":[{"t":"The Fra\u2019al Raider has a Xenotech: Targeting Matrix, see the special ability above.","c":null,"var":0}],"sr":"\u2022 Fra\u2019al utilize a complex targeting matrix that greatly improves the accuracy of their weapon batteries at long range; they treat all targets less than 30 cm as closing and do not suffer a column shift for firing at targets greater than 30 cm. \u2022 The Fra\u2019al will not ally themselves with fleets that include loyal Imperial Navy or Space Marine vessels."},"188":{"pg":188,"fl":"ROGUE TRADERS","nm":"NEKULLI WHIP","bp":50,"ty":"Escort","hp":1,"sp":"25 cm","tn":"90\u00b0","sh":"2","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Weapons battery","45 cm","2","Left/front/right"],["Whisperlance Cannon","30 cm","1","Front"]],"op":"\u2022 The Nekulli Whip has a Xenotech: Advanced Shielding (shields +1) already included in its profile.","ol":[{"t":"The Nekulli Whip has a Xenotech: Advanced Shielding (shields +1) already included in its profile.","c":null,"var":0}],"sr":"\u2022 While highly efficient, a whisperlance cannon behaves as a lance battery in all respects."},"189":{"pg":189,"fl":"ROGUE TRADERS","nm":"RECOMMISSIONED ESCORT","bp":30,"ty":"Escort","hp":1,"sp":"30 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","2","Left/front/right"],["Prow torpedoes","30 cm","1","Front"]],"op":"","ol":[],"sr":""},"190":{"pg":190,"fl":"ROGUE TRADERS","nm":"ICONOCLAST CLASS DESTROYER","bp":30,"ty":"Escort","hp":1,"sp":"30 cm","tn":"90\u00b0","sh":"1","ar":"4+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","3","Left/front/right"]],"op":"","ol":[],"sr":""},"192":{"pg":192,"fl":"ROGUE TRADERS","nm":"ARMED CARGO VESSEL","bp":20,"ty":"Escort","hp":1,"sp":"25 cm","tn":"45\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","1","Left/front/right"]],"op":"\u2022 Fast Clipper: Instead of taking a refit normally, for no extra cost this vessel type can be converted to a fast clipper by entirely removing its primary battery armament for the Advanced Drive Technology refit on p. 175","ol":[{"t":"Fast Clipper: Instead of taking a refit normally, for no extra cost this vessel type can be converted to a fast clipper by entirely removing its primary battery armament for the Advanced Drive Technology refit on p. 175","c":null,"var":0}],"sr":"\u2022 Rogue Trader armed cargo vessels have more in common with true warships than typical freighters, giving up a significant portion of their cargo capacity to mount warship-grade weapons and engineering plants. They move +4D6 when under All Ahead Full special orders as warships do. \u2022 They are worth one assault point in planetary assault scenarios when within 30 cm of the planet edge and count as a half-transport (rounding DOWN) in scenarios that require transports. This means that if it is the only one remaining in a convoy scenario, it counts as zero. \u2022 When included in a Rogue Trader escort squadron and not being used as a transport in scenarios that require them, it offers +1 Ld to Reload Ordnance by ensuring escorts have a ready supply of torpedoes before the battle. This effect is not cumulative if there is more than one Rogue Trader cargo vessel in the escort squadron."},"194":{"pg":194,"fl":"ROGUE TRADERS","nm":"FRA\u2019AL BATTLESHIP","bp":250,"ty":"Battleship","hp":10,"sp":"20 cm","tn":"45\u00b0","sh":"3","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Port weapons battery","45 cm","14","Left"],["Starboard weapons battery","45 cm","14","Right"],["Dorsal lance battery","30 cm","3","Left/front/right"],["Prow lance battery","30 cm","3","Front"]],"op":"\u2022 The Fra\u2019al are exceedingly xenophobic and will not lightly countenance risking their few capital ships in an alliance with any race. While they may well each be accompanied by a squadron of their escorts in larger raids, they can just as well operate singly or in pairs. Using only the profile above, they may be used as a substitution for an enemy in any scenario where the chosen or randomly selected threat is a ship worth up to 250 points. \u2022 Up to two ships in a pirate fleet may be Fra\u2019al battleships, rolling for leadership normally and counting as cruisers against the fleet list.","ol":[{"t":"The Fra\u2019al are exceedingly xenophobic and will not lightly countenance risking their few capital ships in an alliance with any race. While they may well each be accompanied by a squadron of their escorts in larger raids, they can just as well operate singly or in pairs. Using only the profile above, they may be used as a substitution for an enemy in any scenario where the chosen or randomly selected threat is a ship worth up to 250 points.","c":null,"var":0},{"t":"Up to two ships in a pirate fleet may be Fra\u2019al battleships, rolling for leadership normally and counting as cruisers against the fleet list.","c":null,"var":0}],"sr":"\u2022 The Fra\u2019al utilize a complex targeting matrix that greatly improves the accuracy of their weapon batteries at long range. They treat all targets less than 30 cm as closing and do not suffer a column shift for firing at targets greater than 30 cm. \u2022 Fra\u2019al battleships cannot use Come To New Heading special orders. \u2022 When taken in a pirate fleet list, they may not use any fleet re-rolls, and they will attempt to disengage when crippled (+1 Ld bonus when doing so)."},"196":{"pg":196,"fl":"ROGUE TRADERS","nm":"STRYXIS CARAVAN VESSEL","bp":80,"ty":"Defence","hp":8,"sp":"10 cm","tn":"Special","sh":"2","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Ghost-Light Macrobattery","45 cm","10","All round"],["Ghost-Light Lance","30 cm","3","All round"]],"op":"","ol":[],"sr":"\u2022 The Stryxis rely on weapon technology called \u201cGhost-Light\u201d that when striking unshielded vessels inflict horrific crew casualties while only minimally affecting a ship\u2019s hull. In damage terms they function as standard weapon batteries and lances in all respects but will not roll for or inflict critical damage. \u2022 Stryxis caravan vessels are unique constructions and follow the special movement rules outlined below. \u2022 The Stryxis are bitter enemies of the Eldar and cannot ally with any fleet that contains Eldar vessels."},"252":{"pg":252,"fl":"CHAOS","nm":"THE PLANET KILLER","bp":505,"ty":"Battleship","hp":14,"sp":"20 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"5","tl":"TURRETS","aw":[["Prow weapons battery","60 cm","12","Left/front/right"],["Port weapons battery","60 cm","6","Left"],["Starboard weapons battery","60 cm","6","Right"],["Dorsal lance battery","60 cm","6","Left/front/right"],["Prow torpedoes","30 cm","9","Left/front/right"],["Armageddon gun","90 cm","See rules","Front"]],"op":"","ol":[],"sr":"\u2022 The Planet Killer is notoriously slow to manoeuvre and so cannot use the Come to New Heading special orders."},"255":{"pg":255,"fl":"CHAOS","nm":"CHAOS BATTLE BARGE","bp":410,"ty":"Battleship","hp":12,"sp":"20 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Port weapons battery","60 cm","6","Left"],["Starboard weapons battery","60 cm","6","Right"],["Dorsal lance battery","60 cm","3","Left/front/right"],["Port launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Starboard launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Prow launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","2 squadrons","\u2013"],["Prow lance battery","30 cm","4","Front"]],"op":"Pre-Heresy battle barges were widely emulated in several variants by the Mechanicus Adepts of Mars during the Great Crusade. What remains of these rare vessels may have changed hands and crews in the intervening millennia. \u2022 Chaos battle barges can be led by a Chaos Lord having +1 leadership for +25 points. This is an alternative to the Chaos Lord of the Incursion Fleet list. \u2022 Can embark Chaos Space Marines for +35 points. \u2022 If Chaos Space Marines are taken, it may embark Chosen Terminators for +10 points. A number of Primarchs, and even renowned Battle-Captains ordered subtle modifications to their ships under their command during extended stays in port between times at the speartip of the Great Crusade. \u2022 For no change in cost, Chaos battle barges may exchange their port and starboard weapons battery for range 45 cm, firepower 8 weapons battery. \u2022 For no change in cost, Chaos battle barges may exchange their port and starboard weapons battery for range 30 cm, firepower 10 weapons battery. \u2022 Can exchange the prow lance battery for Strength 8 torpedo tubes for +10 points. \u2022 Can exchange the dorsal lance battery for range 45 cm, strength 4 for +10 points.","ol":[{"t":"Pre-Heresy battle barges were widely emulated in several variants by the Mechanicus Adepts of Mars during the Great Crusade. What remains of these rare vessels may have changed hands and crews in the intervening millennia.","c":null,"var":0},{"t":"Chaos battle barges can be led by a Chaos Lord having +1 leadership for +25 points. This is an alternative to the Chaos Lord of the Incursion Fleet list.","c":25,"var":0},{"t":"Can embark Chaos Space Marines for +35 points.","c":35,"var":0},{"t":"If Chaos Space Marines are taken, it may embark Chosen Terminators for +10 points. A number of Primarchs, and even renowned Battle-Captains ordered subtle modifications to their ships under their command during  To New Heading special orders. \u2022 Mark of Tzeentch: This ship bears the Mark of Tzeentch as part of its point cost; it does not have to be paid for separately by the ship\u2019s commander. \u2022 Flagship: If chosen, the Scion of Prospero must be used as the fleet\u2019s flagship and have its Warmaster placed aboard it unless the Planet Killer is also present, in which case a Chaos Lord must lead it. This vessel may only bear the Mark of Tzeentch. It cannot be used in any fleet that has Death Guard Chaos Space Marines or any vessels bearing the Mark of Nurgle unless the fleet is being led by Abaddon the Despoiler, as there is ageless enmity between the servants of the Bringer of Change and those of the Lord of Decay. \u2022 Vortex of Chaos: Favoured horrors of Tzeentch writhe and cavort amidst the very bulkheads and girders, and a swirling vortex of Chaos surrounds this vessel. At the end of each Movement Phase, any ship within 15 cm of this vessel (friend or foe!) must place a blast marker in base contact with it. \u2022 Vagaries of Fate: The Changer of Ways provides for command of the Fates, affording its auguries snatched glimpses of the future. The ship is gifted with an additional re- roll added to that from the Mark of Tzeentch, but the daemons bound to the hull are easily enraged by a commander\u2019s inability to use this foresight and inflict 1 damage if this ship\u2019s or its Lord\u2019s re-rolls fail for any reason. FLEET LISTS Tzeentch (pg. 236)"},"260":{"pg":260,"fl":"CHAOS","nm":"WAGE OF SIN, EMPEROR'S CHILDREN BATTLE BARGE","bp":430,"ty":"Battleship","hp":12,"sp":"25 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Port lance battery","45 cm","4","Left"],["Starboard lance battery","45 cm","4","Right"],["Dorsal weapons battery","60 cm","6","Left/front/right"],["Port launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Starboard launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Prow torpedoes","30 cm","9","Front"]],"op":"","ol":[],"sr":"\u2022 The Wage Of Sin is a unique vessel; only one may ever be in a Chaos fleet. \u2022 It is a ponderous vessel and may not use Come To New Heading special orders. \u2022 Mark of Slaanesh: This ship bears the Mark of Slaanesh as part of its point cost; it does not have to be paid for separately by the ship\u2019s commander. \u2022 Flagship: If chosen, the Wage Of Sin must be used as the fleet\u2019s flagship and have its Warmaster placed aboard it unless the Planet Killer is also present, in which case a Chaos Lord must lead it. This vessel may only bear the Mark of Slaanesh. It cannot be used in any fleet that has World Eaters Chaos Space Marines or any vessels bearing the Mark of Khorne unless the fleet is being led by Abaddon the Despoiler, as there remains unforgivable animosity between the World Eaters and the Emperor\u2019s Children dating from the Battle of Skalathrax. \u2022 Palace of Pleasure: The glittering domes and spires of this ancient vessel are dedicated to every perverse and extreme form of stimulation imaginable, and a retinue of Noise Marines have made it their permanent conveyance. This ship always counts as being crewed by Emperor\u2019s Children Chaos Space Marines (included it its cost), following the rules on pg. 223."},"262":{"pg":262,"fl":"CHAOS","nm":"TERMINUS EST, DEATH GUARD BATTLE BARGE","bp":430,"ty":"Battleship","hp":13,"sp":"20 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Port Hives of Nurgle","30 cm","6","Left"],["Starboard Hives of Nurgle","30 cm","6","Right"],["Dorsal lance battery","45 cm","4","Left/front/right"],["Port launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Starboard launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Prow launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","3 squadrons","\u2013"],["Prow lance battery","30 cm","4","Left/front/right"]],"op":"","ol":[],"sr":"\u2022 The Terminus Est is a unique vessel; only one may ever be in a Chaos fleet. \u2022 It is a ponderous vessel and may not use Come To New Heading special orders. \u2022 Mark of Nurgle: This ship bears the Mark of Nurgle as part of its point cost; it does not have to be paid for separately by the ship\u2019s commander. The extra hit is already included in its profile. \u2022 Flagship: If chosen, the Terminus Est must be used as the fleet\u2019s flagship and have its Warmaster placed aboard it unless the Planet Killer is also present, in which case a Chaos Lord must lead it. This vessel may only bear the Mark of Nurgle. It cannot be used with any fleet that has Thousand Sons Chaos Space Marines or vessels bearing the Mark of Tzeentch unless the fleet is being led by Abaddon the Despoiler, as there is ageless enmity between the servants of the Bringer of Change and those of the Lord of Decay. \u2022 Miasma of Pestilence: The Terminus Est is surrounded by vast swarming clouds of the same Warp-spawned flies which buzz and howl through its interior and first transformed Typhus into the Host of the Destroyer Hive. This miasma permeates outwards from the ship through blisters, boils and fractures in its surface or through corroded discharge tubes and weapon barrels. It replaces the ship\u2019s turrets and works in exactly the same way as turrets against attack craft but has no effect against torpedoes. The miasma is so thick that it obscures and distorts the shape of the Terminus Est, meaning that vessels within 15 cm do not benefit from a left column shift when firing at it."},"264":{"pg":264,"fl":"CHAOS","nm":"SLAVERER, WORLD EATERS BATTLE BARGE","bp":380,"ty":"Battleship","hp":12,"sp":"25 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Port lance battery","30 cm","3","Left"],["Starboard lance battery","30 cm","3","Right"],["Dorsal weapons battery","45 cm","8","Left/front/right"],["Port weapons battery","30 cm","12","Left"],["Starboard weapons battery","30 cm","12","Right"],["Prow torpedoes","30 cm","9","Front"]],"op":"","ol":[],"sr":"\u2022 The Slaverer is a unique vessel; only one may ever be in a Chaos fleet. \u2022 It is a ponderous vessel and may not use Come To New Heading special orders. \u2022 Mark of Khorne: This ship bears the Mark of Khorne as part of its point cost; it does not have to be paid for separately by the ship\u2019s commander. If it is not the flagship, a Chaos Lord must lead it. \u2022 Berzerker Horde: As part of its cost, it embarks Chaos Space Marines with the Mark of Khorne, following all rules for Chaos Space Marines on pg. 223. It also embarks a retinue of Khorne Berzerkers, giving it a boarding modifier of +2 in addition to its improved boarding value. It is embarked with Chosen Terminators and may roll two D6 and pick the highest D6 when conducting a teleport Hit and Run attack each turn. \u2022 Chariot of Slaughter: This vessel may only bear the Mark of Khorne. If chosen, it does not have to be used as the fleet\u2019s flagship unless it is the most expensive vessel present. It cannot be used in any fleet that has Emperor\u2019s Children Chaos Space Marines or any vessels bearing the Mark of Slaanesh unless the fleet is being led by Abaddon the Despoiler, as there remains unforgivable enmity between the World Eaters and the Emperor\u2019s Children. FROM NATE MONTES The Slaverer replaces the Conqueror as a named World Eaters ship, as the Conqueror has been retconned to a Gloriana battleship in the official lore. In all respects, the rules for the Slaverer are identical to the Conqueror rules from the 2010 Compendium. The ship's description has been changed to represent this infamous vessel."},"266":{"pg":266,"fl":"CHAOS","nm":"DESPOILER CLASS BATTLESHIP","bp":400,"ty":"Battleship","hp":12,"sp":"20 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Port launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","4 squadrons","\u2013"],["Starboard launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","4 squadrons","\u2013"],["Port weapons battery","60 cm","6","Left"],["Starboard weapons battery","60 cm","6","Right"],["Dorsal lance battery","60 cm","3","Left/front/right"],["Prow lance battery","30 cm","4","Front"]],"op":"\u2022 Can replace its prow lances with Strength 8 torpedoes at a cost of +10 points (like The Damnation's Fury).","ol":[{"t":"Can replace its prow lances with Strength 8 torpedoes at a cost of +10 points (like The Damnation's Fury).","c":10,"var":0,"sw":{"f":[5],"t":[["Prow torpedoes","see text","8","Front"]]}}],"sr":"\u2022 May not use Come to New Heading special orders."},"267":{"pg":267,"fl":"CHAOS","nm":"DESOLATOR CLASS BATTLESHIP","bp":300,"ty":"Battleship","hp":12,"sp":"25 cm","tn":"45\u00b0","sh":"4","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Port lance battery","60 cm","4","Left"],["Starboard lance battery","60 cm","4","Right"],["Dorsal weapons battery","60 cm","6","Left/front/right"],["Prow torpedoes","30 cm","9","Front"]],"op":"","ol":[],"sr":"\u2022 May not use Come to New Heading special orders."},"268":{"pg":268,"fl":"CHAOS","nm":"RETALIATOR CLASS GRAND CRUISER","bp":260,"ty":"Grand Cruiser","hp":10,"sp":"20 cm","tn":"45\u00b0","sh":"3","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Port weapons battery","30 cm","6","Left"],["Starboard weapons battery","30 cm","6","Right"],["Port lance battery","45 cm","2","Left"],["Starboard lance battery","45 cm","2","Right"],["Port launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","2 squadrons","\u2013"],["Starboard launch bays","Swiftdeaths: 30 cm / Doomfires: 20 cm / Dreadclaws: 30 cm","2 squadrons","\u2013"]],"op":"\u2022 Can be equipped with improved thrusters and may move 5D6 cm when on All Ahead Full orders (like the Foebane). This costs no extra points.","ol":[{"t":"Can be equipped with improv "]],"op":"","ol":[],"sr":"\u2022 Improved thrusters: moves +5D6 on All Ahead Full special orders."},"281":{"pg":281,"fl":"CHAOS","nm":"IDOLATOR CLASS RAIDER","bp":45,"ty":"Escort","hp":1,"sp":"30 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Weapons battery","45 cm","2","Left/front/right"],["Lance battery","30 cm","1","Front"]],"op":"","ol":[],"sr":"\u2022 Does not suffer a column shift for firing over 30 cm."},"282":{"pg":282,"fl":"CHAOS","nm":"INFIDEL CLASS RAIDER","bp":40,"ty":"Escort","hp":1,"sp":"30 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","2","Left/front/right"],["Torpedoes","30 cm","2","Front"]],"op":"","ol":[],"sr":""},"283":{"pg":283,"fl":"CHAOS","nm":"ICONOCLAST CLASS DESTROYER","bp":30,"ty":"Escort","hp":1,"sp":"30 cm","tn":"90\u00b0","sh":"1","ar":"4+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","3","Left/front/right"]],"op":"","ol":[],"sr":""},"284":{"pg":284,"fl":"CHAOS","nm":"ACTIVATED BLACKSTONE FORTRESS","bp":750,"ty":"Defence","hp":16,"sp":"10 cm","tn":"Special","sh":"6","ar":"6+","tu":"0","tl":"TURRETS","aw":[["Warp cannons","90 cm","8","All around"]],"op":"","ol":[],"sr":"\u2022 Only one Activated Blackstone Fortress may be fielded for every FULL 750 points of other ships in a Chaos fleet. No more than three may be taken. \u2022 A Blackstone Fortress cannot go onto special orders but is assumed to automatically pass all other Leadership tests it is required to make. \u2022 The Blackstone Fortress can move up to 10 cm in any direction in the movement phase: it does not turn like a normal ship. \u2022 It has no crew and so does not add a D6 to its boarding score during a boarding action. \u2022 A Blackstone Fortress\u2019 warp cannons roll 1 dice per point of Strength and require a 4+ to hit, like a lance. However, all hits will affect a ship directly, and ignores shields, holofields and any other similar mechanisms, such as reactive armour saves, spores, etc. Warp cannons do not ignore any Brace for impact saves or any reactive armour modifiers while braced! \u2022 Super-Mega-Death Shot: The Blackstone Fortress is capable of channelling its energy into a single shot of extraordinary magnitude if not crippled. To do so, it must build up its energy by not moving or firing its weapons for two turns. In the next turn, it must remain still and immediately fire its weapon in the shooting phase. Trace a straight line 90 cm from the stem of the Blackstone Fortress in any direction desired with the Nova Cannon template. Any ship, friend or foe, that touches the template with its stem (not its base!) takes 8 lance shots, ignoring shields or any similar mechanism (spores, holofields, etc.). Any ship that touches the centre of the template with its stem is immediately destroyed! This same shot can also be used in Exterminatus if the Blackstone Fortress reaches the low orbit table, in which case the planet is destroyed on a roll of 2+. Multiple Blackstone Fortresses (no more than 3) can combine this shot together if they are all never further apart than the diameter of a Nova Cannon template. The shot centres from the template placed in the middle of the Fortresses and cannot cross the stem of any one Fortress. Every additional Fortress combined in this way increases the range by 90 cm and the number of lance shots on the template by 8. While charging, any ordnance or escorts touching the area between the Fortresses is immediately destroyed. However, capital ships may disrupt the charging process by doing so, taking 8 lance shots for every Fortress charging, that ignore shields and cannot be braced for. If this happens, each Fortress automatically takes D6 hits, cannot move or shoot in the next turn and must recharge again before firing."},"286":{"pg":286,"fl":"CHAOS","nm":"CHAOS SPACE HULK","bp":650,"ty":"Defence","hp":40,"sp":"10 cm","tn":"Special","sh":"3","ar":"4+","tu":"6","tl":"TURRETS","aw":[["Port weapons battery","45 cm" tion to any other modifiers. \u2022 All hit and run attacks against Shadowhunters add +1 to their roll."},"333":{"pg":333,"fl":"ELDAR","nm":"TRANSPORT","bp":null,"ty":"Escort","hp":1,"sp":"10/10/15 cm","tn":"Special","sh":"Holofields","ar":"4+","tu":"0","tl":"TURRETS","aw":[["Weapons battery","15 cm","1","Front"]],"op":"","ol":[],"sr":"\u2022 Though Eldar transports are like their other starships in that they are crewed by those who have elected the Path of the Mariner, these ships are generally led by Craftmasters that are less experienced than those who pilot true warships and thus suffer a -1 modifier against the Eldar leadership table. \u2022 Eldar transports are reserved for scenarios that require transports, for which they have the value of a full transport or two assault points."},"334":{"pg":334,"fl":"ELDAR","nm":"HAVEN SPACE STATION","bp":200,"ty":"Defence","hp":8,"sp":"\u2013","tn":"\u2013","sh":"Holofields","ar":"5+","tu":"0","tl":"TURRETS","aw":[["Weapons battery","60 cm","8","All around"],["Launch bays","Darkstar: 30 cm / Eagle: 20 cm","5 squadrons","\u2013"],["Pulsar lances","45 cm","3","All around"]],"op":"","ol":[],"sr":"\u2022 Netherfield: imparts an additional right column shift (in addition to that imparted by holofields) for all weapons that use the gunnery table. \u2022 Polarization Field: does not risk suffering a hit for being in contact with blast markers and ignores all effects of solar flares."},"352":{"pg":352,"fl":"DARK ELDAR","nm":"TORTURE CLASS CRUISER","bp":210,"ty":"Cruiser","hp":6,"sp":"35 cm","tn":"90\u00b0","sh":"Shadowfield","ar":"5+","tu":"0","tl":"TURRETS","aw":[["Prow weapons battery","30 cm","12","Front"],["Launch bays","Fighters: 30 cm / Bombers: 20 cm / Assault Boats: 30 cm","4 squadrons","\u2013"],["Prow phantom lance","30 cm","2","Front"],["Prow torpedoes","30 cm","4","Front"],["Impaler assault module","Attack Craft: 30 cm","Special","Front"]],"op":"\u2022 Torture class cruisers may be equipped with one of the following: L
