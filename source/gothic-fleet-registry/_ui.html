re lost.","Note that Demiurg torpedoes and attack craft are not always interchangeable, so Demiurg torpedo tubes cannot be used to launch attack craft, and launch bays may only fire torpedoes if noted in the ship profile."],"ents":[]},{"t":"WAR HOST OF THE DEMIURG","rules":[],"text":[],"ents":[]},{"t":"ATTACK RATING","rules":[],"text":[],"ents":[]},{"t":"LEADERSHIP","rules":[],"text":["They cannot use Demiurg fleet re-rolls, but if available they may purchase special characters with any re-rolls they come with to lead their ships."],"ents":[]},{"t":"CAMPAIGNS","rules":[],"text":["In campaigns, Demiurg and vessels on this fleet list allied with them may gain leadership, crew skills and refits in the same manner as Imperial vessels (max Ld 10)."],"ents":[]},{"t":"AFFILIATION OF BROTHERHOODS","rules":[],"text":[],"ents":[]},{"t":"Re-rolls","rules":[],"text":["A Demiurg fleet may purchase re-rolls, but they are purchased by the fleet as a whole, rather than being considered Fleet Commander re-rolls.","These re-rolls can only be used for Demiurg vessels and not with other starships they may take as allies in their war host."],"ents":[{"l":"One extra re-roll","r":null,"p":25,"src_page":486,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr"},{"l":"Two extra re-rolls","r":null,"p":75,"src_page":486,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr"}]},{"t":"Determination","rules":[],"text":[],"ents":[]},{"t":"Mercenaries","rules":[],"text":["As such, even when allied with two fleets that are fighting each other, Demiurg and Kroot ships will never fire upon each other.","They ignore each other for the purpose of the closest target."],"ents":[]},{"t":"Battleships","rules":[],"text":["Your fleet may include one battleship for every two cruiser-class vessels in the fleet."],"ents":[{"l":"Stronghold Commerce Vessel","r":488,"p":350,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Cruisers","rules":[],"text":["Your fleet may include no more than twelve cruisers.","D "}]},{"t":"ESCORTS","rules":[],"text":["For every three Demiurg capital ships in the fleet, it may include one squadron of up to six Tau or Rogue Trader escorts.","Tau, Nicassar and Rogue Trader escorts may not be mixed in the same squadrons."],"ents":[]},{"t":"Tau Escorts","rules":[],"text":[],"ents":[{"l":"Castellan class starship","r":474,"p":50,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Defender class starship","r":464,"p":45,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Warden class gunship","r":475,"p":30,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Orca class gunship","r":466,"p":25,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Nicassar Escorts","rules":[],"text":[],"ents":[{"l":"Nicassar Dhow","r":491,"p":45,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Rogue Trader Escorts","rules":[],"text":[],"ents":[{"l":"Xenos Vessel","r":184,"p":50,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Xenos Vessel - Pthuxutl war cruiser","r":186,"p":50,"src_page":487,"a":0,"mx":null,"nt":"Named Xenos Vessel variant from pg. 186: same 50 points, with one xenotech system already chosen.","k":"unit"},{"l":"Xenos Vessel - Fra'al raider","r":187,"p":50,"src_page":487,"a":0,"mx":null,"nt":"Named Xenos Vessel variant from pg. 187: same 50 points, with one xenotech system already chosen.","k":"unit"},{"l":"Xenos Vessel - Nekulli whip","r":188,"p":50,"src_page":487,"a":0,"mx":null,"nt":"Named Xenos Vessel variant from pg. 188: same 50 points, with one xenotech system already chosen.","k":"unit"},{"l":"Recommissioned Escort","r":189,"p":30,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Iconoclast Destroyer","r":190,"p":30,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Cargo Vessel","r":192,"p":20,"src_page":487,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["They do not have access to boarding torpedoes but may use torpedo bombers for +10 points per launch bay."],"ents":[{"l":"Torpedo bombers","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book prints this only in the section text: \u201cThey do not have access to boarding torpedoes but may use torpedo bombers for +10 points per launch bay.\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"}]}]}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("bfgdata").textContent);
const SHIPS = DATA.ships, LISTS = DATA.lists;
const $ = s => document.querySelector(s);

/* Faction colours. Orks, Adeptus Mechanicus, Tyranids, Necrons and Chaos are
   the exact pair used by the project's printed ship cards; the rest follow the
   same recipe (near-black hull colour + a readable mid tone) so every list in
   the book gets its own identity. First match wins, so put narrow patterns
   before wide ones. */
const FACTION_COLS = [
  [/dark eldar/i,                     "#1A1424", "#4A3A6B"],
  [/ork/i,                            "#183625", "#47764C"],
  [/mechanicus/i,                     "#4B1018", "#8B2635"],
  [/tyranid/i,                        "#351747", "#824594"],
  [/necron/i,                         "#123735", "#277369"],
  [/chaos/i,                          "#24152E", "#63376F"],
  [/eldar/i,                          "#12303F", "#2C6A8C"],
  [/tau|demiurg|kroot/i,              "#33240C", "#8C6520"],
  [/space marine/i,                   "#22303A", "#46626F"],
  [/inquisition/i,                    "#1C1618", "#5A403F"],
  [/rogue trader|merchant|commerce/i, "#2E2A1A", "#6E6338"],
  [/imperial|navy/i,                  "#14243F", "#2E4C7E"],
];
function factionCols(name){
  for(const [re, d, m] of FACTION_COLS) if(re.test(name)) return [d, m];
  return ["#1F2A22", "#4A5B4E"];
}

/* Weapon classes. G / T / O are the badge colours on the project's cards;
   L, N, R and P are new, added so lances, nova cannons, rams and Tau pulse
   weapons stop sharing the generic battery colour. */
const WEP = [
  [/lance/i,                        "L", "#1F6F8B", "#DCEAF0"],
  [/nova cannon|bombardment/i,      "N", "#A33A2E", "#F6DFDB"],
  [/torpedo/i,                      "T", "#5B646D", "#E5E8EA"],
  [/launch bay|attack craft|bays/i, "O", "#70469A", "#E9DEF3"],
  [/ram|klaw|boarding/i,            "R", "#7A5230", "#EFE2D4"],
  [/pulse|railgun|ion /i,           "P", "#2E6B4A", "#DFEDE2"],
];
function wepClass(name){
  for(const [re, l, b, w] of WEP) if(re.test(name)) return [l, b, w];
  return ["G", "#A97913", "#F4E5BC"];
}
/* Kohdekortissa panssari on lyhyessa muodossa "6+/5+/4+"; kirjan
   profiilissa se on "6+ front / 5+ sides / 4+ rear" eika mahdu solun
   leveyteen. Poimitaan pelkat arvot alkuperaisessa jarjestyksessa. */
/* Launch bay -rivilla kirjan kantama on "Fighta-Bommas: 25 cm / Assault
   Boats: 30 cm". Kohdekortissa se on "25/30cm". */
function shortRange(r){
  const t = String(r || "").replace(/(\d)\s*[\u2013-]\s*(\d+)\s*cm/, "$1\u2013$2cm");
  const m = t.match(/\d+(?=\s*cm)/g);
  /* Moniarvoinen kantama tiivistetaan pelkiksi luvuiksi. Yksikko jaa pois:
     otsikko sanoo jo Range, eika "cm" mahtunut sarakkeeseen nelja kertaa.
     Aluslajien nimet ovat SPECIAL-lohkon laukaisukansisaannossa. */
  return (m && m.length > 1) ? m.join("/") : t;
}

function shortArmour(a){
  const m = String(a || "").match(/\d\+/g);
  return m && m.length > 1 ? m.join("/") : String(a || "");
}

/* Kaari kuvana. Kirjainlyhenne ei mahtunut sarakkeeseen ja lohkokuva on
   myos nopeampi lukea. "Quadrant" ja "All round" tarkoittavat molemmat
   etta ampuja valitsee lohkon, joten ne piirtyvat samoin. */
function arcParts(a){
  const t = String(a || "").trim().toLowerCase();
  if(!t || t === "\u2013" || t === "-") return null;
  if(/all\s*a?round|quadrant/.test(t)) return {f:1, r:1, a:1, l:1, pick:1};
  const p = {f: /front/.test(t) ? 1 : 0, r: /right/.test(t) ? 1 : 0,
             a: /rear|aft/.test(t) ? 1 : 0, l: /left/.test(t) ? 1 : 0};
  if(!(p.f || p.r || p.a || p.l)) return null;
  p.pick = (p.f + p.r + p.a + p.l) > 1 ? 1 : 0;
  return p;
}

const ARC_WEDGE = [
  ["f", "M6,6L2.46,2.46A5,5 0 0 1 9.54,2.46Z"],
  ["r", "M6,6L9.54,2.46A5,5 0 0 1 9.54,9.54Z"],
  ["a", "M6,6L9.54,9.54A5,5 0 0 1 2.46,9.54Z"],
  ["l", "M6,6L2.46,9.54A5,5 0 0 1 2.46,2.46Z"]
];

function arcGlyph(a){
  const p = arcParts(a);
  if(!p) return '<span class="noarc">\u2013</span>';
  return '<svg class="arcg" viewBox="0 0 12 12" aria-hidden="true">' +
    ARC_WEDGE.map(w => '<path d="' + w[1] + '" class="' +
      (p[w[0]] ? (p.pick ? "pick" : "on") : "") + '"/>').join("") +
    '<circle cx="6" cy="6" r="5"/></svg>';
}

/* Critical hits table, Rulebook v1.10 pg. 67. Boxes per result reflect the
   entries that stack (fire, engine, thrusters); * = cannot be repaired. */
const CRIT = [
  ["2", "DORSAL", ""], ["3", "STARBOARD", ""], ["4", "PORT", ""], ["5", "PROW", ""],
  ["6", "ENGINE +1", "NO TURNS"], ["7", "FIRE! +1/turn", ""],
  ["8", "THRUST +1", "SPEED -10"], ["9", "BRIDGE -3Ld*", ""], ["10", "SHIELDS 0*", ""]
];
const CRIT_WIDE = ["11 Hull Breach +D3", "12 Bulkhead Collapse +D6"];
const CRIT_FOOT = "* flagship also loses its remaining re-rolls; 9 and 10 cannot be repaired";
const NECRON_CRIT = [
  ["2", "PORT POWER", "ARC + WHIP OFF"], ["3", "STBD POWER", "ARC + WHIP OFF"],
  ["4", "LIGHTNING ARC OFF", "ALL ARCS"], ["5", "POWER FLOW", "ARC + WHIP OFF"],
  ["6", "DRIVE", "NO TURNS; -1Ld"], ["7", "DRIVE", "SPEED -5; -1Ld"],
  ["8", "INERTIALESS", "NO AAF; -1Ld"], ["9", "SEPULCHRE", "OFF; -2Ld"],
  ["10", "COMMAND CORE", "-3Ld"]
];
const NECRON_CRIT_WIDE = ["11 Power Surge +D3; -2Ld", "12 Ruptured Power Core +D6; -2Ld"];
const NECRON_CRIT_FOOT = "Necron critical repairs succeed on 4+ (Fleets pg. 402).";
const TYRANID_CRIT = [
  ["2", "SPORE CYSTS", "OFF"], ["3", "STARBOARD", "OFF"],
  ["4", "PORT", "OFF"], ["5", "PROW", "OFF"],
  ["6", "THORAX +1", "OFF"], ["7", "HEAVY WOUND", "+1/turn until fixed"],
  ["8", "VENTS +1", "NO TURNS"], ["9", "SYNAPSE", "NO HIVE OVERRIDE"],
  ["10", "SPORES OFF*", "PERMANENT"]
];
const TYRANID_CRIT_WIDE = ["11 Severe Wound +D3", "12 Massive Haemorrhage +D6; bio-plasma splash"];
const TYRANID_CRIT_FOOT = "* result 10 cannot be repaired; result 12 also attacks another target within 2D6 cm.";
const ELDAR_CRIT = [
  ["2", "INFINITY CIRCUIT", "-1Ld"], ["3", "KEEL", "OFF"],
  ["4", "PROW", "OFF"], ["5", "MAST LINES", "MAX TURN 90"],
  ["6", "MAINSAIL", "ALL SPEEDS -5"], ["7", "SUPERSTRUCTURE +1", "TURN >45: 1 = +1"],
  ["8", "MAINSAIL", "NO 2ND MOVE"], ["9", "INFINITY CIRCUIT +1", "-3Ld*"],
  ["10", "HOLOFIELDS", "OFF*"]
];
const ELDAR_CRIT_WIDE = ["11 Hull Breach +D3", "12 Bulkhead Collapse +D6"];
const ELDAR_CRIT_FOOT = "Critical on 4+; * results 9 and 10 cannot be repaired (Fleets p. 305).";
const DARK_ELDAR_CRIT = [
  ["2", "WEAPON SYSTEMS", "ALL OFF"], ["3", "PROW MAIN", "OFF"],
  ["4", "MANOEUVRING", "TEST FOR CTNH"], ["5", "BATTERIES", "OFF"],
  ["6", "TURNING FINS", "MAX TURN 45"], ["7", "ENGINES", "SPEED -10"],
  ["8", "SUPERSTRUCTURE +1", "SO: 1 = +1"], ["9", "COMMANDERS", "-1Ld*"],
  ["10", "SHADOWFIELDS", "OFF*"]
];
const DARK_ELDAR_CRIT_WIDE = ["11 Hull Breach +D3", "12 Bulkhead Collapse +D6"];
const DARK_ELDAR_CRIT_FOOT = "* results 9 and 10 cannot be repaired (Fleets p. 344).";
/* Fleets WiP s. 119. "Mechanicus capital ships must also roll a D6 once
   against the Mechanicus Gifts table." Teksti on tiivistetty kortille;
   avainsana alussa kertoo mihin lahja vaikuttaa. */
const ADMECH_GIFTS = [
  ["Energy Reserves",      "CRIPPLED", "turrets/shields/weapons 75 %, not 50 %"],
  ["Advanced Engines",     "SPEED",    "+5 cm; AAF +1D6"],
  ["Repulsor Shielding",   "BLAST",    "ignore blast/gas; lost if Shields Collapse"],
  ["Fleet Defence Turrets","TURRETS",  "2 turrets: +2 to self or 1 ship &lt;=15 cm"],
  ["Targeting Matrix",     "ORDERS",   "AAF/CTNH/Burn: weapons 75 %; no nova"],
  ["Weapon Relays",        "GUNNERY",  "batteries shift left; lance 6 = double"]
];

/* Mechanicus-alus = Explorator-listan capital ship. Listan escortit otetaan
   Imperial Navy- ja Space Marines -listoilta "otherwise unmodified from their
   normal profiles" (Fleets p. 125), joten ne eivat ole Mechanicus-aluksia
   eivatka saa lahjoja tai korjausbonusta. */
function isMechanicusVessel(sh){
  return /Mechanicus/i.test(L().nm) && !/escort/i.test(sh.ty || "");
}

function giftsHTML(sh){
  if(!isMechanicusVessel(sh)) return "";
  const cells = ADMECH_GIFTS.map((g, i) =>
    `<div><i>${i + 1}</i><span><u>${esc(g[0])}</u>
      <em><b>${esc(g[1])}</b> ${g[2]}</em></span></div>`).join("");
  return `<div class="k-gift"><b>GIFTS OF THE OMNISSIAH
    <em>&mdash; D6 per capital ship; colour in yours &middot; Fleets p. 119</em></b>
    <div class="k-gg">${cells}</div></div>`;
}

const CRIP_LINE = "CRIPPLED: Speed -5 cm; weapons, ordnance, shields and turrets 1/2.";
const REPAIR_LINE = "REPAIR: End Phase, D6 / remaining Hit; 6 = 1 crit; " +
  "blast contact 1/2 dice.";
const CRIT_LINE = "A hit that gets through the shields: D6, a 6 rolls 2D6 on this table.";
const ESCORT_LINE = "ESCORT: one unsaved Hit destroys the ship; a Critical Hit destroys " +
  "the escort outright.";

function crippledLine(sh){
  const ctx = String(sh.fl || "") + " " + String(sh.nm || "");
  if(/TYRANID/i.test(ctx))
    return "CRIPPLED: Speed -5 cm; Bio-plasma and Pyro-acid 1/2; Spores unchanged; no Torpedoes, Attack Craft, Claws or Tentacles.";
  if(/NECRON/i.test(ctx))
    return "CRIPPLED: Speed -5 cm; weapons and Turrets 1/2; Star Pulse off; Portals 1/2 (round down).";
  if(/^ELDAR\b/i.test(String(sh.fl || "")))
    return "CRIPPLED: all Speed values -5 cm; weapons and ordnance 1/2; Holofields unchanged.";
  if(/DARK ELDAR/i.test(ctx))
    return "CRIPPLED: Speed -5 cm; weapons and ordnance 1/2; Shadowfields unchanged.";
  return CRIP_LINE + ((sh.aw || []).some(a => /nova cannon/i.test(a[0])) ? " No Nova Cannon." : "");
}

function shortShield(v){
  const t = String(v || "");
  if(/^holofields?$/i.test(t)) return "HOLO";
  if(/^shadowfields?$/i.test(t)) return "SHADOW";
  return t;
}

function criticalModel(sh){
  const ctx = String(sh.fl || "") + " " + String(sh.nm || "");
  if(/TYRANID/i.test(ctx)) return {
    title:"TYRANID CRITICAL DAMAGE (2D6)", rows:TYRANID_CRIT,
    wide:TYRANID_CRIT_WIDE, foot:TYRANID_CRIT_FOOT
  };
  if(/NECRON/i.test(ctx)) return {
    title:"NECRON CRITICAL DAMAGE (2D6)", rows:NECRON_CRIT,
    wide:NECRON_CRIT_WIDE, foot:NECRON_CRIT_FOOT
  };
  if(/^ELDAR\b/i.test(String(sh.fl || ""))) return {
    title:"ELDAR CRITICAL DAMAGE (2D6)", rows:ELDAR_CRIT,
    wide:ELDAR_CRIT_WIDE, foot:ELDAR_CRIT_FOOT
  };
  if(/DARK ELDAR/i.test(ctx)) return {
    title:"DARK ELDAR CRITICAL DAMAGE (2D6)", rows:DARK_ELDAR_CRIT,
    wide:DARK_ELDAR_CRIT_WIDE, foot:DARK_ELDAR_CRIT_FOOT
  };
  return {title:"CRITICAL DAMAGE (2D6)", rows:CRIT, wide:CRIT_WIDE, foot:CRIT_FOOT};
}

function repairLine(sh){
  const ctx = String(sh.fl || "") + " " + String(sh.nm || "");
  if(/NECRON/i.test(ctx))
    return "REPAIR: End Phase, D6 / remaining Hit; 4+ = 1 crit; blast contact 1/2 dice.";
  /* "Mechanicus vessels always add +1D6 to their rolls when attempting to
     repair critical damage" (Fleets p. 120). Listan escortit ovat Imperial
     Navy -aluksia "otherwise unmodified", joten bonus koskee capitaleja --
     sama rajaus kuin lahjataulukolla. Kortille riittaa poikkeama. */
  if(isMechanicusVessel(sh)) return "ALL ADMECH: REPAIR +1D6.";
  return REPAIR_LINE;
}

/* Vakiolaukaisin ei ansaitse omaa riviaan erikoissaantojen seassa: se on
   sen taulukon selite, jota se koskee, ja menee siksi otsikkoriville.
   Eldarilla ja Dark Eldarilla laukaisin poikkeaa vakiosta, joten ne
   pysyvat oikeina saantoina. */
function criticalTriggerLine(sh){
  if(/^ELDAR\b/i.test(String(sh.fl || "")))
    return "CRITICAL: Every Hit causes critical damage on 4+; roll 2D6 on the Eldar table.";
  if(/DARK ELDAR/i.test(String(sh.fl || "") + " " + String(sh.nm || "")))
    return "CRITICAL: Every Hit causes critical damage on 6; roll 2D6 on the Dark Eldar table.";
  return null;
}

function criticalTriggerHint(sh){
  const ctx = String(sh.fl || "") + " " + String(sh.nm || "");
  if(/^ELDAR\b/i.test(String(sh.fl || ""))) return "every Hit: 4+ &rarr; 2D6";
  if(/DARK ELDAR/i.test(ctx)) return "every Hit: 6 &rarr; 2D6";
  return "through shields: 6 &rarr; 2D6";
}

/* ------------------------------------------------------------- state ---- */
let S = { li:0, limit:1500, units:[] };
const KEY = "gothic-fleet-registry-v1";
function save(){
  try{ S.ln = LISTS[S.li] && LISTS[S.li].nm;
       /* rivin nimi talteen, jotta indeksisiirto voidaan korjata */
       S.units.forEach(u => {
         const e = entOf(u);
         if(e) u.el = e.l;
         u.upn = {};
         Object.keys(u.ups || {}).forEach(k => {
           const p = k.split(":"), sec = LISTS[S.li].secs[+p[0]];
           const en = sec && sec.ents[+p[1]];
           if(en) u.upn[sec.t + "\u0001" + en.l] = u.ups[k];
         });
       });
       localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  /* Yksikot viittaavat osioindekseihin. Jos datan versio on vaihtunut, nimi ei
     enaa tasmaa indeksiin -- silloin laivasto tyhjennetaan mieluummin kuin
     naytetaan vaaria aluksia. */
  try{
    const r = localStorage.getItem(KEY);
    if(!r) return;
    const o = JSON.parse(r);
    if(!o || typeof o.li !== "number" || !LISTS[o.li]) return;
    if(o.ln && o.ln !== LISTS[o.li].nm) return;
    const L0 = LISTS[o.li];
    const ok = (o.units||[]).every(u => {
      const sec = L0.secs[u.s];
      if(!sec || !sec.ents[u.e]) return false;
      if(!u.el) return true;                      /* vanha tallenne ilman nimea */
      if(sec.ents[u.e].l === u.el) return true;
      const j = sec.ents.findIndex(e => e.l === u.el);
      if(j < 0) return false;
      u.e = j;                                    /* rivi siirtyi, korjataan */
      return true;
    });
    /* paivitysvalinnat nimista takaisin indekseiksi */
    if(ok) (o.units || []).forEach(u => {
      if(!u.upn) return;
      const ups = {};
      L0.secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
        const v = u.upn[sec.t + "\u0001" + en.l];
        if(v) ups[si + ":" + ei] = v;
      }));
      u.ups = ups;
    });
    S = ok ? o : { li:o.li, limit:o.limit||1500, units:[] };
    S.units.forEach(normalizeSwaps);
  }catch(e){}
}

const L = () => LISTS[S.li];
const shipOf = u => u.ref ? SHIPS[String(u.ref)] : null;
const entOf = u => L().secs[u.s].ents[u.e];

/* Jokaisella aluksen optiolla on kolme tilaa:
     take  = mukana, maksaa pisteita, tulostuu rastitettuna
     opt   = jaa kortille tyhjaksi ruuduksi, ei maksa (rakennettava kortti)
     off   = ei tulostu lainkaan
   Oletus on "opt", jolloin kortti nayttaa samalta kuin projektin
   PROTO_Peruskortit_valinnoilla eli sen voi rastia myohemmin poydalla. */
/* Kaksi vaihto-optiota voi osoittaa samaan aseistusriviin: Strike Cruiser
   vaihtaa launch baynsa joko torpedoiksi TAI bombardment cannoniksi. Alus
   kantaa yhdet launch bayt, joten molempia ei voi ottaa - ja jos otetaan,
   kortille tulee kaksi merkittya rivia samaan paikkaan ja kumpikin optio
   laskutetaan. Jattaa voimaan sen jonka indeksi on `keep`, muut avataan. */
function dropSwapConflicts(u, sh, keep){
  const pick = sh && sh.ol && sh.ol[keep];
  if(!pick || !pick.sw) return;
  const rows = new Set(pick.sw.f || []);
  sh.ol.forEach((o, j) => {
    if(j === keep || !o.sw) return;
    if(u.os[j] !== "take") return;
    if((o.sw.f || []).some(f => rows.has(f))) u.os[j] = "opt";
  });
}

/* Tallenne voi olla tallennettu ennen kuin ristiriita estettiin, joten
   sama siivous ajetaan latauksessa jokaiselle yksikolle. */
function normalizeSwaps(u){
  const sh = u.ref ? SHIPS[String(u.ref)] : null;
  if(!sh || !sh.ol || !u.os) return;
  sh.ol.forEach((o, i) => { if(u.os[i] === "take") dropSwapConflicts(u, sh, i); });
  u.opts = sh.ol.map((o, j) => j).filter(j => optState(u, j) === "take");
}

function optState(u, i){
  if(u.os && u.os[i]) return u.os[i];
  if((u.opts||[]).includes(i)) return "take";   /* vanha tallenne */
  return "opt";
}
function setOptState(u, i, v){
  u.os = u.os || {};
  u.os[i] = v;
  const sh = shipOf(u);
  if(sh){
    const picked = sh.ol[i];
    if(v === "take") dropSwapConflicts(u, sh, i);
    if(v === "take" && picked && picked.grp){
      const max = Math.max(1, picked.gmax || 1);
      const others = sh.ol.map((o, j) => j).filter(j => j !== i &&
        sh.ol[j].grp === picked.grp && optState(u, j) === "take");
      while(others.length >= max) u.os[others.shift()] = "opt";
    }
    sh.ol.forEach((o, j) => {                 /* riippuvuus ei saa jaada roikkumaan */
      if(o.dep != null && optState(u, j) === "take" && optState(u, o.dep) !== "take")
        u.os[j] = "opt";
    });
  }
  u.opts = (sh ? sh.ol : []).map((o, j) => j).filter(j => optState(u, j) === "take");
}

/* ---- listan paivitykset (re-rollit, Markit, gubbinsit, Dakka Dakka) ----
   Data kertoo jokaisesta rivista lajin k ja kiinnityskohteet at. Kohteeton
   paivitys on laivastonlaajuinen: se tarjotaan mille tahansa alukselle. */
function isUpgradeEnt(en){ return en && en.k === "up"; }

/* Launch bay -voimakkuus = kaikkien laukaisukansirivien voimakkuuksien
   summa. Kirjan oma esimerkki: Terror Ship 2 + 2 = 4, joten torpedo-
   bommat maksavat 4 x 10 = 40 pistetta. Nopalliset arvot lasketaan
   maksimin mukaan ("per (maximal) launch bay strength"), jolloin
   Ork-hulkin D6+2 + D6+2 = 16 ja hinta 160 - tamakin on kirjan luku. */
function bayStrength(sh){
  let n = 0, exact = true;
  (sh && sh.aw || []).forEach(a => {
    if(!/launch bay/i.test(a[0])) return;
    const txt = String(a[2] || "");
    const dice = txt.match(/D(\d+)\s*\+\s*(\d+)/i);
    if(dice){ n += (+dice[1]) + (+dice[2]); return; }
    const nums = (txt.match(/\d+/g) || []).map(Number);
    if(!nums.length){ exact = false; return; }
    /* "Port / Starboard Launch bays  1 / 1 squadron" = yksi per puoli */
    if(/\bport\b/i.test(a[0]) && /\bstarboard\b/i.test(a[0]))
      n += nums.reduce((x, y) => x + y, 0);
    else {
      n += Math.max.apply(null, nums);
      if(nums.length > 1) exact = false;
    }
  });
  return {n: n, exact: exact};
}

/* Aluksen keulapanssari numerona: "6+ front / 5+" -> 6, "5+" -> 5. */
function prowArmour(sh){
  const t = String(sh && sh.ar || "");
  const m = t.match(/(\d)\+\s*(?:front|prow)/i) || t.match(/(\d)\+/);
  return m ? +m[1] : 0;
}

/* Kelpoisuusehto. Tyhja ehto kelpaa aina. Aseistusta katsotaan
   VAIHTOJEN JALKEEN, joten nova cannonin ottaminen sulkee Power Ramin
   aivan kuten kirja sanoo. */
function condOK(u, en, si, ei){
  const c = en && en.cond;
  if(!c) return true;
  const sh = shipOf(u);
  if(!sh) return false;
  const esc = /escort/i.test(sh.ty || "");
  if(c.cap && esc) return false;
  if(c.esc && !esc) return false;
  if(c.ty && !new RegExp(c.ty, "i").test(sh.ty || "")) return false;
  if(c.nm && !new RegExp(c.nm, "i").test(sh.nm || "")) return false;
  if(c.nmno && new RegExp(c.nmno, "i").test(sh.nm || "")) return false;
  if(c.prow && prowArmour(sh) < +c.prow) return false;
  /* vain voimassa oleva kokoonpano: auki jatetty vaihtoehto ei laske */
  /* Vain voimassa oleva kokoonpano, ja rivin oma vaikutus poissuljettuna:
     muuten "vaatii keulatorpedot" kumoaisi itsensa heti kun torpedot on
     vaihdettu nova cannoniin. */
  const skip = si == null ? null : upgradeKey(si, ei);
  const rows = armModel(u, sh, skip).filter(r => !r.alt || r.box === "on")
    .map(r => r.a);
  const rowHit = pat => {
    const p = String(pat).split("@");
    const rx = new RegExp(p[0], "i");
    return rows.some(a => rx.test(a[0]) &&
      (p.length < 2 || String(a[1]).indexOf(p[1]) >= 0));
  };
  if(c.has && !rowHit(c.has)) return false;
  if(c.no && rowHit(c.no)) return false;
  if(c.noopt && (sh.ol || []).some(o => new RegExp(c.noopt, "i").test(o.t)))
    return false;
  return true;
}

function upgradeKey(si, ei){ return si + ":" + ei; }

function upTokens(t){
  return String(t || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ")
    .split(/\s+/).filter(w => w.length > 2);
}

/* Onko tama paivitys jo aluksen omana optiona samalla hinnalla? */
function coveredByShipOption(u, en){
  const sh = shipOf(u);
  if(!sh || en.p == null) return false;
  const want = upTokens(en.l);
  if(!want.length) return false;
  return (sh.ol || []).some(o => o.c === en.p &&
    want.every(w => upTokens(o.t).indexOf(w) >= 0));
}

/* Kaikki listan paivitykset kahtena joukkona: taman rivin omat ja muut. */
function upgradesFor(u){
  const own = [], other = [];
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(!isUpgradeEnt(en)) return;
    if(coveredByShipOption(u, en)) return;
    if(!condOK(u, en, si, ei)) return;
    const at = en.at;
    /* Pakollinen ei saa piiloutua koontilistan alle: se on aina voimassa
       ja nakyy kortilla, joten se nakyy myos rakentajassa. */
    if(en.req){ own.push([si, ei, en]); return; }
    if(!at){ other.push([si, ei, en]); return; }
    if(at.some(p => p[0] === u.s && p[1] === u.e)) own.push([si, ei, en]);
  }));
  return {own: own, other: other};
}

function upState(u, si, ei){
  const en = L().secs[si].ents[ei];
  if(en && en.req && u.s === si) return "take";   /* pakollinen, ei irrotettavissa */
  return (u.ups && u.ups[upgradeKey(si, ei)]) || "off";
}

function setUpState(u, si, ei, v){
  u.ups = u.ups || {};
  u.ups[upgradeKey(si, ei)] = v;
  /* Valinta voi sulkea toisen: nova cannon tekee Power Ramista
     kelvottoman. Silloin se otetaan pois eika jaa maksamaan hiljaa. */
  const drop = () => Object.keys(u.ups).forEach(k => {
    if(u.ups[k] === "off") return;
    const p = k.split(":"), sec = L().secs[+p[0]];
    const e2 = sec && sec.ents[+p[1]];
    if(e2 && !e2.req && !condOK(u, e2, +p[0], +p[1])) u.ups[k] = "off";
  });
  const en = L().secs[si].ents[ei];
  if(v === "take" && en && en.grp){
    /* saman ryhman muut pois: re-rolleja otetaan yksi rivi, ei kolmea */
    Object.keys(u.ups).forEach(k => {
      if(k === upgradeKey(si, ei)) return;
      const p = k.split(":"), e2 = (L().secs[+p[0]] || {ents: []}).ents[+p[1]];
      if(e2 && e2.grp === en.grp && u.ups[k] === "take") u.ups[k] = "off";
    });
  }
  drop();
}

/* Pakolliset paivitykset kiinnittyvat heti kun yksikko lisataan. */
function applyRequired(u){
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(!isUpgradeEnt(en) || !en.req) return;
    /* Kohteeton pakollinen koskee jokaista alusta jolle ehto sopii:
       niin AdMechin +1 turret ja dorsal lance osuvat oikeisiin runkoihin. */
    const mine = en.at ? en.at.some(p => p[0] === u.s && p[1] === u.e)
                       : condOK(u, en, si, ei);
    if(!mine) return;
    u.ups = u.ups || {};
    u.ups[upgradeKey(si, ei)] = "take";
  }));
}

function upCost(u, en){
  if(en.p == null) return 0;
  if(en.per === "hull") return en.p * hulls(u);
  if(en.per === "bay") return en.p * bayStrength(shipOf(u)).n;
  return en.p;
}

/* Hintateksti kertoo seka kertoimen etta lopputuloksen, koska
   "+10 / bay" yksin ei auta pisteiden laskennassa. */
function upCostLabel(u, en){
  if(en.p == null) return "see text";
  if(!en.p) return "free";
  const sign = en.p > 0 ? "+" : "";
  if(en.per === "hull")
    return sign + en.p + " / ship = " + sign + upCost(u, en);
  if(en.per === "bay"){
    const b = bayStrength(shipOf(u));
    return sign + en.p + " x " + b.n + " bays = " + sign + upCost(u, en) +
      (b.exact ? "" : " (check)");
  }
  return sign + en.p;
}

function upgradePts(u){
  let p = 0;
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(isUpgradeEnt(en) && upState(u, si, ei) === "take") p += upCost(u, en);
  }));
  return p;
}

function unitPts(u){
  const en = entOf(u);
  let p = (en.p == null ? (u.custom|0) : en.p) * (u.n || 1);
  const sh = shipOf(u);
  if(sh) sh.ol.forEach((o, i) => {
    if(o.c != null && optState(u, i) === "take")
      p += o.c * (isEscort(u) ? hulls(u) : 1);
  });
  return p + upgradePts(u) + (u.adj|0);
}

/* Kattohinta: paljonko yksikko maksaa, jos jokainen viela auki oleva
   valinta rastitaan poydalla. Nain listan loppusumma kertoo myos sen,
   kuinka paljon pelivaraa avoimet optiot vaativat. */
function unitMaxPts(u){
  const sh = shipOf(u);
  let p = unitPts(u);
  if(sh) sh.ol.forEach((o, i) => {
    if(o.c != null && optState(u, i) === "opt")
      p += o.c * (isEscort(u) ? hulls(u) : 1);
  });
  const seen = {};
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(!isUpgradeEnt(en) || upState(u, si, ei) !== "opt") return;
    /* Toisensa poissulkevista otetaan vain kallein: kaikkia ei voi ottaa. */
    if(en.grp){
      seen[en.grp] = Math.max(seen[en.grp] || 0, upCost(u, en));
      return;
    }
    p += upCost(u, en);
  }));
  Object.keys(seen).forEach(g => p += seen[g]);
  return p;
}
const totalMax = () => S.units.reduce((a, u) => a + unitMaxPts(u), 0);

/* Aseen nimi: vain vakiintuneet lyhennykset, ei sanojen katkaisua.
   "Port / Starboard" on kirjan tapa kirjoittaa yksi molemminpuolinen ase;
   ilman valilyontia se mahtuu sarakkeeseen myos rastiruudun kanssa. */
function shortWeaponName(v){
  return String(v || "")
    .replace(/\*/g, "")
    .replace(/\s*\/\s*/g, "/")
    .replace(/\bbatteries\b/gi, "batt.")
    .replace(/\s+/g, " ").trim();
}

/* FIREPOWER/STR on tarkoituksella tiivis sarake. Pelitermit kirjoitetaan
   muualla auki, mutta tassa kaytetaan vain vakiintuneita lyhenteita. */
function shortStrength(v){
  return String(v || "")
    .replace(/\bsquadrons?\b/gi, "Sqn")
    .replace(/\bcapacity\s*:\s*/gi, "Cap. ")
    .replace(/\bper enemy\b/gi, "/enemy")
    .replace(/\bspecial\b/gi, "Spec.")
    .replace(/\s*\/\s*/g, "/")
    /* Nollan levyinen valilyonti kauttaviivan jalkeen: "1 Orca/Warden" ei
       mahdu 11,9 mm sarakkeeseen yhdella rivilla, ja ilman tata selain ei
       saa katkaista sita mistaan. Nakymattoman merkin ansiosta katkos
       osuu kauttaviivaan eika sanan keskelle. */
    .replace(/\//g, "/\u200B")
    .replace(/\s+/g, " ").trim();
}
const total = () => S.units.reduce((a,u) => a + unitPts(u), 0);
/* Ships counted for ratio / cap rules: an escort squadron counts as its
   number of hulls, a capital ship as one. */
const hulls = u => u.n || 1;

/* -------------------------------------------------------- validation ---- */
function isEscort(u){ const sh = shipOf(u); return sh && /escort/i.test(sh.ty); }
/* Paivitysrivi ei ole runko eika yksikko: se ei saa kasvattaa osiolaskuria.
   Vanhat tallenteet voivat sisaltaa paivityksen omana rivinaan, joten
   suodatus tehdaan taalla eika vain lisayksen yhteydessa. */
function isUnitRow(u){ return !isUpgradeEnt(L().secs[u.s].ents[u.e]); }
function secShips(si){ return S.units.filter(u => u.s === si && isUnitRow(u))
  .reduce((a,u) => a + hulls(u), 0); }
function secUnits(si){ return S.units.filter(u => u.s === si && isUnitRow(u)).length; }

function checks(){
  const out = [], lim = S.limit|0, tot = total();
  out.push({ ok: tot <= lim, t:"Points limit",
    v: tot + " / " + lim,
    s: tot <= lim ? (lim - tot) + " pts remaining" : (tot - lim) + " pts over the limit" });

  L().secs.forEach((sec, si) => (sec.rules || []).forEach(r => {
    if(r.kind === "section_count"){
      const c = secShips(si);
      out.push({ ok: c <= r.max && (c === 0 || c >= r.min), t: sec.t,
        v: c + " / " + r.max, s: r.src });
    }
    if(r.kind === "cap"){
      const c = (r.sec||[si]).reduce((a,i) => a + secShips(i), 0);
      out.push({ ok: c <= r.max, t: sec.t, v: c + " / " + r.max, s: r.src });
    }
    if(r.kind === "ratio"){
      const have = (r.allow_sec||[si]).reduce((a,i) => a + secShips(i), 0);
      const base = (r.per_sec||[]).reduce((a,i) => a + secShips(i), 0);
      const allowed = Math.floor(base / r.per) * r.allow;
      out.push({ ok: have <= allowed, t: sec.t,
        v: have + " / " + allowed, s: r.src });
    }
    if(r.kind === "per_points"){
      const c = (r.sec||[si]).reduce((a,i) => a + secUnits(i), 0);
      const allowed = Math.max(1, Math.ceil(lim / r.per)) * r.each;
      out.push({ ok: c <= allowed, t: sec.t, v: c + " / " + allowed, s: r.src });
    }
    if(r.kind === "mandatory_at"){
      const c = (r.sec||[si]).reduce((a,i) => a + secUnits(i), 0);
      const need = lim >= r.points;
      out.push({ ok: !need || c >= 1, t: sec.t,
        v: need ? (c >= 1 ? "included" : "missing") : "not required",
        s: r.src, warn: !need });
    }
    if(r.kind === "squadron"){
      S.units.filter(u => u.s === si && isEscort(u)).forEach(u => {
        const n = hulls(u), sh = shipOf(u);
        out.push({ ok: n >= r.min && n <= r.max, t: sh.nm,
          v: n + " ships", s: "Squadrons of " + r.min + "\u2013" + r.max + ". " + r.src });
      });
    }
  }));

  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(en.mx == null) return;
    if(isUpgradeEnt(en)) return;
    const c = S.units.filter(u => u.s === si && u.e === ei).reduce((a,u) => a + hulls(u), 0);
    if(c > 0 || en.mx === 0)
      out.push({ ok: c <= en.mx, t: en.l, v: c + " / " + en.mx,
        s: "Entry is limited to " + en.mx + " in the list." });
  }));
  return out;
}

/* -------------------------------------------------------------- view ---- */
function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function title(s){ return String(s||"").toLowerCase().replace(/(^|[\s(\-\u2013/])([a-z])/g,
  (m,a,b) => a + b.toUpperCase()); }

function renderTop(){
  $("#srcline").textContent = DATA.src;
  const sel = $("#listsel");
  sel.innerHTML = LISTS.map((l,i) =>
    `<option value="${i}"${i===S.li?" selected":""}>${esc(l.nm)}</option>`).join("");
  $("#limit").value = S.limit;
  const tot = total(), over = tot > (S.limit|0);
  const t = $("#tally");
  t.className = "tally" + (over ? " over" : "");
  const mx = totalMax();
  t.innerHTML = `<b>${tot}</b><i>/ ${S.limit|0} pts</i>${
    mx > tot ? `<i class="maxp">max ${mx} if every open option is taken</i>` : ""}`;
  $("#listmeta").textContent = "Fleets WiP pg. " + L().pg;
}

function renderCatalogue(){
  const wrap = $("#catalogue");
  wrap.innerHTML = L().secs.map((sec, si) => {
    if(!sec.ents.length && !sec.rules.length && !sec.text.length) return "";
    const hdr = (sec.rules||[]).find(r => r.kind === "section_count" && r.hdr);
    const auto = (sec.rules||[]).map(r =>
      `<p class="rule"><b>Checked by the builder</b>${esc(r.src)}</p>`).join("");
    const man = (sec.text||[]).map(t =>
      `<p class="rule manual"><b>Check yourself</b>${esc(t)}</p>`).join("");
    const rows = sec.ents.map((en, ei) => {
      const sh = en.r ? SHIPS[String(en.r)] : null;
      const up = isUpgradeEnt(en);
      const targets = up && en.at
        ? en.at.map(p => title(L().secs[p[0]].ents[p[1]].l)).filter((v,i,a) => a.indexOf(v)===i)
        : null;
      const sub = sh
        ? `${sh.ty} \u00b7 ${sh.hp||"\u2013"} hits \u00b7 ${sh.sp} \u00b7 ${sh.sh} sh \u00b7 ${sh.ar} \u00b7 ${sh.tu} tur`
        : en.k === "cmd"
          ? "commander \u2014 assign to a ship when you deploy"
        : up
          ? (targets ? "tick it on: " + targets.slice(0,3).join(", ") +
              (targets.length > 3 ? " ..." : "")
            : "tick it on any ship in the fleet")
          : "fleet option";
      const cost = en.p == null ? "?" : (en.a || up ? "+" : "") + en.p;
      const warn = en.nt ? `<div class="warn"><b>${en.badref
        ? "Source error &ndash; check before use"
        : en.prose ? "Not printed as a priced line" : "Source correction"
        }</b>${esc(en.nt)}</div>` : "";
      /* Paivitys ei ole oma yksikkonsa, joten sita ei voi lisata riviksi:
         se rastitaan siina aluksessa tai komentajassa johon se kuuluu. */
      return `<div class="pick${up ? " upg" : ""}"><div class="nm">${esc(title(en.l))}${
        up ? `<span class="tag">${en.req ? "required" : "upgrade"}</span>` : ""}
        <small>${esc(sub)}</small></div>
        <div class="p">${cost}</div>
        ${up ? "" : `<button class="add" data-s="${si}" data-e="${ei}" title="Add">+</button>`}
        ${warn}</div>`;
    }).join("");
    return `<details class="sec"${sec.ents.length ? " open" : ""}>
      <summary>${esc(title(sec.t))}${hdr ? `<span class="limitchip">max ${hdr.max}</span>` : ""}
      <span class="n">${sec.ents.filter(e => !isUpgradeEnt(e)).length || ""}</span></summary>
      <div class="secbody">${auto}${man}${rows}</div></details>`;
  }).join("");
  wrap.querySelectorAll(".add").forEach(b => b.onclick = () => addUnit(+b.dataset.s, +b.dataset.e));
}

function renderFleet(){
  const box = $("#fleet");
  if(!S.units.length){
    box.innerHTML = `<p class="empty">Nothing added yet. Pick ships from the list on the left \u2014
      only entries this fleet list allows are shown.</p>`;
    $("#fleetmeta").textContent = "";
    return;
  }
  $("#fleetmeta").textContent = S.units.length + " units \u00b7 " +
    S.units.reduce((a,u) => a + hulls(u), 0) + " hulls";
  box.innerHTML = S.units.map((u, ui) => {
    const en = entOf(u), sh = shipOf(u), esc_ = isEscort(u);
    const stats = sh ? `<div class="stats">
      <span><b>Hits</b> ${sh.hp||"\u2013"}</span><span><b>Speed</b> ${esc(sh.sp)}</span>
      <span><b>Turns</b> ${esc(sh.tn)}</span><span><b>Shields</b> ${esc(sh.sh)}</span>
      <span><b>Armour</b> ${esc(sh.ar)}</span><span><b>Turrets</b> ${
        esc(effTurrets(u, sh))}</span>
      <span><b>pg.</b> ${sh.pg}</span></div>` : "";
    const opts = sh && sh.ol.length ? sh.ol.map((o, oi) => {
      const st = optState(u, oi);
      const blocked = o.dep != null && optState(u, o.dep) !== "take";
      const c = o.c == null ? "see text" : (o.c ? "+" + o.c : "free");
      const b = (v, lab, cls) => `<button type="button" class="${cls||""}"
        data-u="${ui}" data-o="${oi}" data-v="${v}" aria-pressed="${st===v}"
        ${v === "take" && blocked ? "disabled" : ""}
        title="${v==="take" ? "Counted in the points and printed ticked"
              : v==="opt" ? "Printed on the card as an empty box, not counted"
              : "Left off the card entirely"}">${lab}</button>`;
      return `<div class="opt${blocked ? " dis" : ""}">
        <span class="tri">${b("take","Take")}${b("opt","Option")}${b("off","Hide","off")}</span>
        <span>${esc(o.t)}</span><span class="c">${c}</span></div>`;
    }).join("") : "";
    const ups = upgradesFor(u);
    const upRow = (si, ei, up) => {
      const st = upState(u, si, ei);
      const c = upCostLabel(u, up);
      const b = (v, lab, cls) => `<button type="button" class="${cls||""}"
        data-u="${ui}" data-us="${si}" data-ue="${ei}" data-v="${v}"
        aria-pressed="${st===v}"
        title="${v==="take" ? "Counted in the points and printed ticked"
              : v==="opt" ? "Printed on the card as an empty box, not counted"
              : "Left off the card entirely"}">${lab}</button>`;
      return `<div class="opt${up.req ? " req" : ""}">
        <span class="tri">${b("take","Take")}${b("opt","Option")}${b("off","Hide","off")}</span>
        <span>${esc(title(up.l))}${up.req ? " \u2014 required by the fleet list" : ""}
          ${up.nt ? `<span class="src">${esc(up.nt)}</span>` : ""}</span>
        <span class="c">${c}</span></div>`;
    };
    const upOwn = ups.own.map(x => upRow(x[0], x[1], x[2])).join("");
    const upOther = ups.other.length
      ? `<details><summary>Other fleet-list upgrades (${ups.other.length})</summary>
         ${ups.other.map(x => upRow(x[0], x[1], x[2])).join("")}</details>`
      : "";
    const upBlock = (upOwn || upOther)
      ? `<div class="ups"><h5>Fleet-list upgrades</h5>${upOwn}${upOther}</div>` : "";
    const cust = en.p == null ? `<input type="text" inputmode="numeric" class="cpts"
      data-u="${ui}" value="${u.custom||0}" style="width:70px" title="Points (varies \u2014 enter it)">` : "";
    return `<div class="unit">
      <div class="uhead">
        <span class="cls">${esc(title(sh ? sh.nm : en.l))}</span>
        ${en.badref ? '<span class="ty" style="color:var(--bad)">source page ref wrong</span>' : ""}
        <span class="ty">${esc(sh ? sh.ty
          : en.k === "cmd" ? "commander" : "fleet option")}${esc_ ? " squadron" : ""}</span>
        <span class="pts">${unitPts(u)} pts${(() => {
          const mx = unitMaxPts(u);
          return mx > unitPts(u) ? `<span class="maxp">max ${mx}</span>` : "";
        })()}</span>
      </div>
      <div class="uctl">
        ${sh ? `<input type="text" class="nmin" data-u="${ui}" placeholder="${esc_ ? "Squadron name" : "Ship name (optional)"}" value="${esc(u.name||"")}">` : ""}
        ${esc_ ? `<div class="stepper"><button data-u="${ui}" data-d="-1">\u2212</button>
           <span>${u.n||1}</span><button data-u="${ui}" data-d="1">+</button></div>` : ""}
        ${cust}
        <button class="del" data-del="${ui}">Remove</button>
      </div>
      ${esc_ ? `<div class="uctl"><input type="text" class="memin" data-u="${ui}"
        style="flex:1 1 300px;min-width:180px"
        placeholder="Ship names, comma separated - printed in the squadron boxes"
        value="${esc(u.members||"")}"></div>` : ""}
      <div class="uctl">
        <input type="text" class="notein" data-u="${ui}" style="flex:1 1 240px;min-width:150px"
          placeholder="Refit, gift, gubbins or other fleet-rule upgrade \u2014 prints on the card"
          value="${esc(u.note||"")}">
        <label style="display:flex;align-items:center;gap:5px;font:400 11px/1 var(--mono);color:var(--ink-3)">
          \u00b1 pts <input type="text" inputmode="numeric" class="adjin" data-u="${ui}"
            style="width:62px" value="${u.adj|0}"></label>
      </div>
      ${stats}${opts}${upBlock}</div>`;
  }).join("");

  box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    S.units.splice(+b.dataset.del, 1); render(); });
  box.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
    const u = S.units[+b.dataset.u];
    u.n = Math.max(1, (u.n||1) + (+b.dataset.d)); render(); });
  box.querySelectorAll(".nmin").forEach(i => i.oninput = () => {
    S.units[+i.dataset.u].name = i.value; save(); });
  box.querySelectorAll(".notein").forEach(i => i.oninput = () => {
    S.units[+i.dataset.u].note = i.value; save(); });
  box.querySelectorAll(".cpts").forEach(i => i.oninput = () => {
    S.units[+i.dataset.u].custom = parseInt(i.value, 10) || 0; renderTop(); renderChecks(); save(); });
  box.querySelectorAll(".adjin").forEach(i => i.oninput = () => {
    S.units[+i.dataset.u].adj = parseInt(i.value, 10) || 0;
    i.closest(".unit").querySelector(".pts").textContent =
      unitPts(S.units[+i.dataset.u]) + " pts";
    renderTop(); renderChecks(); save(); });
  box.querySelectorAll(".tri button").forEach(b => b.onclick = () => {
    const u = S.units[+b.dataset.u];
    if(b.dataset.us != null && b.dataset.us !== "")
      setUpState(u, +b.dataset.us, +b.dataset.ue, b.dataset.v);
    else
      setOptState(u, +b.dataset.o, b.dataset.v);
    render(); });
  box.querySelectorAll(".memin").forEach(i => i.oninput = () => {
    S.units[+i.dataset.u].members = i.value; save(); });
}

function renderChecks(){
  const cs = checks(), bad = cs.filter(c => !c.ok).length;
  $("#chkmeta").textContent = bad ? bad + " problem" + (bad>1?"s":"") : "all clear";
  $("#checks").innerHTML = cs.map(c =>
    `<div class="chk ${c.ok ? (c.warn ? "warn" : "") : "bad"}">
      <span class="dot"></span>
      <span><b>${esc(c.t)}</b><span class="src">${esc(c.s)}</span></span>
      <span class="val">${esc(c.v)}</span></div>`).join("");
  const n = L().secs.reduce((a,s) => a + s.text.length, 0);
  const e = L().secs.reduce((a,s) => a + s.rules.length, 0);
  $("#manualnote").innerHTML = `<b>What this checks.</b> ${e} restriction${e===1?"":"s"}
    in this list are machine-readable and enforced above \u2014 each one shows the sentence it
    came from. A further ${n} rule sentence${n===1?"":"s"} could not be turned into a check
    and are printed under their section on the left, marked <b>Check yourself</b>.
    Ordnance, refits, campaign rules and anything phrased as an exception are always yours to verify.`;
}

function addUnit(si, ei){
  const en = L().secs[si].ents[ei];
  const sh = en.r ? SHIPS[String(en.r)] : null;
  const u = { s:si, e:ei, ref:en.r || null, n:1, opts:[], name:"" };
  /* Avoin hinta ("varies") saa lahtoarvokseen profiilin oman hinnan: kirja
     jattaa listarivin auki, mutta alussivu antaa luvun. Pelaaja voi
     kirjoittaa sen yli - se on avoimen hinnan tarkoitus. */
  if(en.p == null && sh && sh.bp != null) u.custom = sh.bp;
  if(sh && /escort/i.test(sh.ty)){
    const sq = (L().secs[si].rules||[]).find(r => r.kind === "squadron");
    u.n = sq ? sq.min : 2;
  }
  applyRequired(u);
  S.units.push(u); render();
}

function render(){
  S.units.forEach(applyRequired);      /* vanhat tallenteet mukaan */
  renderTop(); renderCatalogue(); renderFleet(); renderChecks(); save();
}

   Kortin osiot ja mitat vastaavat projektin ship cards -kortteja:
   144 x 135 mm, 2 kpl / A4 pysty. */

/* Aseen nimen tunnistava avain: sivun ja suunnan maareet pois, jolloin
   "Prow bombardment cannon" ja "Port heavy gunz" typistyvat muotoon
   "bombardment cannon" ja "heavy gunz". */
function wepKey(name){
  return String(name || "").toLowerCase()
    .replace(/^(port|starboard|prow|dorsal|forward|aft)\s+/g, "")
    .replace(/\*/g, "")
    .replace(/\s+(battery|batteries|bays|bay)$/g, "")
    .trim();
}

function fleetMatches(def, sh){
  const fl = String(sh.fl || ""), ctx = fl + " " + String(sh.nm || "");
  return !def.fleet || def.fleet.test(fl) || def.fleet.test(ctx);
}

function defMatches(def, sh, arm){
  return fleetMatches(def, sh) && def.wep.test(String(arm[0] || "")) &&
    (!def.notWep || !def.notWep.test(String(arm[0] || ""))) &&
    (!def.range || def.range.test(String(arm[1] || "")));
}

function defOptionMatches(def, sh, option){
  const text = String(option && option.t || option || "");
  return fleetMatches(def, sh) && (!def.notOpt || !def.notOpt.test(text)) &&
    ((def.opt && def.opt.test(text)) ||
     (!def.opt && def.wep.test(text) && (!def.range || def.range.test(text))));
}

function uniqRefs(refs){
  const out = [], seen = {};
  refs.forEach(r => { if(r && !seen[r.id]){ seen[r.id] = 1; out.push(r); } });
  return out;
}

function sourceStarDef(sh){
  return (sh.aw || []).some(a => /\*/.test(a[0])) ?
    {id:"source_asterisk", color:"#A33B54", mentions:[/^\s*\*/]} : null;
}

function weaponMentioned(text, arm){
  const low = String(text || "").toLowerCase();
  const name = wepKey(arm[0]).replace(/\b(battery|batteries|bay|bays)\b/g, "").trim();
  if(name.length >= 4 && low.includes(name)) return true;
  if(/lance/i.test(arm[0]) && /\blances?\b/i.test(text)) return true;
  if(/torpedo/i.test(arm[0]) && /\btorpedo(?:es)?\b|\blauncha/i.test(text)) return true;
  if(/launch bay/i.test(arm[0]) && /launch bays?|attack craft/i.test(text)) return true;
  if(/weapons battery/i.test(arm[0]) && /weapons batter(?:y|ies)/i.test(text)) return true;
  return false;
}

function localRef(arm){
  const [letter, color] = wepClass(arm[0]);
  const family = /lance/i.test(arm[0]) ? "lance" :
    /torpedo/i.test(arm[0]) ? "torpedo" :
    /launch bay/i.test(arm[0]) ? "launch" :
    /battery|gunz/i.test(arm[0]) ? "battery" : wepKey(arm[0]);
  return {id:"local_" + family, color, letter};
}

function specialModel(sh){
  const raw = (sh.sr || "").trim();
  const parts = [];
  if(raw){
    (raw.indexOf("\u2022") >= 0
        ? raw.split("\u2022")
        : raw.split(/(?<=\.)\s+(?=[A-Z])/)
      ).forEach(t => {
        t = t.trim().replace(/^[\u2022\s]+/, "");
        if(t.length > 2) parts.push(t);
      });
  }
  const byWeapon = (sh.aw || []).map(a => SPECIAL_WEAPON_RULES.filter(d => defMatches(d, sh, a)));
  const optionDefs = (sh.ol || []).map(o => SPECIAL_WEAPON_RULES.filter(d => defOptionMatches(d, sh, o)));
  const defs = uniqRefs(byWeapon.flat().concat(optionDefs.flat()));
  const sourceDef = sourceStarDef(sh);
  const rules = parts.map(t => {
    let refs = defs.filter(d => (d.mentions || []).some(re => re.test(t)));
    (sh.aw || []).forEach((a, i) => {
      if(!weaponMentioned(t, a)) return;
      refs = refs.concat(byWeapon[i].length ? byWeapon[i] : [localRef(a)]);
    });
    if(sourceDef && /^\s*\*/.test(t)) refs.push(sourceDef);
    return {t, refs:uniqRefs(refs), ast:refs.length > 0};
  });
  defs.forEach(def => {
    if(!rules.some(r => r.refs.some(x => x.id === def.id)))
      rules.push({t:def.text, refs:[def], ast:true, canonical:true});
  });
  SPECIAL_HULL_RULES.filter(d => fleetMatches(d, sh))
    .forEach(d => rules.push({t:d.text, refs:[], ast:false, canonical:true, hull:d.id}));
  return {rules, byWeapon, optionDefs, sourceDef};
}

function specialLines(sh){
  return specialModel(sh).rules;
}

function starredKeys(rules, sh){
  const model = specialModel(sh), out = {};
  (sh.aw || []).forEach((a, i) => {
    let refs = model.byWeapon[i].slice();
    rules.forEach(r => {
      if(weaponMentioned(r.t, a) && !refs.length) refs.push(localRef(a));
    });
    if(model.sourceDef && /\*/.test(a[0])) refs.push(model.sourceDef);
    const used = new Set(rules.flatMap(r => (r.refs || []).map(x => x.id)));
    refs = uniqRefs(refs).filter(r => used.has(r.id));
    if(refs.length) out[i] = refs;
  });
  return out;
}

function starHTML(refs){
  return uniqRefs(refs || []).map(r =>
    `<b class="ast" style="--ast:${r.color}" data-rule="${esc(r.id)}" title="${esc(r.id.replace(/_/g," "))}">*</b>`
  ).join("");
}

function optStars(sh, o, rules){
  const model = specialModel(sh), text = String(o.t || "");
  const oi = (sh.ol || []).indexOf(o);
  let refs = oi >= 0 ? model.optionDefs[oi].slice() : [];
  model.byWeapon.forEach((defs, i) => {
    if(weaponMentioned(text, sh.aw[i])) refs = refs.concat(defs);
  });
  const used = new Set(rules.flatMap(r => (r.refs || []).map(x => x.id)));
  return uniqRefs(refs).filter(r => used.has(r.id));
}

/* Aseistustaulukon rivit sen jalkeen kun vaihto-optiot on huomioitu.
   Sama lahderivi voi saada useita vaihtoehtoja (esim. Strike Cruiserin
   laukaisukannet -> torpedoputket TAI pommituskanuuna). */
function armModel(u, sh, skip){
  const alts = {}, gone = {};
  /* Valikkoaseet: mika optio omistaa minkakin aseistusrivin. Rivi jolla ei
     ole omistajaa on vakioaseistusta eika voi kadota. */
  const owner = {};
  (sh.ol || []).forEach((o, i) => {
    (o.aws || []).forEach(r => (owner[r] = owner[r] || []).push(i));
  });
  (sh.ol || []).forEach((o, i) => {
    if(!o.sw) return;
    const st = optState(u, i);
    if(st === "off") return;
    o.sw.f.forEach((fi, k) => {
      (alts[fi] = alts[fi] || []).push([o.sw.t[k] || o.sw.t[0], st]);
      if(st === "take") gone[fi] = 1;
    });
  });
  /* Listan paivitys koskee montaa eri alusta, joten korvattava rivi
     tunnistetaan nimihahmolla eika indeksilla. Ehtoja ei katsota tassa:
     valittu on valittu, ja nain valtetaan kehapaattely condOK:n kanssa. */
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(!isUpgradeEnt(en) || !en.swp) return;
    if(skip === upgradeKey(si, ei)) return;
    const st = upState(u, si, ei);
    if(st === "off") return;
    const rx = new RegExp(en.swp.f, "i");
    sh.aw.forEach((a, fi) => {
      if(!rx.test(a[0])) return;
      if(en.swp.onlyrg && String(a[1]).indexOf(en.swp.onlyrg) < 0) return;
      let st2 = en.swp.st || a[2];
      if(en.swp.halfst){
        /* "launch bay strength divided in half (rounding down)" */
        st2 = String(a[2]).replace(/\d+/, m => String(Math.floor(+m / 2)));
      }
      const row = en.swp.t ? en.swp.t.slice()
        : [a[0], en.swp.rg || a[1], st2, en.swp.ar || a[3]];
      (alts[fi] = alts[fi] || []).push([row, st]);
      if(st === "take") gone[fi] = 1;
    });
  }));
  const rows = [];
  sh.aw.forEach((a, i) => {
    const own = owner[i];
    let menuBox = null;
    if(own){
      const states = own.map(oi => optState(u, oi));
      if(states.every(x => x === "off")) return;    /* piilotettu ase pois */
      menuBox = states.some(x => x === "take") ? "on" : "open";
    }
    const alt = alts[i];
    /* Vaihtoehtoryhma on tasan yhden aseen paikka. Perusrivi on mukana vain
       kun mitaan korvaajaa ei ole otettu (gone[i]), joten silloin se on se
       ase joka on kaytossa - ja ryhmassa on aina tasan yksi merkitty rivi. */
    if(!gone[i]) rows.push({a: a, i: i, grp: alt ? 1 : 0,
                            box: alt ? "on" : menuBox});
    (alt || []).forEach(pair =>
      rows.push({a: pair[0], i: i, alt: 1, grp: 1,
                 box: pair[1] === "take" ? "on" : "open"}));
  });
  /* Listan tuoma lisaase, esim. AdMechin pakollinen 60 cm dorsal lance.
     Se ei korvaa mitaan, joten se tulee taulukon loppuun ilman ruutua. */
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(!isUpgradeEnt(en) || !en.add) return;
    if(skip === upgradeKey(si, ei)) return;
    if(upState(u, si, ei) !== "take") return;
    if(rows.some(r => r.a[0] === en.add[0])) return;
    rows.push({a: en.add, i: -1, box: null, extra: 1});
  }));
  return rows;
}

/* Tilasto listan pakollisten muutosten jalkeen. */
function statMod(u, key){
  let d = 0;
  L().secs.forEach((sec, si) => sec.ents.forEach((en, ei) => {
    if(!isUpgradeEnt(en) || !en.mod || en.mod[key] == null) return;
    if(upState(u, si, ei) !== "take") return;
    d += en.mod[key];
  }));
  return d;
}

function effTurrets(u, sh){
  const d = statMod(u, "tu"), base = String(sh.tu || "");
  if(!d) return base;
  const m = base.match(/^\s*(\d+)/);
  return m ? base.replace(/^\s*\d+/, String(+m[1] + d)) : base;
}

/* Korvaava ase ei ole profiilin rivi, joten sille ei ole valmiiksi
   laskettua tahtea. Se haetaan samalla logiikalla kuin muillekin:
   vain sellaiset saannot kelpaavat jotka ovat oikeasti talla kortilla. */
function starsForRow(sh, rules, a){
  let refs = SPECIAL_WEAPON_RULES.filter(d => defMatches(d, sh, a));
  if(!refs.length)
    rules.forEach(r => { if(weaponMentioned(r.t, a)) refs = [localRef(a)]; });
  const used = new Set(rules.flatMap(r => (r.refs || []).map(x => x.id)));
  return uniqRefs(refs).filter(r => used.has(r.id));
}

/* Rivit kaaritaan ryhmiin: vaihtoehtoryhma saa oman <tbody>:n, jolle CSS
   piirtaa pystypalkin. Ryhma tunnistuu aseistusrivin indeksista - perusrivi
   ja sen korvaajat kantavat samaa i:ta. */
function armRows(u, sh, starred, rules){
  const out = [];
  let open = null;
  const close = () => { if(open !== null){ out.push("</tbody>"); open = null; } };
  let wasGrp = false;
  armModel(u, sh).forEach(r => {
    const key = r.grp ? "g" + r.i : "p";
    if(key !== open){
      const gap = (r.grp || wasGrp) && out.length;
      close();
      if(gap) out.push('<tbody class="gp"><tr><td colspan="4"></td></tr></tbody>');
      out.push(r.grp ? '<tbody class="g">' : "<tbody>");
      open = key;
      wasGrp = !!r.grp;
    }
    const a = r.a;
    const [letter, badge, wash] = wepClass(a[0]);
    const star = r.alt ? starHTML(starsForRow(sh, rules || [], a))
                       : starHTML(starred[r.i]);
    const box = r.box ? `<span class="${r.grp ? "rb" : "wb"}${
      r.box === "on" ? " on" : ""}"></span>` : "";
    out.push(`<tr class="w${r.alt ? " alt" : ""}" style="--rw:${wash}">
      <td class="nm">${box}<span class="bg" style="--bd:${badge}">${letter}</span>
        &nbsp;${r.alt ? '<i class="or">OR</i>' : ""}${star}${
        esc(shortWeaponName(a[0]))}</td>
      <td class="rg">${esc(shortRange(a[1]))}</td><td class="st">${
        esc(shortStrength(a[2]))}</td>
      <td class="ar" data-arc="${esc(String(a[3] == null ? "" : a[3]))}" title="${
        esc(String(a[3] == null ? "" : a[3]))}">${arcGlyph(a[3])}</td></tr>`);
  });
  close();
  return out.join("");
}

function optRows(u, sh, rules){
  const rows = [];
  sh.ol.forEach((o, i) => {
    const st = optState(u, i);
    if(st === "off") return;
    const cost = o.c == null ? "see text" : (o.c ? "+" + o.c : "free") +
      (o.c && isEscort(u) ? " / ship" : "");
    const head = o.t.split(/(?<=[.;])\s+/)[0].replace(/\.$/, "");
    const rest = o.t.slice(head.length).replace(/^[.;\s]+/, "");
    const star = starHTML(optStars(sh, o, rules));
    rows.push(`<div class="k-opt">
      <span class="cb${st === "take" ? " on" : ""}"></span>
      <span class="tx"><b>${star}${esc(head)}</b>${rest ? `<span>${esc(rest)}</span>` : ""}</span>
      <span class="c">${esc(cost)}</span></div>`);
  });
  /* Listan omat paivitykset (re-roll, Mark, gubbins, Dakka Dakka) samaan
     lohkoon kuin aluksen optiot: pelaajan kannalta ne ovat sama asia. */
  const ups = upgradesFor(u);
  ups.own.concat(ups.other).forEach(x => {
    const si = x[0], ei = x[1], up = x[2], st = upState(u, si, ei);
    if(st === "off") return;
    const cost = upCostLabel(u, up);
    rows.push(`<div class="k-opt">
      <span class="cb${st === "take" ? " on" : ""}"></span>
      <span class="tx"><b>${esc(title(up.l))}</b><span>${
        esc(up.req ? "Required by " + L().nm + "."
                   : "Fleet-list upgrade, " + L().nm + ".")}</span></span>
      <span class="c">${esc(cost)}</span></div>`);
  });
  if((u.note || "").trim())
    rows.push(`<div class="k-opt"><span class="cb on"></span>
      <span class="tx"><b>${esc(u.note.trim())}</b>
      <span>Fleet-list upgrade entered in the builder.</span></span>
      <span class="c">${u.adj ? (u.adj > 0 ? "+" : "") + u.adj : "incl."}</span></div>`);
  return rows.join("");
}

function cardHTML(u, pos){
  const sh = shipOf(u), en = entOf(u);
  if(!sh) return "";
  const escq = isEscort(u), n = hulls(u);
  const [kd, km] = factionCols(L().nm + " " + (sh.fl || ""));
  const name = (u.name || "").trim();
  const sub = [name ? title(sh.nm) : "", sh.fl ? title(sh.fl) : "", sh.ty,
               "pg. " + sh.pg].filter(Boolean).join(" | ");
  const half = Math.floor((sh.hp || 0) / 2);
  const upList = upgradesFor(u);
  const upShown = upList.own.concat(upList.other)
    .filter(x => upState(u, x[0], x[1]) !== "off").length;
  const optionCount = (sh.ol || []).filter((o, i) => optState(u, i) !== "off").length +
    upShown + ((u.note || "").trim() ? 1 : 0);
  const optMode = optionCount >= 9 ? " opt-overflow" :
                  optionCount >= 7 ? " opt-dense" :
                  optionCount >= 5 ? " opt-compact" : "";
  /* Tiivistetyt palkit vapauttivat pystytilaa; osa annetaan optiolistalle
     ja loput valuvat itsestaan ARMAMENT/SPECIAL-riville, joka on flex:1. */
  const optionHeight = optionCount >= 14 ? 45 : optionCount >= 10 ? 40 :
                       optionCount >= 7 ? 35 : 31;

  let left;
  if(escq){
    const members = (u.members || "").split(/[,/]/).map(x => x.trim()).filter(Boolean);
    left = `<div class="k-box"><h4>SQUADRON STATE<em>1 box / ship</em></h4>
      <div class="k-bd"><div class="fit-content">
        <div class="k-sq">
          <div><span>BUILT</span><i></i></div>
          <div><span>DESTROYED</span><i></i></div>
          <div><span>REMAINING</span><i></i></div>
        </div>
        <p class="k-note">${esc(ESCORT_LINE)}</p></div></div></div>`;
    u._mem = members;
  }else{
    /* Ylakaista ehjat, alakaista crippled. Jos puolisko olisi tyhja
       (hp 1), ruudut pysyvat yhtena kaistana - crippled-tilaa ei ole. */
    const hp = sh.hp || 0, box = i => `<i>${i}</i>`;
    let hits = "";
    if(half > 0 && half < hp){
      const okRow = [], crRow = [];
      for(let i = 1; i <= hp; i++) (i <= half ? okRow : crRow).push(box(i));
      hits = `<div class="k-hits">${okRow.join("")}</div>
        <p class="k-cr">CRIPPLED <em>from box ${half + 1}</em></p>
        <div class="k-hits cr">${crRow.join("")}</div>`;
    }else{
      let row = "";
      for(let i = 1; i <= hp; i++) row += box(i);
      hits = `<div class="k-hits">${row}</div>`;
    }
    left = `<div class="k-box"><h4>DAMAGE<em>tick per Hit</em></h4>
      <div class="k-bd"><div class="fit-content">${hits}
        <p class="k-note">${esc(crippledLine(sh))}</p></div></div></div>`;
  }
