t enough gravitic hooks to notionally transport them to safety)."},"468":{"pg":468,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"OR\u2019ES EL\u2019LEATH (CUSTODIAN) CLASS BATTLESHIP","bp":330,"ty":"Battleship","hp":10,"sp":"20 cm","tn":"45\u00b0","sh":"3","ar":"6+ front * / 5+","tu":"4","tl":"TURRETS","aw":[["Port Railgun battery","45 cm","6","Left/front"],["Starboard Railgun battery","45 cm","6","Front/right"],["Port ion cannon","45 cm","1","Left/front"],["Starboard ion cannon","45 cm","1","Front/right"],["Stern gravitic hook","\u2013","Capacity: 3 Wardens","\u2013"],["Port launch bays","Barracudas: 25 cm / Mantas: 20 cm","3 squadrons","\u2013"],["Starboard launch bays","Barracudas: 25 cm / Mantas: 20 cm","3 squadrons","\u2013"],["Prow gravitic launcher","20\u201340 cm","8","Front"]],"op":"","ol":[],"sr":"\u2022 The gravitic hooks of Custodian battleships are enclosed in a single shrouded, hangar- type enclosure specifically designed for Kir\u2019la (Warden) gunships and are unsuitable for the transport of or to count for other escort types. \u2022 Custodian battleships cannot undergo Come To New Heading special orders. \u2022 Custodian battleships are equipped with a deflector that raises its prow armour to 6+. This is disabled whenever the vessel suffers a prow critical hit (repairable normally). \u2022 The Custodian has an integrated Tracking System coupled to an extremely sophisticated sensor suite. It has a range of 20 cm (instead of 10 cm)."},"470":{"pg":470,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"LAR\u2019SHI\u2019VRE (PROTECTOR) CLASS CRUISER \u2014 T\u2019OLKU CONFIGURATION","bp":185,"ty":"Cruiser","hp":6,"sp":"20 cm","tn":"90\u00b0","sh":"2","ar":"6+ front * / 5+","tu":"3","tl":"TURRETS","aw":[["Port Railgun battery","45 cm","2","Left/front"],["Starboard Railgun battery","45 cm","2","Front/right"],["Prow Railgun battery","45 cm","6","Front"],["Port ion cannon","30 cm","1","Left/front"],["Starboard ion cannon","30 cm","1","Front/right"],["Prow launch bays","Barracudas: 25 cm / Mantas: 20 cm","1 squadron","\u2013"],["Prow gravitic launcher","20\u201340 cm","5","Front"]],"op":"","ol":[],"sr":"\u2022 All Protector class cruisers are equipped with a deflector that raises its prow armour to 6+. This is disabled whenever the vessel suffers a prow critical hit (repairable normally). \u2022 Long-range ion cannons are a recent development; T\u2019olku configuration Protectors must outnumber those of the Vior\u2019la configuration in a Tau fleet."},"472":{"pg":472,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"IL\u2019PORRUI (EMISSARY) CLASS ENVOY SHIP \u2014 DAL\u2019YTH CONFIGURATION","bp":110,"ty":"Cruiser","hp":4,"sp":"20 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Port Railgun battery","45 cm","4","Left/front"],["Starboard Railgun battery","45 cm","4","Front/right"],["Port gravitic hook","\u2013","Capacity: 1 Warden","\u2013"],["Starboard gravitic hook","\u2013","Capacity: 1 Warden","\u2013"],["Prow launch bays","Barracudas: 25 cm","2 squadrons","\u2013"]],"op":"\u2022 Emissary class cruisers can be equipped with a deflector that raises its prow armour to 6+ for +10 points. This is disabled whenever the vessel suffers a prow critical hit (repairable normally).","ol":[{"t":"Emissary class cruisers can be equipped with a deflector that raises its prow armour to 6+ for +10 points. This is disabled whenever the vessel suffers a prow critical hit (repairable normally).","c":10,"var":0}],"sr":"\u2022 A large number of Il\u2019Porrui vessels were equipped with specialized gravitic hooks for supporting Kir\u2019la \u201cWarden\u201d gunships so that it may have a form of escort on long-range emissary missions. These gravitic hooks are specially designed for Wardens and cannot be used to tow or count for any other kind of escort."},"474":{"pg":474,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"KIR\u2019SHASVRE (CASTELLAN) CLASS ESCORT","bp":50,"ty":"Escort","hp":1,"sp":"25 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Prow Railgun battery","45 cm","2","Left/front/right"],["Prow gravitic launcher","20\u201340 cm","2","Front"]],"op":"","ol":[],"sr":"\u2022 This vessel may squadron with any other Tau escorts normally except Orcas (max. six per squadron), but those in a squadron with Wardens may not also be with any other escort type."},"475":{"pg":475,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"KIR\u2019LA (WARDEN) CLASS GUNSHIP","bp":30,"ty":"Escort","hp":1,"sp":"25 cm","tn":"90\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Prow Railgun battery","30 cm","2","Front"],["Prow ion cannon","30 cm","1","Left/front/right"]],"op":"","ol":[],"sr":"\u2022 Any Tau fleet may bring Wardens to battle on gravitic hooks instead of Orcas. \u2022 Any ship equipped with Wardens can only be equipped with Wardens and may not have other hook-transported escorts. \u2022 These then form an independent squadron in all respects (including separate leadership), as they are Kor\u2019or\u2019vesh vessels and not necessarily related to the parent vessel transporting them. They may squadron with Castellan escorts in the fleet if present (max. six per squadron) but not with any other escort types."},"476":{"pg":476,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"IL\u2019EMAAR (COURIER) CLASS MERCHANT TRANSPORT","bp":null,"ty":"Escort","hp":1,"sp":"20 cm","tn":"45\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Prow Railgun battery","30 cm","2","Left/front/right"]],"op":"","ol":[],"sr":"\u2022 Il\u2019Emaar merchant transports support the Kor\u2019vattra in a variety of missions but are usually crewed by more junior members of the Kor-caste. They have a -1 modifier when determining base leadership. \u2022 These vessels are reserved for scenarios that require transports, for which they have the value of a full transport or two assault points."},"478":{"pg":478,"fl":"TAU","nm":"KOR CASTE ORBITAL CITY","bp":150,"ty":"Defence","hp":10,"sp":"0 cm","tn":"0\u00b0","sh":"3","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Railgun battery","45 cm","12","All round"],["Launch bays","Barracudas: 25 cm / Mantas: 20 cm","4 squadrons","\u2013"],["Gravitic hook","\u2013 Capacity:","2 Orcas/Wardens","\u2013"]],"op":"","ol":[],"sr":"\u2022 Like many deep-space way-stations, Tau Orbital Cities are equipped with comprehensive sensor and communication suites with a high degree of automation. They are equipped with a Tracking System. \u2022 Orcas and Wardens assigned to guard an Orbital City have a base leadership of 7 and cannot squadron with other escorts."},"479":{"pg":479,"fl":"TAU","nm":"SECURITY ORBITAL","bp":50,"ty":"Defence","hp":4,"sp":"0 cm","tn":"0\u00b0","sh":"1","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Railgun battery","45 cm","4","All round"],["Ion cannon","30 cm","1","All round"]],"op":"","ol":[],"sr":"\u2022 Like many deep-space way-stations, Tau Security Orbitals are equipped with comprehensive sensor and communication suites with a high degree of automation. They are equipped with a Tracking System."},"480":{"pg":480,"fl":"TAU","nm":"ORBITALS","bp":null,"ty":"Defence","hp":4,"sp":"0 cm","tn":"0\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Launch bays","Barracudas: 25 cm / Mantas: 20 cm","1 squadron","\u2013"],["Gravitic hook","\u2013","Capacity: 1 Orca/Warden","\u2013"],["Railgun battery","45 cm","3","All round"],["Ion cannon","30 cm","1","All round"]],"op":"\u2022 Launch Bay +10 pts \u2022 Gravitic hook +5 pts (Orca/Warden needs to be purchased separately) \u2022 Railgun battery +15 pts \u2022 Ion Cannon Turret +15 pts","ol":[{"t":"Launch Bay +10 pts","c":10,"var":0,"grp":"480_defence","gmax":1,"aws":[0]},{"t":"Gravitic hook +5 pts (Orca/Warden needs to be purchased separately)","c":5,"var":0,"grp":"480_defence","gmax":1,"aws":[1]},{"t":"Railgun battery +15 pts","c":15,"var":0,"grp":"480_defence","gmax":1,"aws":[2]},{"t":"Ion Cannon Turret +15 pts","c":15,"var":0,"grp":"480_defence","gmax":1,"aws":[3]}],"sr":"\u2022 A core module supplies the command, communication, energy and sensor facilities for an array along with habitats for all key staff. A core module and all its ancillary modules are treated as one model for game purposes. \u2022 Normally individual orbital modules are assembled into arrays of up to five. The first module must be the core module and no more than four other modules can be added. An Orbital costs its core plus the sum of all added modules. \u2022 Each security module adds +1 turret to the Core module. \u2022 Each security module includes one of the defence systems below, at the points cost shown. \u2022 Orcas and Wardens assigned to guard an Orbital have a base leadership of 7 and cannot squadron with other escorts. \u2022 Each manufacturing module provides habitats for its workforce and greatly expanded energy reserves. Each module added raises the array\u2019s shield value by 1, to a maximum of 3. \u2022 The processing capacity of the module\u2019s drone intelligences acts as a tracking system. \u2022 Habitat modules are used to allow more Tau to dwell on the array. These modules do not expand an arrays capabilities but they do make them larger. The module adds 1 to the damage points the array can absorb."},"481":{"pg":481,"fl":"TAU","nm":"WAYSTATION","bp":null,"ty":"Defence","hp":4,"sp":"0 cm","tn":"0\u00b0","sh":"1","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Launch bays","Barracudas: 25 cm / Mantas: 20 cm","1 squadron","\u2013"],["Gravitic hook","\u2013","Capacity: 1 Orca/Warden","\u2013"],["Railgun battery","45 cm","3","All round"],["Ion cannon","30 cm","1","All round"]],"op":"\u2022 Launch Bay: 30 pts \u2022 Gravitic hook: 25 pts (Orca/Warden needs to be purchased separately) \u2022 Railgun battery: 35 pts \u2022 Ion Cannon Turret: 35 pts","ol":[{"t":"Launch Bay: 30 pts","c":30,"var":0,"grp":"481_defence","gmax":1,"aws":[0]},{"t":"Gravitic hook: 25 pts (Orca/Warden needs to be purchased separately)","c":25,"var":0,"grp":"481_defence","gmax":1,"aws":[1]},{"t":"Railgun battery: 35 pts","c":35,"var":0,"grp":"481_defence","gmax":1,"aws":[2]},{"t":"Ion Cannon Turret: 35 pts","c":35,"var":0,"grp":"481_defence","gmax":1,"aws":[3]}],"sr":"\u2022 Tau Waystations can be used in any scenario where the Tau are defenders, even if Ion cannon 30 cm 1 All round planetary defences are not normally permitted. \u2022 Because of their immense data handling facilities they count as having tracking systems. \u2022 Orcas and Wardens assigned to guard a Waystation have a base leadership of 7 and cannot squadron with other escorts. \u2022 Choose one of the defence systems below. This defines the point cost for the waystation."},"488":{"pg":488,"fl":"DEMIURG","nm":"\u2018STRONGHOLD\u2019 COMMERCE VESSEL","bp":350,"ty":"Battleship","hp":10,"sp":"15 cm","tn":"45\u00b0","sh":"4","ar":"6+ front / 5+","tu":"4","tl":"TURRETS","aw":[["Port weapons battery","30 cm","12","Left"],["Starboard weapons battery","30 cm","12","Right"],["Port lance battery","60 cm","3","Left"],["Starboard lance battery","60 cm","3","Right"],["Prow weapons battery","45 cm","14","Front"],["Prow cutting beam","15 cm","Special (max. 8)","Front"],["Dorsal torpedo silos","30 cm","6","All round"],["Dorsal launch bays","Fighters: 30 cm / Bombers: 20 cm / Assault boats: 30 cm","3 squadrons","\u2013"]],"op":"","ol":[],"sr":"\u2022 Demiurg Stronghold class ships are heavily automated and count their Ld value as 10 at the start of the battle. The Stronghold's Ld will drop by -1 for each point of damage it suffers, but its Ld value will not drop any further than 5. \u2022 Bridge smashed critical hits will not inflict additional Leadership loss on a Demiurg ship, but instead cause an extra point of damage (and possible attendant Ld loss) on the vessel. \u2022 A Stronghold class vessel is worth 350 Victory points normally but in a pure Demiurg fleet or one fighting against Orks it is worth 400 Victory points instead to reflect its extra determination. This does not affect its starting point cost. \u2022 Demiurg \u2018Stronghold\u2019 class vessels cannot employ Come to New Heading orders."},"489":{"pg":489,"fl":"DEMIURG","nm":"\u2018BASTION\u2019 COMMERCE VESSEL","bp":255,"ty":"Cruiser","hp":8,"sp":"20 cm","tn":"45\u00b0","sh":"2","ar":"6+ front / 5+","tu":"2","tl":"TURRETS","aw":[["Port weapons battery","30 cm","6","Left"],["Starboard weapons battery","30 cm","6","Right"],["Port lance battery","60 cm","2","Left"],["Starboard lance battery","60 cm","2","Right"],["Prow weapons battery","45 cm","8","Front"],["Prow cutting beam","15 cm","Special (max. 8)","Front"],["Dorsal launch bays","Fighters: 30 cm / Bombers: 20 cm / Assault boats: 30 cm / Torpedoes: 30 cm","3 squadrons / 4","\u2013 / All round"]],"op":"","ol":[],"sr":"\u2022 Demiurg Bastion class ships are heavily automated and count their Ld value as 9 at the start of the battle. The Bastion\u2019s Ld will drop by -1 for each point of damage the Bastion suffers, but its Ld value will not drop any further than 5. \u2022 Bridge smashed critical hits will not inflict additional Leadership loss on a Demiurg ship, but instead cause an extra point of damage (and possible attendant Ld loss) on the vessel. \u2022 A Bastion class vessel is worth 255 Victory points normally but in a pure Demiurg fleet or one fighting against Orks it is worth 300 Victory points instead to reflect its extra determination. This does not affect its starting point cost. \u2022 Demiurg \u2018Bastion\u2019 class vessels cannot employ Come to New Heading orders. \u2022 The dorsal launch bays may launch either attack craft or torpedoes if reloaded but may not launch both attack craft and torpedoes in the same turn."},"490":{"pg":490,"fl":"DEMIURG","nm":"\u2018CITADEL\u2019 COMMERCE VESSEL","bp":185,"ty":"Cruiser","hp":6,"sp":"20 cm","tn":"45\u00b0","sh":"2","ar":"6+ front / 5+","tu":"3","tl":"TURRETS","aw":[["Port weapons battery","30 cm","6","Left"],["Starboard weapons battery","30 cm","6","Right"],["Prow weapons battery","45 cm","8","Front"],["Prow cutting beam","15 cm","Special (max. 8)","Front"],["Dorsal torpedo silos","30 cm","4","All round"]],"op":"","ol":[],"sr":"\u2022 Demiurg Citadel class ships are heavily automated and count their Ld value as 9 at the start of the battle. The Citadel\u2019s Ld will drop by -1 for each point of damage it suffers, but its Ld value will not drop any further than 5. \u2022 Bridge smashed critical hits will not inflict additional Leadership loss on a Demiurg ship, but instead cause an extra point of damage (and possible attendant Ld loss) on the vessel. \u2022 A Citadel class vessel is worth 185 Victory points normally but in a pure Demiurg fleet or one fighting against Orks it is worth 200 Victory points instead to reflect its extra determination. This does not affect its starting point cost. \u2022 Demiurg \u2018Citadel\u2019 class vessels cannot employ Come to New Heading special orders."},"491":{"pg":491,"fl":"NICASSAR","nm":"DHOW","bp":45,"ty":"Escort","hp":1,"sp":"20 cm","tn":"180\u00b0","sh":"2","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Port railgun battery","30 cm","3","Left"],["Starboard railgun battery","30 cm","3","Right"]],"op":"","ol":[],"sr":"\u2022 Tau fleets may bring Dhows to battle on gravitic hooks instead of Orcas. Any ship equipped with Dhows can only be equipped with Dhows and may not have Orcas. These then form a squadron separate of their parent ship. \u2022 Their Leadership is the same as their parent ship +1 as the Nicassar are natural spacefarers."},"492":{"pg":492,"fl":"NICASSAR","nm":"CARAVAN","bp":200,"ty":"Defence","hp":8,"sp":"10 cm","tn":"Special","sh":"4","ar":"5+","tu":"6","tl":"TURRETS","aw":[["Railgun battery","30 cm","10","All round"],["Gravitic hook","\u2013","Capacity: 4 Dhows","\u2013"]],"op":"","ol":[],"sr":"\u2022 Their point cost and profile above reflects a slightly modified Nicassar Rig and four Dhows. Nicassar Caravans are ponderously slow, but like their individual Dhows, they are surprisingly manoeuvrable. \u2022 A Nicassar Caravan moves 10 cm in any direction during the movement phase, no more, no less. \u2022 It is not slowed down by blast markers, celestial phenomena or being crippled. \u2022 Cannot take Burn Retros, Come To New Heading or All Ahead Full special orders. \u2022 Nicassar Caravans have +1 Leadership (max. 10)."},"493":{"pg":493,"fl":"NICASSAR","nm":"RIG","bp":40,"ty":"Defence","hp":4,"sp":"0 cm","tn":"0\u00b0","sh":"1","ar":"5+","tu":"6","tl":"TURRETS","aw":[["Gravitic hook","\u2013","Capacity: 4 Dhows","\u2013"]],"op":"","ol":[],"sr":"\u2022 For every Nicassar Rig in the fleet, four Dhows must be purchased. Their gravitic hooks count toward the number of Dhows in the fleet and cannot be used on any other escort type."},"494":{"pg":494,"fl":"KROOT","nm":"WARSPHERE","bp":145,"ty":"Defence","hp":10,"sp":"10 cm","tn":"Special","sh":"2","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Weapons battery","30 cm","12","All round"]],"op":"\u2022 A Kroot Warsphere may add 2HP and 2 firepower for +20 points (up to three times). \u2022 A Kroot Warsphere may subtract 2HP and 2 firepower for -20 points (up to two times). \u2022 Warspheres 10HP or greater may also add +1 shield for +10 points. \u2022 Warspheres 10HP or greater may +1 turret strength for +10 points. \u2022 A Kroot Warsphere 10HP or greater can extend the range of its weapons battery by +15 cm for +25 points.","ol":[{"t":"A Kroot Warsphere may add 2HP and 2 firepower for +20 points (up to three times).","c":20,"var":0},{"t":"A Kroot Warsphere may subtract 2HP and 2 firepower for -20 points (up to two times).","c":null,"var":0},{"t":"Warspheres 10HP or greater may also add +1 shield for +10 points.","c":10,"var":0},{"t":"Warspheres 10HP or greater may +1 turret strength for +10 points.","c":10,"var":0},{"t":"A Kroot Warsphere 10HP or greater can extend the range of its weapons battery by +15 cm for +25 points.","c":25,"var":0}],"sr":"\u2022 Kroot Warspheres have powerful engines firing in all direction, and this, coupled with the unique, spherical designs of their ships means no command check is needed for All Ahead Full special orders. \u2022 During planetary assaults, Kroot Warspheres cannot return to flight during a battle once they have landed. However, they are not destroyed and only count as disengaged for purposes of victory points. \u2022 The Kroot approach spacefaring with an innate sense bereft of the technological advances so keenly sought by other races. When the Damocles Crusade revealed shortcomings in the Warsphere compared to Imperial starships, the Kroot adapted simply by constructing larger Warspheres."},"500":{"pg":500,"fl":"HIGH ORBIT DEFENCES","nm":"RAMILIES CLASS STAR FORT","bp":875,"ty":"Defence","hp":12,"sp":"0 cm","tn":"0\u00b0","sh":"4 (quadrant)","ar":"5+","tu":"4 (quadrant)","tl":"TURRETS","aw":[["Weapons battery","60 cm","12","Quadrant"],["Lance battery","60 cm","5","Quadrant"],["Launch bays","Fighters: 30 cm / Bombers: 20 cm / BASILICA WEAPONS","4 squadrons","\u2013"],["Weapons battery","45 cm","4","All round"],["Torpedo silos","30 cm","9","All round"]],"op":"","ol":[],"sr":"\u2022 Availability: The Ramilies is available to Imperial and Chaos Fleets, subject to the rules below. \u2022 Deployment & Scenarios: A Ramilies can be deployed as an orbital defence or, in appropriate scenarios such as Planetary Assault, Exterminatus, Surprise Attack, or Hunter, Prey as a replacement for a planet. In such scenarios orbital defences may be sited within 30 cm of a Ramilies class star fort. A Ramilies is bought from the fleet\u2019s points, rather than defences to represent its rarity and importance. Ramilies may only be used by prior agreement in competitive games (it\u2019s unlikely to be ambushing you in the middle of a fleet engagement after all), but can prove to be a good \u2018surprising find\u2019 for players in Umpired scenarios."},"506":{"pg":506,"fl":"HIGH ORBIT DEFENCES","nm":"BLACKSTONE FORTRESS","bp":400,"ty":"Defence","hp":16,"sp":"0","tn":"0","sh":"6","ar":"5+","tu":"6","tl":"TURRETS","aw":[["Weapons battery","60 cm","20","All round"],["Lance battery","60 cm","4","All round"],["Launch bays","Fighters: 30 cm / Bombers: 20 cm","8 squadrons","\u2013"]],"op":"","ol":[],"sr":""},"507":{"pg":507,"fl":"HIGH ORBIT DEFENCES","nm":"SPACE STATION","bp":150,"ty":"Defence","hp":8,"sp":"0","tn":"0","sh":"2","ar":"5+","tu":"4","tl":"TURRETS","aw":[["Weapons battery","60 cm","12","All round"],["Lance battery","30 cm","3","All round"],["Launch bays","Fighters: 30 cm / Bombers: 20 cm","4 squadrons","\u2013"]],"op":"","ol":[],"sr":""},"508":{"pg":508,"fl":"HIGH ORBIT DEFENCES","nm":"ORBITAL DOCK","bp":90,"ty":"Defence","hp":6,"sp":"0","tn":"0","sh":"2","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Weapons battery","30 cm","4","All round"],["Launch bays","Fighters: 30 cm / Bombers: 20 cm","4 squadrons","\u2013"]],"op":"","ol":[],"sr":""},"509":{"pg":509,"fl":"HIGH ORBIT DEFENCES","nm":"ORBITAL DEFENCE LASER PLATFORM","bp":30,"ty":"Defence","hp":1,"sp":"0","tn":"0","sh":"1","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Lance battery","30 cm","2","All round"]],"op":"","ol":[],"sr":""},"510":{"pg":510,"fl":"HIGH ORBIT DEFENCES","nm":"ORBITAL TORPEDO LAUNCHER","bp":30,"ty":"Defence","hp":1,"sp":"0","tn":"0","sh":"1","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Torpedoes","30 cm","6","All round"]],"op":"","ol":[],"sr":""},"511":{"pg":511,"fl":"HIGH ORBIT DEFENCES","nm":"ORBITAL WEAPONS PLATFORM","bp":30,"ty":"Defence","hp":1,"sp":"0","tn":"0","sh":"1","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Weapons battery","60 cm","6","All round"]],"op":"","ol":[],"sr":""},"514":{"pg":514,"fl":"HIGH ORBIT DEFENCES","nm":"DEFENCE MONITOR","bp":60,"ty":"Escort","hp":1,"sp":"10 cm","tn":"45\u00b0","sh":"2","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Weapons battery","30 cm","8","Left/front/right"],["Lance battery","30 cm","1","Front"]],"op":"","ol":[],"sr":""},"515":{"pg":515,"fl":"HIGH ORBIT DEFENCES","nm":"SYSTEM SHIP","bp":20,"ty":"Escort","hp":1,"sp":"15 cm","tn":"45\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","3","Left/front/right"]],"op":"","ol":[],"sr":""},"517":{"pg":517,"fl":"LOW ORBIT DEFENCES","nm":"AIR BASE","bp":20,"ty":"Ground","hp":1,"sp":"0","tn":"0","sh":"0","ar":"6+","tu":"2","tl":"TURRETS","aw":[["Launch bays","Fighters: 30 cm / Bombers: 20 cm","4 squadrons","\u2013"]],"op":"","ol":[],"sr":""},"521":{"pg":521,"fl":"ADDITIONAL VESSELS","nm":"ESCORT CARRIER","bp":60,"ty":"Escort","hp":1,"sp":"15 cm","tn":"45\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Port launch bays","Fighters: 30 cm / Bombers: 20 cm","1 squadrons","\u2013"],["Starboard launch bays","Fighters: 30 cm / Bombers: 20 cm","1 squadrons","\u2013"],["Dorsal weapons battery","15 cm","2","Left/front/right"]],"op":"","ol":[],"sr":"\u2022 Escort carriers do not count as freighters for victory conditions. \u2022 They make Reload Ordnance checks at -1 Ld."},"522":{"pg":522,"fl":"ADDITIONAL VESSELS","nm":"Q-SHIP","bp":60,"ty":"Escort","hp":1,"sp":"15 cm","tn":"45\u00b0","sh":"2","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Weapons battery","30 cm","3","Left/front/right"],["Lance battery","30 cm","1","Front"]],"op":"","ol":[],"sr":"\u2022 Q-ships are not declared as such when deployed onto the table; the owning player must write down which freighters are Q-ships at the start of the game. The owning player may reveal the ship as a Q-ship at any time during the game; it is, obviously, also revealed as a Q-ship if it is hit twice by enemy fire (thus producing two blast markers.) It is permissible for the owning player to \u2018hold back\u2019 one of his Turrets if the Q-ship is attacked by enemy attack craft (to avoid revealing it), but this is a dangerous gamble. \u2022 Q-ships do not count as freighters for victory conditions, as they have no transport capacity."},"523":{"pg":523,"fl":"ADDITIONAL VESSELS","nm":"ARMED FREIGHTER","bp":20,"ty":"Escort","hp":1,"sp":"15 cm","tn":"45\u00b0","sh":"1","ar":"5+","tu":"1","tl":"TURRETS","aw":[["Weapons battery","30 cm","3","Left/front/right"]],"op":"","ol":[],"sr":"\u2022 An armed freighter reduces its cargo capacity to carry bigger guns and reactors; it therefore counts as only half a freighter in scenarios that involve them. Round fractions down at the end of the game; therefore, if only one armed freighter and nothing else escapes a Convoy scenario, you lose."},"524":{"pg":524,"fl":"ADDITIONAL VESSELS","nm":"HEAVY TRANSPORT","bp":null,"ty":"Cruiser","hp":6,"sp":"15 cm","tn":"45\u00b0","sh":"2","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Port weapons battery","15 cm","3","Left"],["Starboard weapons battery","15 cm","3","Right"],["Dorsal weapons battery","15 cm","2","Left/front/right"]],"op":"","ol":[],"sr":""},"458b":{"pg":458,"fl":"TAU KOR\u2019VATTRA","nm":"GAL\u2019LEATH (EXPLORER) CLASS STARSHIP \u2014 BOR\u2019KAN MK XXIV CONFIGURATION","bp":230,"ty":"Battleship","hp":12,"sp":"15 cm","tn":"45\u00b0","sh":"1","ar":"5+ / 4+ rear","tu":"5","tl":"TURRETS","aw":[["Prow Railgun battery","45 cm","6","Left/front/right"],["Prow gravitic launcher","20\u201340 cm","8","Front"],["Port launch bays","Barracudas: 25 cm / Mantas: 20 cm","2 squadrons","\u2013"],["Starboard launch bays","Barracudas: 25 cm / Mantas: 20 cm","2 squadrons","\u2013"],["Port gravitic hook","\u2013","Capacity: 1 Orca/Warden","\u2013"],["Starboard gravitic hook","\u2013","Capacity: 1 Orca/Warden","\u2013"],["Dorsal gravitic hook","\u2013","Capacity: 1 Orca/Warden","\u2013"]],"op":"","ol":[],"sr":"\u2022 To equip a Gal\u2019leath class vessel with a gravitic launcher requires the replacement of one segment of launch bays with additional stowage for the drone guided missiles, reducing the vessel\u2019s launch capacity."},"460b":{"pg":460,"fl":"TAU KOR\u2019VATTRA","nm":"LAR\u2019SHI (HERO) CLASS STARSHIP \u2014 T\u2019OLKU CONFIGURATION","bp":180,"ty":"Cruiser","hp":8,"sp":"20 cm","tn":"45\u00b0","sh":"2","ar":"5+","tu":"3","tl":"TURRETS","aw":[["Prow Railgun battery","45 cm","4","Left/front/right"],["Prow gravitic launcher","20\u201340 cm","6","Front"],["Port launch bays","Barracudas: 25 cm / Mantas: 20 cm","1 squadron","\u2013"],["Starboard launch bays","Barracudas: 25 cm / Mantas: 20 cm","1 squadron","\u2013"],["Port Railgun battery","45 cm","4","Left/front"],["Starboard Railgun battery","45 cm","4","Front/right"]],"op":"","ol":[],"sr":"\u2022 All Lar\u2019shi class vessels are fitted with a prow deflector to raise their frontal armour to 6. This is disabled if the ship suffers a Prow critical hit."},"462b":{"pg":462,"fl":"TAU KOR\u2019VATTRA","nm":"IL\u2019FANNOR (MERCHANT) CLASS STARSHIP \u2014 DAL\u2019YTH CONFIGURATION","bp":95,"ty":"Cruiser","hp":4,"sp":"15 cm","tn":"45\u00b0","sh":"1","ar":"5+","tu":"2","tl":"TURRETS","aw":[["Prow Railgun battery","45 cm","2","Left/front/right"],["Port ion cannon","30 cm","1","Left/front"],["Starboard ion cannon","30 cm","1","Front/right"],["Port Railgun battery","45 cm","2","Left/front"],["Starboard Railgun battery","45 cm","2","Front/right"]],"op":"\u2022 Later examples of the Il\u2019fannor were produced with a drastically superior hull structure, constructed by methods only recently discovered by the Tau. Il\u2019fannors of either configuration may therefore increase their hits from 4 to 6 at a cost of +15 points.","ol":[{"t":"Later examples of the Il\u2019fannor were produced with a drastically superior hull structure, constructed by methods only recently discovered by the Tau. Il\u2019fannors of either configuration may therefore increase their hits from 4 to 6 at a cost of +15 points.","c":15,"var":0}],"sr":""},"470b":{"pg":470,"fl":"TAU KOR\u2019OR\u2019VESH","nm":"LAR\u2019SHI\u2019VRE (PROTECTOR) CLASS CRUISER \u2014 VIOR\u2019LA CONFIGURATION","bp":185,"ty":"Cruiser","hp":6,"sp":"20 cm","tn":"90\u00b0","sh":"2","ar":"6+ front * / 5+","tu":"3","tl":"TURRETS","aw":[["Port Railgun battery","45 cm","2","Left/front"],["Starboard Railgun battery","45 cm","2","Front/right"],["Prow Railgun ba  Captain must be assigned to a particular ship and improves its leadership by +1.","You may wait until after rolling for leadership before deciding which ships to assign your veteran captains to.","Ships assigned a Veteran Captain must be squadroned on the tabletop (their skills are too precious to waste on lone ships).","A Veteran Captain gets one re-roll which is included in their points cost and can only be used on their own vessel or another vessel in their own squadron."],"ents":[{"l":"Veteran Captain (Ld +1)","r":null,"p":50,"src_page":38,"a":1,"mx":null,"nt":null,"k":"cmd"}]},{"t":"THE RESERVE FLEETS OF SEGMENTUM OBSCURUS","rules":[],"text":["Instead, whole shipyards are filled with rows of silent, inactive vessels, often representing classes of ship now outdated or scarce.","As such a posting to a reserve fleet is an unnerving duty, forcing a sailor to enter deep into an unfamiliar vessel which may have lain dormant for centuries.","Reserve fleets are used only reluctantly by the Imperial Navy, and only in the most desperate of circumstances, but an invasion the size of Abaddon\u2019s Thirteenth Black Crusade without doubt qualifies as exactly that \u2013 the most dire of circumstances, the most desperate of times.","If you wish, you may use a Battlefleet Obscura Reserve Fleet, picked using the fleet list on pg 34.","In addition, you may of course use the Reserves rule to pick other Imperial vessels not found in your own fleet list.","However, since a reserve fleet also draws on very old or scarce vessels, you may also use your reserve choices to select any of the following Chaos vessels if you so wish.","Reserve vessels use all their normal rules and keep their particular ordnance types (ie Chaos ordnance is used on Chaos ships picked in a reserve fleet) but you cannot pick any of the ship class variants described since these are described for vessels who have already turned traitor and hence obviously no longer in Imperial service!"],"ents":[]},{"t":"Strange happenings","rules":[],"text":["If a vessel in a reserve fleet also fails the command check by rolling a double, then not only does it become unreliable but it also may do absolutely nothing during the current turn other than make its minimum move directly ahead.","When fighting against Chaos fleets, a vessel which has already become unreliable and rolls a second double for a command check must attempt to disengage as soon as possible exactly as if they had been crippled (and will continue to do so for the rest of the game)."],"ents":[]},{"t":"FLEET UPGRADES","rules":[],"ents":[{"l":"Imperial Power Ram","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"Any capital ship with a 6+ prow, unless it has a Nova Cannon. The book states this in the shared fleet rules: \u201cPOWER RAM The Imperial Power Ram may be taken by any Imperial capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.\u201d","prose":1,"cond":{"cap":1,"prow":"6","no":"nova cannon"},"k":"up"}],"text":["Priced upgrades the book states in this faction's shared fleet rules rather than as list entries."]}]},{"nm":"Imperial Navy \u2014 Armageddon Sector","pg":40,"secs":[{"t":"FLEET RULES (pg. 37\u201339)","rules":[],"text":["CAPITAL SHIPS Battleships You may include up to one battleship in your fleet for every three cruisers or battlecruisers.","Apocalypse class battleship (pg 52)...........365 pts Emperor class battleship (pg 53)................365 pts Retribution class battleship (pg 54)...........345 pts Battlecruisers & Grand Cruisers You may include up to one battlecruiser or grand cruiser in your fleet for every two cruisers.","Grand Cruisers do not count as cruisers for purposes of fielding battleships.","110 pts Defiant Class Light Cruiser* (pg 76).........120 pts ESCORTS You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","35 pts Cobra class destroyer (pg 84)........................30 pts ORDNANCE Any ship with launch bays may choose to have them launch any mix of Fury interceptors and Starhawk bombers.","Some ships may carry Shark assault boats at an additional cost.","* The Endurance and Defiant class light cruisers are rare variants of the Endeavour, hence the combined numbers of Endurance and Defiant class vessels may not exceed the number of Endeavour class light cruisers in the fleet.","Vast numbers of new, inexperienced sailors frequently have to be drawn up to replace those lost in the constant fighting (many of them drawn from worlds within the Cadian system itself such as Vigilatum and Macharia).","Because of this, the ships and squadrons of Battlefleet Cadia must roll two dice and pick the lowest score when determining leadership.","0-5 Veteran Captains You may include up to five Veteran Captains in your fleet.","Each Veteran Captain must be assigned to a particular ship and improves its leadership by +1.","Veteran Captain (Ld +1)........................................................................................................+50 pts You may wait until after rolling for leadership before deciding which ships to assign your veteran captains to.","Ships assigned a Veteran Captain must be squadroned on the tabletop (their skills are too precious to waste on lone ships).","A Veteran Captain gets one re-roll which is included in their points cost and can only be used on their own vessel or another vessel in their own squadron.","Instead, whole shipyards are filled with rows of silent, inactive vessels, often representing classes of ship now outdated or scarce.","As such a posting to a reserve fleet is an unnerving duty, forcing a sailor to enter deep into an unfamiliar vessel which may have lain dormant for centuries.","Reserve fleets are used only reluctantly by the Imperial Navy, and only in the most desperate of circumstances, but an invasion the size of Abaddon\u2019s Thirteenth Black Crusade without doubt qualifies as exactly that \u2013 the most dire of circumstances, the most desperate of times.","If you wish, you may use a Battlefleet Obscura Reserve Fleet, picked using the fleet list on pg 34.","In addition, you may of course use the Reserves rule to pick other Imperial vessels not found in your own fleet list.","However, since a reserve fleet also draws on very old or scarce vessels, you may also use your reserve choices to select any of the following Chaos vessels if you so wish.","Reserve vessels use all their normal rules and keep their particular ordnance types (ie Chaos ordnance is used on Chaos ships picked in a reserve fleet) but you cannot pick any of the ship class variants described since these are described for vessels who have already turned traitor and hence obviously no longer in Imperial service!","If a vessel in a reserve fleet also fails the command check by rolling a double, then not only does it become unreliable but it also may do absolutely nothing during the current turn other than make its minimum move directly ahead.","When fighting against Chaos fleets, a vessel which has already become unreliable and rolls a second double for a command check must attempt to disengage as soon as possible exactly as if they had been crippled (and will continue to do so for the rest of the game)."],"ents":[]},{"t":"Fleet Commander","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Fleet Commander","sec":[1],"ok":true,"hdr":1}],"text":["You may include a commander in your fleet, who must be assigned to a ship and improves its Leadership to the value shown.","If the fleet is worth over 750 points a fleet commander must be included to lead it.","Your fleet commander gets a single re-roll included in his points cost, and may buy more if you wish.","The cost of your re-rolls depends on the commander you choose (ie you cannot choose to buy Master of the Fleet re-rolls if your fleet is commanded by an Admiral)."],"ents":[{"l":"Fleet-Admiral (Ld 8)","r":null,"p":50,"src_page":40,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Admiral (Ld 9)","r":null,"p":100,"src_page":40,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Solar Admiral (Ld 10)","r":null,"p":150,"src_page":40,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Master of the Fleet (Ld 10)","r":null,"p":50,"src_page":40,"a":0,"mx":null,"nt":null,"k":"cmd"}]},{"t":"Admiral Re-rolls","rules":[],"text":[],"ents":[{"l":"One extra re-roll","r":null,"p":25,"src_page":40,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1],[1,2]]},{"l":"Two extra re-rolls","r":null,"p":75,"src_page":40,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1],[1,2]]},{"l":"Three extra re-rolls","r":null,"p":150,"src_page":40,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1],[1,2]]}]},{"t":"Master of the Fleet Re-rolls","rules":[],"text":["As long as at least one Space Marine Battle barge is included you may choose a Master of the Fleet, who will always be assigned to a Battle barge and cannot be assigned to a non-Space Marine ship.","As long as the fleet includes at least one Imperial capital ship it may include a fleet-admiral, admiral or solar admiral, who will always be assigned to an Imperial Navy vessel and cannot be a assigned to a Space Marine vessel."],"ents":[{"l":"One extra re-roll","r":null,"p":25,"src_page":40,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,3]]},{"l":"Two extra re-rolls","r":null,"p":50,"src_page":40,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,3]]},{"l":"Three extra re-rolls","r":null,"p":75,"src_page":40,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,3]]}]},{"t":"Battleships","rules":[{"kind":"ratio","allow":1,"allow_type":"battleship","per":3,"per_type":"cruisers","src":"You may include up to one battleship in your fleet for every three cruisers or battlecruisers.","ok":true,"allow_sec":[4],"per_sec":[6]}],"text":[],"ents":[{"l":"Apocalypse class battleship","r":52,"p":365,"src_page":41,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Emperor class bat page":41,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid Strike Vessel (Firestorm)*","r":79,"p":45,"src_page":41,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gladius Class Frigate*","r":108,"p":45,"src_page":41,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Hunter Class Destroyer*","r":109,"p":40,"src_page":41,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid Strike Vessel (Sword)*","r":82,"p":40,"src_page":41,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid Strike Vessel (Cobra)*","r":84,"p":35,"src_page":41,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["Any ship with launch bays may choose to have them launch any mix of Fury interceptors and Starhawk bombers.","Some ships may carry Shark assault boats at an additional cost."],"ents":[]},{"t":"RESERVES","rules":[],"text":["However, it is important to note that despite the inclusion of Space Marine vessels in the fleet list, this is still an Imperial Navy fleet and hence may only take reserves from other Imperial Navy fleets list NOT Space Marine fleet lists.","Likewise, Imperial Navy fleets choosing reserves from this fleet list cannot choose Space Marine vessels from it.","* Space Marine vessels may not be squadroned with non-Space Marine vessels.","No more than two of these vessels (Endurance and Defiant class light cruisers) may be taken for every 500 points (or portion thereof) in the fleet."],"ents":[]},{"t":"BATTLEFLEET BAKKA","rules":[],"text":[],"ents":[]},{"t":"SEGMENTUM TEMPESTUS","rules":[],"text":["Only three Despoilers were built out of the fifteen originally ordered and all became traitors."],"ents":[]},{"t":"THE FORGE WORLD OF BAKKA","rules":[],"text":["But it never had that chance because the restless agents of mankind claimed it for their own, greedy for its abundant and available mineral wealth.","Naturally, the Emperor rejoices at the righteous remorse of a penitent but the sin must still be cleansed by punishment."],"ents":[]},{"t":"THE FIRST TYRANNIC WAR","rules":[],"text":["The other fleet had only been defeated because it was surprised and weakened; this new fleet was too strong to fight.","The only other defensive point was the ringed gas-giant Circe, which they could reach within the hour.","At the height of the battle only a fraction of the Imperial warships remained operational, amongst them the scarred bulk of the Dominus Astra.","The Dominus Astra disappeared into the warp never to be seen again.","Only a dozen other ships of the proud Tempestus fleet survived the battle of Circe.","Calgar could only helplessly watch the Imperial vessels wreathed in the flame of their weapon fire, the silent explosion of Tyranid ships as they were struck, the glittering aurora of lights as laser salvoes vaporized rings of dust.","The Tyranids drove straight forward against the fleet and Macragge's defences, each successive foe was destroyed before it came anywhere near the planet."],"ents":[]},{"t":"LORD ADMIRAL ZACCARIUS RATH","rules":[],"text":["\u2018Those far-distant, warp-beaten ships, upon which Imperial citizens never gaze, are all that stand between heresy and the dominion of the galaxy.\u2019 - Lord Admiral Rath Zaccarius Rath was born on Delta Prime in the Prime Sector.","To Steward Rath's great disappointment, his only son eschewed an elegant career in the Stewardship to enlist in the Imperial Navy.","There was never any doubt who would lead the force."],"ents":[]},{"t":"FLEET UPGRADES","rules":[],"ents":[{"l":"Imperial Power Ram","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"Any capital ship with a 6+ prow, unless it has a Nova Cannon. The book states this in the shared fleet rules: \u201cPOWER RAM The Imperial Power Ram may be taken by any Imperial capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.\u201d","prose":1,"cond":{"cap":1,"prow":"6","no":"nova cannon"},"k":"up"}],"text":["Priced upgrades the book states in this faction's shared fleet rules rather than as list entries."]}]},{"nm":"Imperial Navy \u2014 Bakka Sector","pg":48,"secs":[{"t":"FLEET RULES (pg. 42\u201347)","rules":[],"text":["Only three Despoilers were built out of the fifteen originally ordered and all became traitors.","But it never had that chance because the restless agents of mankind claimed it for their own, greedy for its abundant and available mineral wealth.","Naturally, the Emperor rejoices at the righteous remorse of a penitent but the sin must still be cleansed by punishment.","The other fleet had only been defeated because it was surprised and weakened; this new fleet was too strong to fight.","The only other defensive point was the ringed gas-giant Circe, which they could reach within the hour.","At the height of the battle only a fraction of the Imperial warships remained operational, amongst them the scarred bulk of the Dominus Astra.","The Dominus Astra disappeared into the warp never to be seen again.","Only a dozen other ships of the proud Tempestus fleet survived the battle of Circe.","Calgar could only helplessly watch the Imperial vessels wreathed in the flame of their weapon fire, the silent explosion of Tyranid ships as they were struck, the glittering aurora of lights as laser salvoes vaporized rings of dust.","The Tyranids drove straight forward against the fleet and Macragge's defences, each successive foe was destroyed before it came anywhere near the planet.","DOSSIER LORD ADMIRAL ZACCARIUS RATH \u2018Those far-distant, warp-beaten ships, upon which Imperial citizens never gaze, are all that stand between heresy and the dominion of the galaxy.\u2019 - Lord Admiral Rath Zaccarius Rath was born on Delta Prime in the Prime Sector.","To Steward Rath's great disappointment, his only son eschewed an elegant career in the Stewardship to enlist in the Imperial Navy.","There was never any doubt who would lead the force."],"ents":[]},{"t":"Admiral","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Admiral","sec":[1],"ok":true,"hdr":1}],"text":["You may include 1 Admiral in your fleet, who must be assigned to a ship and improves its Leadership to the value shown.","If the fleet is worth over 750 points an Admiral must be included to lead it.","Additional re-rolls may be purchased for the listed point costs (including for Admiral Rath).","An Imperial Bakka Battlefleet with 1,500 points or greater may be led by Lord Admiral Rath, who must always be placed on a battleship, though it not necessarily be the most expensive one present.","In a campaign, a ship so refitted must remain his flagship unless it is destroyed."],"ents":[{"l":"Fleet-Admiral (Ld 8)","r":null,"p":50,"src_page":48,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Admiral (Ld 9)","r":null,"p":100,"src_page":48,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Solar Admiral (Ld 10)","r":null,"p":150,"src_page":48,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"Lord Admiral Rath (Ld10)","r":null,"p":200,"src_page":48,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One extra re-roll","r":null,"p":25,"src_page":48,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1],[1,2],[1,3]]},{"l":"Two extra re-rolls","r":null,"p":75,"src_page":48,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1],[1,2],[1,3]]},{"l":"Three extra re-rolls","r":null,"p":150,"src_page":48,"a":0,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0],[1,1],[1,2],[1,3]]}]},{"t":"Emperor battleship Dominus Astra","rules":[],"text":["Only one member of this class, the venerable Dominus Astra, saw action against Hive Fleet Behemoth while serving as Lord Admiral Rath's flagship.","The Dominus Astra was never officially seen again although rumours abound of a mysterious ghost ship that appears from the warp in time of greatest peril to hurl itself on humanity\u2019s most dangerous enemies.","Bakka fleets may only field a single Emperor battleship, and this only as reserves unless Admiral Rath leads the fleet, in which case it must be his flagship."],"ents":[]},{"t":"Battleships","rules":[{"kind":"ratio","allow":1,"allow_type":"battleship","per":3,"per_type":"cruisers","src":"You may include up to one battleship in your fleet for every three cruisers or battlecruisers.","ok":true,"allow_sec":[3],"per_sec":[5]}],"text":["An Emperor class battleship can only be taken as reserves unless Admiral Rath leads the fleet."],"ents":[{"l":"Emperor class battleship","r":53,"p":365,"src_page":49,"a":0,"mx":1,"nt":null,"k":"unit"},{"l":"Retribution class battleship","r":54,"p":345,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Victory class battleship","r":55,"p":345,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Vanquisher class battleship","r":57,"p":300,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Battlecruisers","rules":[{"kind":"ratio","allow":1,"allow_type":"battlecruiser","per":2,"per_type":"cruisers","src":"You may include up to one battlecruiser in your fleet for every two cruisers.","ok":true,"allow_sec":[4],"per_sec":[5]}],"text":[],"ents":[{"l":"Dominion class battlecruiser","r":62,"p":260,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Mercury class battlecruiser","r":64,"p":255,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Armageddon class battlecruiser","r":65,"p":235,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Cruisers","rules":[{"kind":"section_count","min":0,"max":12,"src":"0-12 Cruisers","sec":[5],"ok":true,"hdr":1}],"text":[],"ents":[{"l":"Dominator class cruiser","r":68,"p":190,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Tyrant class cruiser","r":69,"p":185,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gothic class cruiser","r":70,"p":180,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Lunar class cruiser","r":71,"p":180,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Endeavour Class Light Cruiser","r":73,"p":115,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Endurance Class Light Cruiser","r":75,"p":115,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Siluria Class Light Cruiser","r":78,"p":100,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[6]}],"text":[],"ents":[{"l":"Havoc class frigate","r":81,"p":35,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Sword class frigate","r":82,"p":35,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Viper class destroyer","r":83,"p":35,"src_page":49,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":["Any ship with launch bays may use any mix of Fury interceptors and Starhawk bombers.","They may also take torpedo bombers for +10 points per launch bay.","An Emperor class battleship may carry Shark assault boats at an additional cost of +5 points."],"ents":[{"l":"Torpedo bombers","r":null,"p":10,"a":1,"u":1,"mx":null,"nt":"Per launch bay strength. The book prints this only in the section text: \u201cThey may also take torpedo bombers for +10 points per launch bay.\u201d","prose":1,"per":"bay","cond":{"has":"launch bay"},"k":"up"},{"l":"Shark assault boats (Emperor class only)","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201cAn Emperor class battleship may carry Shark assault boats at an additional cost of +5 points.\u201d","prose":1,"k":"up"}]},{"t":"THE ADEPTUS MECHANICUS OF BAKKA","rules":[],"text":["In a Bakka fleet list, cruisers from the Adeptus Mechanicus fleet list may be taken instead of and in the same manner as Imperial Navy battlecruisers, counting as battlecruisers against any fleet limits in all respects.","They utilize all rules for Adeptus Mechanicus vessels except as follows: they do not count as reserves, they will not disengage when crippled and they may use fleet commander re-rolls.","However, the fleet may not be led by nor take an Archmagos when used this way."],"ents":[]},{"t":"RESERVES","rules":[],"text":["Ships from any Imperial fleet list may be used as reserves, with one reserve cruiser, battlecruiser or grand cruiser for every three Bakka cruisers in the fleet, one reserve battleship for every three Bakka battleships in the fleet, etc.","One Rogue Trader cruiser and its attendant escorts may be taken for every 750 points in the fleet.","One cannot take as reserves the reserves of another fleet list.","As such, ships such as the Jovian that are part of the reserve fleet of Battlefleet Bakka cannot be used as reserves of another fleet list."],"ents":[{"l":"Jovian class battlecruiser","r":63,"p":260,"src_page":50,"a":0,"mx":1,"nt":null,"k":"unit"}]},{"t":"THE SHIPS OF BATTLEFLEET BAKKA","rules":[],"text":["Siluria light cruisers may be represented if desired as easily as cutting off the prow lances of a Dauntless light cruiser.","Havoc frigates may be represented with Chaos Infidel raiders, painted appropriately in loyalist colours of course!","On the other hand, the unique ship classes of Battlefleet Bakka may be represented in any manner desired by the player as long as they can be easily recognized by an opponent."],"ents":[]},{"t":"STARSHIP DEFENCES OF BAKKA","rules":[],"text":[],"ents":[]},{"t":"Adeptus Mechanicus","rules":[],"text":["When used with Battlefleet Bakka, Adeptus Mechanicus capital ships may take the Fleet Defence Turrets refit instead of rolling randomly on the Mechanicus Gifts table.","Fleet Defence Turret ........................+5 points Two turrets on a ship are exchanged for fleet defence turrets capable of protecting itself or any one other vessel within 15 cm each ordnance phase, adding +2 to the turret strength of the ship it is defending (this does not alter bomber attack rolls when used to defend another vessel)."],"ents":[]},{"t":"Imperial Navy","rules":[],"text":["Reserve vessels may not be given this upgrade, but any vessels from the Battlefleet Bakka fleet list used as reserves in other fleets may take it with them."],"ents":[{"l":"+1 turret (Battlefleet Bakka refit)","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"The book prints this only in the section text: \u201c+1 turret.............................................+5 points Any capital ship of Battlefleet Bakka can add this upgrade.\u201d","prose":1,"k":"up"}]},{"t":"FLEET UPGRADES","rules":[],"ents":[{"l":"Imperial Power Ram","r":null,"p":5,"a":1,"u":1,"mx":null,"nt":"Any capital ship with a 6+ prow, unless it has a Nova Cannon. The book states this in the shared fleet rules: \u201cPOWER RAM The Imperial Power Ram may be taken by any Imperial capital ship with a 6+ prow for +5 points unless it has a Nova Cannon.\u201d","prose":1,"cond":{"cap":1,"prow":"6","no":"nova cannon"},"k":"up"}],"text":["Priced upgrades the book states in this faction's shared fleet rules rather than as list entries."]}]},{"nm":"Space Marines \u2014 Codex Astartes","pg":97,"secs":[{"t":"FLEET RULES (pg. 91\u201396)","rules":[],"text":["Most Astartes strike craft appear to carry at least three Gunships, which between them is sufficient to transport a company of Space Marines simultaneously.","Battle barges are thought to carry at least nine Thunderhawks each and fortress monasteries might be able to carry thirty or more.","A typical offensive against a rebel or alien-held planet begins with the arrival of strike craft which engage and clear away defending system ships and may establish a hidden base located within an asteroid field or on a small moon if a protracted campaign is being undertaken.","However it is hard to imagine that the Adeptus Astartes would accept a ship to ship fight on any but the most favourable terms, instead operating against shipping lanes, dock facilities and other vulnerable assets.","I only pray that they remain on our side.","Space Marine vessels may fire boarding torpedoes instead of ordinary torpedoes, as detailed in the Ordnance rules in Battlefleet Gothic.","On a score of 4+, do not remove the Thunderhawk marker ( However, Thunderhawks can only remove one enemy marker in any given ordnance phase and stop moving as soon as they intercept an enemy.","Any vessel that earns or pays for a refit to carry Thunderhawks may then ONLY carry them, and its launch bay capacity is reduced by half (rounding up when applicable).","Escort carriers may never be upgraded to carry Thunderhawks!","Thunderhawk Annihilator The Thunderhawk Annihilator is a specialized gunship employed only by crusading Chapters.","As they behave as both fighters and bombers, they apply a bonus to turret suppression by adding +1 attack for each marker in the wave after attacks are modified by turrets \u2013 meaning each ordnance marker that survives against turrets will be able to conduct at least one attack and will not have a minimum of zero attacks.","When a wave of Thunderhawk Annihilators attacks a ship, you must decide beforehand if any of the markers will forgo their attack runs in favour of turret suppression.","Every one that does so cannot make any attack rolls but adds an additional +1 bonus attack to any surviving Thunderhawk Annihilators when rolling their attacks.","Thunderhawks used in this manner cannot contribute more bonus attacks than the defending ship actually has turrets or the number of surviving Thunderhawk Annihilators, whichever number is lower.","NOTE: In either case, at least one Thunderhawk Annihilators has to survive against turrets for the wave to attack in this manner.","Drop pods enable Space Marine capital ships to quickly deploy Space Marines to the surface and impart +2 assault points for each capital ship during a planetary assault instead of +1.","Once per turn you may use the Honour Guard, if your fleet list includes them.","All the normal rules for teleport attacks apply, except that they may be used in addition to a normal teleport attack that turn.","The player may roll two dice and choose which one to use as the result, including the normal +1 bonus for being Space Marines.","Once per turn a vessel equipped with Terminator boarding parties may use them when conducting a hit and run teleport attack.","Terminators may be used in addition to a normal teleport attack that turn.","Space Marines may roll appeals against the Space Marines table on [???] if desired.","For example, a 1,500-point Space Marine fleet with two battlebarges that rolls a 2D6 roll of 2 against this table may waive the point restrictions and gain a third battlebarge, provided the owning player actually has three battlebarge models to represent it.","Ships not able to take a particular refit rolled randomly may re-roll the result."],"ents":[]},{"t":"Master of the Fleet","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Master of the Fleet","sec":[1],"ok":true,"hdr":1}],"text":["You may include 1 Master of the Fleet.","If your fleet includes any battle barges, he must be assigned to a battle barge in preference to a strike cruiser.","If the fleet is worth over 750 points, the Master of the Fleet must be included to lead it.","You may buy Fleet Commander re-rolls for your Master of the Fleet.","In addition, the Master of the Fleet\u2019s ship may carry a Terminator boarding party:"],"ents":[{"l":"Master of the Fleet (Ld 10)","r":null,"p":50,"src_page":97,"a":0,"mx":null,"nt":null,"k":"cmd"},{"l":"One re-roll","r":null,"p":25,"src_page":97,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Two re-rolls","r":null,"p":50,"src_page":97,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Three re-rolls","r":null,"p":75,"src_page":97,"a":1,"u":1,"mx":null,"nt":null,"k":"up","grp":"rr","at":[[1,0]]},{"l":"Terminator boarding party","r":null,"p":50,"src_page":97,"a":1,"u":1,"mx":null,"nt":null,"k":"up","at":[[1,0]]}]},{"t":"Battle Barges","rules":[{"kind":"section_count","min":0,"max":3,"src":"0-3 Battle Barges","sec":[2],"ok":true,"hdr":1}],"text":["You may include one Space Marine battle barge for every 1,000 points or part thereof in your fleet."],"ents":[{"l":"Venerable battle barge","r":103,"p":null,"src_page":97,"a":0,"mx":1,"nt":"Source page reference is wrong: the book prints pg. 102, but Seditio Opprimere, Venerable Battle Barge is on pg. 103. Corrected by name.","k":"unit"},{"l":"Battle barge","r":104,"p":425,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"Cruisers","rules":[{"kind":"section_count","min":0,"max":10,"src":"0-10 Cruisers","sec":[3],"ok":true,"hdr":1}],"text":[],"ents":[{"l":"Strike cruisers","r":105,"p":145,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ESCORTS","rules":[{"kind":"squadron","min":2,"max":6,"src":"You may include any number of escorts in your fleet in squadrons of 2\u20136 unless specified (see pg 13).","ok":true,"sec":[4]}],"text":[],"ents":[{"l":"Nova class Frigate","r":107,"p":50,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Gladius class Frigate","r":108,"p":45,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Hunter class Destroyer","r":109,"p":40,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Firestorm)","r":79,"p":45,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Sword)","r":82,"p":40,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"},{"l":"Rapid strike vessel (Cobra)","r":84,"p":35,"src_page":97,"a":0,"mx":null,"nt":null,"k":"unit"}]},{"t":"ORDNANCE","rules":[],"text":[],"ents":[]}]},{"nm":"Space Marines \u2014 Crusade","pg":98,"secs":[{"t":"Master of the Fleet","rules":[{"kind":"section_count","min":0,"max":1,"src":"0-1 Master of the Fleet","sec":[0],"ok":true,"hdr":1}],"text":["You may include 1 Master of the Fleet.","If your fleet includes any battle barges, he must be assigned to a battle barge.","The Master of the Fleet may be assigned to a venerable battle barge or fortress monastery if one is present, but does not have to be.","If the fleet is worth over 750 points, the Master of the
